<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF6F1">
<title>Parlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ============================================
   PARLAY — Design System
   ============================================ */
:root {
  --espresso:   #2C1A0E;
  --terra:      #C4714A;
  --amber:      #E8B88A;
  --cream:      #FAF6F1;
  --parchment:  #F2EBE0;
  --muted:      #9B8880;
  --border:     #E0D4C8;
  --surface:    #FFFFFF;
  --sage:       #7A9E8A;
  --blush:      #D4967A;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body:    'DM Sans', sans-serif;
  --r-sm:  8px; --r-md: 16px; --r-lg: 24px; --r-pill: 50px;
  --shadow-sm: 0 2px 8px rgba(44,26,14,0.08);
  --shadow-md: 0 4px 20px rgba(44,26,14,0.12);
  --nav-h: 72px; --max-w: 430px;
  --ease: cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--parchment);color:var(--espresso);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
#app{width:100%;max-width:var(--max-w);min-height:100vh;min-height:100dvh;background:var(--parchment);position:relative;overflow:hidden;box-shadow:0 0 80px rgba(44,26,14,0.2)}

/* SCREENS */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;opacity:0;pointer-events:none;transition:opacity 0.28s var(--ease),transform 0.28s var(--ease);transform:translateX(24px)}
.screen.active{opacity:1;pointer-events:all;transform:translateX(0)}
.screen.exit{transform:translateX(-24px);opacity:0;pointer-events:none}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max-w);height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:none;align-items:center;justify-content:space-around;z-index:100;padding:0 4px;padding-bottom:env(safe-area-inset-bottom)}
#bottom-nav.visible{display:flex}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:8px 4px;border:none;background:none;color:var(--muted);-webkit-tap-highlight-color:transparent;transition:color 0.2s}
.nav-icon{font-size:20px;line-height:1;transition:transform 0.2s var(--ease);display:block}
.nav-label{font-size:9.5px;font-weight:500;letter-spacing:0.04em;line-height:1}
.nav-item.active{color:var(--terra)}
.nav-item.active .nav-icon{transform:translateY(-2px)}
.nav-item:active .nav-icon{transform:scale(0.88)}

/* TYPOGRAPHY */
.t-display{font-family:var(--font-display);font-weight:300;line-height:1.08}
.t-head{font-family:var(--font-display);font-weight:400;line-height:1.15}
.t-subhead{font-family:var(--font-display);font-style:italic;font-weight:300;color:var(--muted)}
.t-muted{color:var(--muted)}
.t-terra{color:var(--terra)}
.t-sage{color:var(--sage)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:var(--font-body);font-weight:500;font-size:.9rem;border-radius:var(--r-pill);padding:15px 28px;transition:all .2s var(--ease);-webkit-tap-highlight-color:transparent;text-decoration:none;white-space:nowrap;letter-spacing:.01em}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--espresso);color:var(--cream)}
.btn-accent{background:var(--terra);color:#fff}
.btn-ghost{background:transparent;color:var(--espresso);border:1.5px solid var(--border)}
.btn-ghost:active{border-color:var(--espresso)}
.btn-muted{background:var(--parchment);color:var(--muted)}
.btn-full{width:100%}
.btn-sm{padding:10px 20px;font-size:.82rem}

/* INPUTS */
.input-wrap{display:flex;flex-direction:column;gap:6px}
.input-label{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;background:var(--parchment);border:1.5px solid transparent;border-radius:var(--r-md);padding:14px 16px;font-family:var(--font-body);font-size:1rem;color:var(--espresso);outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none}
.input:focus{border-color:var(--terra);background:var(--surface)}
.input::placeholder{color:var(--muted)}

/* CARDS */
.card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden}
.card-p{padding:20px}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-pill);font-size:.82rem;font-weight:500;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;transition:all .2s var(--ease);-webkit-tap-highlight-color:transparent;color:var(--espresso)}
.chip.selected{background:var(--espresso);color:var(--cream);border-color:var(--espresso)}
.chip-sage.selected{background:var(--sage);border-color:var(--sage)}

/* AVATAR */
.avatar{border-radius:50%;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);color:var(--terra);flex-shrink:0;overflow:hidden;border:2px solid var(--border)}
.avatar-sm{width:36px;height:36px;font-size:1rem}
.avatar-md{width:52px;height:52px;font-size:1.4rem}
.avatar-lg{width:80px;height:80px;font-size:2rem}

/* PROGRESS */
.progress-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--terra);border-radius:2px;transition:width .5s var(--ease)}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:20px 0}

/* BADGE */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:.6rem;font-weight:700;background:var(--terra);color:#fff}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--espresso);color:var(--cream);padding:11px 20px;border-radius:var(--r-pill);font-size:.85rem;font-weight:500;z-index:999;opacity:0;transition:all .3s var(--ease);pointer-events:none;white-space:nowrap;max-width:310px;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.a1{animation:fadeUp .45s var(--ease) .05s both}
.a2{animation:fadeUp .45s var(--ease) .15s both}
.a3{animation:fadeUp .45s var(--ease) .25s both}
.a4{animation:fadeUp .45s var(--ease) .35s both}
.a5{animation:fadeUp .45s var(--ease) .45s both}
.a6{animation:fadeUp .45s var(--ease) .55s both}
::-webkit-scrollbar{width:0}

/* ============================================
   SCREEN: SPLASH
   ============================================ */
#screen-splash {
  background: var(--espresso);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.splash-logo {
  font-family: var(--font-display);
  font-size: 4.5rem;
  font-weight: 300;
  color: var(--cream);
  letter-spacing: -0.02em;
  animation: fadeIn .8s ease both;
  line-height: 1;
}

.splash-logo span { color: var(--amber); font-style: italic; }

.splash-tagline {
  font-size: .85rem;
  color: rgba(250,246,241,0.5);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-top: 12px;
  animation: fadeIn .8s .3s ease both;
}

.splash-cta {
  position: absolute;
  bottom: 48px;
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 0 32px;
  animation: fadeUp .6s .6s var(--ease) both;
}

.splash-bg-circle {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(196,113,74,0.18) 0%, transparent 70%);
  animation: float 6s ease-in-out infinite;
}

/* ============================================
   SCREEN: ONBOARDING
   ============================================ */
.onboarding-wrap {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 28px;
  padding-top: max(52px, env(safe-area-inset-top));
  padding-bottom: max(40px, env(safe-area-inset-bottom));
  background: var(--parchment);
}

.ob-header { margin-bottom: 40px; }
.ob-step-dots { display: flex; gap: 6px; margin-bottom: 32px; }
.ob-dot { width: 24px; height: 3px; border-radius: 2px; background: var(--border); transition: all .3s var(--ease); }
.ob-dot.active { width: 40px; background: var(--terra); }
.ob-dot.done { background: rgba(196,113,74,.4); }

.ob-title { font-family: var(--font-display); font-size: 2.6rem; font-weight: 300; line-height: 1.1; margin-bottom: 8px; color: var(--espresso); }
.ob-title em { font-style: italic; color: var(--terra); }
.ob-sub { font-size: .875rem; color: var(--muted); line-height: 1.65; }
.ob-body { flex: 1; display: flex; flex-direction: column; gap: 20px; }
.ob-footer { margin-top: 32px; display: flex; flex-direction: column; gap: 10px; }

/* Love Language Cards */
.ll-options { display: flex; flex-direction: column; gap: 10px; }

.ll-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: var(--r-md);
  border: 1.5px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: all .2s var(--ease);
  -webkit-tap-highlight-color: transparent;
}

.ll-card:active { transform: scale(.98); }
.ll-card.selected { border-color: var(--terra); background: #FDF5F0; }
.ll-card.selected .ll-check { background: var(--terra); border-color: var(--terra); }
.ll-icon { font-size: 1.6rem; width: 36px; text-align: center; flex-shrink: 0; }
.ll-content { flex: 1; }
.ll-name { font-size: .9rem; font-weight: 600; color: var(--espresso); margin-bottom: 2px; }
.ll-desc { font-size: .75rem; color: var(--muted); line-height: 1.4; }
.ll-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; transition: all .2s; display: flex; align-items: center; justify-content: center; }
.ll-check::after { content: '✓'; font-size: .65rem; color: #fff; opacity: 0; transition: opacity .15s; }
.ll-card.selected .ll-check::after { opacity: 1; }

/* Invite code display */
.invite-code-box {
  background: var(--espresso);
  border-radius: var(--r-lg);
  padding: 28px;
  text-align: center;
  color: var(--cream);
}
.invite-code {
  font-family: var(--font-display);
  font-size: 3rem;
  font-weight: 600;
  letter-spacing: .2em;
  color: var(--amber);
  margin: 12px 0;
}
.invite-note { font-size: .78rem; color: rgba(250,246,241,0.55); line-height: 1.5; }

/* ============================================
   SCREEN: HOME DASHBOARD
   ============================================ */
#screen-home {
  padding-bottom: calc(var(--nav-h) + 16px);
}

.home-header {
  background: var(--espresso);
  padding: 0 24px 28px;
  padding-top: max(52px, env(safe-area-inset-top));
  position: relative;
  overflow: hidden;
}

.home-header::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(196,113,74,0.25) 0%, transparent 70%);
  pointer-events: none;
}

.home-greeting {
  font-family: var(--font-display);
  font-size: 1.6rem;
  font-weight: 300;
  color: var(--cream);
  margin-bottom: 4px;
}

.home-greeting em { font-style: italic; color: var(--amber); }

.home-date {
  font-size: .75rem;
  color: rgba(250,246,241,0.45);
  letter-spacing: .06em;
  margin-bottom: 20px;
}

/* Partner status bar */
.partner-bar {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--r-md);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.partner-avatars { display: flex; gap: -4px; }
.partner-avatars .avatar { border: 2px solid var(--espresso); }
.partner-avatars .avatar + .avatar { margin-left: -8px; }

.partner-info { flex: 1; }
.partner-names { font-size: .85rem; font-weight: 500; color: var(--cream); }
.partner-status { font-size: .72rem; color: var(--amber); margin-top: 1px; }

.partner-streak {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.streak-num { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; color: var(--amber); line-height: 1; }
.streak-label { font-size: .62rem; color: rgba(250,246,241,0.5); letter-spacing: .05em; text-transform: uppercase; }

/* Quick action strip */
.quick-strip {
  display: flex;
  gap: 10px;
  padding: 20px 20px 4px;
  overflow-x: auto;
  scrollbar-width: none;
}

.quick-action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
  min-width: 68px;
}

.qa-bubble {
  width: 56px; height: 56px;
  border-radius: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  transition: all .2s var(--ease);
  box-shadow: var(--shadow-sm);
}

.quick-action:active .qa-bubble { transform: scale(.92); background: var(--parchment); }
.qa-label { font-size: .68rem; font-weight: 500; color: var(--muted); text-align: center; line-height: 1.2; }

/* Module cards */
.module-section { padding: 8px 20px; }
.section-label {
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
  padding: 0 2px;
}

.module-card {
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  overflow: hidden;
  cursor: pointer;
  transition: all .2s var(--ease);
  -webkit-tap-highlight-color: transparent;
  margin-bottom: 12px;
}

.module-card:active { transform: scale(.99); box-shadow: var(--shadow-md); }

.mc-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 18px 14px;
}

.mc-icon {
  width: 44px; height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}

.mc-icon.terra { background: #FDF0EA; }
.mc-icon.sage  { background: #EDF4F0; }
.mc-icon.amber { background: #FDF7EE; }
.mc-icon.blush { background: #FBF0EC; }

.mc-text { flex: 1 }
.mc-title { font-size: .95rem; font-weight: 600; color: var(--espresso); margin-bottom: 2px; }
.mc-sub   { font-size: .75rem; color: var(--muted); line-height: 1.4; }
.mc-arrow { font-size: 1.1rem; color: var(--border); }

.mc-body { padding: 0 18px 16px; }

/* Equity mini bar */
.equity-mini {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.eq-item {
  background: var(--parchment);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.eq-label { font-size: .65rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.eq-values { display: flex; justify-content: space-between; align-items: baseline; }
.eq-val { font-family: var(--font-display); font-size: 1.2rem; font-weight: 400; color: var(--espresso); }
.eq-bar { height: 3px; border-radius: 2px; background: var(--border); margin-top: 4px; overflow: hidden; }
.eq-fill { height: 100%; background: var(--terra); border-radius: 2px; }

/* Love language mini */
.ll-mini {
  display: flex;
  gap: 8px;
}
.ll-mini-chip {
  flex: 1;
  background: var(--parchment);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  text-align: center;
}
.ll-mini-icon { font-size: 1.2rem; margin-bottom: 4px; }
.ll-mini-name { font-size: .7rem; font-weight: 500; color: var(--espresso); }
.ll-mini-who  { font-size: .62rem; color: var(--muted); margin-top: 1px; }

/* Mediator mini */
.mediator-mini {
  background: linear-gradient(135deg, #FDF5F0 0%, #F5F0FB 100%);
  border-radius: var(--r-sm);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.mm-icon { font-size: 1.5rem; }
.mm-text { flex: 1; font-size: .8rem; color: var(--espresso); line-height: 1.45; }
.mm-btn { font-size: .75rem; font-weight: 600; color: var(--terra); cursor: pointer; white-space: nowrap; }

/* Upcoming events mini */
.event-mini-list { display: flex; flex-direction: column; gap: 8px; }
.event-mini-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--parchment);
  border-radius: var(--r-sm);
}
.emi-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.emi-content { flex: 1; }
.emi-name { font-size: .82rem; font-weight: 500; color: var(--espresso); }
.emi-date { font-size: .7rem; color: var(--muted); }
.emi-tag  { font-size: .65rem; font-weight: 600; color: var(--muted); background: var(--border); padding: 2px 8px; border-radius: var(--r-pill); }

/* ============================================
   SCREEN: PLACEHOLDERS (coming soon)
   ============================================ */
/* ============================================
   ACTION SHEET (delete / archive)
   ============================================ */
.action-sheet-overlay {
  position: fixed; inset: 0; background: rgba(44,26,14,.45); z-index: 200;
  display: flex; align-items: flex-end; animation: fadeIn .15s ease;
}
.action-sheet {
  width: 100%; background: var(--cream); border-radius: 20px 20px 0 0;
  padding: 0 16px max(24px,env(safe-area-inset-bottom));
  animation: slideUp .22s cubic-bezier(.32,1,.45,1);
}
.action-sheet-handle {
  width: 36px; height: 4px; background: var(--border); border-radius: 2px;
  margin: 12px auto 16px;
}
.action-sheet-title {
  font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); text-align: center; padding-bottom: 12px;
  border-bottom: 1px solid var(--border); margin-bottom: 8px;
}
.as-btn {
  width: 100%; border: none; background: none; padding: 15px 16px;
  display: flex; align-items: center; gap: 14px; cursor: pointer;
  border-radius: var(--r-md); transition: background .15s; text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.as-btn:active { background: var(--parchment); }
.as-btn-icon { font-size: 1.2rem; width: 28px; text-align: center; flex-shrink: 0; }
.as-btn-text { flex: 1; }
.as-btn-label { font-size: .9rem; font-weight: 600; color: var(--espresso); }
.as-btn-sub   { font-size: .72rem; color: var(--muted); margin-top: 1px; }
.as-btn.danger .as-btn-label { color: #C0392B; }
.as-cancel {
  width: 100%; border: 1.5px solid var(--border); background: var(--surface);
  padding: 14px; border-radius: var(--r-md); font-size: .9rem; font-weight: 600;
  color: var(--muted); cursor: pointer; margin-top: 8px; transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.as-cancel:active { background: var(--parchment); }

@keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }

/* Three-dot menu button on cards */
.parlay-menu-btn {
  width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  font-size: 1rem; color: var(--muted); flex-shrink: 0; transition: background .15s;
  -webkit-tap-highlight-color: transparent; letter-spacing: .05em;
}
.parlay-menu-btn:active { background: var(--parchment); }

/* Date option slots */
.date-slot {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-md); padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
}
.date-slot.filled { border-color: var(--terra); background: #FDF5F0; }
.date-slot-num {

.date-option-card {

}
.date-option-card.selected { border-color: var(--sage); background: #EDF4F0; }
.date-option-card:active { background: var(--parchment); }

.ph-icon { font-size: 3.5rem; margin-bottom: 24px; animation: float 4s ease-in-out infinite; }
.ph-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 400; margin-bottom: 10px; }
.ph-sub { font-size: .875rem; color: var(--muted); line-height: 1.65; max-width: 280px; margin: 0 auto; }
.ph-badge {

  margin-top: 20px;
  padding: 6px 16px;
  border-radius: var(--r-pill);
  border: 1.5px solid var(--border);

  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
</style>
</head>
<body>
<div id="view-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(90,70,160,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:max(env(safe-area-inset-top,0px),10px) 20px 10px;align-items:center;justify-content:space-between;gap:12px;">
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="font-size:.9rem;">👁️</span>
    <span id="view-banner-text" style="font-size:.78rem;font-weight:600;color:#fff;letter-spacing:.02em;"></span>
  </div>
  <button id="view-banner-switch" style="font-size:.72rem;font-weight:700;color:rgba(255,255,255,.9);background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 12px;cursor:pointer;white-space:nowrap;">← Back to my view</button>
</div>
<!-- Auth identity bar — shown when Supabase is active, top of every main screen -->
<div id="auth-bar" style="display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:998;background:var(--espresso);padding:max(env(safe-area-inset-top,0px),8px) 20px 8px;align-items:center;justify-content:space-between;gap:12px;">
  <div style="font-size:.72rem;color:rgba(250,246,241,.5);">Signed in as <strong id="auth-bar-name" style="color:var(--amber);"></strong></div>
  <button onclick="SupabaseDB.signOut()" style="font-size:.68rem;font-weight:600;color:rgba(250,246,241,.4);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:3px 10px;cursor:pointer;font-family:var(--font-body);">Sign out</button>
</div>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ================================================
   STATE
   ================================================ */
const State = (() => {
  const KEY = 'parlay_v1';
  const defaults = {
    onboarded: false,
    user: { name: '', role: 'user' },
    partner: { name: '', connected: false, inviteCode: '' },
    loveLanguage: { primary: '', secondary: '' },
    nudgePrefs: { enabled: true, frequency: 'daily' },
    mediatorTone: 'neutral',
    family: {
      kids: [],
      providers: [],
      playdateContacts: []
    },
    events: [
      { id: 1, name: "Date Night", date: "Mar 14", type: "couple", color: "#C4714A" },
      { id: 2, name: "Boys Night", date: "Mar 16", type: "solo", color: "#7A9E8A" },
      { id: 3, name: "In-Laws Visit", date: "Mar 22", type: "family", color: "#9B8880" }
    ],
    negotiations: [],
    equity: { boysNights: 3, girlsNights: 2, dateNights: 1, inlawUs: 2, inlawThem: 1 },
    streak: 7,
    partnerProfile: { traits: [], notes: '', endearment: '', setupDone: false }, // kept for migration only
    commPrefs: {
      // Each spouse fills TWO profiles independently:
      // .self       = their own self-report (how I want to receive messages)
      // .readOfThem = their read of their partner (how I think my partner communicates)
      user: {
        self:       { traits: [], setupDone: false },
        readOfThem: { traits: [], endearment: '', notes: '', setupDone: false }
      },
      partner: {
        self:       { traits: [], setupDone: false },
        readOfThem: { traits: [], endearment: '', notes: '', setupDone: false }
      }
    },
    currentView: 'user'  // 'user' | 'partner' — which partner's perspective is active
  };
  let s = { ...defaults };
  function load() {
    try {
      const d = localStorage.getItem(KEY);
      if (d) {
        const saved = JSON.parse(d);
        // Migrate old flat commPrefs to nested self/readOfThem structure
        if (saved.commPrefs) {
          const cp = saved.commPrefs;
          const needsMigration = cp.user && !cp.user.self;
          if (needsMigration) {
            const oldUserTraits   = cp.user?.traits   || [];
            const oldPartnerTraits= cp.partner?.traits || [];
            const oldEndearment   = cp.partner?.endearment || saved.partnerProfile?.endearment || '';
            const oldNotes        = cp.partner?.notes || saved.partnerProfile?.notes || '';
            const oldLegacyTraits = saved.partnerProfile?.traits || [];
            saved.commPrefs = {
              user: {
                self:       { traits: oldUserTraits,    setupDone: oldUserTraits.length > 0 },
                readOfThem: { traits: oldPartnerTraits.length ? oldPartnerTraits : oldLegacyTraits,
                              endearment: oldEndearment, notes: oldNotes,
                              setupDone: oldPartnerTraits.length > 0 || oldLegacyTraits.length > 0 || !!oldEndearment }
              },
              partner: { self: { traits: [], setupDone: false }, readOfThem: { traits: [], endearment: '', notes: '', setupDone: false } }
            };
          }
        }
        s = { ...defaults, ...saved };
      }
    } catch(e){}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
  function get(k) { return k ? s[k] : s; }
  function set(k, v) {
    if (typeof k === 'object') s = { ...s, ...k };
    else s = { ...s, [k]: v };
    save(); return s;
  }
  function reset() { s = { ...defaults }; localStorage.removeItem(KEY); }
  return { load, get, set, reset };
})();

/* ================================================
   SUPABASE DB LAYER
   ================================================
   Replace the two placeholder strings below with your
   Supabase project URL and anon/public API key.
   Get them from: Dashboard → Settings → API
   ================================================ */
const SupabaseDB = (() => {
  const SUPABASE_URL      = 'https://oevfeeymescxynikkqkx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ldmZlZXltZXNjeHluaWtrcWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMjU3MTgsImV4cCI6MjA4ODYwMTcxOH0.NgyUxl7UPZh8A4JVBUTNTyXQyR3p5eoqeByK-dvQAHo';

  const configured = SUPABASE_URL !== 'YOUR_SUPABASE_URL';
  const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  // ── Identity ──────────────────────────────────────────────
  let _session           = null;   // supabase Session
  let _handledByForm  = false;   // true from signIn() call through end of bootstrap() — suppresses onAuthStateChange routing
  let _coupleRow  = null;   // couples row
  let _myUserId   = null;
  let _myRole     = 'user'; // 'user' | 'partner'  (spouse_1 = user, spouse_2 = partner)
  let _realtimeSub = null;

  function isReady() { return configured && !!_session && !!_coupleRow; }

  // ── Auth ──────────────────────────────────────────────────
  async function signUp(email, password, name) {
    if (!configured) return { error: 'Supabase not configured' };
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) return { error: error.message };
    if (data.user) {
      // Write profile immediately (works even before email confirmation)
      await sb.from('profiles').upsert({ id: data.user.id, name });
    }
    if (!data.session) {
      // Email confirmation required — session is null until user clicks the link
      return { data, confirmEmail: true };
    }
    // Auto-confirmed (email confirmation disabled in Supabase settings)
    _session  = data.session;
    _myUserId = data.user.id;
    State.set('user', { ...State.get('user'), name });
    return { data };
  }

  async function signIn(email, password) {
    if (!configured) return { error: 'Supabase not configured' };
    _handledByForm = true;   // keep true until auth-signin clears it after bootstrap()
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      _handledByForm = false;
      return { error: error.message };
    }
    _session  = data.session;
    _myUserId = data.user?.id || null;
    return { data };
  }
  function clearFormFlag() { _handledByForm = false; }

  async function signOut() {
    if (!configured) return;
    await sb.auth.signOut();
    _session = null; _coupleRow = null; _myUserId = null; _myRole = 'user';
    State.reset();
    Router.navigate('auth-entry');
  }

  async function signInWithGoogle() {
    if (!configured) return { error: 'Supabase not configured' };
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href.split('#')[0] }
    });
    if (error) return { error: error.message };
    return {};
  }

  async function getSession() {
    if (!configured) return null;
    const { data } = await sb.auth.getSession();
    _session = data.session;
    _myUserId = _session?.user?.id || null;
    return _session;
  }

  // ── Couple linking ────────────────────────────────────────
  function _generateCode() {
    return Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  async function createCouple() {
    if (!configured || !_myUserId) return { error: 'Not authenticated' };
    const code = _generateCode();
    const { data, error } = await sb.from('couples')
      .insert({ spouse_1_id: _myUserId, invite_code: code })
      .select().single();
    if (error) return { error: error.message };
    _coupleRow = data;
    _myRole    = 'user';
    State.set('currentView', 'user');
    State.set('partner', { ...State.get('partner'), inviteCode: code, connected: false });
    return { data };
  }

  async function joinCouple(code) {
    if (!configured || !_myUserId) return { error: 'Not authenticated' };
    // Use a SECURITY DEFINER RPC — direct table access fails here because
    // RLS blocks Spouse 2 from reading/updating a couple row they're not in yet.
    const { data: rpcData, error: rpcError } = await sb.rpc('join_couple_by_invite', {
      p_code: code.toUpperCase().trim()
    });
    if (rpcError) return { error: rpcError.message };
    if (rpcData?.error) return { error: rpcData.error };
    const couple = rpcData?.data;
    if (!couple) return { error: 'Unexpected response from server' };
    _coupleRow = couple;
    _myRole    = 'partner';
    State.set('currentView', 'partner');
    State.set('mediatorTone', couple.mediator_tone || 'neutral');
    if (couple.mediator_tone) localStorage.setItem('parlay_tone_set', '1');
    State.set('partner', { ...State.get('partner'), connected: true });
    return { data: couple };
  }

  async function validateInviteCode(code) {
    // Uses the "invite code lookup" SELECT policy (no DEFINER needed for read-only)
    if (!configured) return { valid: false, error: 'Not configured' };
    const { data, error } = await sb.from('couples')
      .select('id, invite_code, spouse_2_id')
      .eq('invite_code', code.toUpperCase().trim())
      .single();
    if (error || !data) return { valid: false, error: 'Invite code not found' };
    if (data.spouse_2_id) return { valid: false, error: 'This code has already been used' };
    return { valid: true };
  }

  async function loadCouple() {
    if (!configured || !_myUserId) return null;
    const { data } = await sb.from('couples')
      .select('*')
      .or(`spouse_1_id.eq.${_myUserId},spouse_2_id.eq.${_myUserId}`)
      .single();
    if (!data) return null;
    _coupleRow = data;
    _myRole    = data.spouse_1_id === _myUserId ? 'user' : 'partner';
    State.set('currentView', _myRole);
    State.set('mediatorTone', data.mediator_tone || 'neutral');
    State.set('equity', data.equity || {});
    return data;
  }

  function getCoupleId()  { return _coupleRow?.id || null; }
  function getMyRole()    { return _myRole; }
  function getMyUserId()  { return _myUserId; }
  function getMyEmail()   { return _session?.user?.email || ''; }
  function getCurrentSession() { return _session; }
  function getMyName()      {
    // Signed-in person's own name, regardless of spouse role
    if (_myRole === 'user')    return State.get('user')?.name    || '';
    if (_myRole === 'partner') return State.get('partner')?.name || '';
    return '';
  }
  function getPartnerName() {
    // The OTHER person's name, regardless of who is signed in
    if (_myRole === 'user')    return State.get('partner')?.name || '';
    if (_myRole === 'partner') return State.get('user')?.name    || '';
    return '';
  }

  function getPartnerUserId() {
    if (!_coupleRow) return null;
    return _myRole === 'user' ? _coupleRow.spouse_2_id : _coupleRow.spouse_1_id;
  }

  // ── Profile ───────────────────────────────────────────────
  async function saveProfile(updates) {
    if (!configured || !_session) return;
    // Always persist email alongside profile so partner can display it
    const email = _session.user?.email || '';
    await sb.from('profiles').upsert({ id: _myUserId, email, ...updates });
  }

  async function loadProfile(userId) {
    if (!configured) return null;
    const { data } = await sb.from('profiles').select('*').eq('id', userId).single();
    return data;
  }

  // ── Comm Prefs ────────────────────────────────────────────
  async function saveCommSelf(traits) {
    if (!configured || !_session || !_myUserId) return;
    await sb.from('comm_self')
      .upsert({ user_id: _myUserId, traits, setup_done: traits.length > 0 },
              { onConflict: 'user_id' });
  }


  async function loadCommPrefs() {
    if (!isReady()) return;
    const partId = getPartnerUserId();
    if (!partId) return;

    const [selfRes, partnerSelfRes] = await Promise.all([
      sb.from('comm_self').select('*').eq('user_id', _myUserId).maybeSingle(),
      sb.from('comm_self').select('*').eq('user_id', partId).maybeSingle(),
    ]);

    const myRole   = _myRole;
    const themRole = myRole === 'user' ? 'partner' : 'user';
    const existing = State.get('commPrefs') || {};

    State.set('commPrefs', {
      [myRole]: {
        ...(existing[myRole] || {}),
        self: { traits: selfRes.data?.traits || [], setupDone: selfRes.data?.setup_done || false },
      },
      [themRole]: {
        ...(existing[themRole] || {}),
        self: { traits: partnerSelfRes.data?.traits || [], setupDone: partnerSelfRes.data?.setup_done || false },
      }
    });
  }

  // ── Family ────────────────────────────────────────────────
  async function saveFamilyMember(type, data) {
    if (!isReady()) return;
    await sb.from('family_members').upsert({ id: data.id, couple_id: _coupleRow.id, type, data });
  }

  async function deleteFamilyMember(id) {
    if (!isReady()) return;
    await sb.from('family_members').delete().eq('id', id);
  }

  async function loadFamily() {
    if (!isReady()) return;
    const { data } = await sb.from('family_members').select('*').eq('couple_id', _coupleRow.id);
    if (!data) return;
    const kids              = data.filter(r => r.type === 'kid').map(r => r.data);
    const providers         = data.filter(r => r.type === 'provider').map(r => r.data);
    const playdateContacts  = data.filter(r => r.type === 'playdate_contact').map(r => r.data);
    State.set('family', { kids, providers, playdateContacts });
  }

  // ── Couple settings (tone, equity) ────────────────────────
  async function saveCoupleSettings(patch) {
    if (!isReady()) return;
    await sb.from('couples').update(patch).eq('id', _coupleRow.id);
  }

  // ── Negotiations ──────────────────────────────────────────
  async function saveNegotiation(neg) {
    if (!isReady()) return;
    const row = _negToRow(neg);
    await sb.from('negotiations').upsert(row, { onConflict: 'id' });
  }

  async function updateNegotiation(id, patch) {
    if (!isReady()) return;
    const row = _negPatchToRow(patch);
    await sb.from('negotiations').update(row).eq('id', id);
  }

  async function softDeleteNegotiation(id) {
    if (!isReady()) return;
    await sb.from('negotiations').update({ deleted_at: new Date().toISOString() }).eq('id', id);
  }

  async function loadNegotiations() {
    if (!isReady()) return;
    const { data } = await sb.from('negotiations')
      .select('*').eq('couple_id', _coupleRow.id)
      .is('deleted_at', null).order('created_at', { ascending: false });
    if (!data) return;
    MediatorState.negotiations = data.map(_rowToNeg);
    MediatorState.tombstones   = new Set(); // server-side soft-deletes replace tombstones
    localStorage.setItem('parlay_negotiations', JSON.stringify(MediatorState.negotiations));
  }

  // ── Tasks ─────────────────────────────────────────────────
  async function saveTask(task) {
    if (!isReady()) return;
    const row = _taskToRow(task);
    await sb.from('tasks').upsert(row, { onConflict: 'id' });
  }

  async function updateTask(id, patch) {
    if (!isReady()) return;
    const row = _taskPatchToRow(patch);
    await sb.from('tasks').update(row).eq('id', id);
  }

  async function softDeleteTask(id) {
    if (!isReady()) return;
    await sb.from('tasks').update({ deleted_at: new Date().toISOString() }).eq('id', id);
  }

  async function loadTasks() {
    if (!isReady()) return;
    const { data } = await sb.from('tasks')
      .select('*').eq('couple_id', _coupleRow.id)
      .is('deleted_at', null).order('created_at', { ascending: false });
    if (!data) return;
    TaskState._data = data.map(_rowToTask);
    localStorage.setItem('parlay_tasks', JSON.stringify(TaskState._data));
  }

  // ── Real-time ─────────────────────────────────────────────
  function subscribeToCouple() {
    if (!isReady() || _realtimeSub) return;
    const coupleId = _coupleRow.id;
    _realtimeSub = sb.channel('couple-' + coupleId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'negotiations',
          filter: `couple_id=eq.${coupleId}` }, async () => {
        await loadNegotiations();
        const cur = Router.current();
        if (cur === 'plan') Router.navigate('plan');
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks',
          filter: `couple_id=eq.${coupleId}` }, async () => {
        await loadTasks();
        const cur = Router.current();
        if (cur === 'tasks') Router.navigate('tasks');
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'couples',
          filter: `id=eq.${coupleId}` }, async (payload) => {
        _coupleRow = payload.new;
        State.set('mediatorTone', payload.new.mediator_tone);
        State.set('equity', payload.new.equity);
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'comm_self' }, async () => {
        await loadCommPrefs();
        const cur = Router.current();
        if (cur === 'setup') Router.navigate('setup');
      })
      .subscribe();
  }

  // ── Bootstrap ─────────────────────────────────────────────
  async function bootstrap() {
    if (!configured) {
      State.load();
      return { mode: 'local' };
    }

    let session;
    try { session = await getSession(); } catch(e) { console.warn('[bootstrap] getSession error:', e); }
    if (!session) return { mode: 'unauthenticated' };

    // Load my own profile
    let profile;
    try { profile = await loadProfile(_myUserId); } catch(e) { console.warn('[bootstrap] loadProfile error:', e); }
    if (profile) {
      // State.user = Spouse 1's data, State.partner = Spouse 2's data — always.
      // Load my profile into the correct slot based on my actual role.
      if (_myRole === 'user') {
        State.set('user',    { ...State.get('user'),    name: profile.name  || '' });
      } else {
        State.set('partner', { ...State.get('partner'), name: profile.name  || '' });
      }
      State.set('loveLanguage', { ...(State.get('loveLanguage') || {}), primary: profile.love_language || '' });
    }

    // Persist my email in case it wasn't saved yet
    if (_session?.user?.email) {
      sb.from('profiles').upsert({ id: _myUserId, email: _session.user.email }).catch(() => {});
    }

    // Load or create couple
    let couple;
    try { couple = await loadCouple(); } catch(e) { console.warn('[bootstrap] loadCouple error:', e); }

    if (couple) {
      // Load partner's profile into the OTHER role slot
      const partnerId = getPartnerUserId();
      if (partnerId) {
        let partnerProfile;
        try { partnerProfile = await loadProfile(partnerId); } catch(e) { console.warn('[bootstrap] partner profile error:', e); }
        if (partnerProfile) {
          if (_myRole === 'user') {
            // I am Spouse 1 — partner goes in State.partner
            State.set('partner', {
              ...State.get('partner'),
              name:      partnerProfile.name  || State.get('partner')?.name || '',
              email:     partnerProfile.email || '',
              connected: true,
            });
          } else {
            // I am Spouse 2 — partner (Spouse 1) goes in State.user
            State.set('user', {
              ...State.get('user'),
              name:  partnerProfile.name  || State.get('user')?.name  || '',
              email: partnerProfile.email || '',
            });
            // Mark couple as connected on the partner slot (my slot)
            State.set('partner', { ...State.get('partner'), connected: true });
          }
        }
      }
      try {
        await Promise.all([loadCommPrefs(), loadFamily(), loadNegotiations(), loadTasks()]);
        subscribeToCouple();
      } catch(e) { console.warn('[bootstrap] data load error:', e); }
    }

    if (profile?.name) State.set('onboarded', true);

    return {
      mode: 'supabase',
      coupled: !!couple,
      partnerConnected: !!(couple?.spouse_2_id),
      onboardingComplete: !!(profile?.love_language),  // proxy: ob2 save = onboarding started
    };
  }

  // ── Row mappers (camelCase ↔ snake_case) ──────────────────
  function _negToRow(neg) {
    return {
      id: neg.id, couple_id: getCoupleId(),
      topic_id: neg.topicId, title: neg.title,
      raw_input: neg.rawInput, filtered_input: neg.filteredInput,
      intent_context: neg.intentContext, date_options: neg.dateOptions,
      status: neg.status,
      created_by: neg.createdBy === 'user'
        ? (_myRole === 'user' ? _myUserId : getPartnerUserId())
        : (_myRole === 'partner' ? _myUserId : getPartnerUserId()),
      partner_raw_reply: neg.partnerRawReply,
      partner_filtered_reply: neg.partnerFilteredReply,
      partner_date_response: neg.partnerDateResponse,
      proposal: neg.proposal, resolution: neg.resolution,
      archived: neg.archived || false,
    };
  }

  function _negPatchToRow(patch) {
    const map = {
      topicId: 'topic_id', title: 'title', rawInput: 'raw_input',
      filteredInput: 'filtered_input', intentContext: 'intent_context',
      dateOptions: 'date_options', status: 'status',
      partnerRawReply: 'partner_raw_reply', partnerFilteredReply: 'partner_filtered_reply',
      partnerDateResponse: 'partner_date_response',
      proposal: 'proposal', resolution: 'resolution', archived: 'archived',
    };
    const row = {};
    Object.entries(patch).forEach(([k, v]) => { if (map[k]) row[map[k]] = v; });
    return row;
  }

  function _rowToNeg(row) {
    // Map created_by UUID back to role string for in-memory compatibility
    const createdByRole = row.created_by === (_myRole === 'user' ? _myUserId : getPartnerUserId())
      ? 'user' : 'partner';
    return {
      id: row.id, topicId: row.topic_id, title: row.title,
      date: new Date(row.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
      rawInput: row.raw_input, filteredInput: row.filtered_input,
      intentContext: row.intent_context, dateOptions: row.date_options,
      status: row.status, createdBy: createdByRole,
      partnerRawReply: row.partner_raw_reply, partnerFilteredReply: row.partner_filtered_reply,
      partnerDateResponse: row.partner_date_response,
      proposal: row.proposal, resolution: row.resolution,
      archived: row.archived || false,
    };
  }

  function _taskToRow(task) {
    const myId      = _myUserId;
    const partnerId = getPartnerUserId();
    const roleToId  = (role) => role === 'user'
      ? (_myRole === 'user' ? myId : partnerId)
      : (_myRole === 'user' ? partnerId : myId);
    return {
      id: task.id, couple_id: getCoupleId(),
      title: task.title, context: task.context,
      raw_context: task.rawContext, filtered_context: task.filteredContext,
      priority: task.priority,
      due_date: task.dueDate || null,
      assigned_to: task.assignedTo ? roleToId(task.assignedTo) : null,
      created_by: roleToId(task.createdBy || 'user'),
      status: task.status,
      pending_response_from: task.pendingResponseFrom ? roleToId(task.pendingResponseFrom) : null,
      counter_count: task.counterCount || 0,
      counter_message: task.counterMessage, filtered_counter: task.filteredCounter,
      decline_reason: task.declineReason, filtered_decline: task.filteredDecline,
    };
  }

  function _taskPatchToRow(patch) {
    const map = {
      title: 'title', context: 'context', rawContext: 'raw_context',
      filteredContext: 'filtered_context', priority: 'priority', dueDate: 'due_date',
      status: 'status', counterCount: 'counter_count',
      counterMessage: 'counter_message', filteredCounter: 'filtered_counter',
      declineReason: 'decline_reason', filteredDecline: 'filtered_decline',
    };
    const row = {};
    const myId      = _myUserId;
    const partnerId = getPartnerUserId();
    const roleToId  = (role) => role === 'user'
      ? (_myRole === 'user' ? myId : partnerId)
      : (_myRole === 'user' ? partnerId : myId);
    Object.entries(patch).forEach(([k, v]) => {
      if (map[k]) row[map[k]] = v;
    });
    if (patch.assignedTo !== undefined)
      row.assigned_to = patch.assignedTo ? roleToId(patch.assignedTo) : null;
    if (patch.pendingResponseFrom !== undefined)
      row.pending_response_from = patch.pendingResponseFrom ? roleToId(patch.pendingResponseFrom) : null;
    return row;
  }

  function _rowToTask(row) {
    const myId      = _myUserId;
    const partnerId = getPartnerUserId();
    const idToRole  = (id) => id === (_myRole === 'user' ? myId : partnerId) ? 'user' : 'partner';
    return {
      id: row.id, title: row.title, context: row.context,
      rawContext: row.raw_context, filteredContext: row.filtered_context,
      priority: row.priority, dueDate: row.due_date,
      assignedTo: row.assigned_to ? idToRole(row.assigned_to) : null,
      createdBy: idToRole(row.created_by),
      status: row.status,
      pendingResponseFrom: row.pending_response_from ? idToRole(row.pending_response_from) : null,
      counterCount: row.counter_count || 0,
      counterMessage: row.counter_message, filteredCounter: row.filtered_counter,
      declineReason: row.decline_reason, filteredDecline: row.filtered_decline,
      createdAt: row.created_at, updatedAt: row.updated_at,
    };
  }

  // ── Auth state listener (registered once at module init) ──
  // Handles: Google OAuth redirect returns, email confirmation callback, session expiry
  let _authListenerRegistered = false;
  function _initAuthListener() {
    if (!configured || _authListenerRegistered) return;
    _authListenerRegistered = true;

    sb.auth.onAuthStateChange(async (event, session) => {
      // SIGNED_IN fires for: Google OAuth redirect, email confirmation click, AND email/password sign-in.
      // For email/password sign-in the auth-signin handler calls bootstrap() directly — skip here.
      // The _handledByForm flag is set BEFORE signInWithPassword and cleared AFTER bootstrap() returns.
      if (event === 'SIGNED_IN' && session && !_handledByForm) {
        // Fresh auth event — Google OAuth redirect or email confirmation link clicked
        _session  = session;
        _myUserId = session.user.id;

        // Ensure profile exists (Google users skip the sign-up form)
        const profile = await loadProfile(_myUserId);
        const googleName = session.user.user_metadata?.full_name?.split(' ')[0] || '';
        const finalName  = profile?.name || googleName || '';

        if (!profile?.name && finalName) {
          await sb.from('profiles').upsert({ id: _myUserId, name: finalName });
        }
        // Load name into role-correct slot (role is set by loadCouple below)
        // For now, stash in a temp var — we'll place it after we know the role
        const _myNameTemp = finalName;

        if (profile?.love_language)
          State.set('loveLanguage', { ...(State.get('loveLanguage') || {}), primary: profile.love_language });

        const couple = await loadCouple();

        // Now _myRole is set — place my name in the correct slot
        if (_myRole === 'user') {
          State.set('user',    { ...State.get('user'),    name: _myNameTemp });
        } else {
          State.set('partner', { ...State.get('partner'), name: _myNameTemp });
        }

        if (couple) {
          // Load partner profile into the other slot
          const partnerId = getPartnerUserId();
          if (partnerId) {
            const partnerProfile = await loadProfile(partnerId);
            if (partnerProfile?.name) {
              if (_myRole === 'user') {
                State.set('partner', { ...State.get('partner'), name: partnerProfile.name, email: partnerProfile.email || '', connected: true });
              } else {
                State.set('user',    { ...State.get('user'),    name: partnerProfile.name, email: partnerProfile.email || '' });
                State.set('partner', { ...State.get('partner'), connected: true });
              }
            }
          }
          await Promise.all([loadCommPrefs(), loadFamily(), loadNegotiations(), loadTasks()]);
          subscribeToCouple();
          State.set('onboarded', true);
          Router.navigate('home');
        } else {
          // Check if there's a pending invite code (Spouse 2 used Google on auth-join)
          const pendingCode = localStorage.getItem('parlay_pending_invite');
          if (pendingCode) {
            localStorage.removeItem('parlay_pending_invite');
            const joinResult = await joinCouple(pendingCode);
            if (!joinResult.error) {
              const partnerId = getPartnerUserId();
              if (partnerId) {
                const partnerProfile = await loadProfile(partnerId);
                if (partnerProfile?.name) {
                  // After joining, I am Spouse 2 (_myRole = 'partner')
                  State.set('user', { ...State.get('user'), name: partnerProfile.name, email: partnerProfile.email || '' });
                  State.set('partner', { ...State.get('partner'), connected: true });
                }
              }
              await Promise.all([loadCommPrefs(), loadFamily(), loadNegotiations(), loadTasks()]);
              subscribeToCouple();
              State.set('onboarded', true);
              Router.navigate('ob2'); // Spouse 2's personal onboarding
              return;
            }
          }
          // No couple, no pending code — normal new user onboarding
          Router.navigate(profile?.love_language ? 'ob-connect' : 'ob2');
        }
      }

      if (event === 'SIGNED_OUT') {
        _session = null; _coupleRow = null; _myUserId = null; _myRole = 'user';
        State.reset();
        Router.navigate('auth-entry');
      }

      if (event === 'TOKEN_REFRESHED' && session) {
        _session = session;
      }
    });
  }

  return {
    get configured() { return configured; },
    get myRole()     { return _myRole; },
    get coupleRow()  { return _coupleRow; },
    isReady,
    initAuthListener: _initAuthListener,
    signUp, signIn, signOut, signInWithGoogle, getSession,
    createCouple, joinCouple, validateInviteCode, loadCouple, getCoupleId, getMyRole, getMyUserId, getMyEmail, getMyName, getPartnerName, getPartnerUserId, getCurrentSession,
    saveProfile, loadProfile,
    saveCommSelf, loadCommPrefs, clearFormFlag,
    saveFamilyMember, deleteFamilyMember, loadFamily,
    saveCoupleSettings,
    saveNegotiation, updateNegotiation, softDeleteNegotiation, loadNegotiations,
    saveTask, updateTask, softDeleteTask, loadTasks,
    subscribeToCouple,
    bootstrap,
  };
})();

   ================================================ */
const Router = (() => {
  const routes = {};
  const inits = {};
  let current = null;
  const NAV_SCREENS = ['home', 'languages', 'plan', 'tasks', 'equity'];

  function register(name, renderFn, initFn) {
    routes[name] = renderFn;
    if (initFn) inits[name] = initFn;
  }

  function navigate(name, params = {}) {
    const app = document.getElementById('app');
    const prev = current;

    if (prev) {
      const prevEl = document.getElementById(`screen-${prev}`);
      if (prevEl) {
        prevEl.classList.remove('active');
        prevEl.classList.add('exit');
        setTimeout(() => { prevEl.classList.remove('exit'); }, 300);
      }
    }

    current = name;

    // View banner (localStorage dev mode only — hidden when Supabase is active)
    const ONBOARDING_SCREENS = ['splash','ob1','ob2','ob-self','ob3','ob4','ob-join','ob-connect','ob-intro','auth-entry','auth-signup','auth-signin','auth-join','auth-confirm-email'];
    const NAV_MAIN_SCREENS = ['home','languages','plan','tasks','equity','setup'];
    const banner = document.getElementById('view-banner');
    const bannerText = document.getElementById('view-banner-text');
    const bannerSwitch = document.getElementById('view-banner-switch');
    if (banner) {
      const view = State.get('currentView') || 'user';
      const pName = (SupabaseDB.configured ? SupabaseDB.getPartnerName() : null) || State.get('partner')?.name || State.get('user')?.name || 'Partner';
      // Only show the "Viewing as" banner in localStorage mode (no Supabase)
      if (!SupabaseDB.configured && view === 'partner' && !ONBOARDING_SCREENS.includes(name)) {
        bannerText.textContent = `Viewing as ${pName}`;
        banner.style.display = 'flex';
        if (bannerSwitch) bannerSwitch.onclick = () => { State.set('currentView','user'); navigate(name); };
      } else {
        banner.style.display = 'none';
      }
    }

    // Auth bar — show signed-in user name on main app screens
    const authBar = document.getElementById('auth-bar');
    if (authBar) {
      if (SupabaseDB.configured && SupabaseDB.isReady() && NAV_MAIN_SCREENS.includes(name)) {
        const nameEl = document.getElementById('auth-bar-name');
        if (nameEl) nameEl.textContent = (SupabaseDB.configured ? SupabaseDB.getMyName() : State.get('user')?.name) || 'You';
        authBar.style.display = 'flex';
      } else {
        authBar.style.display = 'none';
      }
    }

    // Nav visibility
    const nav = document.getElementById('bottom-nav');
    if (nav) {
      nav.style.display = NAV_SCREENS.includes(name) ? 'flex' : 'none';
      nav.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.screen === name);
      });
    }

    let el = document.getElementById(`screen-${name}`);
    if (!el) {
      el = document.createElement('div');
      el.id = `screen-${name}`;
      el.className = 'screen';
      app.appendChild(el);
    }

    if (routes[name]) el.innerHTML = routes[name](params);
    requestAnimationFrame(() => {
      el.classList.add('active');
      if (inits[name]) inits[name](el, params);
    });
  }

  function init() {
    // Build nav
    const nav = document.createElement('nav');
    nav.id = 'bottom-nav';
    nav.innerHTML = `
      <button class="nav-item" data-screen="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-screen="languages">
        <span class="nav-icon">💛</span>
        <span class="nav-label">Connect</span>
      </button>
      <button class="nav-item" data-screen="plan">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Plan</span>
      </button>
      <button class="nav-item" data-screen="tasks" style="position:relative;">
        <span id="task-nav-badge" style="display:none;position:absolute;top:4px;right:10px;min-width:16px;height:16px;background:var(--terra);color:#fff;border-radius:8px;font-size:.58rem;font-weight:700;padding:0 4px;align-items:center;justify-content:center;"></span>
        <span class="nav-icon">✅</span>
        <span class="nav-label">Tasks</span>
      </button>
      <button class="nav-item" data-screen="equity">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Balance</span>
      </button>
    `;
    document.body.appendChild(nav);
    nav.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => navigate(btn.dataset.screen));
    });
  }

  return { register, navigate, init, current: () => current };
})();

const U = {
  toast(msg, ms = 2500) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), ms);
  },
  toastUndo(msg, onUndo, duration = 4500) {
    const prev = document.getElementById('parlay-undo-toast');
    if (prev) prev.remove();
    const el = document.createElement('div');
    el.id = 'parlay-undo-toast';
    el.style.cssText = 'position:fixed;bottom:calc(var(--nav-h,80px) + 16px);left:50%;transform:translateX(-50%);background:#1a1208;color:#fff;padding:12px 16px;border-radius:12px;font-size:.82rem;font-family:var(--font-body);z-index:9999;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(0,0,0,.28);white-space:nowrap;max-width:calc(100vw - 40px);';
    el.innerHTML = '<span>' + msg + '</span><button style="background:rgba(255,255,255,.18);border:none;color:#fff;font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--font-body);">Undo</button>';
    document.body.appendChild(el);
    const timer = setTimeout(() => el.remove(), duration);
    el.querySelector('button').addEventListener('click', () => {
      clearTimeout(timer); el.remove(); if (onUndo) onUndo();
    });
  },
  initials: n => n ? n.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2) : '?',
  timeOfDay() {
    const h = new Date().getHours();
    return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  },
  today: () => new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
  code: () => Math.random().toString(36).slice(2,8).toUpperCase()
};

    </div>

    <div style="display:flex;flex-direction:column;gap:12px;" class="a2">
      <div>
        <label style="font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(250,246,241,.4);display:block;margin-bottom:5px;">Your first name</label>
        <input id="join-name" class="input" type="text" placeholder="e.g. Alex" autocomplete="given-name" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:var(--cream);">

        <input id="join-password" class="input" type="password" placeholder="At least 8 characters" autocomplete="new-password" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:var(--cream);">
      </div>
      <div id="join-error" style="display:none;font-size:.76rem;color:#F87171;background:rgba(248,113,113,.1);border-radius:10px;padding:10px 14px;line-height:1.5;"></div>
    </div>

    <div style="margin-top:20px;" class="a3">
      <button id="join-btn" style="width:100%;padding:16px;background:rgba(122,158,138,.85);color:#fff;border:none;border-radius:14px;font-family:var(--font-body);font-size:.92rem;font-weight:700;cursor:pointer;">
        Join & create account →
      </button>
      <div style="text-align:center;margin-top:14px;font-size:.74rem;color:rgba(250,246,241,.3);">
        Already have an account? <span onclick="Router.navigate('auth-signin')" style="color:var(--amber);cursor:pointer;text-decoration:underline;">Sign in instead</span>
      </div>
    </div>
  </div>
`, (el) => {
  // Auto-uppercase the code field
  el.querySelector('#join-code').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase();
  });

  // Live code validation — debounced, runs after user stops typing
  const codeInputEl  = el.querySelector('#join-code');
  const codeValidEl  = el.querySelector('#join-code-valid') || (() => {
    const d = document.createElement('div');
    d.id = 'join-code-valid';
    d.style.cssText = 'font-size:.72rem;min-height:18px;margin-top:4px;padding:0 2px;transition:color .2s;';
    codeInputEl.parentNode.insertBefore(d, codeInputEl.nextSibling);
    return d;
  })();
  let _validateTimer = null;
  codeInputEl.addEventListener('input', () => {
    const v = codeInputEl.value.trim();
    clearTimeout(_validateTimer);
    if (v.length < 6) { codeValidEl.textContent = ''; return; }
    codeValidEl.style.color = 'var(--muted)';
    codeValidEl.textContent = 'Checking…';
    _validateTimer = setTimeout(async () => {
      const result = await SupabaseDB.validateInviteCode(v);
      if (result.valid) {
        codeValidEl.style.color = 'var(--sage)';
        codeValidEl.textContent = '✓ Code valid';
        codeInputEl.style.borderColor = 'rgba(122,158,138,.8)';
      } else {
        codeValidEl.style.color = 'var(--terra)';
        codeValidEl.textContent = '✗ ' + result.error;
        codeInputEl.style.borderColor = 'rgba(196,113,74,.6)';
      }
    }, 500);
  });

  // Auto-fill from magic link ?invite= param
  const prefill = localStorage.getItem('parlay_prefill_invite');
  if (prefill) {
    const codeInput = el.querySelector('#join-code');
    if (codeInput) {
      codeInput.value = prefill;
      codeInput.style.borderColor = 'rgba(122,158,138,.8)';
      codeInput.style.background = 'rgba(122,158,138,.12)';
      // Trigger validation for the prefilled code
      codeInput.dispatchEvent(new Event('input'));
    }
    localStorage.removeItem('parlay_prefill_invite');
  } else {
    el.querySelector('#join-code').focus();
  }

  // Google path: store code in localStorage before OAuth redirect
  el.querySelector('#join-google-btn').addEventListener('click', () => {
    const code = el.querySelector('#join-code').value.trim().toUpperCase();
    const errEl = el.querySelector('#join-error');
    if (code.length < 6) {
      errEl.textContent = 'Enter your partner\'s 6-character invite code first';
      errEl.style.display = 'block';
      el.querySelector('#join-code').focus();
      return;
    }
    // Stash code so onAuthStateChange can pick it up after Google redirect
    localStorage.setItem('parlay_pending_invite', code);
    SupabaseDB.signInWithGoogle();
  });

  // Email path: sign up then immediately join
  el.querySelector('#join-btn').addEventListener('click', async () => {
    const code     = el.querySelector('#join-code').value.trim().toUpperCase();
    const name     = el.querySelector('#join-name').value.trim();
    const email    = el.querySelector('#join-email').value.trim();
    const password = el.querySelector('#join-password').value;
    const errEl    = el.querySelector('#join-error');
    errEl.style.display = 'none';

    if (code.length < 6) { errEl.textContent = 'Enter your partner\'s invite code'; errEl.style.display = 'block'; el.querySelector('#join-code').focus(); return; }
    if (!name)            { errEl.textContent = 'Enter your name'; errEl.style.display = 'block'; return; }
    if (!email)           { errEl.textContent = 'Enter your email'; errEl.style.display = 'block'; return; }
    if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters'; errEl.style.display = 'block'; return; }

    const btn = el.querySelector('#join-btn');
    btn.textContent = 'Creating account…'; btn.disabled = true;

    // 1. Create account
    const signupResult = await SupabaseDB.signUp(email, password, name);
    if (signupResult.error) {
      errEl.textContent = signupResult.error; errEl.style.display = 'block';
      btn.textContent = 'Join & create account →'; btn.disabled = false;
      return;
    }
    if (signupResult.confirmEmail) {
      // Store code so it can be consumed after email confirmation
      localStorage.setItem('parlay_pending_invite', code);
      SupabaseDB.initAuthListener();
      Router.navigate('auth-confirm-email');
      return;
    }

    // 2. Account is live — join the couple immediately
    btn.textContent = 'Joining…';
    const joinResult = await SupabaseDB.joinCouple(code);
    if (joinResult.error) {
      errEl.textContent = joinResult.error; errEl.style.display = 'block';
      btn.textContent = 'Join & create account →'; btn.disabled = false;
      return;
    }

    // 3. Load partner (Spouse 1) name into State.user; mark State.partner as connected
    const partnerId = SupabaseDB.getPartnerUserId();
    if (partnerId) {
      const profile = await SupabaseDB.loadProfile(partnerId);
      if (profile?.name) {
        // As Spouse 2, my slot is State.partner; Spouse 1's data goes in State.user
        State.set('user',    { ...State.get('user'),    name: profile.name, email: profile.email || '' });
        State.set('partner', { ...State.get('partner'), connected: true });
      }
    }
    await Promise.all([SupabaseDB.loadCommPrefs(), SupabaseDB.loadFamily(), SupabaseDB.loadNegotiations(), SupabaseDB.loadTasks()]);
    SupabaseDB.subscribeToCouple();
    SupabaseDB.initAuthListener();

    // 4. Go to Spouse 2's personal onboarding (skip ob-connect — they've already joined)
    Router.navigate('ob2');
  });

  el.querySelector('#join-code').focus();
});

    const btn = el.querySelector('#signin-btn');

    let result;

      btn.textContent = 'Sign in →'; btn.disabled = false;

});

Router.register('ob-join', () => `
  <div class="onboarding-wrap">
    <div class="a1" style="margin-bottom:32px;margin-top:20px;">
      <div class="ob-title">Enter your<br><em>invite code</em></div>
      <div class="ob-sub" style="margin-top:8px;">Your partner's 6-character code links your accounts together.</div>
    </div>
    <div class="ob-body a2">
      <div class="input-wrap">
        <label class="input-label">Invite code</label>
        <input class="input" id="join-code" type="text" placeholder="e.g. AB12CD" style="text-transform:uppercase;letter-spacing:.15em;font-size:1.3rem;font-family:var(--font-display);" maxlength="6" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div id="join-error" style="display:none;font-size:.78rem;color:var(--terra);background:rgba(196,113,74,.1);border-radius:10px;padding:10px 14px;line-height:1.5;"></div>
    </div>
    <div class="ob-footer a3">
      <button class="btn btn-primary btn-full" id="join-btn">Connect to partner →</button>
      <button class="btn btn-muted btn-full" onclick="Router.navigate(SupabaseDB.configured ? 'ob-connect' : 'splash')">Back</button>
    </div>
  </div>
`, async (el) => {
  // Live validation on ob-join code field
  const ojCode = el.querySelector('#join-code');
  let _ojTimer = null;
  ojCode.addEventListener('input', () => {
    const v = ojCode.value.trim();
    const errEl = el.querySelector('#join-error');
    clearTimeout(_ojTimer);
    if (v.length < 6) { errEl.style.display = 'none'; return; }
    _ojTimer = setTimeout(async () => {
      const result = await SupabaseDB.validateInviteCode(v);
      if (result.valid) {
        errEl.style.display = 'none';
        ojCode.style.borderColor = 'rgba(122,158,138,.8)';
      } else {
        errEl.textContent = result.error; errEl.style.display = 'block';
        ojCode.style.borderColor = 'rgba(196,113,74,.6)';
      }
    }, 500);
  });

  el.querySelector('#join-btn').addEventListener('click', async () => {
    const code   = el.querySelector('#join-code').value.trim().toUpperCase();
    const errEl  = el.querySelector('#join-error');
    errEl.style.display = 'none';

    if (code.length < 6) { errEl.textContent = 'Enter the full 6-character code'; errEl.style.display = 'block'; return; }

    const btn = el.querySelector('#join-btn');
    btn.textContent = 'Connecting…'; btn.disabled = true;

    if (SupabaseDB.configured) {
      const { error } = await SupabaseDB.joinCouple(code);
      if (error) {
        // Recovery: if already coupled (they joined earlier and looped back here),
        // treat "already used" as success and continue
        if (error.includes('already been used') && SupabaseDB.coupleRow) {
          // They're already in the couple — just continue
        } else {
          errEl.textContent = error; errEl.style.display = 'block';
          btn.textContent = 'Connect to partner →'; btn.disabled = false;
          return;
        }
      }
      // Load partner (Spouse 1) profile into State.user; Spouse 2's slot is State.partner
      const partnerId = SupabaseDB.getPartnerUserId();
      if (partnerId) {
        const profile = await SupabaseDB.loadProfile(partnerId);
        if (profile?.name) {
          State.set('user',    { ...State.get('user'),    name: profile.name, email: profile.email || '' });
          State.set('partner', { ...State.get('partner'), connected: true });
        }
      }
      // Load all shared data now that couple is linked
      await Promise.all([
        SupabaseDB.loadCommPrefs(),
        SupabaseDB.loadFamily(),
        SupabaseDB.loadNegotiations(),
        SupabaseDB.loadTasks(),
      ]);
      SupabaseDB.subscribeToCouple();
      State.set('onboarded', true);
      Router.navigate('ob-intro'); // ← correct: don't loop back to ob2
    } else {
      // localStorage-only mode — name prompt not needed (user already entered name in ob1)
      State.set('partner', { ...State.get('partner'), connected: true, inviteCode: code });
      Router.navigate('ob-intro');
    }
  });
  el.querySelector('#join-code').addEventListener('input', e => {
    e.target.value = e.target.value.toUpperCase();
  });
  el.querySelector('#join-code').focus();
});

// Mediator state
const MediatorState = {
  negotiations: JSON.parse(localStorage.getItem('parlay_negotiations') || '[]'),
  tombstones:   new Set(JSON.parse(localStorage.getItem('parlay_tombstones') || '[]')),

  save() { localStorage.setItem('parlay_negotiations', JSON.stringify(this.negotiations)); },
  saveTombstones() { localStorage.setItem('parlay_tombstones', JSON.stringify([...this.tombstones])); },

  add(neg) { this.negotiations.unshift(neg); this.save(); SupabaseDB.saveNegotiation(neg).catch(() => {}); },

  update(id, patch) {
    const i = this.negotiations.findIndex(n => n.id === id);
    if (i > -1) { this.negotiations[i] = { ...this.negotiations[i], ...patch }; this.save(); SupabaseDB.updateNegotiation(id, patch).catch(() => {}); }
  },

  // Archive: marks as archived but keeps it (visible in archive section)
  archive(id) {
    this.update(id, { archived: true });
  },

  // Delete: soft-delete on Supabase, remove locally + tombstone
  remove(id) {
    this.negotiations = this.negotiations.filter(n => n.id !== id);
    this.tombstones.add(id);
    this.save();
    this.saveTombstones();
    SupabaseDB.softDeleteNegotiation(id).catch(() => {});
  },

  // Filter helper — excludes tombstoned items
  get active()   { return this.negotiations.filter(n => !this.tombstones.has(n.id) && !n.archived && n.status !== 'resolved'); },
  get history()  { return this.negotiations.filter(n => !this.tombstones.has(n.id) && !n.archived && n.status === 'resolved'); },
  get archived() { return this.negotiations.filter(n => !this.tombstones.has(n.id) && n.archived); },
  get all()      { return this.negotiations.filter(n => !this.tombstones.has(n.id)); },

  // Pending for partner to respond to (partner inbox)
  get pendingForPartner() { return this.all.filter(n => n.status === 'pending_partner'); },
  // Partner has replied, awaiting user action
  get partnerReplied()    { return this.all.filter(n => n.status === 'partner_replied'); },

  find(id) { return this.all.find(n => n.id === id) || null; },
};

function _incrementEquity(topicId) {
  const eq = State.get('equity') || {};
  const map = {
    date:     { dateNights: (eq.dateNights || 0) + 1 },
    boys:     { boysNights: (eq.boysNights || 0) + 1 },
    girls:    { girlsNights: (eq.girlsNights || 0) + 1 },
    inlaw:    { inlawUs: (eq.inlawUs || 0) + 1 },
    family:   { inlawUs: (eq.inlawUs || 0) + 1 },
    host:     { hosting: (eq.hosting || 0) + 1 },
    playdate: { playdates: (eq.playdates || 0) + 1 },
  };
  if (map[topicId]) {
    const updated = { ...eq, ...map[topicId] };
    State.set('equity', updated);
    SupabaseDB.saveCoupleSettings({ equity: updated }).catch(() => {});
  }
}

const ParlayActions = {
  // Show action sheet for a given parlay ID. onDone is called after any action.
  show(negId, onDone) {
    const neg = MediatorState.find(negId);
    if (!neg) return;
    const topic = TOPIC_TYPES.find(t => t.id === neg.topicId) || TOPIC_TYPES[5];
    const isArchived = !!neg.archived;

    const overlay = document.createElement('div');
    overlay.className = 'action-sheet-overlay';
    overlay.innerHTML = `
      <div class="action-sheet">
        <div class="action-sheet-handle"></div>
        <div class="action-sheet-title">${topic.icon} ${neg.title}</div>

        ${isArchived ? `
          <button class="as-btn" id="as-unarchive">
            <span class="as-btn-icon">📂</span>
            <div class="as-btn-text">
              <div class="as-btn-label">Unarchive</div>
              <div class="as-btn-sub">Move back to active plans</div>
            </div>
          </button>
        ` : `
          <button class="as-btn" id="as-archive">
            <span class="as-btn-icon">📁</span>
            <div class="as-btn-text">
              <div class="as-btn-label">Archive</div>
              <div class="as-btn-sub">Hide from your list — still accessible below</div>
            </div>
          </button>
        `}

        <button class="as-btn danger" id="as-delete">
          <span class="as-btn-icon">🗑️</span>
          <div class="as-btn-text">
            <div class="as-btn-label">Delete for both partners</div>
            <div class="as-btn-sub">Removes this parlay permanently — can't be undone</div>
          </div>
        </button>

        <button class="as-cancel" id="as-cancel">Cancel</button>
      </div>
    `;

    document.body.appendChild(overlay);

    const close = () => overlay.remove();
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
    overlay.querySelector('#as-cancel').addEventListener('click', close);

    const archBtn = overlay.querySelector('#as-archive');
    const unarchBtn = overlay.querySelector('#as-unarchive');

    if (archBtn) {
      archBtn.addEventListener('click', () => {
        const archNeg = MediatorState.find(negId);
        if (archNeg) _incrementEquity(archNeg.topicId);
        MediatorState.archive(negId);
        close();
        U.toast('Parlay archived');
        if (onDone) onDone('archived');
      });
    }
    if (unarchBtn) {
      unarchBtn.addEventListener('click', () => {
        MediatorState.update(negId, { archived: false });
        close();
        U.toast('Parlay restored');
        if (onDone) onDone('unarchived');
      });
    }

    overlay.querySelector('#as-delete').addEventListener('click', () => {
      // Confirm step
      const confirmEl = overlay.querySelector('.action-sheet');
      confirmEl.innerHTML = `
        <div class="action-sheet-handle"></div>
        <div class="action-sheet-title" style="color:#C0392B;">⚠️ Delete permanently?</div>
        <div style="padding:12px 8px 16px;font-size:.83rem;color:var(--muted);line-height:1.6;text-align:center;">
          This removes <strong style="color:var(--espresso);">${neg.title}</strong> for both you and your partner. This cannot be undone.
        </div>
        <button class="as-btn danger" id="as-confirm-delete" style="background:#FFF0EE;border-radius:var(--r-md);">
          <span class="as-btn-icon">🗑️</span>
          <div class="as-btn-text">
            <div class="as-btn-label">Yes, delete for both</div>
          </div>
        </button>
        <button class="as-cancel" id="as-cancel2">Cancel</button>
      `;
      confirmEl.querySelector('#as-cancel2').addEventListener('click', close);
      confirmEl.querySelector('#as-confirm-delete').addEventListener('click', () => {
        MediatorState.remove(negId);
        close();
        U.toast('Parlay deleted for both partners');
        if (onDone) onDone('deleted');
      });
    });
  }
};

// How the SENDER wants to communicate — reads their own self-report
function getSenderPrefsPrompt(senderRole) {
  const commPrefs = State.get('commPrefs') || {};
  const selfPrefs = commPrefs[senderRole]?.self || {};
  const traits    = selfPrefs.traits || [];
  if (traits.length === 0) return '';

  const byCategory = {};
  MY_COMM_PREFS_TRAITS.forEach(cat => {
    const sel = cat.traits.filter(t => traits.includes(t.id));
    if (sel.length > 0) byCategory[cat.category] = sel.map(t => t.label);
  });

  let block = `\nSENDER VOICE PROFILE — This person's own stated communication style (preserve their authentic voice; only remove destructive patterns):\n`;
  Object.entries(byCategory).forEach(([cat, items]) => {
    block += `• ${cat}: ${items.join('; ')}\n`;
  });
  return block;
}

// How the RECIPIENT wants to receive communication
// Single source of truth: the recipient's own self-report only.
// Each person fills out their own preferences; Parlay applies those when they are the recipient.
function getRecipientPrefsPrompt(recipientRole, recipientName) {
  const commPrefs  = State.get('commPrefs') || {};
  const selfPrefs  = commPrefs[recipientRole]?.self || {};
  const selfTraits = selfPrefs.traits || [];

  if (selfTraits.length === 0) return '';

  const byCategory = {};
  MY_COMM_PREFS_TRAITS.forEach(cat => {
    const sel = cat.traits.filter(t => selfTraits.includes(t.id));
    if (sel.length > 0) byCategory[cat.category] = sel.map(t => t.label);
  });

  let block = `\nRECIPIENT PROFILE — ${recipientName}'s self-reported communication preferences (HARD CONSTRAINT — every word must reflect this):\n`;
  Object.entries(byCategory).forEach(([cat, items]) => {
    block += `  • ${cat}: ${items.join('; ')}\n`;
  });
  block += `Address ${recipientName} by first name only unless they've indicated otherwise. Shape every tone, framing, and pacing decision around these preferences.\n`;
  return block;
}
