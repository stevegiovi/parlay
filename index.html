Router.register('decision-detail', (params) => {
  const dec = DecisionHelper.get(params.id);
  if (!dec) return '<div style="padding:40px;text-align:center;">Decision not found</div>';
  const myN = Auth.myName();
  const theirN = Auth.theirName();

  return '<div style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:calc(var(--nav-h) + 24px);">' +
    ScreenHeader.render({ title: 'Decision', back: 'decisions', icon: '🤔' }) +

    '<div style="font-family:var(--font-display);font-size:1.3rem;font-weight:300;margin-bottom:4px;" class="a1">' + U.esc(dec.question) + '</div>' +
    (dec.context ? '<div style="font-size:.75rem;color:var(--muted);margin-bottom:16px;">' + U.esc(dec.context) + '</div>' : '<div style="margin-bottom:16px;"></div>') +

    // Options
    dec.options.map(opt => {
      const isMyPick = opt.myVote;
      const isTheirPick = opt.theirVote;
      const borderColor = isMyPick && isTheirPick ? 'var(--sage)' : isMyPick ? 'var(--terra)' : isTheirPick ? 'var(--purple, #7A6A9B)' : 'var(--border)';

      return '<div class="insight-card decision-option" data-opt="' + opt.id + '" style="margin-bottom:10px;border-left:3px solid ' + borderColor + ';cursor:pointer;">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
          '<div style="font-size:.88rem;font-weight:700;">' + U.esc(opt.text) + '</div>' +
          '<div style="display:flex;gap:4px;">' +
            (isMyPick ? '<span style="font-size:.55rem;padding:2px 6px;background:rgba(196,113,74,.15);color:var(--terra);border-radius:8px;font-weight:700;">Your pick</span>' : '') +
            (isTheirPick ? '<span style="font-size:.55rem;padding:2px 6px;background:rgba(122,158,138,.15);color:var(--sage);border-radius:8px;font-weight:700;">' + U.esc(theirN) + "'s pick</span>" : '') +
          '</div>' +
        '</div>' +

        // Pros
        (opt.pros.length > 0 ?
          '<div style="margin-bottom:4px;">' +
            opt.pros.map(p => '<div style="font-size:.72rem;color:var(--sage);display:flex;align-items:baseline;gap:4px;"><span>+</span> ' + U.esc(p) + '</div>').join('') +
          '</div>'
        : '') +

        // Cons
        (opt.cons.length > 0 ?
          '<div>' +
            opt.cons.map(c => '<div style="font-size:.72rem;color:var(--terra);display:flex;align-items:baseline;gap:4px;"><span>-</span> ' + U.esc(c) + '</div>').join('') +
          '</div>'
        : '') +

        '<div style="display:flex;gap:6px;margin-top:8px;">' +
          '<button class="btn btn-sm btn-outline vote-btn" data-opt="' + opt.id + '">Vote for this</button>' +
          '<button class="btn btn-sm btn-outline add-pro-btn" data-opt="' + opt.id + '">+ Pro</button>' +
          '<button class="btn btn-sm btn-outline add-con-btn" data-opt="' + opt.id + '">+ Con</button>' +
        '</div>' +
      '</div>';
    }).join('') +

    // Decide button
    '<div style="margin-top:16px;text-align:center;">' +
      '<button class="btn btn-accent" id="finalize-decision" style="width:100%;">Finalize Decision</button>' +
    '</div>' +
  '</div>';
}, (el, params) => {
  // Vote buttons
  el.querySelectorAll('.vote-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      DecisionHelper.vote(params.id, btn.dataset.opt);
      U.toast('Vote recorded');
      Router.reload();
    });
  });

  // Add pro
  el.querySelectorAll('.add-pro-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const text = prompt('Add a pro:');
      if (text && text.trim()) {
        DecisionHelper.addPro(params.id, btn.dataset.opt, text.trim());
        Router.reload();
      }
    });
  });

  // Add con
  el.querySelectorAll('.add-con-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const text = prompt('Add a con:');
      if (text && text.trim()) {
        DecisionHelper.addCon(params.id, btn.dataset.opt, text.trim());
        Router.reload();
      }
    });
  });

  // Finalize
  el.querySelector('#finalize-decision')?.addEventListener('click', () => {
    const dec = DecisionHelper.get(params.id);
    const myPick = dec.options.find(o => o.myVote);
    if (!myPick) { U.toast('Vote for an option first'); return; }
    DecisionHelper.decide(params.id, myPick.id);
    U.toast('Decision finalized!');
    Router.go('decisions');
  });
});

// AGENDA VIEW SCREEN — Day-by-day upcoming events
// ──────────────────────────────────────────────
Router.register('agenda', () => {
  const today = new Date();
  const days = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    const dateStr = d.toISOString().split('T')[0];
    const events = CalendarEngine.eventsForDate(dateStr);
    days.push({ date: d, dateStr, events });
  }

  const dayLabel = (d) => {
    const diff = Math.round((d - today) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    return d.toLocaleDateString('en-US', { weekday: 'long' });
  };

  return '<div style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:calc(var(--nav-h) + 24px);">' +
    ScreenHeader.render({ title: 'Agenda', subtitle: 'Next 2 weeks', icon: '📋', back: 'calendar' }) +

    days.map((day, idx) => {
      const hasEvents = day.events.length > 0;
      return '<div class="a' + Math.min(idx + 1, 5) + '" style="margin-bottom:' + (hasEvents ? '16px' : '8px') + ';">' +
        '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:' + (hasEvents ? '8px' : '0') + ';">' +
          '<div style="font-size:.82rem;font-weight:700;' + (idx === 0 ? 'color:var(--terra);' : '') + '">' + dayLabel(day.date) + '</div>' +
          '<div style="font-size:.65rem;color:var(--muted);">' + day.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</div>' +
          (hasEvents ? '' : '<div style="font-size:.65rem;color:var(--border);font-style:italic;">No events</div>') +
        '</div>' +
        (hasEvents ? day.events.map(ev =>
          '<div onclick="' + (ev.parlayId ? "Router.go(\'parlay-detail\',{id:\'" + ev.parlayId + "\'})" : ev.taskId ? "Router.go(\'task-detail\',{id:\'" + ev.taskId + "\'})" : '') + '" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:4px;cursor:pointer;border-left:3px solid ' + (ev.color || 'var(--sage)') + ';">' +
            '<span style="font-size:.9rem;">' + (ev.type === 'parlay' ? '📅' : ev.type === 'task' ? '✅' : '🎯') + '</span>' +
            '<div style="flex:1;min-width:0;">' +
              '<div style="font-size:.78rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + U.esc(ev.title) + '</div>' +
              (ev.time ? '<div style="font-size:.62rem;color:var(--muted);">' + ev.time + '</div>' : '') +
            '</div>' +
            '<div style="font-size:.55rem;padding:2px 6px;background:rgba(122,158,138,.1);color:var(--sage);border-radius:8px;">' + ev.type + '</div>' +
          '</div>'
        ).join('') : '') +
      '</div>';
    }).join('') +

    ContextTools.renderToolbar('calendar') +
  '</div>';
});

// WEEKLY CHAT SUMMARY SCREEN
// ──────────────────────────────────────────────
Router.register('chat-weekly', () => {
  const stats = ChatAnalytics.summary(7);
  const digest = ChatAnalytics.weeklyDigest();
  const myN = Auth.myName();
  const theirN = Auth.theirName();

  // Get conversation topics from messages
  const messages = CoupleChat.recentMessages(50).filter(m => m.from !== 'system' && m.from !== 'ai');

  // Simple word frequency for topics
  const stopWords = new Set(['the','a','an','is','are','was','were','i','you','we','it','to','in','for','on','and','or','but','at','of','do','have','has','had','my','your','our','this','that','be','can','will','would','should','could','not','no','yes','so']);
  const wordCounts = {};
  messages.forEach(m => {
    const words = (m.raw || '').toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/).filter(w => w.length > 3 && !stopWords.has(w));
    words.forEach(w => { wordCounts[w] = (wordCounts[w] || 0) + 1; });
  });
  const topWords = Object.entries(wordCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);

  return '<div style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:calc(var(--nav-h) + 24px);">' +
    ScreenHeader.render({ title: 'Weekly Chat Summary', subtitle: 'Past 7 days', icon: '📊', back: 'couple-chat' }) +

    // Summary banner
    '<div style="background:linear-gradient(135deg,rgba(196,113,74,.1),rgba(122,101,180,.08));border:1px solid rgba(196,113,74,.15);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;text-align:center;" class="a1">' +
      '<div style="font-family:var(--font-display);font-size:1.6rem;font-weight:300;margin-bottom:4px;">' + stats.totalMessages + ' <span style="font-size:1rem;color:var(--muted);">messages</span></div>' +
      '<div style="font-size:.72rem;color:var(--muted);">' + U.esc(myN) + ' & ' + U.esc(theirN) + ' this week</div>' +
    '</div>' +

    // Stats grid
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;" class="a2">' +
      '<div style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);text-align:center;">' +
        '<div style="font-size:1.1rem;font-weight:700;color:var(--terra);">' + stats.myMessages + '</div>' +
        '<div style="font-size:.65rem;color:var(--muted);">Your messages</div>' +
      '</div>' +
      '<div style="padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);text-align:center;">' +
        '<div style="font-size:1.1rem;font-weight:700;color:var(--sage);">' + stats.theirMessages + '</div>' +
        '<div style="font-size:.65rem;color:var(--muted);">' + U.esc(theirN) + "'s messages</div>" +
      '</div>' +
    '</div>' +

    // Digest items
    '<div class="section-label">Highlights</div>' +
    '<div class="insight-card a3" style="margin-bottom:12px;">' +
      digest.map(line => '<div style="font-size:.78rem;padding:6px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;">' +
        '<span style="font-size:.9rem;">💡</span> ' + line +
      '</div>').join('') +
    '</div>' +

    // Top topics
    (topWords.length > 0 ?
      '<div class="section-label">Most Discussed Topics</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;" class="a4">' +
        topWords.map(([word, count]) =>
          '<div style="padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;font-size:.72rem;">' +
            '<span style="font-weight:600;">' + word + '</span> <span style="color:var(--muted);">(' + count + ')</span>' +
          '</div>'
        ).join('') +
      '</div>'
    : '') +

    // AI analysis
    '<div class="section-label">Communication Quality</div>' +
    '<div class="insight-card a5" style="margin-bottom:12px;">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">' +
        '<span style="font-size:1.3rem;">🤖</span>' +
        '<div style="font-size:.82rem;font-weight:700;">AI Analysis</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
        '<div style="font-size:.75rem;display:flex;align-items:center;gap:6px;">' +
          '<span style="color:var(--sage);">✓</span> ' +
          (stats.myMessages > 0 && stats.theirMessages > 0 ?
            (Math.abs(stats.myMessages - stats.theirMessages) <= stats.totalMessages * 0.2 ?
              'Well-balanced conversation — great two-way communication!' :
              stats.myMessages > stats.theirMessages ?
                'You\'re carrying more of the conversation. Try asking more open-ended questions.' :
                U.esc(theirN) + ' is messaging more. Make sure to respond thoughtfully.') :
            'Keep chatting to build communication patterns!') +
        '</div>' +
        '<div style="font-size:.75rem;display:flex;align-items:center;gap:6px;">' +
          '<span style="color:var(--sage);">✓</span> ' +
          (stats.avgResponseTime > 0 ?
            (stats.avgResponseTime < 10 ? 'Quick response times — you\'re very attentive!' :
             stats.avgResponseTime < 30 ? 'Good response times — keep it up!' :
             'Response times could improve. Try to reply when you see messages.') :

        '<div style="font-size:.75rem;display:flex;align-items:center;gap:6px;">' +
          '<span style="color:var(--sage);">✓</span> ' +
          (stats.daysActive >= 5 ? 'You chatted ' + stats.daysActive + ' out of 7 days — consistent communication!' :

           'Only ' + stats.daysActive + ' days of chatting. Try to touch base daily!') +
        '</div>' +
      '</div>' +
    '</div>' +

    ContextTools.renderToolbar('couple-chat') +
  '</div>';
});

// RELATIONSHIP TIMELINE SCREEN
// ──────────────────────────────────────────────
Router.register('timeline', () => {
  const parlays = Store.parlays();
  const tasks = Store.tasks();
  const appreciations = AppreciationStore.all();
  const conflicts = ConflictTracker.all();
  const myN = Auth.myName();
  const theirN = Auth.theirName();

  // Build timeline events from all sources
  const events = [];

  parlays.forEach(p => {
    const topic = (typeof TOPICS_V2 !== 'undefined' ? TOPICS_V2 : []).find(t => t.id === p.topicId) || { icon: '📅', name: 'Event' };
    events.push({
      date: p.created_at || p.date || new Date().toISOString(),
      type: 'parlay',
      icon: topic.icon,
      title: p.title,
      subtitle: p.status === 'resolved' ? 'Resolved' : p.status,
      color: '#C4714A',
      route: 'parlay-detail',
      id: p.id,
    });
  });

  tasks.filter(t => t.status === 'completed').forEach(t => {
    events.push({
      date: t.completedAt || t.createdAt || new Date().toISOString(),
      type: 'task',
      icon: '✅',
      title: t.title + ' completed',
      subtitle: 'Task done',
      color: '#7A9E8A',
      route: 'task-detail',
      id: t.id,
    });
  });

  appreciations.slice(0, 10).forEach(a => {
    events.push({
      date: a.date,
      type: 'appreciation',
      icon: '💛',
      title: a.text.substring(0, 60) + (a.text.length > 60 ? '...' : ''),
      subtitle: 'Appreciation',
      color: '#E8B88A',
    });
  });

  conflicts.filter(c => c.resolution === 'resolved').forEach(c => {
    events.push({
      date: c.date,
      type: 'conflict',
      icon: '🕊️',
      title: 'Resolved: ' + (c.trigger || 'Disagreement'),
      subtitle: c.whatHelped || 'Conflict resolved',
      color: '#7A6A9B',
    });
  });

  // Sort by date descending
  events.sort((a, b) => new Date(b.date) - new Date(a.date));

  // Group by month
  const groups = {};
  events.forEach(ev => {
    const month = new Date(ev.date).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    if (!groups[month]) groups[month] = [];
    groups[month].push(ev);
  });

  return '<div style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:calc(var(--nav-h) + 24px);">' +
    ScreenHeader.render({ title: 'Our Timeline', subtitle: events.length + ' moments', icon: '📖', back: 'home' }) +

    (events.length > 0 ?
      Object.entries(groups).map(([month, evts]) =>
        '<div class="section-label">' + month + '</div>' +
        '<div style="position:relative;padding-left:20px;border-left:2px solid var(--border);margin-left:8px;margin-bottom:16px;">' +
          evts.map(ev =>
            '<div style="position:relative;margin-bottom:12px;' + (ev.route ? 'cursor:pointer;' : '') + '" ' +
              (ev.route ? 'onclick="Router.go(\'' + ev.route + '\',{id:\'' + ev.id + '\'})"' : '') + '>' +
              // Timeline dot
              '<div style="position:absolute;left:-27px;top:4px;width:14px;height:14px;border-radius:50%;background:' + ev.color + ';border:2px solid var(--cream);"></div>' +
              // Content
              '<div style="padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);">' +
                '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">' +
                  '<span style="font-size:.9rem;">' + ev.icon + '</span>' +
                  '<div style="font-size:.78rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + U.esc(ev.title) + '</div>' +
                '</div>' +
                '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                  '<div style="font-size:.62rem;color:var(--muted);">' + ev.subtitle + '</div>' +
                  '<div style="font-size:.58rem;color:var(--border);">' + U.ago(ev.date) + '</div>' +
                '</div>' +
              '</div>' +
            '</div>'
          ).join('') +
        '</div>'
      ).join('')
    :
      '<div style="text-align:center;padding:40px 20px;">' +
        '<div style="font-size:2rem;margin-bottom:12px;">📖</div>' +
        '<div style="font-size:.88rem;font-weight:600;margin-bottom:4px;">Your timeline is empty</div>' +
        '<div style="font-size:.75rem;color:var(--muted);">Start using Parlay to build your relationship story</div>' +
      '</div>'
    ) +
  '</div>';
});

(async () => {
  Router.initNav();

  // ── Dev toolbar ───────────────────────────────
  if (DEV.enabled) {
    document.body.style.paddingTop = '28px';
    const bar = document.createElement('div');
    bar.id = 'dev-bar';
    bar.innerHTML = `
      <span>🔧 v${VERSION}</span>
      <span class="sep"></span>
      <span id="dev-user">...</span>
      <span class="sep"></span>
      <button onclick="navigator.clipboard?.writeText(Auth.couple()?.invite_code||'none');U.toast('Code copied')">Copy invite</button>
      <button onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">Refresh</button>
      <button onclick="Auth.signOut()">Sign out</button>
      <button onclick="localStorage.clear();sessionStorage.clear();location.reload()" style="color:#f66;">Clear & reload</button>
      <span style="margin-left:auto;">
        <button onclick="location.search='?dev&as=1'">→ P1</button>
        <button onclick="location.search='?dev&as=2'">→ P2</button>
      </span>
    `;
    document.body.prepend(bar);
  }

  function updateDevBar() {
    if (!DEV.enabled) return;
    const el = document.getElementById('dev-user');
    if (el) {
      const m = Auth.me();
      el.textContent = m.name ? `${m.name} (${Auth.amSpouse1() ? 'P1' : 'P2'})` : 'Not signed in';
    }
  }

  // ── Auto-login for dev mode ───────────────────
  if (DEV.autoAs && DEV.accounts[DEV.autoAs]) {
    const acct = DEV.accounts[DEV.autoAs];
    console.log(`[DEV] Auto-login as ${acct.label}...`);

    // Try sign in first (account may already exist)
    let result = await Auth.signIn(acct.email, acct.password);
    if (result.error && result.error.includes('Invalid login')) {
      // Account doesn't exist yet — create it
      console.log('[DEV] Account not found, creating...');
      result = await Auth.signUp(acct.email, acct.password, acct.label.split(' ')[0]);
      if (result.error) {
        console.error('[DEV] Signup failed:', result.error);
        Router.go('auth-entry');
        updateDevBar();
        return;
      }
      if (result.confirmEmail) {
        console.warn('[DEV] Email confirmation required — disable in Supabase Auth settings for dev');
        U.toast('⚠️ Disable email confirmation in Supabase for dev mode');
        Router.go('auth-entry');
        updateDevBar();
        return;
      }
    }

    if (result.error) {
      console.error('[DEV] Login failed:', result.error);
      Router.go('auth-entry');
      updateDevBar();
      return;
    }

    // Bootstrap
    const boot = await Auth.bootstrap();
    console.log('[DEV] Bootstrap:', boot);

    // Auto-create/join couple for dev
    if (!boot.coupled) {
      if (DEV.autoAs === '1') {
        // Partner 1 creates the couple
        const { code } = await Auth.createCouple();
        console.log(`[DEV] Created couple. Invite code: ${code}`);
        await Auth.bootstrap();
        Router.go('home');
      } else {
        // Partner 2 needs to join — find Partner 1's couple
        // Sign in as P1 briefly to get the code, then switch back
        // Actually simpler: just go to the join screen
        Router.go('ob-join');
      }
    } else {
      Router.go('home');
    }
    updateDevBar();
    return;
  }

  // ── Demo mode via URL (?demo or ?demo=B) ──────
  if (_devParams.has('demo')) {
    DEMO.activate(_devParams.get('demo') === 'B' ? 'B' : 'A');
    return;
  }

  // ── Handle invite link (?invite=CODE) ────────
  const _inviteCode = _devParams.get('invite');
  if (_inviteCode) {
    // Store invite code for use after auth
    sessionStorage.setItem('parlay_pending_invite', (_inviteCode || '').toUpperCase().replace(/[^A-Z0-9]/g, ''));
  }

  // ── Normal flow ───────────────────────────────
  let boot = await Auth.bootstrap();
  if (boot.mode === 'pending') {
    await new Promise(r => setTimeout(r, 600));
    boot = await Auth.bootstrap();
  }

  if (boot.mode === 'unauthenticated') {
    if (_inviteCode) {
      // User clicked invite link but isn't signed in — show signup with context
      U.toast('Create an account to connect with your partner');
    }
    Router.go('auth-entry');
  } else {
    // Authenticated — check for pending invite code.
    // Auto-join even if user already has a solo couple (joinCouple handles orphan cleanup).
    const pendingInvite = sessionStorage.getItem('parlay_pending_invite');
    if (pendingInvite && !boot.hasPartner) {
      sessionStorage.removeItem('parlay_pending_invite');
      const joinResult = await Auth.joinCouple(pendingInvite);
      if (joinResult.error) {
        U.toast('Invite code error: ' + joinResult.error);
        Router.go(boot.coupled ? 'partner-hub' : 'ob-couple');
      } else {
        await Auth.bootstrap();
        U.toast('Connected with your partner! 🎉');
        Router.go('home');
      }
    } else if (!boot.coupled) {
      // Not coupled yet, not from an invite — go to couple creation
      Router.go('ob-couple');
    } else {
      Router.go('home');
    }
  }
  updateDevBar();

  // Auth state change listener (handles page reload, OAuth redirect, Google SSO)
  Auth.sb().auth.onAuthStateChange(async (event, session) => {
    if (event === 'INITIAL_SESSION') return;
    if (event === 'SIGNED_IN' && session) {
      // For Google OAuth users, ensure a profile name exists (they skip the signup form)
      const googleName = session.user.user_metadata?.full_name?.split(' ')[0] || session.user.user_metadata?.name?.split(' ')[0] || '';
      if (googleName) {
        const { data: existing } = await Auth.sb().from('profiles').select('name').eq('id', session.user.id).maybeSingle();
        if (!existing?.name) {
          await Auth.sb().from('profiles').upsert({ id: session.user.id, name: googleName, email: session.user.email });
        }
      }

      const b = await Auth.bootstrap();
      // Skip routing if bootstrap was already in progress (sign-in form handles it)
      if (b.mode === 'pending') return;

      // Check for pending invite code (from invite link).
      // Auto-join even if user already has a solo couple (joinCouple handles orphan cleanup).
      const pendingInvite = sessionStorage.getItem('parlay_pending_invite');
      if (pendingInvite && !b.hasPartner) {
        sessionStorage.removeItem('parlay_pending_invite');
        const joinResult = await Auth.joinCouple(pendingInvite);
        if (joinResult.error) {
          U.toast('Invite code error: ' + joinResult.error);
          Router.go(b.coupled ? 'partner-hub' : 'ob-couple');
        } else {
          await Auth.bootstrap();
          U.toast('Connected with your partner! 🎉');
          Router.go('home');
        }
      } else if (!b.coupled) {
        Router.go('ob-couple');
      } else {
        Router.go('home');
      }
      updateDevBar();
    }
    if (event === 'SIGNED_OUT') {
      Router.go('auth-entry');
      updateDevBar();
    }
  });
})();

</script>
</body>
</html>
