<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1208">
<title>Parlay — for couples who talk it through</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ═══════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════ */
:root {
  --font-display: 'DM Serif Display', serif;
  --font-body: 'DM Sans', system-ui, sans-serif;

  --espresso: #1a1208;
  --cream: #FAF6F1;
  --terra: #C4714A;
  --sage: #7A9E8A;
  --amber: #E8B88A;
  --muted: #9B8880;
  --parchment: #F5F0EA;
  --surface: #FEFCFA;
  --border: #E8E2DA;
  --purple: #7A6A9B;
  --blush: #9B6B8A;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-pill: 100px;
  --nav-h: 72px;
}

/* ═══════════════════════════════════════════════
   RESET + BASE
   ═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--cream);
  color: var(--espresso);
  min-height: 100dvh;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
input, textarea, select, button { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ═══════════════════════════════════════════════
   SCROLLBAR
   ═══════════════════════════════════════════════ */
::-webkit-scrollbar { width: 0; height: 0; }

/* ═══════════════════════════════════════════════
   ANIMATIONS
   ═══════════════════════════════════════════════ */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.a1 { animation: fadeIn .5s ease both; }
.a2 { animation: fadeIn .5s ease both; animation-delay: .1s; }
.a3 { animation: fadeIn .5s ease both; animation-delay: .2s; }
.a4 { animation: fadeIn .5s ease both; animation-delay: .3s; }
.a5 { animation: fadeIn .5s ease both; animation-delay: .4s; }

/* ═══════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════ */
#app { min-height: 100dvh; }
.screen { display: none; }
.screen.active { display: block; }

/* ═══════════════════════════════════════════════
   NAV
   ═══════════════════════════════════════════════ */
#nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-h);
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  background: var(--cream);
  border-top: 1px solid var(--border);
  display: none;
  justify-content: space-around;
  align-items: center;
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: none; cursor: pointer; padding: 6px 12px;
  position: relative;
}
.nav-btn .icon { font-size: 1.3rem; }
.nav-btn .label { font-size: .62rem; font-weight: 600; color: var(--muted); }
.nav-btn.active .label { color: var(--terra); }
.nav-badge {
  position: absolute; top: 2px; right: 4px;
  min-width: 16px; height: 16px; border-radius: 8px;
  background: var(--terra); color: #fff;
  font-size: .58rem; font-weight: 700;
  display: none; align-items: center; justify-content: center;
  padding: 0 4px;
}

/* ═══════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════ */
#toast {
  position: fixed; bottom: calc(var(--nav-h) + 16px); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--espresso); color: var(--cream);
  padding: 10px 20px; border-radius: var(--r-pill);
  font-size: .82rem; font-weight: 500;
  opacity: 0; pointer-events: none;
  transition: all .3s ease; z-index: 9999;
  white-space: nowrap; max-width: calc(100vw - 40px);
  text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ═══════════════════════════════════════════════
   FORM ELEMENTS
   ═══════════════════════════════════════════════ */
.input {
  width: 100%; padding: 14px 16px;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-md); font-size: .88rem;
  color: var(--espresso); outline: none;
  transition: border-color .2s;
}
.input:focus { border-color: var(--terra); }
.input-label {
  display: block; font-size: .62rem; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.btn {
  display: flex; align-items: center; justify-content: center;
  padding: 15px 20px; border: none; border-radius: var(--r-md);
  font-family: var(--font-body); font-size: .9rem; font-weight: 600;
  cursor: pointer; transition: opacity .15s; width: 100%;
}
.btn:active { opacity: .85; }
.btn-primary { background: var(--espresso); color: var(--cream); }
.btn-accent { background: var(--terra); color: #fff; }
.btn-outline { background: none; color: var(--muted); border: 1.5px solid var(--border); }
.btn-sm { padding: 8px 14px; font-size: .82rem; width: auto; }
.btn-ghost { background: none; border: none; color: var(--muted); font-size: .82rem; cursor: pointer; padding: 8px; }

/* ═══════════════════════════════════════════════
   CARDS
   ═══════════════════════════════════════════════ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 16px; cursor: pointer;
  transition: border-color .15s;
}
.card:active { border-color: var(--terra); }

/* ═══════════════════════════════════════════════
   HOME HEADER
   ═══════════════════════════════════════════════ */
.home-header {
  background: var(--espresso); color: var(--cream);
  padding: 0 24px 24px;
  padding-top: max(52px, env(safe-area-inset-top));
  border-radius: 0 0 28px 28px;
  margin-bottom: 16px;
}
.home-greeting {
  font-family: var(--font-display); font-size: 2.4rem;
  font-weight: 400; line-height: 1.15; margin-bottom: 4px;
}
.home-greeting em { font-style: italic; color: var(--amber); }
.home-date { font-size: .72rem; color: rgba(250,246,241,.45); margin-bottom: 20px; }

/* Partner bar */
.partner-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--r-md);
}
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; font-weight: 700;
}
.partner-avatars { display: flex; gap: -6px; }
.partner-avatars .avatar:last-child { margin-left: -8px; }

/* ═══════════════════════════════════════════════
   SECTION LABELS
   ═══════════════════════════════════════════════ */
.section-label {
  font-size: .62rem; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--muted);
  padding: 0 20px; margin-bottom: 10px;
}

/* ═══════════════════════════════════════════════
   INBOX BANNER
   ═══════════════════════════════════════════════ */
.inbox-banner {
  margin: 0 20px 12px;
  background: linear-gradient(135deg, #3d1f0a, #2C1A0E);
  border: 1.5px solid rgba(196,113,74,.4);
  border-radius: var(--r-lg); padding: 16px 18px;
}

/* ═══════════════════════════════════════════════
   QUICK ACTIONS
   ═══════════════════════════════════════════════ */
.quick-strip {
  display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.quick-strip::-webkit-scrollbar { display: none; }
.quick-action {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  min-width: 68px; cursor: pointer;
}
.qa-bubble {
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; transition: all .15s;
}
.quick-action:active .qa-bubble { border-color: var(--terra); background: #FDF5F0; }
.qa-label { font-size: .65rem; font-weight: 600; color: var(--muted); }

/* ═══════════════════════════════════════════════
   MODULE CARDS
   ═══════════════════════════════════════════════ */
.mod-card {
  margin: 0 20px 8px; padding: 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); cursor: pointer;
  display: flex; align-items: center; gap: 14px;
  transition: border-color .15s;
}
.mod-card:active { border-color: var(--terra); }
.mod-icon {
  width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; flex-shrink: 0;
}

/* ═══════════════════════════════════════════════
   PARLAY CARD (in plan list)
   ═══════════════════════════════════════════════ */
.parlay-card {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); cursor: pointer;
  transition: border-color .15s;
}
.parlay-card:active { border-color: var(--terra); }
.status-chip {
  font-size: .62rem; font-weight: 700;
  padding: 3px 10px; border-radius: var(--r-pill);
  white-space: nowrap;
}

/* ═══════════════════════════════════════════════
   TOPIC GRID
   ═══════════════════════════════════════════════ */
.topic-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; padding: 0 20px;
}
.topic-card {
  padding: 16px; border-radius: var(--r-md);
  background: var(--surface); border: 1.5px solid var(--border);
  cursor: pointer; text-align: center; transition: all .15s;
}
.topic-card:active { border-color: var(--terra); background: #FDF5F0; }
.topic-icon { font-size: 1.6rem; margin-bottom: 6px; }
.topic-label { font-size: .78rem; font-weight: 600; color: var(--espresso); }

/* ═══════════════════════════════════════════════
   TASK CARD
   ═══════════════════════════════════════════════ */
.task-card {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); cursor: pointer;
}

/* ═══════════════════════════════════════════════
   RADIO OPTIONS
   ═══════════════════════════════════════════════ */
.radio-group { display: flex; flex-direction: column; gap: 8px; }
.radio-opt {
  padding: 14px 16px; border: 1.5px solid var(--border);
  border-radius: var(--r-md); cursor: pointer; transition: all .15s;
  display: flex; align-items: center; gap: 12px;
}
.radio-opt.selected { border-color: var(--terra); background: #FDF5F0; }
.radio-opt .dot {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.radio-opt.selected .dot { border-color: var(--terra); background: var(--terra); }
.radio-opt.selected .dot::after {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff;
}
</style>

const Store = (() => {
  let _parlays = [];
  let _tasks   = [];
  let _commPrefs = { me: null, them: null };
  let _kv = {};  // simple key-value for settings (mediatorTone, equity, etc.)

  // ── Parlay helpers ────────────────────────────
  function _rowToParlay(row) {
    return {
      id: row.id,
      topicId: row.topic_id,
      title: row.title,
      date: U.shortDate(row.created_at),
      rawInput: row.raw_input,
      filteredInput: row.filtered_input,
      intentContext: row.intent_context,
      dateOptions: typeof row.date_options === 'string'
        ? (() => { try { return JSON.parse(row.date_options); } catch { return []; } })()
        : (row.date_options || []),
      status: row.status,
      createdByUid: row.created_by,  // RAW UUID — the only authority
      isMine: row.created_by === Auth.myUid(),
      partnerRawReply: row.partner_raw_reply,
      partnerFilteredReply: row.partner_filtered_reply,
      partnerDateResponse: row.partner_date_response,
      proposal: row.proposal,
      resolution: row.resolution,
      archived: row.archived || false,
    };
  }

  function _parlayToRow(p) {
    return {
      id: p.id,
      couple_id: Auth.couple()?.id,
      topic_id: p.topicId,
      title: p.title,
      raw_input: p.rawInput,
      filtered_input: p.filteredInput,
      intent_context: p.intentContext,
      date_options: p.dateOptions,
      status: p.status,
      created_by: p.createdByUid || Auth.myUid(),
      partner_raw_reply: p.partnerRawReply,
      partner_filtered_reply: p.partnerFilteredReply,
      partner_date_response: p.partnerDateResponse,
      proposal: p.proposal,
      resolution: p.resolution,
      archived: p.archived || false,
    };
  }

  function _patchToRow(patch) {
    const map = {
      topicId:'topic_id', title:'title', rawInput:'raw_input',
      filteredInput:'filtered_input', intentContext:'intent_context',
      dateOptions:'date_options', status:'status',
      partnerRawReply:'partner_raw_reply', partnerFilteredReply:'partner_filtered_reply',
      partnerDateResponse:'partner_date_response',
      proposal:'proposal', resolution:'resolution', archived:'archived',
    };
    const row = {};
    for (const [k,v] of Object.entries(patch)) { if (map[k]) row[map[k]] = v; }
    return row;
  }

  // ── Task helpers ──────────────────────────────
  function _roleToUid(role) {
    // In parlay-v2 we store UIDs directly, but tasks use a simple role pattern
    if (role === Auth.myUid()) return role; // already a UID
    return role === 'me' ? Auth.myUid() : Auth.theirUid();
  }

  function _uidToRole(uid) {
    return uid === Auth.myUid() ? 'me' : 'them';
  }

  function _rowToTask(row) {
    return {
      id: row.id,
      title: row.title,
      context: row.context,
      rawContext: row.raw_context,
      filteredContext: row.filtered_context,
      categoryId: row.category_id || 'other',
      priority: row.priority || 'normal',
      dueDate: row.due_date,
      assignedTo: _uidToRole(row.assigned_to),
      createdBy: _uidToRole(row.created_by),
      status: row.status || 'pending_response',
      pendingResponseFrom: row.pending_response_from ? _uidToRole(row.pending_response_from) : null,
      counterCount: row.counter_count || 0,
      counterMessage: row.counter_message,
      filteredCounter: row.filtered_counter,
      declineReason: row.decline_reason,
      filteredDecline: row.filtered_decline,
    };
  }

  function _taskToRow(t) {
    return {
      id: t.id,
      couple_id: Auth.couple()?.id,
      title: t.title,
      context: t.context,
      raw_context: t.rawContext,
      filtered_context: t.filteredContext,
      category_id: t.categoryId,
      priority: t.priority,
      due_date: t.dueDate || null,
      assigned_to: t.assignedTo === 'me' ? Auth.myUid() : Auth.theirUid(),
      created_by: t.createdBy === 'me' ? Auth.myUid() : Auth.theirUid(),
      status: t.status,
      pending_response_from: t.pendingResponseFrom === 'me' ? Auth.myUid()

      counter_count: t.counterCount,
      counter_message: t.counterMessage,
      filtered_counter: t.filteredCounter,
      decline_reason: t.declineReason,
      filtered_decline: t.filteredDecline,

// ROUTER — Hash-based SPA
// ──────────────────────────────────────────────
const Router = (() => {
  const _routes = {};
  let _current = null;
  const NAV_SCREENS = ['home','plan','tasks','setup'];

  function register(name, renderFn, initFn) {
    _routes[name] = { render: renderFn, init: initFn };
  }

  function go(name, params = {}) {
    const route = _routes[name];
    if (!route) { console.error('[Router] Unknown route:', name); return; }

    _current = name;
    const app = document.getElementById('app');

    // Render
    const html = route.render(params);
    let el = document.getElementById('screen-' + name);
    if (!el) {
      el = document.createElement('div');
      el.id = 'screen-' + name;
      el.className = 'screen';
      app.appendChild(el);
    }
    el.innerHTML = html;

    // Hide all, show this
    app.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    el.classList.add('active');

    // Scroll to top
    window.scrollTo(0, 0);

    // Nav visibility + active state
    const nav = document.getElementById('nav');
    if (nav) {
      nav.style.display = NAV_SCREENS.includes(name) ? 'flex' : 'none';
      nav.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.screen === name);
      });
    }

    // Update badges on every main nav
    if (NAV_SCREENS.includes(name)) { try { Badges.update(); } catch(e) {} }

    // Init
    if (route.init) {
      try { route.init(el, params); } catch(e) { console.error('[Router] init error on', name, e); }
    }
  }

  function current() { return _current; }

  function initNav() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => go(btn.dataset.screen));
    });
  }

  return { register, go, current, initNav };
})();

const AI = (() => {
  async function call(systemPrompt, userMessage) {
    const token = Auth.getToken();
    const headers = {
      'Content-Type': 'application/json',
      'apikey': CONFIG.SUPABASE_KEY,
      'Authorization': `Bearer ${token || CONFIG.SUPABASE_KEY}`,
    };
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), CONFIG.AI_TIMEOUT);

    try {
      const res = await fetch(CONFIG.EDGE_URL, {
        method: 'POST',
        headers,
        body: JSON.stringify({ systemPrompt, userMessage }),
        signal: controller.signal,
      });
      clearTimeout(timeout);

      if (!res.ok) {
        const body = await res.text().catch(() => '');
        throw new Error(`AI error ${res.status}: ${body.slice(0,150)}`);
      }

      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch { return raw.trim(); }
      return data.content?.[0]?.text || data.text || data.result || data.message || '';
    } catch(e) {
      clearTimeout(timeout);
      throw e;
    }
  }

  return { call };
})();

      <div style="font-size:.82rem;color:var(--muted);line-height:1.6;">

          ? 'First clarify the basics — then tell Parlay exactly what you want.'
          : `Say exactly what you want. Don't filter yourself — Parlay does that before ${U.esc(theirN)} sees it.`}
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;" class="a3">

      <div id="intent-section">${needsIntent ? renderIntentQuestions(topicId) : ''}</div>

      <!-- Tone warning -->
      <div id="tone-warn" style="display:none;padding:12px 14px;background:#FFF5E0;border:1px solid #E8B88A;border-radius:var(--r-md);font-size:.78rem;color:#8A6A2A;line-height:1.5;">
        <div style="font-weight:700;margin-bottom:3px;" id="warn-head">⚡ Parlay detected some heat</div>
        <div id="warn-body">That's okay — Parlay will cool it down before sending.</div>
      </div>

      <div>
        <div class="input-label">What do you want or need? <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">speak freely</span></div>
        <textarea id="compose-text" class="input" rows="5" placeholder="e.g. I want to take a solo trip to visit my college friends March 20-23. I'll need you to handle the kids." style="resize:none;line-height:1.6;"></textarea>
      </div>

      <!-- Date options -->
      <div>
        <div class="input-label">Date options (optional)</div>
        <div style="display:flex;flex-direction:column;gap:8px;" id="date-slots">
          <div style="display:flex;gap:8px;">
            <input type="date" class="input" style="flex:2;" data-slot="1" data-type="date">
            <input type="text" class="input" style="flex:1;" placeholder="Time" data-slot="1" data-type="time">
          </div>
          <div style="display:flex;gap:8px;">
            <input type="date" class="input" style="flex:2;" data-slot="2" data-type="date">

}, (el, { topicId } = {}) => {
  const textarea = el.querySelector('#compose-text');
  const warn = el.querySelector('#tone-warn');
  let _submitting = false;

  // Wire up intent question radio selectors
  el.querySelectorAll('.radio-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      const group = opt.closest('.radio-group');
      group.querySelectorAll('.radio-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    });
  });

  // Tension detection (debounced, versioned)
  let _toneTimer, _tensionV = 0;
  textarea?.addEventListener('input', () => {
    clearTimeout(_toneTimer);
    if (textarea.value.length > 40) {
      _toneTimer = setTimeout(async () => {
        const v = ++_tensionV;
        try {
          const t = await AI.call(
            `Analyze for Gottman Four Horsemen. Return ONLY JSON: {"flag":true/false,"horseman":"criticism|contempt|defensiveness|stonewalling|none","note":"one sentence"}`,
            textarea.value
          );
          if (v !== _tensionV) return;
          const parsed = typeof t === 'string' ? JSON.parse(t) : t;
          if (parsed.flag && warn) {
            const h = el.querySelector('#warn-head');
            const b = el.querySelector('#warn-body');
            const headlines = { criticism:'⚡ Character attack detected', contempt:'🚨 Contempt detected', defensiveness:'⚡ Defensiveness detected', stonewalling:'⚡ Shutdown detected' };
            if (h) h.textContent = headlines[parsed.horseman] || '⚡ Some heat detected';
            if (b) b.textContent = parsed.note || "That's okay — Parlay will cool it down.";
            warn.style.display = 'block';
            if (parsed.horseman === 'contempt') { warn.style.background = '#FFF0F0'; warn.style.borderColor = '#E8A0A0'; warn.style.color = '#8A2A2A'; }
            else { warn.style.background = '#FFF5E0'; warn.style.borderColor = '#E8B88A'; warn.style.color = '#8A6A2A'; }
          } else if (warn) { warn.style.display = 'none'; }
        } catch(e) { /* best-effort */ }
      }, 800);
    } else if (warn) { warn.style.display = 'none'; }
  });

  // Submit
  el.querySelector('#compose-submit')?.addEventListener('click', async () => {
    if (_submitting) return;
    const raw = textarea?.value.trim();
    if (!raw) { U.toast('Tell Parlay what you need first'); return; }
    _submitting = true;

    const btn = el.querySelector('#compose-submit');
    const btnText = el.querySelector('#compose-btn-text');
    btn.disabled = true;
    btnText.textContent = 'Filtering your message…';

    // ── Gather intent context from structured questions ────
    let intentContext = '';
    const whoVal = el.querySelector('#iq-who .radio-opt.selected')?.dataset.val;
    const roleVal = el.querySelector('#iq-role .radio-opt.selected')?.dataset.val;

    if (whoVal) {
      const whoLabels = {
        'just-me': 'Just the user going alone — spouse stays home',
        'me-and-kids': 'User going with kids, spouse NOT coming',
        'whole-family': 'Whole family going together',
        'just-us': 'Just the two partners — no kids',
        'double': 'Double date with friends',
        'family-outing': 'Family outing (kids included)',
        'my-family': "User's family",
        'their-family': "Partner's family",
        'both': 'Both families',
        'they-visit-us': 'They come to us',
        'we-visit-them': 'We go to them',
        'meet-somewhere': 'Meet somewhere neutral',
        'dinner': 'Dinner party', 'drinks': 'Drinks & appetizers',
        'bbq': 'BBQ / backyard', 'game': 'Game night',
      };
      intentContext += `WHO/WHAT: ${whoLabels[whoVal] || whoVal}\n`;
    }
    if (roleVal) {
      const roleLabels = {
        'not-involved': 'Spouse not part of this — they stay home',
        'aware': 'Spouse just needs to approve the timing',
        'covering-kids': 'Spouse covers the kids',
        'share-prep': 'Share cooking & prep equally',
        'i-handle': 'User handles it, just needs the OK',
        'plan-together': 'Plan it together',
      };
      intentContext += `PARTNER ROLE: ${roleLabels[roleVal] || roleVal}\n`;
    }

    // Gather date options
    const dateOptions = [];
    for (let n = 1; n <= 2; n++) {
      const d = el.querySelector(`input[data-slot="${n}"][data-type="date"]`)?.value;
      const t = el.querySelector(`input[data-slot="${n}"][data-type="time"]`)?.value || '';
      if (d) dateOptions.push({ id: 'opt_' + n, date: d, timeLabel: t || 'Any time' });
    }
    if (dateOptions.length) {
      intentContext += `DATE OPTIONS: ${dateOptions.map(o => o.date + (o.timeLabel ? ' ' + o.timeLabel : '')).join('; ')}\n`;
    }

    // ── AI tone filter (best-effort) ────
    let filtered = raw;
    let aiWorked = false;
    try {
      filtered = await runToneFilter(raw, intentContext);
      aiWorked = true;
    } catch(e) {
      console.error('[compose] AI filter failed:', e);
      filtered = raw;
    }

    // Save
    const id = 'neg_' + Date.now();
    const topic = TOPICS.find(t => t.id === topicId) || TOPICS[7];
    await Store.addParlay({
      id, topicId,
      title: topic.label,
      date: U.shortDate(new Date()),
      rawInput: raw,
      filteredInput: filtered,
      intentContext,
      dateOptions,
      status: 'pending_partner',
      createdByUid: Auth.myUid(),
      isMine: true,
      partnerRawReply: null, partnerFilteredReply: null,
      partnerDateResponse: null, proposal: null, resolution: null,
      archived: false,
    });

    Router.go('parlay-sent', { id, aiWorked });
  });
});

      <div style="font-size:2.8rem;margin-bottom:16px;">📋</div>
      <div style="font-family:var(--font-display);font-size:1.3rem;margin-bottom:8px;">No tasks yet</div>
      <div style="font-size:.82rem;color:var(--muted);max-width:240px;margin:0 auto;">Assign tasks with context, not conflict.</div>
    </div>` : ''}
  </div>`;
}, () => { Badges.update(); });

// NEW TASK
// ──────────────────────────────────────────────
Router.register('task-new', () => `
  <div style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('tasks')">‹ Back</button>
      <span style="font-family:var(--font-display);font-size:1.1rem;">New Task</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;" class="a2">
      <div>
        <div class="input-label">Task title</div>
        <input id="tn-title" class="input" placeholder="e.g. Pick up groceries">
      </div>
      <div>
        <div class="input-label">Assign to</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" data-assign="them" id="tn-them" style="flex:1;">${Auth.theirName()}</button>
          <button class="btn btn-outline" data-assign="me" id="tn-me" style="flex:1;">Myself</button>
        </div>
      </div>
      <div>
        <div class="input-label">Context (optional)</div>
        <textarea id="tn-context" class="input" rows="3" placeholder="Why, when, any details" style="resize:none;"></textarea>
      </div>
      <button class="btn btn-primary" id="tn-submit">Assign Task</button>
    </div>
  </div>
`, (el) => {
  let _assignTo = 'them';
  const themBtn = el.querySelector('#tn-them');
  const meBtn = el.querySelector('#tn-me');

  const updateBtns = () => {
    themBtn.style.background = _assignTo === 'them' ? 'var(--terra)' : '';
    themBtn.style.color = _assignTo === 'them' ? '#fff' : '';
    themBtn.style.borderColor = _assignTo === 'them' ? 'var(--terra)' : '';
    meBtn.style.background = _assignTo === 'me' ? 'var(--terra)' : '';
    meBtn.style.color = _assignTo === 'me' ? '#fff' : '';
    meBtn.style.borderColor = _assignTo === 'me' ? 'var(--terra)' : '';
  };
  updateBtns();

  themBtn.addEventListener('click', () => { _assignTo = 'them'; updateBtns(); });
  meBtn.addEventListener('click', () => { _assignTo = 'me'; updateBtns(); });

  let _taskSubmitting = false;
  el.querySelector('#tn-submit').addEventListener('click', async () => {
    if (_taskSubmitting) return;
    const title = el.querySelector('#tn-title').value.trim();
    if (!title) { U.toast('Add a title'); return; }
    _taskSubmitting = true;
    const btn = el.querySelector('#tn-submit');
    btn.disabled = true; btn.textContent = 'Assigning…';

    const rawContext = el.querySelector('#tn-context').value.trim();
    const filteredContext = await filterTaskContext(rawContext);

    await Store.addTask({
      id: 'task_' + Date.now(),
      title,
      context: rawContext,
      rawContext,
      filteredContext,
      categoryId: 'other',
      priority: 'normal',
      dueDate: null,
      assignedTo: _assignTo,
      createdBy: 'me',
      status: 'pending_response',
      pendingResponseFrom: _assignTo,
      counterCount: 0,
    });

    Badges.update();
    U.toast('Task assigned ✓');
    Router.go('tasks');
  });
});


// ──────────────────────────────────────────────
// TASK DETAIL
// ──────────────────────────────────────────────
Router.register('task-detail', ({ id } = {}) => {
  const t = Store.findTask(id);
  if (!t) return `<div style="padding:60px 24px;text-align:center;">Task not found.<br><button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="Router.go('tasks')">‹ Back</button></div>`;

  const cat = TASK_CATEGORIES.find(c => c.id === t.categoryId) || TASK_CATEGORIES[6];
  const from = t.createdBy === 'me' ? Auth.myName() : Auth.theirName();
  const to = t.assignedTo === 'me' ? Auth.myName() : Auth.theirName();
  const needsMe = t.pendingResponseFrom === 'me';
  const iAmAssignee = t.assignedTo === 'me';

  // Status label
  const statusLabel = {
    pending_response: needsMe ? '⚡ Your turn' : 'Awaiting response',
    accepted: '✓ Accepted',
    declined: '❌ Declined',
    countered: '↩ Changes suggested',
    done: '✓ Done',
  }[t.status] || t.status;

  // Action area — every combo covered
  let actionHtml = '';
  if (t.status === 'pending_response' && needsMe) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="td-accept">✓ Accept</button>
      <button class="btn btn-outline" id="td-counter">↩ Suggest Changes</button>
      <button class="btn btn-outline" id="td-decline" style="color:#EF4444;border-color:#EF4444;">Decline</button>
    </div>
    <!-- Counter form (hidden until Suggest Changes clicked) -->
    <div id="td-counter-form" style="display:none;margin-top:12px;">
      <div class="input-label">What would work better?</div>
      <textarea id="td-counter-msg" class="input" rows="3" placeholder="e.g. I can do this Thursday instead" style="resize:none;margin-bottom:12px;"></textarea>
      <button class="btn btn-accent" id="td-counter-submit">Send suggestion →</button>
    </div>`;
  } else if (t.status === 'accepted' && iAmAssignee) {
    actionHtml = `<div style="margin-top:20px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="td-done">✓ Mark Done</button>
    </div>`;
  } else if (t.status === 'accepted' && !iAmAssignee) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);margin-top:20px;font-size:.85rem;color:var(--muted);">✓ Accepted — waiting for ${U.esc(to)} to complete</div>`;
  } else if (t.status === 'countered') {
    actionHtml = `<div style="margin-top:16px;">
      ${t.counterMessage ? `<div style="padding:14px 16px;background:var(--surface);border:1px solid rgba(122,106,155,.25);border-radius:var(--r-md);margin-bottom:12px;">
        <div class="input-label" style="color:var(--purple);">↩ Suggested change</div>
        <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredCounter || t.counterMessage)}</div>
      </div>` : ''}
      ${!iAmAssignee ? `<div style="display:flex;gap:8px;">
        <button class="btn" style="background:var(--sage);color:#fff;flex:1;" id="td-accept">✓ Accept change</button>
        <button class="btn btn-outline" style="flex:1;" id="td-decline">Decline</button>
      </div>` : `<div style="text-align:center;padding:12px;font-size:.85rem;color:var(--muted);">Waiting for ${U.esc(from)} to respond</div>`}
    </div>`;
  } else if (t.status === 'declined') {
    actionHtml = `<div style="margin-top:16px;">
      ${t.declineReason ? `<div style="padding:14px 16px;background:#FFF5F5;border:1px solid rgba(239,68,68,.2);border-radius:var(--r-md);margin-bottom:12px;">
        <div class="input-label" style="color:#EF4444;">Decline reason</div>
        <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredDecline || t.declineReason)}</div>
      </div>` : ''}
      <div style="text-align:center;padding:12px;font-size:.85rem;color:var(--muted);">This task was declined.</div>
    </div>`;
  } else if (t.status === 'done') {
    actionHtml = `<div style="text-align:center;padding:16px;color:var(--sage);font-weight:600;">✓ Completed</div>`;
  } else if (t.status === 'pending_response' && !needsMe) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);margin-top:20px;font-size:.85rem;color:var(--muted);">⏳ Waiting for ${U.esc(to)} to respond</div>`;
  }

  return `
  <div data-task-id="${t.id}" style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('tasks')">‹ Tasks</button>
      <button class="btn-ghost" onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">↻</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;" class="a2">
      <div style="width:48px;height:48px;border-radius:14px;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-size:1.4rem;">${cat.icon}</div>
      <div>
        <div style="font-family:var(--font-display);font-size:1.3rem;">${U.esc(t.title)}</div>
        <div style="font-size:.72rem;color:var(--muted);">From ${U.esc(from)} → ${U.esc(to)}</div>
      </div>
    </div>
    <div style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:var(--parchment);border-radius:var(--r-pill);margin-bottom:16px;font-size:.72rem;font-weight:600;color:var(--muted);">${statusLabel}</div>
    ${t.filteredContext || t.context ? `
    <div style="padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:16px;" class="a3">
      <div class="input-label">Context</div>
      <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredContext || t.context)}</div>
    </div>` : ''}
    ${actionHtml}
    <div style="text-align:center;margin-top:20px;">
      <button class="btn-ghost" id="td-delete">Delete task</button>
    </div>
  </div>`;
}, (el, { id } = {}) => {
  const t = Store.findTask(id);
  if (!t) return;

  el.querySelector('#td-accept')?.addEventListener('click', async () => {
    await Store.updateTask(t.id, { status: 'accepted', pendingResponseFrom: null });
    Badges.update(); U.toast('Task accepted ✓');
    Router.go('tasks');
  });

  el.querySelector('#td-done')?.addEventListener('click', async () => {
    await Store.updateTask(t.id, { status: 'done', pendingResponseFrom: null });
    Badges.update(); U.toast('Task done ✓');
    Router.go('tasks');
  });

  // Suggest changes — show form, then submit
  el.querySelector('#td-counter')?.addEventListener('click', () => {
    const form = el.querySelector('#td-counter-form');
    if (form) form.style.display = 'block';
    el.querySelector('#td-counter').style.display = 'none';
  });

  el.querySelector('#td-counter-submit')?.addEventListener('click', async () => {
    const msg = el.querySelector('#td-counter-msg')?.value.trim();
    if (!msg) { U.toast('Say what would work better'); return; }

    const btn = el.querySelector('#td-counter-submit');
    btn.disabled = true; btn.textContent = 'Sending…';

    // AI filter the counter message (best-effort)
    let filtered = msg;
    try {
      filtered = await AI.call(
        'You are Parlay\'s Communication Translator. Rewrite this task counter-proposal to be constructive. 1-2 sentences. First person. ONLY the rewrite.',
        `${Auth.myName()} wrote: "${msg}"\nRewrite:`
      );
    } catch(e) { filtered = msg; }

    await Store.updateTask(t.id, {
      status: 'countered',
      counterMessage: msg,
      filteredCounter: filtered,
      counterCount: (t.counterCount || 0) + 1,
      pendingResponseFrom: t.createdBy === 'me' ? 'me' : 'them',
    });
    Badges.update();
    U.toast('Suggestion sent ✓');
    Router.go('tasks');
  });

  el.querySelector('#td-decline')?.addEventListener('click', async () => {
    const reason = prompt('Optional: why are you declining?') || '';
    let filtered = reason;
    if (reason) {
      try {
        filtered = await AI.call(
          'Rewrite this task decline reason to be respectful. 1 sentence. First person. ONLY the rewrite.',
          `${Auth.myName()} wrote: "${reason}"\nRewrite:`
        );
      } catch(e) { filtered = reason; }
    }
    await Store.updateTask(t.id, {
      status: 'declined',
      declineReason: reason,
      filteredDecline: filtered,
      pendingResponseFrom: null,
    });
    Badges.update(); U.toast('Task declined');
    Router.go('tasks');
  });

  el.querySelector('#td-delete')?.addEventListener('click', async () => {
    if (confirm('Delete this task?')) {
      await Store.deleteTask(t.id);
      Badges.update(); U.toast('Task deleted');
      Router.go('tasks');
    }
  });
});

Router.register('setup-tone', () => {
  const current = Store.get('mediatorTone') || 'neutral';
  return `
  <div style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('setup')">‹ Setup</button>
    </div>
    <div style="font-family:var(--font-display);font-size:1.9rem;font-weight:300;margin-bottom:6px;" class="a1">Mediator <em style="color:var(--terra)">Tone</em></div>
    <div style="font-size:.78rem;color:var(--muted);line-height:1.65;margin-bottom:28px;" class="a2">How Parlay frames all communication.</div>
    <div class="radio-group" id="tone-opts" class="a3">
      ${Object.entries(TONES).map(([id, t]) => `
        <div class="radio-opt${id === current ? ' selected' : ''}" data-id="${id}">
          <div class="dot"></div>
          <div>
            <div style="font-size:1rem;font-weight:700;">${t.icon} ${t.label}</div>
            <div style="font-size:.78rem;color:var(--muted);margin-top:2px;">${t.desc}</div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}, (el) => {
  el.querySelectorAll('.radio-opt').forEach(opt => {
    opt.addEventListener('click', async () => {
      el.querySelectorAll('.radio-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      const tone = opt.dataset.id;
      Store.set('mediatorTone', tone);
      await Auth.saveCoupleSettings({ mediator_tone: tone });
      U.toast(`Tone set to ${TONES[tone]?.label || tone}`);
    });
  });
});

   App initialization
   ═══════════════════════════════════════════════════════════════ */

(async () => {
  Router.initNav();

  // Check for existing session
  const boot = await Auth.bootstrap();
  console.log('[init] Bootstrap result:', boot);

  if (boot.mode === 'unauthenticated') {
    Router.go('auth-entry');
  } else if (!boot.coupled) {
    Router.go('ob-couple');
  } else if (!boot.hasPartner && boot.coupled) {
    Router.go('ob-invite');
  } else {
    Router.go('home');
  }

  // Auth state change listener (handles page reload, OAuth redirect)
  Auth.sb().auth.onAuthStateChange(async (event, session) => {
    if (event === 'INITIAL_SESSION') return; // handled by bootstrap above
    if (event === 'SIGNED_IN' && session) {
      const b = await Auth.bootstrap();
      if (b.coupled && b.hasPartner) Router.go('home');
      else if (b.coupled) Router.go('ob-invite');
      else Router.go('ob-couple');
    }
    if (event === 'SIGNED_OUT') {
      Router.go('auth-entry');
    }
  });
})();

</script>
