async function callAI(systemPrompt, userMessage) {
  // Route through Supabase Edge Function so the Anthropic key stays server-side
  const session = SupabaseDB.getCurrentSession?.();
  const token   = session?.access_token || null;
  const authHeader = token ? { 'Authorization': `Bearer ${token}` } : {};

  // AbortController timeout — edge functions can be slow to cold-start
  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 30000); // 30s max

  let res;
  try {
    res = await fetch(
      'https://oevfeeymescxynikkqkx.supabase.co/functions/v1/ai-proxy',
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeader },
        body: JSON.stringify({ systemPrompt, userMessage }),
        signal: controller.signal,
      }
    );
  } finally {
    clearTimeout(timeoutId);
  }

  if (!res.ok) {
    const errBody = await res.text().catch(() => '');
    throw new Error(`AI proxy error ${res.status}: ${errBody.slice(0, 120)}`);
  }

  const data = await res.json();
  const text = data.content?.[0]?.text || '';
  if (!text) throw new Error('AI returned empty response');
  return text;
}

// Universal language patterns that are always forbidden regardless of tone or context.
// These are injected into every AI call that produces partner-facing text.
const UNIVERSAL_LANGUAGE_SAFETY = `
UNIVERSAL LANGUAGE RULES (apply to every word you write — no exceptions, no overrides):

1. NEVER use terms of endearment unless explicitly specified in the partner profile above. Do not invent "babe", "honey", "love", "sweetheart", or any other endearment. If no endearment is specified, address neutrally.

2. NEVER use comparative or historical framing — phrases like "just this time", "for once", "this time around", "unlike last time", "just the two of us this time", "without the usual..." imply a negative history and will be read as passive-aggressive, even if unintended.

3. NEVER use exclusion language that implies someone is being left out — rephrase positively around what IS happening rather than what isn't.

4. NEVER use scarcity or urgency framing — "I really need this", "I just want one thing", "this is important to me" can feel like pressure even when genuine. Describe the desire neutrally.

5. NEVER reference patterns, frequency, or past incidents — "we never do this", "you always...", "last time we...", "it's been so long since..." all carry implicit criticism regardless of tone.

6. NEVER use minimising language — "it's just a quick trip", "it won't be a big deal" dismisses the partner's valid concerns before they've expressed them.

7. When the topic involves family visits (either side), be especially careful: do not use any phrasing that could be read as territorial, as a score-keeping reference, or as implying the other family is less important.
`;

async function runToneFilter(rawText, userName, tone = 'neutral', intentContext = '') {
  const profile     = TONE_PROFILES[tone] || TONE_PROFILES.neutral;
  const user        = State.get('user');
  const partner     = State.get('partner');
  const partnerName = partner?.name || '';

  // Determine sender role: prefer the live auth role, fall back to name comparison
  const _authRole       = (SupabaseDB.configured && SupabaseDB.getMyRole) ? SupabaseDB.getMyRole() : null;
  const senderRole      = _authRole || (userName === partnerName ? 'user' : (userName === (user?.name || '') ? 'user' : 'partner'));
  const recipientRole   = senderRole === 'user' ? 'partner' : 'user';
  const recipientName   = senderRole === 'user' ? partnerName : (user?.name || '');

  const senderBlock    = getSenderPrefsPrompt(senderRole);
  const recipientBlock = getRecipientPrefsPrompt(recipientRole, recipientName);

  const intentBlock = intentContext
    ? `\nCRITICAL INTENT CONSTRAINT (non-negotiable — must be preserved exactly in your rewrite):\n${intentContext}\nDo NOT change who is going, who stays home, or any logistical facts stated above. If the intent says the user is going alone, the rewritten message must clearly reflect that the user is going alone — never reframe it as a couples or joint trip.\n`
    : '';
  return callAI(
    `You are Parlay's Communication Translator — a specialist in couples communication. Your job is to make messages receivable without defensiveness, while preserving exactly what the sender actually meant.

STEP 0 — CLASSIFY THE MESSAGE FIRST (this determines everything else)
Before doing anything, identify which type of message this is:

TYPE A — AGREEMENT (with or without venting): The core content is a "yes" or acceptance, even if wrapped in frustration or offensive language.
• Examples: "fine, that works, I fucken hate your parents" / "yeah ok whatever" / "sure, I don't care"
• What to do: Extract and state the agreement clearly and warmly. DROP all venting, contempt, or hostility entirely — do not replace it, do not reference it, do not try to find the feeling underneath it. The agreement IS the message. Output only the agreement.
• WRONG: "I hear you're really upset and want to understand what's hard for you" ← this invents emotional content that wasn't there and loses the agreement
• RIGHT: "March 11th works for me." or "That timing works."

TYPE B — REFUSAL or COUNTER-PROPOSAL: The core content is a "no" or "not that, but this instead."
• What to do: Preserve the no or counter clearly. Remove contempt/blame. Apply NVC only to soften HOW the refusal is expressed, not to manufacture agreement.

TYPE C — POSITION or REQUEST: The sender is expressing a need, want, or request that requires negotiation.
• What to do: Apply the full three-discipline framework below.

TYPE D — EMOTIONAL EXPRESSION only (no logistical content): Venting, frustration, distress with no clear ask.
• What to do: Distill to the underlying feeling + a request to talk. Brief and non-dramatic.

Only apply the disciplines below if the message is Type C or D. For Type A or B, lead with the operative content.

---

DISCIPLINE 1 — GOTTMAN FOUR HORSEMEN (for Type C and D only)
Identify and replace destructive patterns:
• Criticism → soft complaint (specific behaviour + feeling + need)
• Contempt → direct statement of unmet need. Zero tolerance — remove entirely, never soften or keep.
• Defensiveness → simple ownership of the speaker's own part
• Stonewalling → request for space framed as care, not withdrawal

DISCIPLINE 2 — NVC TRANSLATION (for Type C and D only)
Find the Observation → Feeling → Need → Request underneath the words.
Honour all four layers in the rewrite even if only one was explicit.
NEVER manufacture feelings that aren't there. NEVER project emotions onto the sender.
NEVER write empathy statements directed at the other partner ("I hear that you're upset") — the sender is not a therapist, they're a person expressing their own position.

DISCIPLINE 3 — RECIPIENT CALIBRATION (always)
Shape output for this specific recipient using tone style and both profiles below.
${intentBlock}
${UNIVERSAL_LANGUAGE_SAFETY}
TONE STYLE: ${profile.label}
${profile.filterInstructions}
${senderBlock}
${recipientBlock}
OUTPUT RULES:
- Preserve the core message type (agreement stays agreement, refusal stays refusal)
- 1–3 sentences maximum
- Write in first person as the sender
- Return ONLY the rewritten message. No preamble, no explanation, no meta-commentary.`,
    `${userName} wrote: "${rawText}"\n\nApply the three disciplines and return the rewritten message only:`
  );
}

async function generateProposal(topic, userPosition, partnerPosition, userName, partnerName, tone = 'neutral', intentContext = '') {
  const profile = TONE_PROFILES[tone] || TONE_PROFILES.neutral;

  // Both parties' prefs inform the proposal — sender (user) voice + recipient (partner) calibration
  const userSenderBlock    = getSenderPrefsPrompt('user');
  const partnerSenderBlock = getSenderPrefsPrompt('partner');
  const recipientBlock     = getRecipientPrefsPrompt('partner', partnerName);

  const intentBlock = intentContext
    ? `\nCRITICAL INTENT CONTEXT (must be respected exactly — do not assume or change who is going):\n${intentContext}\n`
    : '';
  return callAI(
    `You are Parlay's Relationship Mediator — a specialist trained in interest-based negotiation and couples conflict resolution. You operate from three core principles that govern every proposal you write:

PRINCIPLE 1 — POSITIONS VS INTERESTS (Fisher & Ury, "Getting to Yes")
What people say they want (their position) is almost never what they actually need (their interest). Your primary task is to look beneath both partners' stated positions to find the underlying interest — the deeper need, fear, or value that is driving the request.
• Position: "I don't want your parents here for a whole week."
• Interest: "I need to feel like my home is a place I can relax. Extended visits make me feel like I can't be myself."
Your proposal should address the interest, not split the difference between positions. A proposal that satisfies the interest of both parties is always superior to a compromise that leaves both slightly dissatisfied.

PRINCIPLE 2 — DREAMS WITHIN CONFLICT (Gottman)
Every entrenched position has a dream or a fear underneath it. If you can name and honour the dream on both sides — without either partner having to say it explicitly — the proposal will feel deeply seen rather than merely fair.
Ask yourself: What is each person trying to protect? What are they afraid of losing? What would a "win" actually feel like for them emotionally, not just logistically?
Build that understanding into your proposal even if neither partner articulated it. This is the difference between a mediocre settlement and a proposal that makes both people feel genuinely understood.

PRINCIPLE 3 — EMOTIONAL SAFETY FIRST, LOGISTICS SECOND
A proposal that is logistically perfect but emotionally unsafe will be rejected. Lead with acknowledgment of both people's feelings before offering solutions. The structure is always: (1) validate both sides, (2) name the shared interest, (3) offer the creative path forward.
Never assign blame. Never position one partner as more reasonable than the other. Never use language that could read as the AI siding with one party.
${intentBlock}
IMPORTANT: If intent context is provided above, you MUST honour it exactly. If it says "just the user going alone", your proposal must reflect solo travel — never suggest the spouse join unless the intent context explicitly includes them.
${UNIVERSAL_LANGUAGE_SAFETY}
${userSenderBlock}
${partnerSenderBlock}
${recipientBlock}
TONE STYLE: ${profile.label}
${profile.proposalInstructions}

When writing the "reasoning" field, briefly name the underlying interest you identified for each partner — this is the most valuable thing you can surface. Not "both partners want fairness" (generic) but "Sarah needs to feel her home is a sanctuary; James needs to feel he's honouring his family commitments without guilt" (specific).

Format your response as valid JSON with exactly this shape:
{
  "proposal": "2–3 sentences in the specified tone. Acknowledges both sides first, then offers the path forward. Addresses interests not positions.",
  "reasoning": "1–2 sentences naming the underlying interest or dream you identified for each partner — specific, not generic.",
  "userConcession": "One thing the initiating partner gives, framed as a positive choice not a sacrifice",
  "partnerConcession": "One thing the responding partner gives, framed as a positive choice not a sacrifice",
  "tensionLevel": "low|medium|high"
}

Return ONLY the JSON. No markdown, no explanation, no preamble.`,
    `Topic: ${topic}
${userName}'s position: ${userPosition}
${partnerName}'s position: ${partnerPosition}

Identify the underlying interests, name the dreams within the conflict, and generate a proposal:`
  );
}

async function detectTension(text) {
  let result;
  try { result = await callAI(
    `You are a couples communication analyst trained in the Gottman Four Horsemen framework. Analyze the text for destructive communication patterns.

The Four Horsemen and their indicators:
• CRITICISM: Attacks character or personality ("you're so selfish", "you never", "you always", "what's wrong with you")
• CONTEMPT: Superiority, mockery, sarcasm, disgust, eye-rolling in text, name-calling — the most dangerous pattern
• DEFENSIVENESS: Counter-attacks, playing victim, "but you...", making excuses, righteous indignation
• STONEWALLING: Shutdown language, "forget it", "whatever", "I don't care anymore", emotional withdrawal

Return ONLY a JSON object with exactly this shape:
{
  "level": "low|medium|high",
  "flag": true|false,
  "horseman": "criticism|contempt|defensiveness|stonewalling|none",
  "note": "one short, specific sentence describing what was detected, or empty string if flag is false"
}

Flag true if any Horseman is present. Level "high" if contempt is detected (it's the strongest predictor of relationship damage). Return ONLY JSON.`,
    text
  );
  } catch { return { level: 'low', flag: false, horseman: 'none', note: '' }; }
  try { return JSON.parse(result); }
  catch { return { level: 'low', flag: false, horseman: 'none', note: '' }; }
}

// Safely parse a proposal response from the AI.
// The model sometimes wraps JSON in ```json ... ``` fences despite instructions — strip them first.
function parseProposal(raw) {
  try {
    const clean = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim();
    return JSON.parse(clean);
  } catch {
    // If it still fails, return a safe fallback that makes the failure visible without crashing
    return {
      proposal: raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '').trim(),
      reasoning: '',
      userConcession: '',
      partnerConcession: '',
      tensionLevel: 'low'
    };
  }
}

// Topics that need structured intent questions before free text
const INTENT_TOPICS = ['inlaw', 'family', 'date', 'host', 'playdate'];

function renderIntentQuestions(topicId, family, partner) {
  if (!INTENT_TOPICS.includes(topicId)) return '';

  const kids = (family && family.kids) || [];
  const playdateContacts = (family && family.playdateContacts) || [];
  const familySetupDone = family && (kids.length > 0 || (family.providers && family.providers.length > 0));
  const kCount = kids.length;
  const p = partner.name || 'your partner';
  const pShort = partner.name || 'My partner';

  // Smart label helpers
  const kidsLabel = (prefix) => {
    if (kCount === 0) return null;
    if (kCount === 1) return prefix + kids[0].name;
    return prefix + 'the kids';
  };

  // ── HOST: Entertain at Home ──────────────────────────────────
  if (topicId === 'host') {
    const formatOpts = [
      { id: 'dinner',  icon: '🍽️',  label: 'Dinner party',         sub: 'Sit-down meal, higher effort' },
      { id: 'drinks',  icon: '🥂',  label: 'Drinks & appetizers',  sub: 'Low-key, easy to pull off' },

      { id: 'game',    icon: '🎲',  label: 'Game night',           sub: 'Fun & easy, late finish' },
      { id: 'holiday', icon: '🎉',  label: 'Holiday / celebration', sub: 'Bigger occasion' },

    const guestOpts = [

      { id: 'my-friends',     label: 'My friends'      },
      { id: 'their-friends',  label: `${pShort}'s friends` },
      { id: 'family',         label: 'Extended family' },
      { id: 'neighbors',      label: 'Neighbors'       },
      { id: 'work',           label: 'Colleagues'      },

    const kidsSituationOpts = [
      { id: 'adults-only',   label: 'Adults only — need to arrange the kids' },
      { id: 'kids-welcome',  label: 'Kids welcome — they can hang or play' },
      { id: 'mixed',         label: 'Mixed — kids for part of it'           },

        { id: 'just-me', label: 'Just me' },
        ...(kCount > 0 ? [{ id: 'me-and-kids', label: kidsLabel('Me + ') }] : []),

  return `

    </div>
  `;
}

Router.register('mediator-compose', ({ topicId = 'other' } = {}) => {

  const view  = State.get('currentView') || 'user';
  const user = State.get('user');
  const partner = State.get('partner');
  // role-correct names: always "me" and "the recipient"
  const _myNameMC   = (SupabaseDB.configured ? SupabaseDB.getMyName()      : null) || (view === 'partner' ? partner.name : user.name) || 'You';
  const _themNameMC = (SupabaseDB.configured ? SupabaseDB.getPartnerName() : null) || (view === 'partner' ? user.name    : partner.name) || 'your partner';
  const family = State.get('family') || { kids: [], providers: [], playdateContacts: [] };

  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));overflow-y:auto;">

        <span style="font-size:1.2rem;">${topic.icon}</span>
        <span style="font-family:var(--font-display);font-size:1.1rem;">${topic.label}</span>
      </div>
    </div>

    <div class="a2" style="margin-bottom:20px;">
      <div style="font-family:var(--font-display);font-size:1.9rem;font-weight:300;margin-bottom:6px;">Your <em style="font-style:italic;color:var(--terra)">position</em></div>
      <div style="font-size:.82rem;color:var(--muted);line-height:1.6;">
        ${needsIntent
          ? 'First clarify the basics — then tell Parlay exactly what you want. It filters everything before your partner sees it.'
          : `Say exactly what you want or feel. Don't filter yourself — Parlay will do that before ${_themNameMC} sees it.`}
      </div>
    </div>

    <div class="a3" style="display:flex;flex-direction:column;gap:16px;">

        <div style="font-weight:700;margin-bottom:3px;" id="warning-headline">⚡ Parlay detected some heat in your message</div>
        <div id="warning-body">That's okay — Parlay will cool it down before sending.</div>
      </div>

      <div class="input-wrap">
        <label class="input-label">What do you want or need? <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">speak freely</span></label>
        <textarea id="compose-main" class="input" rows="4" placeholder="${
          topicId === 'inlaw' ? 'e.g. I really want to see my parents this month. I miss them and feel like we haven\'t visited in a while.' :
          topicId === 'family' ? 'e.g. There\'s a family reunion on my side this summer. I really want to be there.' :
          topicId === 'date' ? 'e.g. I feel like we\'ve been really disconnected lately and I want to plan something just for us.' :
          topicId === 'boys' ? 'e.g. I\'ve been stressed and I need a night out with my friends. I\'m thinking this Friday.' :
          topicId === 'girls' ? 'e.g. My friends have been planning a night out and I really need this for my mental health.' :
          topicId === 'host' ? 'e.g. I\'d love to have the Martins over for dinner — we haven\'t hosted in a while and it would be fun. I\'m thinking I\'d handle most of the cooking.' :
          topicId === 'playdate' ? 'e.g. Emma has been asking about her friend Lily all week and I think it\'d be really nice to set something up. I\'m happy to handle it.' :
          'e.g. Tell Parlay what you need...'

      <div class="input-wrap">

        <div style="display:flex;flex-direction:column;gap:8px;" id="date-slots">
          ${[1,2,3,4].map(n => `

              <input type="date" class="date-slot-date" data-slot="${n}"
                style="flex:1;border:none;background:transparent;font-size:.85rem;color:var(--espresso);outline:none;min-width:0;">
              <select class="date-slot-time" data-slot="${n}"
                style="border:none;background:transparent;font-size:.8rem;color:var(--muted);outline:none;cursor:pointer;flex-shrink:0;">
                <option value="">Time…</option>
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
                <option value="All day">All day</option>
              </select>
            </div>
          `).join('')}
        </div>
        <div style="margin-top:8px;font-size:.7rem;color:var(--muted);">Leave blank to skip date options and just send your position.</div>
      </div>

      <div style="background:var(--parchment);border-radius:var(--r-md);padding:12px 14px;">
        <div style="font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:4px;">🔒 Private until filtered</div>
        <div style="font-size:.76rem;color:var(--muted);line-height:1.5;">${_themNameMC || 'Your partner'} only sees the calm rewritten version — not your raw words above.</div>
      </div>
    </div>

    <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px;" class="a4">
      <button class="btn btn-accent btn-full" id="compose-submit" style="border-radius:var(--r-md);">
        <span id="compose-btn-text">Let Parlay Mediate →</span>
      </button>
      <button class="btn btn-muted btn-full" style="font-size:.82rem;" onclick="Router.navigate('mediator')">Cancel</button>
    </div>
  </div>
  `;
}, (el, { topicId = 'other' } = {}) => {
  const textarea = el.querySelector('#compose-main');
  const warning = el.querySelector('#tone-warning');
  let toneTimer;

  // Intent block interactivity
  const whoRadios = el.querySelectorAll('input[name="who-going"]');
  const kidsPicker = el.querySelector('#kids-picker');
  const spouseBlock = el.querySelector('#spouse-block');
  const allKidsToggle = el.querySelector('#all-kids-toggle');
  const family = State.get('family') || {};
  const kCount = (family.kids || []).length;

  function styleGroup(container, inputName) {
    if (!container) return;
    container.querySelectorAll('label').forEach(lbl => {
      const input = lbl.querySelector('input');
      if (!input) return;
      const active = input.type === 'checkbox' ? input.checked : input.checked;
      lbl.style.borderColor = active ? 'var(--terra)' : 'var(--border)';
      lbl.style.background  = active ? '#FDF0EA' : 'var(--surface)';
    });
  }

  function updateIntentVisibility() {
    const selected = el.querySelector('input[name="who-going"]:checked')?.value || '';
    const involvesKids = ['me-and-kids', 'whole-family', 'partner-kids', 'with-kids'].includes(selected);
    const spouseNotComing = ['just-me', 'me-and-kids'].includes(selected);

    // Kids picker: only relevant if 2+ kids (1-kid case: name is already in the label)
    if (kidsPicker) kidsPicker.style.display = (involvesKids && kCount >= 2) ? 'block' : 'none';
    if (spouseBlock) spouseBlock.style.display = spouseNotComing ? 'block' : 'none';

    styleGroup(el.querySelector('#who-options'), 'who-going');
  }

  whoRadios.forEach(r => {
    r.addEventListener('change', updateIntentVisibility);
    r.closest('label')?.addEventListener('click', () => setTimeout(updateIntentVisibility, 10));
  });

  // All-kids shortcut toggle
  if (allKidsToggle) {
    allKidsToggle.addEventListener('change', () => {
      const checked = allKidsToggle.checked;
      el.querySelectorAll('#kids-chips input[type="checkbox"]').forEach(cb => {
        cb.checked = checked;
      });
      styleGroup(el.querySelector('#kids-chips'), 'kid-select');
    });
  }

  // Individual kid chips
  el.querySelectorAll('.kid-chip-label').forEach(lbl => {
    lbl.addEventListener('change', () => {
      const cb = lbl.querySelector('input');
      lbl.style.borderColor = cb.checked ? 'var(--terra)' : 'var(--border)';
      lbl.style.background  = cb.checked ? '#FDF0EA' : 'var(--surface)';
      // Sync all-kids toggle
      if (allKidsToggle) {
        const allChecked = [...el.querySelectorAll('#kids-chips input[type="checkbox"]')].every(c => c.checked);
        allKidsToggle.checked = allChecked;
      }
    });
  });

  // Spouse radio styling
  el.querySelectorAll('input[name="spouse-role"]').forEach(r => {
    r.addEventListener('change', () => styleGroup(el.querySelector('#spouse-block'), 'spouse-role'));
  });

  updateIntentVisibility();

  // ── HOST intent block interactivity ──────────────────────
  function styleRadioGroup(selector) {
    el.querySelectorAll(selector).forEach(lbl => {
      const inp = lbl.querySelector('input[type="radio"]');
      if (!inp) return;
      lbl.style.borderColor = inp.checked ? (selector.includes('host') ? '#7A6A9B' : '#5A9E8A') : 'var(--border)';
      lbl.style.background  = inp.checked ? (selector.includes('host') ? 'rgba(122,106,155,.1)' : 'rgba(90,158,138,.1)') : 'var(--surface)';
    });
  }
  function styleCheckboxGroup(selector, activeColor, activeBg) {
    el.querySelectorAll(selector).forEach(lbl => {
      const inp = lbl.querySelector('input[type="checkbox"]');
      if (!inp) return;
      lbl.style.borderColor = inp.checked ? activeColor : 'var(--border)';
      lbl.style.background  = inp.checked ? activeBg   : 'var(--surface)';
    });
  }

  // Host: radio groups
  ['input[name="host-format"]','input[name="host-kids"]','input[name="host-partner-role"]'].forEach(sel => {
    el.querySelectorAll(sel).forEach(inp => {
      inp.addEventListener('change', () => {
        const labelSel = sel.replace('input[name="','').replace('"]','');
        el.querySelectorAll(`.intent-host-label`).forEach(lbl => {
          const r = lbl.querySelector('input[type="radio"]');
          if (!r) return;
          const active = r.checked;
          lbl.style.borderColor = active ? '#7A6A9B' : 'var(--border)';
          lbl.style.background  = active ? 'rgba(122,106,155,.1)' : 'var(--surface)';
        });
      });
    });
  });

  // Host: scale pill cards
  el.querySelectorAll('.host-scale-chip').forEach(lbl => {
    lbl.addEventListener('click', () => {
      const inp = lbl.querySelector('input[type="radio"]');
      if (inp) inp.checked = true;
      el.querySelectorAll('.host-scale-chip').forEach(l => {
        const r = l.querySelector('input[type="radio"]');
        l.style.borderColor = (r && r.checked) ? '#7A6A9B' : 'var(--border)';
        l.style.background  = (r && r.checked) ? 'rgba(122,106,155,.1)' : 'var(--surface)';
      });
    });
  });

  // Host: guest checkboxes
  el.querySelectorAll('.host-guest-chip').forEach(lbl => {
    lbl.addEventListener('change', () => styleCheckboxGroup('.host-guest-chip', '#7A6A9B', 'rgba(122,106,155,.1)'));
  });

  // Playdate: location pill cards
  el.querySelectorAll('.playdate-loc-chip').forEach(lbl => {
    lbl.addEventListener('click', () => {
      const inp = lbl.querySelector('input[type="radio"]');
      if (inp) inp.checked = true;
      el.querySelectorAll('.playdate-loc-chip').forEach(l => {
        const r = l.querySelector('input[type="radio"]');
        l.style.borderColor = (r && r.checked) ? '#5A9E8A' : 'var(--border)';
        l.style.background  = (r && r.checked) ? 'rgba(90,158,138,.1)' : 'var(--surface)';
      });
    });
  });

  // Playdate: radio groups
  ['.playdate-contact-label','.playdate-sup-label','.playdate-other-label','.playdate-kid-chip'].forEach(sel => {
    el.querySelectorAll(sel).forEach(lbl => {
      lbl.addEventListener('change', () => {
        el.querySelectorAll(sel).forEach(l => {
          const r = l.querySelector('input');
          if (!r) return;
          const active = r.type === 'checkbox' ? r.checked : r.checked;
          l.style.borderColor = active ? '#5A9E8A' : 'var(--border)';
          l.style.background  = active ? 'rgba(90,158,138,.1)' : 'var(--surface)';
        });
      });
    });
  });

  // Playdate: "Someone else" shows custom text field
  el.querySelectorAll('input[name="playdate-friend"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const custom = el.querySelector('#playdate-friend-custom');
      if (custom) {
        if (inp.value === '__other__' && inp.checked) {
          custom.focus();
        }
      }
    });
  });

  // Date slot visual fill state
  el.querySelectorAll('.date-slot-date, .date-slot-time').forEach(inp => {
    inp.addEventListener('change', () => {
      const n = inp.dataset.slot;
      const slot = el.querySelector(`#date-slot-${n}`);
      const hasDate = el.querySelector(`.date-slot-date[data-slot="${n}"]`)?.value;
      if (slot) slot.classList.toggle('filled', !!hasDate);
    });
  });

  // Tone detection on textarea
  textarea?.addEventListener('input', () => {
    clearTimeout(toneTimer);
    if (textarea.value.length > 40) {
      toneTimer = setTimeout(async () => {
        const tension = await detectTension(textarea.value);
        if (tension.flag) {
          const horseman = tension.horseman || 'none';
          const headlines = {
            criticism:     '⚡ Sounds like a character attack — Parlay will reframe it as a specific complaint',
            contempt:      '🚨 Contempt detected — the most corrosive pattern. Parlay will replace it with a direct need',
            defensiveness: '⚡ Reads as defensive — Parlay will shift it to ownership',
            stonewalling:  '⚡ Sounds like a shutdown — Parlay will reframe it as a request for space',
            none:          '⚡ Your message sounds heated'
          };
          const bodies = {
            criticism:     tension.note || 'Parlay will turn the character attack into a complaint about a specific behaviour.',
            contempt:      tension.note || 'Raw contempt will be completely replaced. Your underlying need will still come through clearly.',
            defensiveness: tension.note || 'Parlay will remove the counter-attack and lead with your actual position.',
            stonewalling:  tension.note || 'Parlay will replace the shutdown language with a request your partner can actually respond to.',
            none:          'That\'s okay — Parlay will cool it down before it reaches your partner.'
          };
          if (warning) {
            warning.style.display = 'block';
            const headline = warning.querySelector('#warning-headline');
            const body = warning.querySelector('#warning-body');
            if (headline) headline.textContent = headlines[horseman] || headlines.none;
            if (body) body.textContent = bodies[horseman] || bodies.none;
            // Escalate colour for contempt
            warning.style.background = horseman === 'contempt' ? '#FFF0F0' : '#FFF5E0';
            warning.style.borderColor = horseman === 'contempt' ? '#E8A0A0' : '#E8B88A';
            warning.style.color = horseman === 'contempt' ? '#8A2A2A' : '#8A6A2A';
          }
        } else {
          if (warning) warning.style.display = 'none';
        }
      }, 800);
    } else {
      if (warning) warning.style.display = 'none';
    }
  });

  el.querySelector('#compose-submit').addEventListener('click', async () => {
    const raw = textarea.value.trim();
    const constraints = el.querySelector('#compose-constraints')?.value.trim() || '';
    if (!raw) { U.toast('Tell Parlay what you need first'); return; }

    // Gather structured intent
    const whoGoing = el.querySelector('input[name="who-going"]:checked')?.value || null;
    const spouseRole = el.querySelector('input[name="spouse-role"]:checked')?.value || null;
    const familyState = State.get('family') || {};
    const allKids = familyState.kids || [];
    const kCount = allKids.length;

    // For 1-kid: the selection is implicit (name is in the radio label), use that kid automatically
    // For 2+ kids: read checkboxes
    let selectedKids = [];
    if (kCount === 1 && ['me-and-kids', 'whole-family', 'partner-kids', 'with-kids'].includes(whoGoing)) {
      selectedKids = [allKids[0].name];
    } else {
      const selectedKidIds = [...(el.querySelectorAll('#kids-chips input:checked') || [])].map(c => c.value);
      selectedKids = allKids.filter(k => selectedKidIds.includes(k.id)).map(k => k.name);
    }

    // Build structured context string to embed in prompt
    let intentContext = '';
    if (whoGoing) {
      const kStr = selectedKids.length ? '(' + selectedKids.join(', ') + ')' : '';
      const whoLabels = {
        'just-me':      'Just the user going alone — spouse stays home',
        'me-and-kids':  `User going with kids only, spouse NOT coming ${kStr}`,
        'whole-family': `Whole family going together — user, spouse, and kids ${kStr}`,
        'partner-kids': `Spouse going with the kids, user stays home ${kStr}`,
        'just-us':      'Just the two partners — no kids',
        'with-kids':    `Both partners and kids ${kStr}`,
      };
      intentContext += `WHO IS GOING: ${whoLabels[whoGoing] || whoGoing}\n`;
    }
    if (spouseRole) {
      const roleLabels = {
        'not-involved': 'Spouse is not part of this trip at all — they stay home',
        'aware': 'Spouse just needs to be aware and approve the timing',
        'covering-kids': 'Spouse stays home to cover the kids while user goes',
      };
      intentContext += `SPOUSE ROLE: ${roleLabels[spouseRole] || spouseRole}\n`;
    }

    // ── HOST intent context ──────────────────────────────────
    if (topicId === 'host') {
      const hostFormat = el.querySelector('input[name="host-format"]:checked')?.value || '';
      const hostGuests = [...el.querySelectorAll('input[name="host-guests"]:checked')].map(c => c.value);
      const hostScale  = el.querySelector('input[name="host-scale"]:checked')?.value || '';
      const hostKids   = el.querySelector('input[name="host-kids"]:checked')?.value || '';
      const hostRole   = el.querySelector('input[name="host-partner-role"]:checked')?.value || '';

      const formatLabels = { dinner:'Sit-down dinner party', drinks:'Drinks & appetizers (low-key)', bbq:'BBQ / backyard gathering', game:'Game night', holiday:'Holiday or celebration event' };
      const scaleLabels  = { small:'Intimate (2–4 guests)', medium:'Small gathering (5–8 guests)', large:'Larger party (9+ guests)' };
      const kidsLabels   = { 'adults-only':'Adults only — need to arrange childcare/kid coverage', 'kids-welcome':'Kids are welcome and included', 'mixed':'Mixed — kids for part of the event' };
      const roleLabels   = {
        'just-date':'Just needs to agree on the date — user will handle the rest',
        'share-prep':'Both partners share cooking and prep equally',
        'i-cook-clean':'User handles food; partner handles house/cleaning',
        'they-handle':'Partner takes the lead; user supports',
        'full-discuss':'Couple needs to plan the full event together',
      };
      const guestLabels  = { 'couple-friends':'couple friends', 'my-friends':'user\'s own friends', 'their-friends':'partner\'s friends', 'family':'extended family', 'neighbors':'neighbors', 'work':'work colleagues' };

      if (hostFormat) intentContext += `HOSTING FORMAT: ${formatLabels[hostFormat] || hostFormat}\n`;
      if (hostGuests.length) intentContext += `GUEST TYPE: ${hostGuests.map(g => guestLabels[g] || g).join(', ')}\n`;
      if (hostScale)  intentContext += `EVENT SCALE: ${scaleLabels[hostScale] || hostScale}\n`;
      if (hostKids)   intentContext += `KIDS SITUATION: ${kidsLabels[hostKids] || hostKids}\n`;
      if (hostRole)   intentContext += `WHAT USER NEEDS FROM PARTNER: ${roleLabels[hostRole] || hostRole}\n`;
      intentContext += `CONTEXT: This is a "host at home" proposal. The user is proposing to entertain guests at the shared home. The message must establish: (1) who's coming and roughly when, (2) the format/effort level so partner can calibrate expectations, (3) exactly what the user is asking the partner to do or agree to. Do NOT assume the partner is enthusiastic — present this as a proposal that respects both the shared space and the partner's schedule and energy.\n`;
    }

    // ── PLAYDATE intent context ──────────────────────────────
    if (topicId === 'playdate') {
      const familyState2      = State.get('family') || {};
      const allKids2          = familyState2.kids || [];
      const contacts          = familyState2.playdateContacts || [];
      const pdKidIds          = [...el.querySelectorAll('input[name="playdate-kid"]:checked')].map(c => c.value);
      const pdKidNames        = allKids2.filter(k => pdKidIds.includes(k.id)).map(k => k.name);
      const pdFriendId        = el.querySelector('input[name="playdate-friend"]:checked')?.value || '';
      const pdFriendCustom    = el.querySelector('#playdate-friend-custom')?.value.trim() || '';
      const pdLocation        = el.querySelector('input[name="playdate-location"]:checked')?.value || '';
      const pdSupervise       = el.querySelector('input[name="playdate-supervise"]:checked')?.value || '';
      const pdOtherKids       = el.querySelector('input[name="playdate-other-kids"]:checked')?.value || '';

      const friendContact = contacts.find(c => (c.id || c.name) === pdFriendId);
      const friendName    = pdFriendCustom || (friendContact ? friendContact.name : pdFriendId !== '__other__' ? pdFriendId : '');

      const locLabels  = { here:'At our home (we host)', there:"At the friend's place", park:'Park or outdoor neutral location', activity:'Activity venue (gym, arts class, etc.)' };
      const supLabels  = { 'i-supervise':'User will supervise', 'partner-supervise':'Partner will supervise — user is free during this time', 'drop-off':'Drop-off only — no adult staying', 'together':'Both parents stay (social for adults too)' };
      const otherLabels= { together:"Other kids come too — no separate coverage needed", 'i-cover':'User covers the other kid(s)', 'partner-covers':'Partner covers the other kid(s)', 'need-to-figure':'Coverage for other kids still needs to be figured out' };

      if (pdKidNames.length)  intentContext += `WHICH KID: ${pdKidNames.join(', ')}\n`;
      if (friendName)         intentContext += `FRIEND: ${friendName}${friendContact?.parentName ? ` (parent: ${friendContact.parentName})` : ''}\n`;
      if (pdLocation)         intentContext += `LOCATION: ${locLabels[pdLocation] || pdLocation}\n`;
      if (pdSupervise)        intentContext += `WHO SUPERVISES: ${supLabels[pdSupervise] || pdSupervise}\n`;
      if (pdOtherKids)        intentContext += `OTHER KIDS COVERAGE: ${otherLabels[pdOtherKids] || pdOtherKids}\n`;
      intentContext += `CONTEXT: This is a playdate coordination proposal. Key things the message must communicate: (1) which child and with whom, (2) where it happens and who is responsible for logistics/supervision, (3) any impact on the partner's schedule or responsibilities during that time. Be specific about what is being asked of the partner — whether that's agreement, scheduling coverage, or just a heads-up.\n`;
    }
    // Collect date options
    const dateOptions = [];
    [1,2,3,4].forEach(n => {
      const d = el.querySelector(`.date-slot-date[data-slot="${n}"]`)?.value;
      const t = el.querySelector(`.date-slot-time[data-slot="${n}"]`)?.value;
      if (d) dateOptions.push({ id: 'opt_' + n, date: d, timeLabel: t || 'Any time', label: 'Option ' + n });
    });
    if (constraints) intentContext += `TIMING CONSTRAINTS: ${constraints}\n`;
    if (dateOptions.length) intentContext += `DATE OPTIONS PROPOSED: ${dateOptions.map(o => o.label + ': ' + o.date + (o.timeLabel ? ' ' + o.timeLabel : '')).join('; ')}\n`;

    const submitBtn  = el.querySelector('#compose-submit');
    const btnText    = el.querySelector('#compose-btn-text');
    btnText.textContent  = 'Filtering your message…';
    submitBtn.disabled   = true;

    const userName = _myNameMC || State.get('user').name || 'You';
    const tone     = State.get('mediatorTone') || 'neutral';

    let filtered;
    try {
      filtered = await runToneFilter(raw, userName, tone, intentContext);
    } catch (err) {
      console.error('[Parlay] runToneFilter failed:', err);
      btnText.textContent = 'Let Parlay Mediate →';
      submitBtn.disabled  = false;
      const msg = err.name === 'AbortError'
        ? 'Request timed out — check your connection and try again'
        : 'Couldn\u2019t reach the AI right now. Try again in a moment.';
      U.toast(msg);
      return;
    }

    // Save parlay as pending_partner — NO fake partner position, NO generateProposal yet
    const topic = TOPIC_TYPES.find(t => t.id === topicId);
    const negId = 'neg_' + Date.now();
    MediatorState.add({
      id: negId,
      topicId,
      title: topic?.label || 'New Parlay',
      date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
      rawInput: raw,
      filteredInput: filtered,
      intentContext,
      dateOptions,
      status: 'pending_partner',
      createdBy: (SupabaseDB.configured ? SupabaseDB.getMyRole() : null) || (State.get('currentView') === 'partner' ? 'partner' : 'user'),
      partnerRawReply: null,
      partnerFilteredReply: null,
      partnerDateResponse: null,
      proposal: null,
      resolution: null
    });

    Router.navigate('parlay-sent', { negId });
  });
});

/* ================================================
   MODULE: PARLAY SENT CONFIRMATION
   ================================================ */
Router.register('parlay-sent', ({ negId } = {}) => {
  const neg = negId ? MediatorState.find(negId) : null;
  const topic = neg ? (TOPIC_TYPES.find(t => t.id === neg.topicId) || TOPIC_TYPES[7]) : TOPIC_TYPES[7];
  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;">
    <div style="font-size:3rem;margin-bottom:20px;animation:float 4s ease-in-out infinite;">⚖️</div>
    <div style="font-family:var(--font-display);font-size:2rem;font-weight:300;color:var(--espresso);margin-bottom:8px;" class="a1">
      Parlay <em style="color:var(--terra)">sent</em>
    </div>
    <div style="font-size:.85rem;color:var(--muted);line-height:1.7;max-width:260px;margin:0 auto 8px;" class="a2">
      Your position has been filtered and forwarded. Your partner will see a proposal — not your raw words.
    </div>
    ${neg ? `<div style="font-size:.75rem;color:var(--muted);background:var(--parchment);border-radius:var(--r-pill);padding:5px 14px;margin-bottom:28px;" class="a2">${topic.icon} ${neg.title}</div>` : '<div style="margin-bottom:28px;"></div>'}
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;" class="a3">
      <button onclick="Router.navigate('plan')" style="width:100%;padding:15px;background:var(--espresso);color:var(--cream);border:none;border-radius:14px;font-family:var(--font-body);font-size:.9rem;font-weight:600;cursor:pointer;">View All Plans →</button>
      <button onclick="Router.navigate('home')" style="width:100%;padding:12px;background:none;color:var(--muted);border:1px solid var(--border);border-radius:14px;font-family:var(--font-body);font-size:.82rem;cursor:pointer;">Back to Home</button>
    </div>
  </div>`;
});

/* ================================================
   MODULE: PARLAY DETAIL
   Both spouses — shows the conversation thread, filtered message,
   date options, partner reply, and proposal.
   Recipient sees a "Reply" CTA when status = pending_partner.
   Initiator sees "Generate Proposal" when status = partner_replied.
   ================================================ */
Router.register('parlay-detail', ({ negId } = {}) => {
  const neg = negId ? MediatorState.find(negId) : null;
  if (!neg) return `<div style="padding:60px 24px;text-align:center;font-family:var(--font-display);font-size:1.2rem;color:var(--espresso);">Parlay not found<br><br><button onclick="Router.navigate('plan')" style="margin-top:8px;padding:10px 20px;border:1px solid var(--border);border-radius:10px;background:none;cursor:pointer;font-family:var(--font-body);">‹ Back</button></div>`;

  const topic = TOPIC_TYPES.find(t => t.id === neg.topicId) || TOPIC_TYPES[7];
  const view  = State.get('currentView') || 'user';
  const myRole = (SupabaseDB.configured && SupabaseDB.getMyRole) ? SupabaseDB.getMyRole() : (view === 'partner' ? 'partner' : 'user');
  const myName      = (SupabaseDB.configured ? SupabaseDB.getMyName()      : null) || (myRole === 'partner' ? State.get('partner')?.name : State.get('user')?.name) || 'You';
  const partnerName = (SupabaseDB.configured ? SupabaseDB.getPartnerName() : null) || (myRole === 'partner' ? State.get('user')?.name    : State.get('partner')?.name) || 'Partner';

  const iAmCreator   = neg.createdBy === myRole;
  const iAmRecipient = !iAmCreator;
  const creatorName  = neg.createdBy === myRole ? myName : partnerName;
  const recipName    = neg.createdBy === myRole ? partnerName : myName;

  const statusColor = { pending_partner:'#E8B88A', partner_replied:'#7A6A9B', active:'#C4714A', resolved:'#7A9E8A', countered:'#9B6B8A' };
  const sc = statusColor[neg.status] || '#9B8880';

  // Date options renderer
  const dateOptionsHtml = (neg.dateOptions && neg.dateOptions.length > 0) ? `
    <div style="margin-top:12px;">
      <div style="font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">📅 Proposed dates</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${neg.dateOptions.map(o => {
          const d = new Date(o.date + 'T12:00:00');
          const label = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
          const isSelected = neg.partnerDateResponse === o.id;
          return `<div class="date-option-card${isSelected ? ' selected' : ''}" data-opt-id="${o.id}"
            style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1.5px solid ${isSelected ? 'var(--sage)' : 'var(--border)'};border-radius:12px;background:${isSelected ? '#EDF4F0' : 'var(--surface)'};cursor:${iAmRecipient && neg.status === 'pending_partner' ? 'pointer' : 'default'};">
            <div>
              <div style="font-size:.88rem;font-weight:600;color:var(--espresso);">${label}</div>
              ${o.timeLabel ? `<div style="font-size:.72rem;color:var(--muted);">${o.timeLabel}</div>` : ''}
            </div>
            ${isSelected ? `<span style="font-size:.72rem;font-weight:700;color:var(--sage);">✓ Selected</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  // Proposal block
  let proposalHtml = '';
  if (neg.proposal) {
    let p;
    try { p = typeof neg.proposal === 'string' ? JSON.parse(neg.proposal) : neg.proposal; } catch { p = null; }
    const proposalText = p?.proposal || (typeof neg.proposal === 'string' ? neg.proposal : '');
    const reasoning    = p?.reasoning || '';
    const uConc        = p?.userConcession || '';
    const pConc        = p?.partnerConcession || '';
    proposalHtml = `
    <div style="margin-top:16px;padding:16px;background:linear-gradient(135deg,rgba(122,106,155,.08),rgba(122,158,138,.06));border:1.5px solid rgba(122,106,155,.25);border-radius:16px;">
      <div style="font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7A6A9B;margin-bottom:8px;">⚖️ Parlay's Proposal</div>
      <div style="font-size:.88rem;color:var(--espresso);line-height:1.65;margin-bottom:${reasoning?'12px':'0'}">${proposalText}</div>
      ${reasoning ? `<div style="font-size:.76rem;color:var(--muted);line-height:1.55;padding-top:10px;border-top:1px solid rgba(122,106,155,.15);font-style:italic;">${reasoning}</div>` : ''}
      ${(uConc || pConc) ? `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
        ${uConc ? `<div style="padding:10px;background:rgba(196,113,74,.07);border-radius:10px;"><div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--terra);margin-bottom:4px;">${creatorName} gives</div><div style="font-size:.78rem;color:var(--espresso);line-height:1.5;">${uConc}</div></div>` : ''}
        ${pConc ? `<div style="padding:10px;background:rgba(122,158,138,.07);border-radius:10px;"><div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sage);margin-bottom:4px;">${recipName} gives</div><div style="font-size:.78rem;color:var(--espresso);line-height:1.5;">${pConc}</div></div>` : ''}
      </div>` : ''}
    </div>`;
  }

  // Action area
  let actionHtml = '';
  if (neg.status === 'pending_partner' && iAmRecipient) {
    actionHtml = `
      <button onclick="Router.navigate('parlay-reply',{negId:'${neg.id}'})"
        style="width:100%;padding:16px;background:var(--espresso);color:var(--cream);border:none;border-radius:14px;font-family:var(--font-body);font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:10px;">
        Share your position →
      </button>`;
  } else if (neg.status === 'partner_replied' && iAmCreator) {
    actionHtml = `
      <button id="generate-proposal-btn"
        style="width:100%;padding:16px;background:linear-gradient(135deg,#4A3568,#7A6A9B);color:#fff;border:none;border-radius:14px;font-family:var(--font-body);font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:10px;">
        <span id="proposal-btn-text">⚖️ Generate Parlay Proposal</span>
      </button>`;
  } else if (neg.status === 'resolved') {
    actionHtml = `<div style="text-align:center;padding:12px;font-size:.82rem;color:var(--sage);font-weight:600;">✓ Resolved</div>`;
  }

  return `
  <div style="min-height:100dvh;padding:0 20px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom));overflow-y:auto;">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;" class="a1">
      <button onclick="Router.navigate('plan')" style="padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:none;font-family:var(--font-body);font-size:.82rem;color:var(--espresso);cursor:pointer;">‹ Plans</button>
      <button onclick="MediatorView.manage('${neg.id}')" style="padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:none;font-family:var(--font-body);font-size:.75rem;color:var(--muted);cursor:pointer;">⋯ Manage</button>
    </div>

    <!-- Topic identity -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;" class="a2">
      <div style="width:48px;height:48px;border-radius:14px;background:${topic.color}18;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;">${topic.icon}</div>
      <div>
        <div style="font-family:var(--font-display);font-size:1.35rem;font-weight:400;color:var(--espresso);">${neg.title}</div>
        <div style="font-size:.72rem;color:var(--muted);">${neg.date} · ${creatorName} started this</div>
      </div>
    </div>

    <!-- Status -->
    <div style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:${sc}18;border:1px solid ${sc}44;border-radius:var(--r-pill);margin-bottom:20px;" class="a2">
      <div style="width:6px;height:6px;border-radius:50%;background:${sc};"></div>
      <div style="font-size:.72rem;font-weight:700;color:${sc};">${{ pending_partner:'Awaiting your partner', partner_replied:'Partner has replied', active:'In progress', resolved:'Resolved', countered:'Countered' }[neg.status] || neg.status}</div>
    </div>

    <!-- Creator's filtered message -->
    <div style="margin-bottom:16px;" class="a3">
      <div style="font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">${creatorName}'s position</div>
      <div style="padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;">
        <div style="font-size:.88rem;color:var(--espresso);line-height:1.65;">${neg.filteredInput || neg.rawInput || ''}</div>
        <div style="font-size:.62rem;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:4px;"><span style="color:var(--sage);">✓</span> Tone-filtered by Parlay</div>
      </div>
      ${dateOptionsHtml}
    </div>

    <!-- Partner's reply (if exists) -->
    ${neg.partnerFilteredReply ? `
    <div style="margin-bottom:16px;" class="a4">
      <div style="font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">${recipName}'s response</div>
      <div style="padding:14px 16px;background:var(--surface);border:1px solid rgba(122,106,155,.25);border-radius:14px;">
        <div style="font-size:.88rem;color:var(--espresso);line-height:1.65;">${neg.partnerFilteredReply}</div>
        <div style="font-size:.62rem;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:4px;"><span style="color:var(--sage);">✓</span> Tone-filtered by Parlay</div>
      </div>
    </div>` : ''}

    <!-- Proposal -->
    ${proposalHtml ? `<div class="a5">${proposalHtml}</div>` : ''}

    <!-- Actions -->
    <div style="margin-top:20px;" class="a6">${actionHtml}</div>

    <!-- Manage link -->
    <div style="text-align:center;margin-top:12px;">
      <button onclick="MediatorView.manage('${neg.id}')" style="font-size:.75rem;color:var(--muted);background:none;border:none;cursor:pointer;padding:8px;">Archive or delete this parlay</button>
    </div>

  </div>`;
}, (el, { negId } = {}) => {
  const neg = negId ? MediatorState.find(negId) : null;
  if (!neg) return;

  const view   = State.get('currentView') || 'user';
  const myRole = (SupabaseDB.configured && SupabaseDB.getMyRole) ? SupabaseDB.getMyRole() : (view === 'partner' ? 'partner' : 'user');
  const iAmCreator = neg.createdBy === myRole;

  // Date option selection (only active when recipient and pending)
  if (!iAmCreator && neg.status === 'pending_partner') {
    el.querySelectorAll('.date-option-card').forEach(card => {
      card.addEventListener('click', () => {
        const optId = card.dataset.optId;
        el.querySelectorAll('.date-option-card').forEach(c => {
          const sel = c.dataset.optId === optId;
          c.style.borderColor = sel ? 'var(--sage)' : 'var(--border)';
          c.style.background  = sel ? '#EDF4F0' : 'var(--surface)';
          const badge = c.querySelector('span[style*="color:var(--sage)"]');
          if (sel && !badge) {
            const b = document.createElement('span');
            b.style.cssText = 'font-size:.72rem;font-weight:700;color:var(--sage);';
            b.textContent = '✓ Selected';
            c.appendChild(b);
          } else if (!sel && badge) badge.remove();
        });
        // Store selection on neg for use when reply is submitted
        MediatorState.update(neg.id, { partnerDateResponse: optId });
      });
    });
  }

  // Generate proposal button (creator, after partner replied)
  const genBtn = el.querySelector('#generate-proposal-btn');
  if (genBtn) {
    genBtn.addEventListener('click', async () => {
      const btnText = genBtn.querySelector('#proposal-btn-text');
      genBtn.disabled = true;
      btnText.textContent = 'Generating proposal…';

      const user    = State.get('user');
      const partner = State.get('partner');
      const tone    = State.get('mediatorTone') || 'neutral';
      const myName      = (SupabaseDB.configured ? SupabaseDB.getMyName()      : null) || (myRole === 'partner' ? partner?.name : user?.name) || 'You';
      const partnerName = (SupabaseDB.configured ? SupabaseDB.getPartnerName() : null) || (myRole === 'partner' ? user?.name    : partner?.name) || 'Partner';

      const creatorName = neg.createdBy === myRole ? myName : partnerName;
      const recipName   = neg.createdBy === myRole ? partnerName : myName;

      try {
        const raw = await generateProposal(
          neg.title,
          neg.filteredInput || neg.rawInput,
          neg.partnerFilteredReply || neg.partnerRawReply,
          creatorName, recipName, tone, neg.intentContext || ''
        );
        const parsed = parseProposal(raw);
        MediatorState.update(neg.id, { proposal: JSON.stringify(parsed), status: 'active' });
        Router.navigate('parlay-detail', { negId: neg.id });
      } catch (err) {
        console.error('[Parlay] generateProposal failed:', err);
        genBtn.disabled = false;
        btnText.textContent = '⚖️ Generate Parlay Proposal';
        U.toast('Could not reach AI right now — try again in a moment');
      }
    });
  }
});

/* ================================================
   MODULE: PARLAY REPLY
   Spouse 2 (recipient) shares their position.
   Raw text → AI filter → saved to neg → status → partner_replied
   ================================================ */
Router.register('parlay-reply', ({ negId } = {}) => {
  const neg = negId ? MediatorState.find(negId) : null;
  if (!neg) return `<div style="padding:60px 24px;text-align:center;">Parlay not found.<br><button onclick="Router.navigate('plan')" style="margin-top:16px;padding:10px 20px;border:1px solid var(--border);border-radius:10px;background:none;cursor:pointer;font-family:var(--font-body);">‹ Back</button></div>`;

  const topic = TOPIC_TYPES.find(t => t.id === neg.topicId) || TOPIC_TYPES[7];
  const view  = State.get('currentView') || 'user';
  const myRole = (SupabaseDB.configured && SupabaseDB.getMyRole) ? SupabaseDB.getMyRole() : (view === 'partner' ? 'partner' : 'user');
  const myName      = (SupabaseDB.configured ? SupabaseDB.getMyName()      : null) || (myRole === 'partner' ? State.get('partner')?.name : State.get('user')?.name) || 'You';
  const creatorName = neg.createdBy === myRole
    ? myName
    : ((SupabaseDB.configured ? SupabaseDB.getPartnerName() : null) || (myRole === 'partner' ? State.get('user')?.name : State.get('partner')?.name) || 'Partner');

  const hasDateOptions = neg.dateOptions && neg.dateOptions.length > 0;

  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(48px,env(safe-area-inset-bottom));overflow-y:auto;">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;" class="a1">
      <button onclick="Router.navigate('parlay-detail',{negId:'${neg.id}'})" style="padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:none;font-family:var(--font-body);font-size:.82rem;color:var(--espresso);cursor:pointer;">‹ Back</button>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:1.2rem;">${topic.icon}</span>
        <span style="font-family:var(--font-display);font-size:1.1rem;">${topic.label}</span>
      </div>
    </div>

    <!-- What they said (filtered) -->
    <div style="background:var(--espresso);border-radius:18px;padding:18px;margin-bottom:24px;position:relative;overflow:hidden;" class="a2">
      <div style="position:absolute;top:-20px;right:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none;"></div>
      <div style="font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,184,138,.7);margin-bottom:8px;">${creatorName}'s position</div>
      <div style="font-size:.85rem;color:rgba(250,246,241,.88);line-height:1.65;font-style:italic;">"${neg.filteredInput || neg.rawInput || ''}"</div>
      ${hasDateOptions ? `
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);">
        <div style="font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,184,138,.6);margin-bottom:8px;">📅 Proposed dates</div>
        <div style="display:flex;flex-direction:column;gap:6px;" id="reply-date-opts">
          ${neg.dateOptions.map(o => {
            const d = new Date(o.date + 'T12:00:00');
            const label = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
            const isSelected = neg.partnerDateResponse === o.id;
            return `<div class="reply-date-card" data-opt-id="${o.id}"
              style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:1.5px solid ${isSelected?'rgba(122,158,138,.6)':'rgba(255,255,255,.15)'};border-radius:10px;cursor:pointer;background:${isSelected?'rgba(122,158,138,.15)':'rgba(255,255,255,.05)'};transition:all .15s;">
              <div>
                <div style="font-size:.82rem;font-weight:600;color:rgba(250,246,241,.9);">${label}</div>
                ${o.timeLabel ? `<div style="font-size:.68rem;color:rgba(250,246,241,.5);">${o.timeLabel}</div>` : ''}
              </div>
              <div class="date-check" style="width:18px;height:18px;border-radius:50%;border:2px solid ${isSelected?'rgba(122,158,138,.8)':'rgba(255,255,255,.25)'};background:${isSelected?'rgba(122,158,138,.4)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:.7rem;color:rgba(122,158,138,1);">${isSelected?'✓':''}</div>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}
    </div>

    <!-- My position -->
    <div class="a3" style="margin-bottom:16px;">
      <div style="font-family:var(--font-display);font-size:1.7rem;font-weight:300;color:var(--espresso);margin-bottom:6px;">Your <em style="color:var(--terra)">position</em></div>
      <div style="font-size:.8rem;color:var(--muted);line-height:1.6;">Be honest — Parlay will filter everything before ${creatorName} sees it.</div>
    </div>

    <div class="input-wrap a4" style="margin-bottom:16px;">
      <label class="input-label">What do you want or need? <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">speak freely</span></label>
      <textarea id="reply-main" class="input" rows="4" placeholder="e.g. That works for me but I need to know the details earlier so I can plan around it." style="resize:none;line-height:1.6;"></textarea>
    </div>

    <div style="background:var(--parchment);border-radius:var(--r-md);padding:12px 14px;margin-bottom:20px;" class="a4">
      <div style="font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:4px;">🔒 Private until filtered</div>
      <div style="font-size:.76rem;color:var(--muted);line-height:1.5;">${creatorName} only sees Parlay's rewrite — not your raw words.</div>
    </div>

    <button class="btn btn-accent btn-full" id="reply-submit-btn" style="border-radius:var(--r-md);">
      <span id="reply-btn-text">Send my position →</span>
    </button>
    <button class="btn btn-muted btn-full" style="font-size:.82rem;margin-top:10px;" onclick="Router.navigate('parlay-detail',{negId:'${neg.id}'})">Cancel</button>

  </div>`;
}, (el, { negId } = {}) => {
  const neg = negId ? MediatorState.find(negId) : null;
  if (!neg) return;

  const view   = State.get('currentView') || 'user';
  const myRole = (SupabaseDB.configured && SupabaseDB.getMyRole) ? SupabaseDB.getMyRole() : (view === 'partner' ? 'partner' : 'user');

  // Date option selection
  el.querySelectorAll('.reply-date-card').forEach(card => {
    card.addEventListener('click', () => {
      const optId = card.dataset.optId;
      el.querySelectorAll('.reply-date-card').forEach(c => {
        const sel = c.dataset.optId === optId;
        c.style.borderColor = sel ? 'rgba(122,158,138,.6)' : 'rgba(255,255,255,.15)';
        c.style.background  = sel ? 'rgba(122,158,138,.15)' : 'rgba(255,255,255,.05)';
        const check = c.querySelector('.date-check');
        if (check) { check.style.background = sel ? 'rgba(122,158,138,.4)' : 'transparent'; check.textContent = sel ? '✓' : ''; check.style.borderColor = sel ? 'rgba(122,158,138,.8)' : 'rgba(255,255,255,.25)'; }
      });
      MediatorState.update(neg.id, { partnerDateResponse: optId });
    });
  });

  // Submit
  el.querySelector('#reply-submit-btn').addEventListener('click', async () => {
    const raw = el.querySelector('#reply-main').value.trim();
    if (!raw) { U.toast('Share your position first'); return; }

    const user    = State.get('user');
    const partner = State.get('partner');
    const tone    = State.get('mediatorTone') || 'neutral';
    const myName  = (SupabaseDB.configured ? SupabaseDB.getMyName() : null) || (myRole === 'partner' ? partner?.name : user?.name) || 'You';

    const btn     = el.querySelector('#reply-submit-btn');
    const btnText = el.querySelector('#reply-btn-text');
    btn.disabled = true; btnText.textContent = 'Filtering your message…';

    let filtered;
    try {
      filtered = await runToneFilter(raw, myName, tone, neg.intentContext || '');
    } catch (err) {
      console.error('[Parlay] reply filter failed:', err);
      btn.disabled = false; btnText.textContent = 'Send my position →';
      U.toast(err.name === 'AbortError' ? 'Request timed out — try again' : 'Couldn\u2019t reach AI right now — try again');
      return;
    }

    MediatorState.update(neg.id, {
      partnerRawReply:      raw,
      partnerFilteredReply: filtered,
      status:               'partner_replied',
    });

    Router.navigate('parlay-detail', { negId: neg.id });
    U.toast('Position sent \u2714');
  });
});

Router.register('family-setup', familySetupScreen, (el) => {
  function toggleForm(formId, btnId, cancelId) {
    const form = el.querySelector(`#${formId}`);
    el.querySelector(`#${btnId}`)?.addEventListener('click', () => {
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    });
    el.querySelector(`#${cancelId}`)?.addEventListener('click', () => {
      form.style.display = 'none';
    });
  }
  toggleForm('add-kid-form', 'add-kid-btn', 'cancel-kid-btn');
  toggleForm('add-provider-form', 'add-provider-btn', 'cancel-provider-btn');
  toggleForm('add-playdate-form', 'add-playdate-btn', 'cancel-playdate-btn');

  // Helper: rebuild a list section in-place after add/delete
  function rebuildKidsList() {
    const family = State.get('family');
    const list = el.querySelector('#kids-list');
    if (!list) return;
    if (family.kids.length === 0) {
      list.innerHTML = '<div style="padding:16px;background:var(--parchment);border-radius:var(--r-md);text-align:center;font-size:.82rem;color:var(--muted);">No children added yet</div>';
    } else {
      list.innerHTML = family.kids.map(k => `
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);">
          <div style="width:40px;height:40px;border-radius:50%;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;">👧</div>
          <div style="flex:1;">
            <div style="font-size:.9rem;font-weight:600;color:var(--espresso);">${k.name}</div>
            <div style="font-size:.72rem;color:var(--muted);">${k.age ? 'Age ' + k.age : ''}${k.age && k.pronoun ? ' · ' : ''}${k.pronoun || ''}</div>
          </div>
          <button onclick="FamilySetup.deleteKid('${k.id}')" style="border:none;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:12px 10px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;">✕</button>
        </div>`).join('');
    }
  }

  // Save kid — stay in form, clear fields
  el.querySelector('#save-kid-btn')?.addEventListener('click', () => {
    const nameEl = el.querySelector('#kid-name');
    const name = nameEl?.value.trim();
    if (!name) { U.toast('Enter the child\'s name'); nameEl?.focus(); return; }
    const age = el.querySelector('#kid-age')?.value;
    const pronoun = el.querySelector('#kid-gender')?.value;
    const family = State.get('family');
    const kidObj = { id: 'kid_' + Date.now(), name, age, pronoun };
    family.kids.push(kidObj);
    State.set('family', family);
    SupabaseDB.saveFamilyMember('kid', kidObj).catch(() => {});
    U.toast(name + ' added ✓');
    // Clear fields, keep form open
    if (nameEl) nameEl.value = '';
    const ageEl = el.querySelector('#kid-age'); if (ageEl) ageEl.value = '';
    const gEl = el.querySelector('#kid-gender'); if (gEl) gEl.value = '';
    nameEl?.focus();
    rebuildKidsList();
  });

  // Save provider
  el.querySelector('#save-provider-btn')?.addEventListener('click', () => {
    const nameEl = el.querySelector('#prov-name');
    const name = nameEl?.value.trim();
    const type = el.querySelector('#prov-type')?.value;
    if (!name) { U.toast('Enter a provider name'); nameEl?.focus(); return; }
    const contact = el.querySelector('#prov-contact')?.value.trim();
    const notes = el.querySelector('#prov-notes')?.value.trim();
    const kidIds = [...el.querySelectorAll('.prov-kid-check:checked')].map(c => c.value);
    const family = State.get('family');
    const kidsFor = family.kids.filter(k => kidIds.includes(k.id)).map(k => k.name);
    const provObj = { id: 'prov_' + Date.now(), name, type, contact, notes, kidsFor };
    family.providers.push(provObj);
    State.set('family', family);
    SupabaseDB.saveFamilyMember('provider', provObj).catch(() => {});
    U.toast(name + ' added ✓');
    // Hide form, clear fields
    const form = el.querySelector('#add-provider-form');
    if (form) form.style.display = 'none';
    [nameEl, el.querySelector('#prov-contact'), el.querySelector('#prov-notes')].forEach(f => { if(f) f.value=''; });
    const tEl = el.querySelector('#prov-type'); if(tEl) tEl.value='';
    el.querySelectorAll('.prov-kid-check').forEach(c => c.checked = false);
    // Rebuild providers list in-place
    const pList = el.querySelector('#providers-list');
    if (pList) {
      pList.innerHTML = family.providers.map(p => `
        <div style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);">
          <div style="width:40px;height:40px;border-radius:12px;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;">📋</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:.9rem;font-weight:600;color:var(--espresso);">${p.name}</div>
            <div style="font-size:.72rem;color:var(--terra);margin-top:1px;">${p.type || 'Provider'}</div>
            ${p.contact ? '<div style="font-size:.72rem;color:var(--muted);margin-top:2px;">📞 ' + p.contact + '</div>' : ''}
          </div>
          <button onclick="FamilySetup.deleteProvider('${p.id}')" style="border:none;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:12px 10px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;">✕</button>
        </div>`).join('');
    }
  });

  // Save playdate
  el.querySelector('#save-playdate-btn')?.addEventListener('click', () => {
    const pnEl = el.querySelector('#pd-parent-name');
    const parentName = pnEl?.value.trim();
    if (!parentName) { U.toast('Enter the parent\'s name'); pnEl?.focus(); return; }
    const childName = el.querySelector('#pd-child-name')?.value.trim();
    const contact = el.querySelector('#pd-contact')?.value.trim();
    const notes = el.querySelector('#pd-notes')?.value.trim();
    const family = State.get('family');
    const pdObj = { id: 'pd_' + Date.now(), parentName, childName, contact, notes };
    family.playdateContacts.push(pdObj);
    State.set('family', family);
    SupabaseDB.saveFamilyMember('playdate_contact', pdObj).catch(() => {});
    U.toast(parentName + ' added ✓');
    // Hide form, clear fields
    const form = el.querySelector('#add-playdate-form');
    if (form) form.style.display = 'none';
    [pnEl, el.querySelector('#pd-child-name'), el.querySelector('#pd-contact'), el.querySelector('#pd-notes')].forEach(f => { if(f) f.value=''; });
    // Rebuild list
    const dList = el.querySelector('#playdate-list');
    if (dList) {
      dList.innerHTML = family.playdateContacts.map(c => `
        <div style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);">
          <div style="width:40px;height:40px;border-radius:50%;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;">👨‍👩‍👦</div>
          <div style="flex:1;">
            <div style="font-size:.9rem;font-weight:600;color:var(--espresso);">${c.parentName}</div>
            <div style="font-size:.72rem;color:var(--muted);">Parent of ${c.childName || '—'}</div>
            ${c.contact ? '<div style="font-size:.72rem;color:var(--muted);margin-top:2px;">📞 ' + c.contact + '</div>' : ''}
          </div>
          <button onclick="FamilySetup.deletePlaydate('${c.id}')" style="border:none;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:12px 10px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;">✕</button>
        </div>`).join('');
    }
  });
});

// Global delete handlers (called from inline onclick)
const FamilySetup = {
  deleteKid(id) {
    const f    = State.get('family');
    const item = f.kids.find(k => k.id === id);
    if (!item) return;
    f.kids = f.kids.filter(k => k.id !== id);
    State.set('family', f);
    SupabaseDB.deleteFamilyMember(id).catch(() => {});
    Router.navigate('family-setup');
    U.toastUndo(`${item.name} removed`, () => {
      const f2 = State.get('family');
      f2.kids = [...f2.kids, item];
      State.set('family', f2);
      SupabaseDB.saveFamilyMember('kid', item).catch(() => {});
      Router.navigate('family-setup');
    });
  },
  deleteProvider(id) {
    const f    = State.get('family');
    const item = f.providers.find(p => p.id === id);
    if (!item) return;
    f.providers = f.providers.filter(p => p.id !== id);
    State.set('family', f);
    SupabaseDB.deleteFamilyMember(id).catch(() => {});
    Router.navigate('family-setup');
    U.toastUndo(`${item.name} removed`, () => {
      const f2 = State.get('family');
      f2.providers = [...f2.providers, item];
      State.set('family', f2);
      SupabaseDB.saveFamilyMember('provider', item).catch(() => {});
      Router.navigate('family-setup');
    });
  },
  deletePlaydate(id) {
    const f    = State.get('family');
    const item = f.playdateContacts.find(c => c.id === id);
    if (!item) return;
    f.playdateContacts = f.playdateContacts.filter(c => c.id !== id);
    State.set('family', f);
    SupabaseDB.deleteFamilyMember(id).catch(() => {});
    Router.navigate('family-setup');
    U.toastUndo(`${item.parentName} removed`, () => {
      const f2 = State.get('family');
      f2.playdateContacts = [...f2.playdateContacts, item];
      State.set('family', f2);
      SupabaseDB.saveFamilyMember('playdate_contact', item).catch(() => {});
      Router.navigate('family-setup');
    });
  }
};


/* ================================================

/* ---- Shared helpers ---- */
function _setupCompletion() {
  const view     = State.get('currentView') || 'user';
  const myRole   = view === 'partner' ? 'partner' : 'user';
  const cp       = State.get('commPrefs') || {};
  const mySelf   = cp[myRole]?.self || {};   // my self-report only
  const ll       = State.get('loveLanguage') || {};
  const family   = State.get('family') || {};
  const tone     = State.get('mediatorTone') || '';

  const mySelfCount = (mySelf.traits||[]).length;

  return {
    loveLanguage: { done: !!ll.primary, count: ll.primary ? 1 : 0 },
    myComm:       { done: mySelfCount > 0, count: mySelfCount },
    tone:         { done: !!tone && !!localStorage.getItem('parlay_tone_set'), label: tone },
    family:       { done: (family.kids||[]).length > 0, count: (family.kids||[]).length,
                    hasProviders: (family.providers||[]).length > 0,
                    hasPlaydates: (family.playdateContacts||[]).length > 0 },
  };
}

// Returns the first incomplete setup section for the current viewer, or null if all done
function _nextIncomplete(skipRoute) {
  const c = _setupCompletion();
  const order = [
    { key: 'myComm',       route: 'setup-my-comm',       label: 'Your communication style' },
    { key: 'tone',         route: 'setup-tone',          label: 'Mediator tone' },
    { key: 'loveLanguage', route: 'setup-love-language', label: 'Your love language' },
    { key: 'family',       route: 'family-setup',        label: 'Family setup' },
  ];
  return order.find(s => s.route !== skipRoute && !(c[s.key]?.done)) || null;
}

function _statusPill(done, label) {
  if (done) return `<span style="font-size:.62rem;font-weight:700;color:var(--sage);background:rgba(122,158,138,.14);padding:3px 10px;border-radius:20px;white-space:nowrap;">${label || '✓ Done'}</span>`;
  // Fixed contrast: solid background so terra text passes 4.5:1
  return `<span style="font-size:.62rem;font-weight:700;color:#fff;background:var(--terra);padding:3px 10px;border-radius:20px;white-space:nowrap;">Set up →</span>`;
}

function _setupRow(icon, title, sub, done, doneLabel, route) {
  return `
  <div onclick="Router.navigate('${route}')"
       style="display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--surface);border:1.5px solid ${done ? 'var(--border)' : 'rgba(196,113,74,.25)'};border-radius:16px;cursor:pointer;transition:transform .1s;"
       onmousedown="this.style.transform='scale(.99)'" onmouseup="this.style.transform=''">
    <div style="width:42px;height:42px;border-radius:12px;background:${done ? 'rgba(122,158,138,.1)' : 'rgba(196,113,74,.08)'};display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">${icon}</div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:.9rem;font-weight:600;color:var(--espresso);margin-bottom:2px;">${title}</div>
