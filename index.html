/* ================================================
   TASKS MODULE — Full Two-Sided Async Flow
   ================================================ */

const TaskState = {
  _data: JSON.parse(localStorage.getItem('parlay_tasks') || '[]'),
  get tasks() { return this._data; },
  save()      { localStorage.setItem('parlay_tasks', JSON.stringify(this._data)); },
  add(t)      { this._data.unshift(t); this.save(); SupabaseDB.saveTask(t).catch(() => {}); },
  get(id)     { return this._data.find(t => t.id === id); },
  update(id, patch) {
    const i = this._data.findIndex(t => t.id === id);
    if (i > -1) { this._data[i] = { ...this._data[i], ...patch, updatedAt: new Date().toISOString() }; this.save(); SupabaseDB.updateTask(id, patch).catch(() => {}); }
  },
  remove(id)  { this._data = this._data.filter(t => t.id !== id); this.save(); SupabaseDB.softDeleteTask(id).catch(() => {}); },
  forView(view) {
    const me   = view === 'partner' ? 'partner' : 'user';
    const them = view === 'partner' ? 'user'    : 'partner';
    return {
      inbox:    this._data.filter(t => t.assignedTo === me && t.status !== 'done'),
      sent:     this._data.filter(t => t.createdBy === me && t.assignedTo === them),
      myAction: this._data.filter(t => t.pendingResponseFrom === me && t.status !== 'done'),
      done:     this._data.filter(t => t.status === 'done'),
    };
  }
};

const TASK_CATEGORIES = [
  { id: 'household',   icon: '🏠', label: 'Household'   },
  { id: 'kids',        icon: '👧', label: 'Kids'         },
  { id: 'errands',     icon: '🛒', label: 'Errands'      },
  { id: 'admin',       icon: '📋', label: 'Admin'        },
  { id: 'maintenance', icon: '🔧', label: 'Fix/Repair'   },
  { id: 'pets',        icon: '🐾', label: 'Pets'         },
  { id: 'other',       icon: '📌', label: 'Other'        },
];

const TASK_PRIORITIES = [
  { id: 'urgent', dot: '#EF4444', label: 'Urgent' },
  { id: 'high',   dot: '#F97316', label: 'High'   },
  { id: 'normal', dot: '#EAB308', label: 'Normal' },
  { id: 'low',    dot: '#3B82F6', label: 'Low'    },
];

function _taskPriDot(pId, size) {
  const p = TASK_PRIORITIES.find(x => x.id === pId) || TASK_PRIORITIES[2];
  const sz = size || 7;
  return `<span style="display:inline-block;width:${sz}px;height:${sz}px;border-radius:50%;background:${p.dot};flex-shrink:0;"></span>`;
}

function _taskStatusChip(status, pendingFrom, view) {
  const me = view === 'partner' ? 'partner' : 'user';
  const needsMe = pendingFrom === me;
  const s = {
    done:             ['✓ Done',        'var(--sage)',  '#7A9E8A18'],
    active:           ['In Progress',   'var(--sage)',  '#7A9E8A18'],
    declined:         ['✗ Declined',    'var(--terra)', '#C4714A18'],
    countered:        ['💬 Suggested',  '#B45309',      '#B4530918'],
    pending_response: needsMe
      ? ['⚡ Your turn',   '#7C3AED', '#7C3AED18']
      : ['⏳ Awaiting',    'var(--muted)', 'var(--parchment)'],
  };
  const [label, color, bg] = s[status] || ['',  'var(--muted)', 'var(--parchment)'];
  return `<span style="font-size:.62rem;font-weight:700;color:${color};background:${bg};padding:2px 8px;border-radius:20px;white-space:nowrap;">${label}</span>`;
}

function _taskCard(task, view, userName, partnerName) {
  const cat      = TASK_CATEGORIES.find(c => c.id === task.categoryId) || TASK_CATEGORIES[6];
  const pri      = TASK_PRIORITIES.find(p => p.id === task.priority)   || TASK_PRIORITIES[2];
  const dueDate  = task.dueDate ? new Date(task.dueDate + 'T12:00:00') : null;
  const isOverdue = dueDate && dueDate < new Date() && task.status !== 'done';
  const dateStr  = dueDate ? dueDate.toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '';
  const fromName = task.createdBy === 'user' ? userName : partnerName;
  const toName   = task.assignedTo === 'user' ? userName : task.assignedTo === 'partner' ? partnerName : 'Either';
  const me       = view === 'partner' ? 'partner' : 'user';
  const iAmAssignee = task.assignedTo === me;
  const byLine   = iAmAssignee ? `From ${fromName}` : `To ${toName}`;
  const chip     = _taskStatusChip(task.status, task.pendingResponseFrom, view);

  return `
    <div onclick="Router.navigate('task-detail',{taskId:'${task.id}'})"
         style="display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid ${isOverdue ? 'rgba(239,68,68,.35)' : 'var(--border)'};border-radius:14px;cursor:pointer;transition:transform .1s,box-shadow .1s;${isOverdue ? 'background:rgba(239,68,68,.03);' : ''}"
         onmousedown="this.style.transform='scale(.99)'" onmouseup="this.style.transform=''">
      <div style="width:38px;height:38px;border-radius:10px;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;">${cat.icon}</div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px;">
          <div style="font-size:.9rem;font-weight:600;color:var(--espresso);line-height:1.3;">${task.title}</div>
          ${_taskPriDot(task.priority, 8)}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:${task.filteredContext?'6px':'0'};">
          ${chip}
          <span style="font-size:.62rem;color:var(--muted);">${byLine}</span>
          ${dateStr ? `<span style="font-size:.62rem;color:${isOverdue ? '#EF4444' : 'var(--muted)'};font-weight:${isOverdue ? '700' : '400'};">${isOverdue ? '⚠️ Overdue · ' : 'by '}${dateStr}</span>` : ''}
        </div>
        ${task.filteredContext ? `<div style="font-size:.75rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-style:italic;">"${task.filteredContext}"</div>` : ''}
      </div>
      <div style="color:var(--muted);font-size:1rem;flex-shrink:0;margin-top:2px;opacity:.5;">›</div>
    </div>`;
}

          ${TASK_CATEGORIES.map((c, i) => `
            <button class="cat-btn" data-id="${c.id}" style="padding:7px 12px;border:1.5px solid ${i===0?'var(--espresso)':'var(--border)'};border-radius:20px;background:${i===0?'var(--espresso)':'var(--surface)'};color:${i===0?'var(--cream)':'var(--espresso)'};font-family:var(--font-body);font-size:.72rem;font-weight:500;cursor:pointer;transition:all .15s;">${c.icon} ${c.label}</button>`).join('')}

      </div>

        <input id="task-due" type="date" class="input" style="font-size:.9rem;">
      </div>

      <!-- Notes -->
      <div>
        <label style="display:block;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;">(optional)</span></label>
        <textarea id="task-notes" class="input" rows="2" placeholder="Links, instructions, any helpful context…" style="resize:none;line-height:1.6;font-size:.88rem;"></textarea>

        <textarea id="task-context" class="input" rows="3" placeholder="Why this matters, any deadline pressure, relevant context. Parlay will tone-filter this before they see it." style="resize:none;line-height:1.6;font-size:.88rem;background:var(--surface);"></textarea>
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px;">
          <div style="width:6px;height:6px;border-radius:50%;background:var(--sage);flex-shrink:0;"></div>
          <div style="font-size:.7rem;color:var(--muted);">Tone-filtered by Parlay before it reaches them</div>
        </div>
      </div>

    </div>

    <div style="margin-top:24px;display:flex;flex-direction:column;gap:10px;" class="a3">
      <button id="save-task-btn" style="width:100%;padding:16px;background:var(--espresso);color:var(--cream);border:none;border-radius:14px;font-family:var(--font-body);font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .15s;">Save Task</button>
      <button onclick="Router.navigate('tasks')" style="width:100%;padding:12px;background:none;color:var(--muted);border:1px solid var(--border);border-radius:14px;font-family:var(--font-body);font-size:.82rem;cursor:pointer;">Cancel</button>
    </div>
  </div>`;
}, (el) => {
  let selectedCat      = 'household';
  let selectedAssign   = 'me';
  let selectedPriority = 'normal';

  const view        = State.get('currentView') || 'user';
  const partner     = State.get('partner');
  const user        = State.get('user');
  const themLabel   = (SupabaseDB.configured ? SupabaseDB.getPartnerName() : null) || (view === 'partner' ? user.name : partner.name) || '';

  el.querySelectorAll('.assign-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedAssign = btn.dataset.id;
      el.querySelectorAll('.assign-btn').forEach(b => {
        const a = b.dataset.id === selectedAssign;
        b.style.borderColor = a ? 'var(--terra)' : 'var(--border)';
        b.style.background  = a ? '#FDF0EA'       : 'var(--surface)';
      });
      el.querySelector('#partner-msg-wrap').style.display = selectedAssign === 'partner' ? 'block' : 'none';
    });
  });

  el.querySelectorAll('.pri-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedPriority = btn.dataset.id;
      el.querySelectorAll('.pri-btn').forEach(b => {
        const a = b.dataset.id === selectedPriority;
        b.style.borderColor = a ? b.dataset.dot : 'var(--border)';
        b.style.background  = a ? b.dataset.dot + '18' : 'var(--surface)';
      });
    });
  });

  el.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedCat = btn.dataset.id;
      el.querySelectorAll('.cat-btn').forEach(b => {
        const a = b.dataset.id === selectedCat;
        b.style.background  = a ? 'var(--espresso)' : 'var(--surface)';
        b.style.color       = a ? 'var(--cream)'    : 'var(--espresso)';
        b.style.borderColor = a ? 'var(--espresso)' : 'var(--border)';
      });
    });
  });

  el.querySelector('#save-task-btn').addEventListener('click', async () => {
    const title  = el.querySelector('#task-title').value.trim();
    if (!title) { U.toast('What needs doing?'); return; }

    const notes  = el.querySelector('#task-notes').value.trim();
    const rawDue = el.querySelector('#task-due').value;
    const rawCtx = el.querySelector('#task-context')?.value.trim() || '';
    const tone   = State.get('mediatorTone') || 'neutral';
    const authorName = (SupabaseDB.configured ? SupabaseDB.getMyName() : null) || (view === 'partner' ? partner.name : user.name) || 'You';

    // Resolve assignedTo to absolute role
    let assignedTo;
    if (selectedAssign === 'me')      assignedTo = view === 'partner' ? 'partner' : 'user';
    else if (selectedAssign === 'partner') assignedTo = view === 'partner' ? 'user' : 'partner';
    else                               assignedTo = 'either';

    const createdBy  = view === 'partner' ? 'partner' : 'user';
    const isSelf     = assignedTo === createdBy || assignedTo === 'either';
    const assigneeRole = isSelf ? null : assignedTo;

    const task = {
      id:          'task_' + Date.now(),
      title, notes,
      categoryId:  selectedCat,
      priority:    selectedPriority,
      dueDate:     rawDue || '',
      assignedTo,
      createdBy,
      status:      isSelf ? 'active' : 'pending_response',
      pendingResponseFrom: isSelf ? null : assignedTo,
      rawContext:      rawCtx,
      filteredContext: '',
      partnerRawResponse: '', partnerFilteredResponse: '', partnerDecision: null,
      creatorRawReply: '', creatorFilteredReply: '', creatorDecision: null,
      createdAt:   new Date().toISOString(),
      updatedAt:   new Date().toISOString(),
      completedAt: '',
    };

    if (rawCtx && !isSelf) {
      const btn = el.querySelector('#save-task-btn');
      btn.textContent = 'Filtering your message…'; btn.disabled = true;
      try {
        const ctx = `TASK ASSIGNMENT: "${title}" | Category: ${selectedCat} | Priority: ${selectedPriority}`;
        task.filteredContext = await runToneFilter(rawCtx, authorName, tone, ctx);
      } catch(e) { task.filteredContext = rawCtx; }
    }

    TaskState.add(task);
    Tasks.updateBadge();

    if (!isSelf) {
      U.toast('Task sent to ' + themLabel + ' 📬');
    } else {
      U.toast('Task added ✓');
    }
    Router.navigate('tasks');
  });
});

/* ---- TASK DETAIL (view + thread + creator actions) ---- */
Router.register('task-detail', (params) => {

  const view        = State.get('currentView') || 'user';
  const user        = State.get('user');
  const partner     = State.get('partner');
  const userName    = (SupabaseDB.configured ? SupabaseDB.getMyName()      : null) || (view === 'partner' ? partner.name : user.name)    || 'You';
  const partnerName = (SupabaseDB.configured ? SupabaseDB.getPartnerName() : null) || (view === 'partner' ? user.name    : partner.name) || '';
  const cat  = TASK_CATEGORIES.find(c => c.id === task.categoryId) || TASK_CATEGORIES[6];

  const them = view === 'partner' ? 'user'    : 'partner';

  const iAmCreator  = task.createdBy  === me;
  const iAmAssignee = task.assignedTo === me;
  const myTurn      = task.pendingResponseFrom === me;

  const creatorName  = task.createdBy  === 'user' ? userName : partnerName;
  const assigneeName = task.assignedTo === 'user' ? userName : task.assignedTo === 'partner' ? partnerName : 'Either';

  // Status banner
  const banners = {
    done:             ['✅', 'Task completed',                             'rgba(122,158,138,.12)', 'rgba(122,158,138,.3)', 'var(--sage)'],

    declined:         ['✗',  `${assigneeName} declined`,                  'rgba(196,113,74,.1)',   'rgba(196,113,74,.25)', 'var(--terra)'],
    countered:        ['💬', `${assigneeName} suggested a change`,        'rgba(180,83,9,.08)',    'rgba(180,83,9,.22)',   '#B45309'],
    pending_response: myTurn
      ? ['⚡', 'Your response needed',               'rgba(124,58,237,.08)', 'rgba(124,58,237,.22)', '#7C3AED']
      : ['⏳', `Waiting for ${assigneeName}`,        'var(--parchment)',      'var(--border)',         'var(--muted)'],
  };
  const [bIcon, bText, bBg, bBorder, bColor] = banners[task.status] || banners.pending_response;
  const statusBanner = `

      <div style="font-size:.85rem;font-weight:600;color:${bColor};">${bText}</div>
    </div>`;

  // Thread messages
  let thread = '';
  const msgCard = (name, color, text, decision) => {
    const decLabel = { accept: '✓ Accepted', decline: '✗ Declined', counter: '💬 Suggested' }[decision] || '';
    return `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">

  } else if (task.status === 'active') {

          <button onclick="Tasks.showPushback('${task.id}')" style="width:100%;padding:13px;background:none;color:var(--terra);border:1.5px solid rgba(196,113,74,.4);border-radius:14px;font-family:var(--font-body);font-size:.88rem;cursor:pointer;">Push back →</button>

      </div>
      ${task.filteredContext ? `
      <div style="background:rgba(255,255,255,.07);border-radius:12px;padding:14px;border-left:3px solid rgba(232,184,138,.5);">
        <div style="font-size:.62rem;font-weight:700;color:rgba(232,184,138,.7);letter-spacing:.08em;margin-bottom:6px;">THEIR MESSAGE</div>
        <div style="font-size:.85rem;color:rgba(250,246,241,.85);line-height:1.58;font-style:italic;">"${task.filteredContext}"</div>
      </div>` : ''}
    </div>

    <!-- Decision -->
    <div style="margin-bottom:20px;" class="a3">
      <div style="font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;">Your decision</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;" id="decision-btns">
        ${[
          { id: 'accept',  icon: '✅', label: 'Accept',  color: 'var(--sage)',  hex: '#7A9E8A' },
          { id: 'decline', icon: '✗',  label: 'Decline', color: 'var(--terra)', hex: '#C4714A' },
          { id: 'counter', icon: '💬', label: 'Suggest', color: '#B45309',      hex: '#B45309' },
        ].map(d => `
          <button class="decision-btn" data-id="${d.id}" data-color="${d.color}" data-hex="${d.hex}"
            style="padding:16px 8px;border:2px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s;font-family:var(--font-body);">
            <span style="font-size:1.4rem;">${d.icon}</span>
            <span style="font-size:.72rem;font-weight:700;color:var(--espresso);">${d.label}</span>
          </button>`).join('')}
      </div>
    </div>

    <!-- Response textarea -->
    <div style="flex:1;margin-bottom:20px;" class="a4">
      <label id="response-label" style="display:block;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;">Add a note <span style="font-weight:400;text-transform:none;letter-spacing:0;">(optional)</span></label>
      <textarea id="reply-text" class="input" rows="4" placeholder="Anything to add? Parlay will tone-filter this before ${creatorName} sees it." style="resize:none;line-height:1.6;font-size:.88rem;"></textarea>
      <div style="display:flex;align-items:center;gap:6px;margin-top:8px;">
        <div style="width:6px;height:6px;border-radius:50%;background:var(--sage);flex-shrink:0;"></div>
        <div style="font-size:.7rem;color:var(--muted);">Tone-filtered by Parlay before ${creatorName} sees it</div>
      </div>
    </div>

    <div class="a5">
      <button id="reply-submit-btn" disabled style="width:100%;padding:16px;background:var(--espresso);color:var(--cream);border:none;border-radius:14px;font-family:var(--font-body);font-size:.9rem;font-weight:600;cursor:pointer;opacity:.45;transition:opacity .2s;">Send Response</button>
    </div>
  </div>`;
}, (el, params) => {
  const task = TaskState.get(params?.taskId);
  if (!task) return;

  let selectedDecision = null;
  const placeholders = {
    accept:  'Anything to add? (optional) — Parlay will soften the delivery.',
    decline: 'Share why — be honest. Parlay will remove any blame or contempt.',
    counter: 'What would work better? Parlay will make the suggestion constructive.',
  };
  const labels = {
    accept:  'Add a note <span style="font-weight:400;text-transform:none;letter-spacing:0;">(optional)</span>',
    decline: 'Your reason <span style="font-weight:400;text-transform:none;letter-spacing:0;">(encouraged)</span>',
    counter: 'Your suggestion',
  };

  el.querySelectorAll('.decision-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedDecision = btn.dataset.id;
      const col = btn.dataset.hex;
      el.querySelectorAll('.decision-btn').forEach(b => {
        const a = b.dataset.id === selectedDecision;
        b.style.borderColor = a ? b.dataset.hex : 'var(--border)';
        b.style.background  = a ? b.dataset.hex + '18' : 'var(--surface)';
      });
      el.querySelector('#reply-text').placeholder = placeholders[selectedDecision];
      el.querySelector('#response-label').innerHTML = labels[selectedDecision];
      const sb = el.querySelector('#reply-submit-btn');
      sb.disabled = false; sb.style.opacity = '1';
    });
  });

  el.querySelector('#reply-submit-btn').addEventListener('click', async () => {
    if (!selectedDecision) { U.toast('Pick Accept, Decline, or Suggest first'); return; }

    const rawReply  = el.querySelector('#reply-text').value.trim();
    const view      = State.get('currentView') || 'user';
    const user      = State.get('user');
    const partner   = State.get('partner');
    const tone      = State.get('mediatorTone') || 'neutral';
    const myName    = (SupabaseDB.configured ? SupabaseDB.getMyName()      : null) || (view === 'partner' ? partner.name : user.name) || 'You';
    const otherName = (SupabaseDB.configured ? SupabaseDB.getPartnerName() : null) || (view === 'partner' ? user.name    : partner.name) || '';

    const btn = el.querySelector('#reply-submit-btn');
    btn.textContent = 'Filtering response…'; btn.disabled = true;

    try {
      let filteredReply;
      if (rawReply) {
        const decisionCtx = selectedDecision === 'accept'
          ? `TASK: "${task.title}" | DECISION: ACCEPTED. The filtered reply MUST clearly confirm acceptance. Any frustration is secondary.`
          : selectedDecision === 'decline'
          ? `TASK: "${task.title}" | DECISION: DECLINED. Preserve the decline clearly. Remove blame, contempt, or harsh language.`
          : `TASK: "${task.title}" | DECISION: COUNTER-SUGGESTION. Make the suggestion clear and constructive.`;
        try {
          filteredReply = await runToneFilter(rawReply, myName, tone, decisionCtx);
        } catch(err) {
          console.error('[Parlay] task reply filter failed:', err);
          btn.textContent = 'Send Response'; btn.disabled = false;
          U.toast('Couldn\'t reach the AI right now. Try again.');
          return;
        }
      } else {
        filteredReply = { accept: `Works for me — I'll take care of it.`, decline: `I'm not able to take this on right now.`, counter: `I'd like to suggest a different approach.` }[selectedDecision];
      }

      const newStatus = { accept: 'active', decline: 'declined', counter: 'countered' }[selectedDecision];
      const newCounterCount = selectedDecision === 'counter' ? (task.counterCount || 0) + 1 : task.counterCount || 0;
      TaskState.update(task.id, {
        partnerRawResponse:      rawReply,
        partnerFilteredResponse: filteredReply,
        partnerDecision:         selectedDecision,
        status:                  newStatus,
        counterCount:            newCounterCount,
        pendingResponseFrom:     selectedDecision === 'accept' ? null : task.createdBy,
      });
      Tasks.updateBadge();

      const toasts = { accept: 'Task accepted ✓', decline: `Response sent to ${otherName}`, counter: `Suggestion sent to ${otherName}` };
      U.toast(toasts[selectedDecision]);
      // If back-and-forth has gone 2+ rounds, nudge toward conversation
      if (selectedDecision === 'counter' && newCounterCount >= 2) {
        setTimeout(() => U.toast('💬 Heads up — this one might need a quick chat to resolve', 4000), 1200);
      }
      Router.navigate('tasks');
    } catch(e) {
      btn.textContent = 'Send Response'; btn.disabled = false;
      U.toast('Something went wrong — try again');
    }
  });
});

/* ---- GLOBAL TASK ACTIONS ---- */
const Tasks = {
  markDone(id) {
    TaskState.update(id, { status: 'done', completedAt: new Date().toISOString(), pendingResponseFrom: null });
    Tasks.updateBadge();
    U.toast('Task done ✓');
    Router.navigate('tasks');
  },
  remove(id) {
    TaskState.remove(id);
    Tasks.updateBadge();
    Router.navigate('tasks');
  },
  delete(id) { Tasks.remove(id); }, // legacy alias
  reassignToSelf(id) {
    const view = State.get('currentView') || 'user';
    const me   = view === 'partner' ? 'partner' : 'user';
    TaskState.update(id, { assignedTo: me, status: 'active', pendingResponseFrom: null });
    Tasks.updateBadge();
    U.toast('Reassigned to you ✓');
    Router.navigate('tasks');
  },
  closeTask(id) {
    TaskState.update(id, { status: 'done', completedAt: new Date().toISOString(), pendingResponseFrom: null });
    Tasks.updateBadge();
    U.toast('Task closed');
    Router.navigate('tasks');
  },
  acceptCounter(id) {
    TaskState.update(id, { status: 'active', pendingResponseFrom: null });
    Tasks.updateBadge();
    U.toast('Counter accepted — task is active ✓');
    Router.navigate('tasks');
  },
  showPushback(id) {
    const wrap = document.getElementById('pushback-wrap');
    if (wrap) wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
  },
  async submitPushback(id) {
    const text = document.getElementById('pushback-text')?.value.trim();
    if (!text) { U.toast('Write your message first'); return; }
    const task = TaskState.get(id);
    if (!task) return;

    const view    = State.get('currentView') || 'user';
    const user    = State.get('user');
    const partner = State.get('partner');
    const tone    = State.get('mediatorTone') || 'neutral';
    const myName  = (SupabaseDB.configured ? SupabaseDB.getMyName() : null) || (view === 'partner' ? partner.name : user.name) || 'You';
    const btn     = document.getElementById('pushback-submit-btn');
    if (btn) { btn.textContent = 'Filtering…'; btn.disabled = true; }

    try {
      const ctx = `TASK FOLLOW-UP: "${task.title}" | The task creator is pushing back on the ${task.status}. Preserve the core position while removing any contempt or blame.`;
      const filtered = await runToneFilter(text, myName, tone, ctx);
      TaskState.update(id, {
        creatorRawReply:      text,
        creatorFilteredReply: filtered,
        status:               'pending_response',
        pendingResponseFrom:  task.assignedTo,
      });
      Tasks.updateBadge();
      U.toast('Pushback sent');
      Router.navigate('tasks');
    } catch(e) {
      if (btn) { btn.textContent = 'Send →'; btn.disabled = false; }
      U.toast('Something went wrong');
    }
  },
  switchToPartner() {
    State.set('currentView', 'partner');
    Router.navigate('tasks');
  },
  toggleDone() {
    const overflow = document.getElementById('done-overflow');
    const btn = document.getElementById('done-toggle-btn');
    if (!overflow) return;
    const showing = overflow.style.display !== 'none';
    overflow.style.display = showing ? 'none' : 'block';
    if (btn) btn.textContent = showing ? 'Show all →' : 'Show less ↑';
  },
  updateBadge() {
    const view = State.get('currentView') || 'user';
    const { myAction } = TaskState.forView(view);
    const badge = document.getElementById('task-nav-badge');
    if (!badge) return;
    if (myAction.length > 0) {
      badge.textContent = myAction.length;
      badge.style.display = 'inline-flex';
    } else {
      badge.style.display = 'none';
    }
  }
};

/* ================================================
   INIT
   ================================================ */
Router.register('equity', () => {
  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;background:var(--parchment);">
    <div style="font-size:3rem;margin-bottom:20px;animation:float 4s ease-in-out infinite;">\u2696\uFE0F</div>
    <div style="font-family:var(--font-display);font-size:1.8rem;font-weight:300;color:var(--espresso);margin-bottom:8px;">Balance &amp; <em style="color:var(--terra)">Equity</em></div>
    <div style="font-size:.85rem;color:var(--muted);line-height:1.7;max-width:280px;margin-bottom:32px;">Full equity tracking coming soon. Use Parlay to negotiate and resolve plans fairly in the meantime.</div>
    <button onclick="Router.navigate('home')" style="padding:14px 28px;background:var(--espresso);color:var(--cream);border:none;border-radius:14px;font-family:var(--font-body);font-size:.9rem;font-weight:600;cursor:pointer;">\u2190 Home</button>
  </div>
  `;
});

window.addEventListener('DOMContentLoaded', async () => {
  State.load();
  Router.init();

  // Register the auth state listener once
  SupabaseDB.initAuthListener();

  // Handle magic link: ?invite=XXXXXX  — stash code and route to auth-join
  const urlParams = new URLSearchParams(window.location.search);
  const inviteParam = urlParams.get('invite');
  if (inviteParam && inviteParam.length === 6) {
    localStorage.setItem('parlay_prefill_invite', inviteParam.toUpperCase());
  }

  // Update streak on open
  try {
    const today = new Date().toDateString();
    const lastOpen = localStorage.getItem('parlay_last_open');
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (lastOpen !== today) {
      const streak = State.get('streak') || 0;
      State.set('streak', lastOpen === yesterday ? streak + 1 : 1);
      localStorage.setItem('parlay_last_open', today);
    }
  } catch(e) {}

  if (SupabaseDB.configured) {
    const app = document.getElementById('app');
    if (app) app.innerHTML = `<div style="height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--espresso);"><div style="font-family:var(--font-display);font-size:2.5rem;font-weight:300;color:var(--cream);">Par<em style="color:var(--amber)">lay</em></div></div>`;

    let result;
    try {
      result = await SupabaseDB.bootstrap();
    } catch(err) {
      console.error('[Parlay] App init bootstrap failed:', err);
      Router.navigate('auth-entry');
      return;
    }

    if (result.mode === 'unauthenticated') {
      const prefill = localStorage.getItem('parlay_prefill_invite');
      Router.navigate(prefill ? 'auth-join' : 'auth-entry');
      return;
    }

    if (result.mode === 'supabase') {
      if (!result.coupled) {
        if (result.onboardingComplete) {
          Router.navigate('ob-connect');
        } else {
          Router.navigate('ob2');
        }
      } else {
        Router.navigate('home');
      }
      return;
    }
  }

  // localStorage-only fallback
  const start = State.get('onboarded') ? 'home' : 'splash';
  Router.navigate(start);
});
</script>
