/* ═══════════════════════════════════════════════════════════════
   CONVERSATION ANALYTICS & RELATIONSHIP TIMELINE
   ═══════════════════════════════════════════════════════════════ */

const ConvoAnalytics = (() => {
  // Analyze conversation patterns over time
  function getTimeline() {
    const parlays = Store.parlays();
    const tasks = Store.tasks();
    const events = [];

    parlays.forEach(p => {
      events.push({
        type: 'parlay',
        subtype: 'created',
        date: p.date || p.createdAt,
        title: p.title,
        status: p.status,
        topicId: p.topicId,
        id: p.id,
        isMine: p.isMine,
      });
      if (p.status === 'resolved') {
        events.push({
          type: 'parlay',
          subtype: 'resolved',
          date: p.resolvedAt || p.date,
          title: p.title,
          id: p.id,
        });
      }
    });

    tasks.forEach(t => {
      events.push({
        type: 'task',
        subtype: 'created',
        date: t.createdAt || t.date,
        title: t.title,
        status: t.status,
        id: t.id,
      });
      if (t.status === 'done') {
        events.push({
          type: 'task',
          subtype: 'completed',
          date: t.completedAt || t.date,
          title: t.title,
          id: t.id,
        });
      }
    });

    // Sort by date descending
    events.sort((a, b) => {
      const da = new Date(a.date || 0);
      const db = new Date(b.date || 0);
      return db - da;
    });

    return events;
  }

  // Topic distribution analysis
  function topicDistribution() {
    const parlays = Store.parlays();
    const dist = {};
    parlays.forEach(p => {
      const tid = p.topicId || 'other';
      dist[tid] = (dist[tid] || 0) + 1;
    });
    return Object.entries(dist)
      .map(([id, count]) => {
        const topic = TOPICS_V2.find(t => t.id === id) || { icon: '📝', label: id };
        return { id, icon: topic.icon, label: topic.label, count };
      })
      .sort((a, b) => b.count - a.count);
  }

  // Resolution rate
  function resolutionRate() {
    const parlays = Store.parlays();
    if (parlays.length === 0) return { rate: 0, resolved: 0, total: 0 };
    const resolved = parlays.filter(p => p.status === 'resolved').length;
    return { rate: parlays.length > 0 ? Math.round((resolved / parlays.length) * 100) : 0, resolved, total: parlays.length };
  }

  // Average response time (mock estimate)
  function avgResponseTime() {
    const parlays = Store.parlays();
    const withResponse = parlays.filter(p => p.partnerRawReply || p.partnerFilteredReply);
    if (withResponse.length === 0) return 'N/A';
    // Estimate based on status transitions (simplified)
    return withResponse.length > 3 ? '< 2 hours' : withResponse.length > 1 ? '< 6 hours' : '< 1 day';
  }

  // Sentiment trajectory over recent parlays
  function sentimentTrajectory() {
    const parlays = Store.parlays().slice(-10);
    return parlays.map(p => {
      let sentiment = 'neutral';
      if (p.status === 'resolved') sentiment = 'positive';
      else if (p.status === 'declined' || p.status === 'counter_proposed') sentiment = 'mixed';
      else if (p.status === 'active' || p.status === 'in_discussion') sentiment = 'engaged';
      return { title: p.title, sentiment, date: p.date };
    });
  }

  // Daily activity heatmap data (last 28 days)
  function activityHeatmap() {
    const days = [];
    const now = new Date();
    const parlays = Store.parlays();
    const tasks = Store.tasks();

    for (let i = 27; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      const dayParlays = parlays.filter(p => (p.date || '').startsWith(dateStr)).length;
      const dayTasks = tasks.filter(t => (t.date || t.createdAt || '').startsWith(dateStr)).length;
      days.push({
        date: dateStr,
        day: d.toLocaleDateString('en-US', { weekday: 'short' }),
        count: dayParlays + dayTasks,
      });
    }
    return days;
  }

  // Win streaks — consecutive days with positive activity
  function winStreaks() {
    const parlays = Store.parlays();
    const resolved = parlays.filter(p => p.status === 'resolved').length;
    const tasks = Store.tasks();
    const done = tasks.filter(t => t.status === 'done').length;
    return {
      resolvedStreak: resolved,
      doneStreak: done,
      totalPositive: resolved + done,
    };
  }

  // Collaboration score — how balanced the relationship is
  function collaborationIndex() {
    const parlays = Store.parlays();
    const tasks = Store.tasks();
    const myInitiated = parlays.filter(p => p.isMine).length;
    const theirInitiated = parlays.filter(p => !p.isMine).length;
    const myTasks = tasks.filter(t => t.assignedTo === 'me').length;
    const theirTasks = tasks.filter(t => t.assignedTo !== 'me').length;

    const total = myInitiated + theirInitiated;
    const balance = total > 0 ? Math.min(myInitiated, theirInitiated) / Math.max(myInitiated, theirInitiated) : 0;
    const taskBalance = (myTasks + theirTasks) > 0 ? Math.min(myTasks, theirTasks) / Math.max(myTasks, theirTasks) : 0;

    const index = Math.round(((balance + taskBalance) / 2) * 100);
    let label = 'Balanced';
    if (index < 30) label = 'One-sided — try initiating more conversations';
    else if (index < 60) label = 'Room to improve — encourage more participation';
    else if (index < 80) label = 'Good balance';
    else label = 'Great teamwork!';

    return { index, label, myInitiated, theirInitiated, myTasks, theirTasks };
  }

  return {
    getTimeline, topicDistribution, resolutionRate, avgResponseTime,
    sentimentTrajectory, activityHeatmap, winStreaks, collaborationIndex,
  };
})();


/* ═══════════════════════════════════════════════════════════════
   APPRECIATION JOURNAL — Gratitude & positive reinforcement
   ═══════════════════════════════════════════════════════════════ */

const AppreciationStore = (() => {
  const KEY = 'parlay_appreciations';

  function _load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
  }
  function _save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  function add(text, category = 'general') {
    const items = _load();
    items.unshift({
      id: 'ap_' + Date.now(),
      text,
      category,
      date: new Date().toISOString(),
      shared: false,
    });
    _save(items);
    NotifStore.add('appreciation', `You noted something you appreciate about ${Auth.theirName()}`, '#/appreciation');
    return items[0];
  }

  function all() { return _load(); }
  function recent(n = 5) { return _load().slice(0, n); }
  function count() { return _load().length; }

  function share(id) {
    const items = _load();
    const item = items.find(i => i.id === id);
    if (item) { item.shared = true; _save(items); }
    return item;
  }

  function todayCount() {
    const today = new Date().toISOString().split('T')[0];
    return _load().filter(a => a.date.startsWith(today)).length;
  }

  function streak() {
    const items = _load();
    if (items.length === 0) return 0;
    let streak = 0;
    const now = new Date();
    for (let i = 0; i < 30; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      if (items.some(a => a.date.startsWith(dateStr))) {
        streak++;
      } else if (i > 0) break;
    }
    return streak;
  }

  const CATEGORIES = [
    { id: 'general', icon: '💛', label: 'General' },
    { id: 'effort', icon: '💪', label: 'Effort' },
    { id: 'kindness', icon: '🤗', label: 'Kindness' },
    { id: 'patience', icon: '🧘', label: 'Patience' },
    { id: 'humor', icon: '😂', label: 'Humor' },
    { id: 'support', icon: '🤝', label: 'Support' },
    { id: 'growth', icon: '🌱', label: 'Growth' },
  ];

  const PROMPTS = [
    "What's something they did today that made you smile?",
    "When did they show you they cared recently?",
    "What quality do you most admire in them right now?",
    "What's a small thing they do that you often forget to thank them for?",
    "When was the last time they surprised you in a good way?",
    "What's something they're really good at that helps your partnership?",
    "What did they handle well recently that you didn't acknowledge?",
    "What effort of theirs do you want to recognize?",
  ];

  function randomPrompt() {
    return PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
  }

  return { add, all, recent, count, share, todayCount, streak, randomPrompt, CATEGORIES };
})();

const SmartSchedule = (() => {
  // Analyze existing date commitments
  function getBusyDates() {
    const parlays = Store.parlays();
    const dates = [];
    parlays.forEach(p => {
      if (p.dateOptions) {
        p.dateOptions.forEach(opt => {
          if (opt.date) dates.push(opt.date);
        });
      }
      if (p.confirmedDate) dates.push(p.confirmedDate);
    });
    const tasks = Store.tasks();
    tasks.forEach(t => {
      if (t.dueDate) dates.push(t.dueDate);
    });
    return [...new Set(dates)].sort();
  }

  // Suggest next available dates
  function suggestDates(count = 3, preferWeekend = false) {
    const busy = new Set(getBusyDates());
    const suggestions = [];
    const now = new Date();

    for (let i = 1; suggestions.length < count && i < 30; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() + i);
      const dateStr = d.toISOString().split('T')[0];
      const dayOfWeek = d.getDay();

      // Skip if busy
      if (busy.has(dateStr)) continue;

      // Weekend preference
      if (preferWeekend && dayOfWeek !== 0 && dayOfWeek !== 6) continue;

      suggestions.push({
        date: dateStr,
        dayName: d.toLocaleDateString('en-US', { weekday: 'long' }),
        formatted: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
        isWeekend: dayOfWeek === 0 || dayOfWeek === 6,
      });
    }

    // Fallback if weekend preference yielded too few
    if (suggestions.length < count && preferWeekend) {
      return suggestDates(count, false);
    }

    return suggestions;
  }

  // Check for conflicts with a proposed date
  function checkConflicts(dateStr) {
    const busy = getBusyDates();
    const conflicts = [];

    if (busy.includes(dateStr)) {
      // Find what's on that date
      Store.parlays().forEach(p => {
        if (p.dateOptions?.some(o => o.date === dateStr) || p.confirmedDate === dateStr) {
          conflicts.push({ type: 'parlay', title: p.title, id: p.id });
        }
      });
      Store.tasks().forEach(t => {
        if (t.dueDate === dateStr) {
          conflicts.push({ type: 'task', title: t.title, id: t.id });
        }
      });
    }

    return conflicts;
  }

  // Get upcoming commitments
  function upcomingCommitments(days = 7) {
    const now = new Date();
    const cutoff = new Date(now);
    cutoff.setDate(cutoff.getDate() + days);
    const commitments = [];

    Store.parlays().forEach(p => {
      if (p.confirmedDate) {
        const d = new Date(p.confirmedDate);
        if (d >= now && d <= cutoff) {
          commitments.push({
            type: 'parlay',
            title: p.title,
            date: p.confirmedDate,
            topicId: p.topicId,
          });
        }
      }
      (p.dateOptions || []).forEach(opt => {
        if (opt.date) {
          const d = new Date(opt.date);
          if (d >= now && d <= cutoff) {
            commitments.push({
              type: 'proposed',
              title: p.title,
              date: opt.date,
              timeLabel: opt.timeLabel,
              topicId: p.topicId,
            });
          }
        }
      });
    });

    Store.tasks().forEach(t => {
      if (t.dueDate) {
        const d = new Date(t.dueDate);
        if (d >= now && d <= cutoff) {
          commitments.push({
            type: 'task',
            title: t.title,
            date: t.dueDate,
            status: t.status,
          });
        }
      }
    });

    commitments.sort((a, b) => new Date(a.date) - new Date(b.date));
    return commitments;
  }

  return { getBusyDates, suggestDates, checkConflicts, upcomingCommitments };
})();

const AIContext = (() => {
  // Build rich context for AI calls
  function buildContext() {
    const parts = [];

    // Communication style
    if (CommProfile.isComplete()) {
      const summary = CommProfile.summary();
      parts.push(`COMMUNICATION STYLE: ${summary}`);
    }

    // Current mood
    const mood = MoodStore.todayMood();
    if (mood) {
      const moodData = MOODS.find(m => m.id === mood.moodId);
      parts.push(`CURRENT MOOD: ${moodData?.label || mood.moodId} (energy: ${moodData?.energy || 3}/5)`);
      if (mood.context) parts.push(`MOOD CONTEXT: ${mood.context}`);
    }

    // Relationship health
    const score = Insights.communicationScore();
    parts.push(`RELATIONSHIP HEALTH SCORE: ${score.score}/100 (${score.label})`);

    // Recent activity summary
    const parlays = Store.parlays();
    const recentResolved = parlays.filter(p => p.status === 'resolved').length;
    const recentPending = parlays.filter(p => p.status === 'pending_partner').length;
    parts.push(`ACTIVITY: ${parlays.length} total plans, ${recentResolved} resolved, ${recentPending} awaiting response`);

    // Appreciation count
    const apCount = AppreciationStore.count();
    if (apCount > 0) parts.push(`APPRECIATIONS LOGGED: ${apCount}`);

    return parts.join('\n');
  }

  // Enhanced tone filter with context — uses deep relationship psychology methodology
  function enhancedToneFilter(rawText, intentContext = '') {
    const ctx = buildContext();
    const tone = Store.get('mediatorTone') || 'neutral';
    const profile = TONES[tone] || TONES.neutral;
    const senderBlock = getSenderPrefsPrompt();
    const recipientBlock = getRecipientPrefsPrompt();

    const systemPrompt = `You are Parlay's Communication Translator — an expert in couples communication grounded in research-backed relationship psychology.

YOUR METHODOLOGY (apply in order):

═══ PHASE 1: DECODE THE MESSAGE ═══

Classify the message into one of these types BEFORE rewriting:

TYPE A — AGREEMENT / ACCEPTANCE: The core is "yes" or acceptance, even wrapped in frustration.
→ Extract the agreement clearly. DROP all venting — the agreement IS the message.

TYPE B — REFUSAL / BOUNDARY / COUNTER: The core is "no" or "not that, but this instead."
→ Preserve the boundary clearly. Remove blame. Soften HOW it's expressed, not WHAT is said.

TYPE C — REQUEST / NEGOTIATION: The speaker wants something that requires coordination.
→ Apply the full framework below.

TYPE D — EMOTIONAL EXPRESSION: Feelings with no clear ask.
→ Distill to the underlying feeling + a brief request to connect. Keep it short.

TYPE E — LOGISTICS / INFORMATION: Neutral factual content (schedules, updates, reminders).
→ Light polish only. Do not over-soften factual messages.

═══ PHASE 2: GOTTMAN FOUR HORSEMEN SCAN (Types B, C, D) ═══

Scan for and transform these destructive patterns:

1. CRITICISM ("You never…" / "You always…" / "What's wrong with you")
   → Convert to SOFT STARTUP: specific behavior + "I feel…" + "I need…"
   → Example: "You never help" → "I've been feeling overwhelmed lately. Could we figure out how to split things up?"

2. CONTEMPT (sarcasm, eye-rolling language, mockery, superiority, name-calling)
   → REMOVE ENTIRELY. Replace with a direct statement of the unmet need.
   → Contempt is the #1 predictor of relationship failure — never soften it, eliminate it.

3. DEFENSIVENESS ("It's not my fault" / "Yeah but you…" / counter-attacking)
   → Convert to OWNERSHIP: acknowledge even a small part, then state your perspective.
   → Example: "That's not fair, you do it too" → "I hear you. I could do better with that. Here's what I was thinking…"

4. STONEWALLING (shutting down, "whatever", "fine", "I don't care")
   → Convert to a REQUEST FOR SPACE framed as care for the relationship.
   → Example: "Whatever, do what you want" → "I need a little time to think about this so I can respond well."

═══ PHASE 3: NVC TRANSLATION (Types C, D) ═══

Extract the hidden structure underneath the raw message:
  Observation (what happened, factually) → Feeling (sender's emotion) → Need (what matters to them) → Request (a specific, doable ask)

CRITICAL RULES:
• NEVER manufacture feelings the sender didn't express or imply.
• NEVER project emotions onto the recipient ("I know you feel…").
• NEVER write empathy statements directed at the partner ("I understand you're busy") — only the sender's perspective.
• NEVER add "I understand" or "I know" as a hedge — it can sound patronizing.

═══ PHASE 4: ATTACHMENT-AWARE FRAMING ═══

Reframe the message to signal safety and connection, not threat:
• Replace DEMANDS with INVITATIONS ("Would you be open to…" / "How would you feel about…")
• Replace BLAME with VULNERABILITY ("I felt hurt when…" not "You hurt me by…")
• Replace GLOBAL LABELS with SPECIFIC MOMENTS ("When X happened" not "You're always X")
• Frame requests as TEAM PROBLEMS ("How can we handle…" not "You need to…")

═══ PHASE 5: LANGUAGE SAFETY (always apply) ═══

${LANGUAGE_SAFETY}
• NEVER add terms of endearment, pet names, or "honey/babe/sweetie" unless specified in profiles.
• NEVER add "I love you" or romantic language the sender didn't include.
• NEVER use comparative/historical framing ("just this time", "for once", "unlike last time").
• NEVER use scarcity/urgency framing ("I really need this", "I just want one thing").
• NEVER reference patterns or frequency ("we never", "you always").
• NEVER minimize ("it's just…", "it won't be a big deal").
• NEVER be preachy or add moral lessons — you're a translator, not a therapist.

═══ PHASE 6: CALIBRATE DELIVERY ═══

TONE: ${profile.label} — ${profile.filterInstructions}
${senderBlock}${recipientBlock}

CONTEXT ABOUT THIS PERSON:
${ctx}

${intentContext ? `INTENT TO PRESERVE:\n${intentContext}\nDo NOT change who is going, who stays, or any logistical facts.\n` : ''}
═══ OUTPUT RULES ═══

• 1-3 sentences maximum. Brevity is kindness.
• First person as the sender. Always.
• Preserve the message TYPE you identified in Phase 1.
• Preserve ALL factual content, names, dates, places, logistics.
• Sound like a real person texting, not a therapist writing a letter.
• Return ONLY the rewritten message. No labels, no explanations.`;

    return AI.call(systemPrompt, `${Auth.myName()} wrote: "${rawText}"\n\nApply the full methodology and return the rewritten message only:`);
  }

  // Generate personalized coaching tip
  function coachingTip() {
    const mood = MoodStore.todayMood();
    const score = Insights.communicationScore();
    const equity = Insights.equityBalance();

    if (mood?.moodId === 'stressed' || mood?.moodId === 'upset') {
      return {
        icon: '🧘',
        text: "You're feeling some pressure today. Take a breath before starting conversations — you'll communicate more clearly.",
      };
    }

    if (score.score < 40) {
      return {
        icon: '💡',
        text: "Your communication score is low. Try starting with an appreciation before bringing up a request.",
      };
    }

    if (equity.me > 70) {
      return {
        icon: '⚖️',
        text: `You're carrying ${equity.me}% of tasks. Consider asking ${Auth.theirName()} to take on more this week.`,
      };
    }

    if (equity.them > 70) {
      return {
        icon: '🤝',
        text: `${Auth.theirName()} has been handling most tasks. Maybe offer to take something off their plate.`,
      };
    }

    const tips = [
      { icon: '🌟', text: `Start your next conversation with something positive about ${Auth.theirName()}.` },
      { icon: '🎯', text: 'Be specific in your requests — "Can you do X by Friday?" works better than "Can you help?"' },
      { icon: '👂', text: 'After sending a proposal, give your partner time. Rushing creates pressure.' },
      { icon: '📅', text: 'Proposing multiple date options shows flexibility and respect for their schedule.' },
      { icon: '💬', text: 'Use guided conversations for sensitive topics — the structure keeps things productive.' },
      { icon: '🔄', text: 'Check in on unresolved plans. A gentle follow-up shows you care about resolution.' },
    ];

    return tips[Math.floor(Math.random() * tips.length)];
  }

  // Build enhanced mediator system prompt
  function mediatorSystemPrompt() {
    const ctx = buildContext();
    const pp = PartnerProfile.get();
    const conflicts = ConflictTracker.patterns();

    let partnerCtx = '';
    if (pp.loveLanguages?.length) {
      const llLabels = pp.loveLanguages.map(id => PartnerProfile.LOVE_LANGUAGES.find(l => l.id === id)?.label || id);
      partnerCtx += `\nPARTNER'S LOVE LANGUAGES: ${llLabels.join(', ')}`;
    }
    if (pp.stressSignals?.length) {
      const ssLabels = pp.stressSignals.map(id => PartnerProfile.STRESS_SIGNALS.find(s => s.id === id)?.label || id);
      partnerCtx += `\nPARTNER'S STRESS SIGNALS: ${ssLabels.join(', ')}`;
    }
    if (pp.bestTimeToTalk) {
      partnerCtx += `\nBEST TIME TO TALK: ${pp.bestTimeToTalk}`;
    }
    if (pp.needsCoolDown !== undefined) {
      partnerCtx += `\nNEEDS COOL-DOWN: ${pp.needsCoolDown ? 'Yes — give space before talking' : 'No — prefers to talk it out'}`;
    }

    if (conflicts.topTrigger) {
      partnerCtx += `\nCOMMON CONFLICT TRIGGER: ${conflicts.topTrigger}`;
      partnerCtx += `\nCONFLICT RESOLUTION RATE: ${conflicts.resolutionRate}%`;
    }

    return `You are Parlay's AI Mediator — a relationship communication coach grounded in Gottman Method, Nonviolent Communication (NVC), Emotionally Focused Therapy (EFT), and attachment science. You help individuals think through relationship challenges privately.

ABOUT THIS PERSON:
${ctx}
${partnerCtx}

YOUR APPROACH — RESEARCH-BACKED METHODOLOGY:

1. VALIDATE FIRST, SOLVE SECOND
   • Acknowledge the emotion before offering any guidance. People can't hear solutions until they feel heard.
   • Use reflection: "It sounds like you're feeling…" — but only when the emotion is clear.

2. GOTTMAN FOUR HORSEMEN — DETECT AND REDIRECT
   • If they're using CRITICISM: help them find the soft startup underneath ("What's the specific thing that happened, and what do you need?")
   • If they're expressing CONTEMPT: gently name it and redirect to the unmet need ("That frustration sounds deep — what's the need underneath?")
   • If they're being DEFENSIVE: normalize it, then guide toward ownership ("It makes sense to want to protect yourself. What's one small part you could own?")
   • If they're STONEWALLING: validate the overwhelm and suggest a structured pause ("It's okay to take a break — would it help to come back to this in an hour?")

3. NVC FRAMEWORK — HELP THEM FIND THE STRUCTURE
   • Guide them to articulate: Observation → Feeling → Need → Request
   • Ask questions that uncover each layer: "What specifically happened?" → "How did that make you feel?" → "What do you need?" → "What could you ask for?"

4. ATTACHMENT LENS
   • Most conflict is really about: "Are you there for me? Do I matter to you?"
   • Help them see their partner's behavior through attachment needs, not malice.
   • Reframe "they don't care" as "they might be overwhelmed/afraid/unsure how to show up."

5. BID RECOGNITION (Gottman)
   • Help them recognize when their partner is making bids for connection (even clumsy ones).
   • Coach them to turn TOWARD bids rather than away or against.

6. PARTNER CALIBRATION
   • Consider the partner's love languages and stress signals when suggesting approaches.
   • Suggest timing conversations for when the partner is most receptive.
   • If cool-down time is needed, suggest pausing first.

7. REPAIR OVER PERFECTION
   • Emphasize that repair attempts matter more than never fighting.
   • Suggest specific repair phrases they could use.

STYLE:
• 2-4 sentences. Warm but direct.
• Ask one follow-up question to keep the conversation going.
• Never be preachy. Never lecture. You're a thinking partner, not a judge.
• If they're venting, let them — then gently redirect toward what they want to happen next.`;
  }

  return { buildContext, enhancedToneFilter, coachingTip, mediatorSystemPrompt };
})();

const GoalStore = (() => {
  const KEY = 'parlay_goals';

  function _load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
  }
  function _save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  function add(title, category, targetDate) {
    const items = _load();
    items.unshift({
      id: 'goal_' + Date.now(),
      title,
      category,
      targetDate: targetDate || null,
      createdAt: new Date().toISOString(),
      status: 'active',
      checkIns: [],
      notes: '',
    });
    _save(items);
    return items[0];
  }

  function all() { return _load(); }
  function active() { return _load().filter(g => g.status === 'active'); }
  function completed() { return _load().filter(g => g.status === 'completed'); }

  function update(id, fields) {
    const items = _load();
    const idx = items.findIndex(g => g.id === id);
    if (idx >= 0) {
      Object.assign(items[idx], fields);
      _save(items);
    }
    return items[idx];
  }

  function checkIn(id, note) {
    const items = _load();
    const goal = items.find(g => g.id === id);
    if (goal) {
      goal.checkIns.push({ date: new Date().toISOString(), note });
      _save(items);
    }
    return goal;
  }

  function complete(id) {
    return update(id, { status: 'completed', completedAt: new Date().toISOString() });
  }

  function remove(id) {
    const items = _load().filter(g => g.id !== id);
    _save(items);
  }

  const CATEGORIES = [
    { id: 'communication', icon: '💬', label: 'Communication' },
    { id: 'quality-time', icon: '⏰', label: 'Quality Time' },
    { id: 'household', icon: '🏠', label: 'Household' },
    { id: 'finances', icon: '💰', label: 'Finances' },
    { id: 'parenting', icon: '👶', label: 'Parenting' },
    { id: 'intimacy', icon: '❤️', label: 'Intimacy' },
    { id: 'personal', icon: '🌱', label: 'Personal Growth' },
    { id: 'fun', icon: '🎉', label: 'Fun & Adventure' },
  ];

  return { add, all, active, completed, update, checkIn, complete, remove, CATEGORIES };
})();

const DailyRitual = (() => {
  const KEY = 'parlay_daily_ritual';

  function _load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; }
  }
  function _save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  function todayKey() { return new Date().toISOString().split('T')[0]; }

  function isCompletedToday() {
    return _load()[todayKey()]?.completed === true;
  }

  function completeToday(data) {
    const all = _load();
    all[todayKey()] = { completed: true, ...data, date: new Date().toISOString() };
    _save(all);
  }

  function streak() {
    const all = _load();
    let count = 0;
    const now = new Date();
    for (let i = 0; i < 30; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const key = d.toISOString().split('T')[0];
      if (all[key]?.completed) count++;
      else if (i > 0) break;
    }
    return count;
  }

  function history(days = 7) {
    const all = _load();
    const results = [];
    const now = new Date();
    for (let i = 0; i < days; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const key = d.toISOString().split('T')[0];
      results.push({ date: key, completed: !!all[key]?.completed, data: all[key] || null });
    }
    return results;
  }

  return { isCompletedToday, completeToday, streak, history };
})();


/* ═══════════════════════════════════════════════════════════════

   CoupleChat — Full two-way chat replacing iMessage/WhatsApp
   ═══════════════════════════════════════════════════════════════ */

const CoupleChat = (() => {
  const DRAFTS_KEY = 'parlay_chat_drafts';
  const READ_KEY = 'parlay_chat_read_ts';
  let _messages = [];
  let _listeners = [];

  // ─── Supabase helpers ───────────────────────
  function _sb() { return Auth.sb(); }
  function _coupleId() { return Auth.couple()?.id; }
  function _myUid() { return Auth.myUid(); }

  // Convert DB row → in-memory message format
  function _rowToMsg(row) {
    const myUid = _myUid();
    const isMine = row.sender_id === myUid;
    return {
      id: row.id,
      from: row.type === 'system' ? 'system' : row.type === 'ai-insight' ? 'ai' : (isMine ? 'me' : 'them'),
      raw: row.content,
      filtered: row.filtered_content || row.content,
      type: row.type || 'text',
      timestamp: row.created_at,
      read: isMine ? true : !!(row.read_at),
      status: isMine ? (row.read_at ? 'read' : (row.delivered_at ? 'delivered' : 'sent')) : null,
      replyTo: row.reply_to || null,
      reactions: row.reactions || [],
      metadata: row.metadata || null,
      editedAt: row.edited_at || null,
      deleted: row.deleted || false,
      pinned: row.pinned || false,
      _senderId: row.sender_id,
    };
  }

  // ─── Load messages from Supabase ────────────
  async function loadMessages() {
    if (!Auth.isReady()) return;
    const coupleId = _coupleId();
    if (!coupleId) return;
    const { data, error } = await _sb().from('chat_messages')
      .select('*')
      .eq('couple_id', coupleId)
      .order('created_at', { ascending: true })
      .limit(500);
    if (error) { console.warn('[CoupleChat] loadMessages error:', error.message); return; }
    _messages = (data || []).map(_rowToMsg);
  }

  // ─── Event system for live updates ──────────
  function on(event, fn) { _listeners.push({ event, fn }); }
  function off(event, fn) { _listeners = _listeners.filter(l => !(l.event === event && l.fn === fn)); }
  function _notify(event, data) { _listeners.forEach(l => { if (l.event === event) l.fn(data); }); }

  // ─── Handle realtime event from Supabase ────
  function _handleRealtime(payload) {
    const myUid = _myUid();
    if (payload.eventType === 'INSERT') {
      const row = payload.new;
      // Skip if we already have this message (from our own send)
      if (_messages.find(m => m.id === row.id)) return;
      const msg = _rowToMsg(row);
      _messages.push(msg);
      _messages.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
      _notify('newMessage', msg);
      _notify('change');
      // Auto re-render if on chat screen
      if (Router.current() === 'couple-chat') Router.reload();
    } else if (payload.eventType === 'UPDATE') {
      const row = payload.new;
      const idx = _messages.findIndex(m => m.id === row.id);
      if (idx >= 0) {
        _messages[idx] = _rowToMsg(row);
        _notify('change');
        if (Router.current() === 'couple-chat') Router.reload();
      }
    } else if (payload.eventType === 'DELETE') {
      _messages = _messages.filter(m => m.id !== payload.old?.id);
      _notify('change');
      if (Router.current() === 'couple-chat') Router.reload();
    }
  }

  // ─── Message retrieval ──────────────────────
  function messages() { return _messages; }

  function getById(msgId) {
    return _messages.find(m => m.id === msgId) || null;
  }

  function recentMessages(n = 50) { return _messages.slice(-n); }

  function messagesByDate(dateStr) {
    return _messages.filter(m => m.timestamp.startsWith(dateStr));
  }

  function lastMessage() {
    return _messages.length > 0 ? _messages[_messages.length - 1] : null;
  }

  function todayMessageCount() {
    const today = new Date().toISOString().split('T')[0];
    return _messages.filter(m => m.timestamp.startsWith(today) && !m.deleted).length;
  }

  // ─── Send a message ─────────────────────────
  function send(rawText, options = {}) {
    const coupleId = _coupleId();
    const myUid = _myUid();
    if (!coupleId || !myUid) return null;

    const now = new Date().toISOString();
    const tempId = 'cc_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);

    // Optimistic local message
    const msg = {
      id: tempId,
      from: 'me',
      raw: rawText,
      filtered: options.filtered || rawText,
      type: options.type || 'text',
      timestamp: now,
      read: true,
      status: 'sent',
      replyTo: options.replyTo || null,
      reactions: [],
      metadata: options.metadata || null,
      editedAt: null,
      deleted: false,
      pinned: false,
      _senderId: myUid,
    };
    _messages.push(msg);
    _notify('change');

    // Insert into Supabase
    _sb().from('chat_messages').insert({
      couple_id: coupleId,
      sender_id: myUid,
      content: rawText,
      filtered_content: options.filtered || rawText,
      type: options.type || 'text',
      reply_to: options.replyTo || null,
      metadata: options.metadata || null,
    }).select().maybeSingle().then(({ data, error }) => {
      if (error) {
        console.error('[CoupleChat] send error:', error.message);
        return;
      }
      if (data) {
        // Replace temp message with real DB row
        const idx = _messages.findIndex(m => m.id === tempId);
        if (idx >= 0) _messages[idx] = _rowToMsg(data);
        _notify('change');
      }
    });

    _clearDraft();
    return msg;
  }

  // ─── Receive partner message (from realtime) ─
  function receivePartner(rawText, options = {}) {
    // This is now handled by realtime subscription automatically.
    // Keep for backwards compatibility / demo mode.
    const msg = {
      id: 'cc_' + Date.now() + '_p_' + Math.random().toString(36).slice(2,6),
      from: 'them',
      raw: rawText,
      filtered: options.filtered || rawText,
      type: options.type || 'text',
      timestamp: new Date().toISOString(),
      read: false,
      status: null,
      replyTo: options.replyTo || null,
      reactions: [],
      metadata: options.metadata || null,
      editedAt: null,
      deleted: false,
      pinned: false,
    };
    _messages.push(msg);
    _notify('newMessage', msg);
    return msg;
  }

  // ─── System + AI messages ───────────────────
  function addSystemMessage(text, metadata = null) {
    const coupleId = _coupleId();
    const myUid = _myUid();
    const msg = {
      id: 'cc_sys_' + Date.now(),
      from: 'system', raw: text, filtered: text,
      type: 'system', timestamp: new Date().toISOString(),
      read: true, metadata, deleted: false,
    };
    _messages.push(msg);
    _notify('change');
    // Persist to Supabase if connected
    if (coupleId && myUid) {
      _sb().from('chat_messages').insert({
        couple_id: coupleId, sender_id: myUid,
        content: text, filtered_content: text,
        type: 'system', metadata,
      }).then(() => {});
    }
    return msg;
  }

  function addAIInsight(text, actionRoute = null) {
    const coupleId = _coupleId();
    const myUid = _myUid();
    const msg = {
      id: 'cc_ai_' + Date.now(),
      from: 'ai', raw: text, filtered: text,
      type: 'ai-insight', timestamp: new Date().toISOString(),
      read: true, metadata: { actionRoute }, deleted: false,
    };
    _messages.push(msg);
    _notify('change');
    // Persist to Supabase if connected
    if (coupleId && myUid) {
      _sb().from('chat_messages').insert({
        couple_id: coupleId, sender_id: myUid,
        content: text, filtered_content: text,
        type: 'ai-insight', metadata: { actionRoute },
      }).then(() => {});
    }
    return msg;
  }

  // ─── Edit a message ─────────────────────────
  function editMessage(msgId, newText) {
    const msg = _messages.find(m => m.id === msgId);
    if (!msg || msg.from !== 'me' || msg.deleted) return null;
    const now = new Date().toISOString();
    msg.raw = newText;
    msg.filtered = newText;
    msg.editedAt = now;
    _notify('change');
    // Update in Supabase
    _sb().from('chat_messages').update({
      content: newText, filtered_content: newText, edited_at: now,
    }).eq('id', msgId).then(() => {});
    return msg;
  }

  // ─── Delete a message ───────────────────────
  function deleteMessage(msgId) {
    const msg = _messages.find(m => m.id === msgId);
    if (!msg) return false;
    if (msg.from === 'me') {
      msg.deleted = true;
      msg.raw = '';
      msg.filtered = '';
      _notify('change');
      // Update in Supabase
      _sb().from('chat_messages').update({
        deleted: true, content: '', filtered_content: '',
      }).eq('id', msgId).then(() => {});
      return true;
    }
    return false;
  }

  // ─── Reactions (multi-emoji) ────────────────
  function react(msgId, emoji) {
    const msg = _messages.find(m => m.id === msgId);
    if (!msg || msg.deleted) return msg;
    if (!msg.reactions) msg.reactions = [];
    const existing = msg.reactions.findIndex(r => r.from === 'me' && r.emoji === emoji);
    if (existing >= 0) {
      msg.reactions.splice(existing, 1);
    } else {
      msg.reactions = msg.reactions.filter(r => r.from !== 'me');
      msg.reactions.push({ from: 'me', emoji, ts: new Date().toISOString() });
    }
    _notify('change');
    // Update in Supabase
    _sb().from('chat_messages').update({
      reactions: msg.reactions,
    }).eq('id', msgId).then(() => {});
    return msg;
  }

  // ─── Pin / Unpin ────────────────────────────
  function togglePin(msgId) {
    const msg = _messages.find(m => m.id === msgId);
    if (!msg || msg.deleted) return false;
    msg.pinned = !msg.pinned;
    _notify('change');
    // Update in Supabase
    _sb().from('chat_messages').update({
      pinned: msg.pinned,
    }).eq('id', msgId).then(() => {});
    return msg.pinned;
  }

  function pinnedMessages() {
    return _messages.filter(m => m.pinned && !m.deleted);
  }

  // ─── Read tracking ──────────────────────────
  function unreadCount() {
    const readTs = localStorage.getItem(READ_KEY) || '1970-01-01';
    return _messages.filter(m => m.from === 'them' && !m.read && m.timestamp > readTs && !m.deleted).length;
  }

  function markAllRead() {
    const myUid = _myUid();
    const now = new Date().toISOString();
    const unreadIds = [];
    _messages.forEach(m => {
      if (m.from === 'them' && !m.read) {
        m.read = true;
        if (m.id && !m.id.startsWith('cc_')) unreadIds.push(m.id);
      }
    });
    _notify('change');
    _updateReadTimestamp();
    // Mark read in Supabase
    if (unreadIds.length > 0) {
      _sb().from('chat_messages').update({ read_at: now })
        .in('id', unreadIds).then(() => {});
    }
  }

  function _updateReadTimestamp() {
    localStorage.setItem(READ_KEY, new Date().toISOString());
  }

  function firstUnreadIndex() {
    for (let i = _messages.length - 1; i >= 0; i--) {
      if (_messages[i].from === 'them' && !_messages[i].read) continue;
      return i + 1 < _messages.length ? i + 1 : -1;
    }
    return 0;
  }

  // ─── Search with result navigation ──────────
  function searchMessages(query) {
    const q = query.toLowerCase();
    return _messages.filter(m =>
      !m.deleted &&
      ((m.raw || '').toLowerCase().includes(q) ||
       (m.filtered || '').toLowerCase().includes(q))
    );
  }

  // ─── Draft persistence ─────────────────────
  function saveDraft(text) {
    if (text && text.trim()) {
      localStorage.setItem(DRAFTS_KEY, text);
    } else {
      _clearDraft();
    }
  }

  function getDraft() {
    return localStorage.getItem(DRAFTS_KEY) || '';
  }

  function _clearDraft() {
    localStorage.removeItem(DRAFTS_KEY);
  }

  // ─── Message grouping logic ─────────────────
  // Returns messages annotated with grouping metadata
  function groupedMessages(msgs) {
    return msgs.map((m, i) => {
      const prev = i > 0 ? msgs[i - 1] : null;
      const next = i < msgs.length - 1 ? msgs[i + 1] : null;
      const sameFromPrev = prev && prev.from === m.from && m.from !== 'system' && m.from !== 'ai';
      const sameFromNext = next && next.from === m.from && m.from !== 'system' && m.from !== 'ai';

      // Within 2 minutes = part of a group
      const timeDiffPrev = prev ? (new Date(m.timestamp) - new Date(prev.timestamp)) / 60000 : Infinity;
      const timeDiffNext = next ? (new Date(next.timestamp) - new Date(m.timestamp)) / 60000 : Infinity;
      const groupedWithPrev = sameFromPrev && timeDiffPrev < 2;
      const groupedWithNext = sameFromNext && timeDiffNext < 2;

      let groupPos = 'single';
      if (groupedWithPrev && groupedWithNext) groupPos = 'mid';
      else if (groupedWithPrev && !groupedWithNext) groupPos = 'last';
      else if (!groupedWithPrev && groupedWithNext) groupPos = 'first';

      return { ...m, _groupPos: groupPos, _grouped: groupedWithPrev };
    });
  }

  // ─── Quick actions (context-aware) ──────────
  function quickActions() {
    const actions = [];
    const mood = MoodStore.todayMood();
    const parlays = Store.activeParlays();
    const tasks = Store.myActionTasks();
    const hour = new Date().getHours();

    // Time-aware greeting option
    if (todayMessageCount() === 0) {
      if (hour < 12) actions.push({ icon: '☀️', label: 'Good morning!', command: '/greet-morning' });
      else if (hour < 17) actions.push({ icon: '👋', label: 'Thinking of you', command: '/greet-afternoon' });
      else actions.push({ icon: '🌙', label: 'How was your day?', command: '/greet-evening' });
    }

    actions.push({ icon: '📅', label: 'Plan something', command: '/plan' });
    actions.push({ icon: '✅', label: 'Assign task', command: '/task' });
    actions.push({ icon: '💛', label: 'Appreciate', command: '/appreciate' });

    if (parlays.length > 0) {
      actions.push({ icon: '📋', label: `${parlays.length} open plan${parlays.length > 1 ? 's' : ''}`, command: '/plans' });
    }

    if (tasks.length > 0) {
      actions.push({ icon: '⚡', label: `${tasks.length} task${tasks.length > 1 ? 's' : ''} for you`, command: '/mytasks' });
    }

    if (mood?.moodId === 'stressed' || mood?.moodId === 'upset') {
      actions.push({ icon: '🧘', label: 'I need space', command: '/space' });
    }

    actions.push({ icon: '😊', label: 'Emoji', command: '/emoji' });
    actions.push({ icon: '🤖', label: 'Ask AI', command: '/ai' });
    actions.push({ icon: '📊', label: 'Chat stats', command: '/stats' });

    return actions;
  }

  // ─── AI-powered message enhancement hints ───
  function getAIHint(rawText) {
    const coach = ToneCoach.analyze(rawText);
    if (coach) return { type: 'tone', ...coach };

    // Scheduling language
    if (/\b(tonight|tomorrow|this weekend|saturday|sunday|friday|next week|let'?s go|dinner|lunch|movie|trip)\b/i.test(rawText)) {
      return { type: 'schedule', msg: '📅 Sounds like you\'re discussing plans — want to make it official?', action: 'compose-pick' };
    }

    // Task language
    if (/\b(can you|could you|please|pick up|grab|get|remember to|don't forget|need you to|would you mind)\b/i.test(rawText)) {
      return { type: 'task', msg: '✅ This sounds like a task — want to track it so nothing falls through the cracks?', action: 'task-create' };
    }

    // Appreciation language
    if (/\b(thank|love that|appreciate|grateful|means a lot|you're the best|so proud)\b/i.test(rawText)) {
      return { type: 'appreciation', msg: '💛 Beautiful! Want to save this to your appreciation journal?', action: 'appreciation' };
    }

    // Conflict language — suggest mediator
    if (/\b(frustrated|annoyed|upset|hurt|angry|disappointed|we need to talk)\b/i.test(rawText)) {
      return { type: 'mediator', msg: '🤖 Would it help to talk this through with the AI mediator first?', action: 'mediator' };
    }

    // Budget/money language
    if (/\b(cost|expensive|budget|afford|price|money|spend|buy)\b/i.test(rawText)) {
      return { type: 'budget', msg: '💰 Talking about money? A Parlay proposal can help you both agree on the budget.', action: 'compose-pick' };
    }

    return null;
  }

  // ─── Link detection ─────────────────────────
  function detectLinks(text) {
    const urlRegex = /(https?:\/\/[^\s<]+)/g;
    const matches = text.match(urlRegex);
    return matches || [];
  }

  // ─── Export chat history ────────────────────
  function exportChat(format = 'text') {
    const msgs = _messages.filter(m => !m.deleted && m.from !== 'ai');
    if (format === 'text') {
      return msgs.map(m => {
        const time = new Date(m.timestamp).toLocaleString();
        const from = m.from === 'me' ? Auth.myName() : m.from === 'them' ? Auth.theirName() : 'System';
        return `[${time}] ${from}: ${m.filtered || m.raw}`;
      }).join('\n');
    }
    return JSON.stringify(msgs, null, 2);
  }

  // ─── Chat statistics ───────────────────────
  function stats() {
    const msgs = _messages.filter(m => !m.deleted && m.from !== 'system' && m.from !== 'ai');
    const myMsgs = msgs.filter(m => m.from === 'me');
    const theirMsgs = msgs.filter(m => m.from === 'them');
    const today = new Date().toISOString().split('T')[0];
    const todayMsgs = msgs.filter(m => m.timestamp.startsWith(today));
    const filteredCount = myMsgs.filter(m => m.filtered && m.filtered !== m.raw).length;

    return {
      total: msgs.length,
      mine: myMsgs.length,
      theirs: theirMsgs.length,
      today: todayMsgs.length,
      filtered: filteredCount,
      pinned: pinnedMessages().length,
      reactions: msgs.reduce((sum, m) => sum + (m.reactions?.length || 0), 0),
    };
  }

  // ─── Cache invalidation ─────────────────────
  function invalidate() { _messages = []; }

  // ─── Toggle helpers (for inline onclick) ────
  function _toggleSearch() {
    const bar = document.querySelector('#cc-search-bar');
    if (!bar) return;
    const isHidden = bar.style.display === 'none';
    bar.style.display = isHidden ? 'block' : 'none';
    if (isHidden) {
      const input = bar.querySelector('#cc-search-input');
      if (input) { input.value = ''; input.focus(); }
    }
  }

  function _toggleActions() {
    const qa = document.querySelector('#cc-quick-actions');
    const btn = document.querySelector('#cc-plus-btn');
    if (!qa || !btn) return;
    const opening = qa.style.display === 'none';
    qa.style.display = opening ? 'flex' : 'none';
    btn.textContent = opening ? '×' : '+';
    btn.style.background = opening ? 'var(--terra)' : 'var(--parchment)';
    btn.style.color = opening ? '#fff' : 'var(--muted)';
  }

  return {
    messages, getById, send, receivePartner, addSystemMessage, addAIInsight,
    editMessage, deleteMessage, react, togglePin, pinnedMessages,
    unreadCount, markAllRead, firstUnreadIndex,
    recentMessages, messagesByDate, searchMessages, lastMessage,
    todayMessageCount, groupedMessages, quickActions, getAIHint,
    detectLinks, exportChat, stats,
    saveDraft, getDraft,
    loadMessages, _handleRealtime,
    invalidate, on, off,
    _toggleSearch, _toggleActions,
  };
})();

   CalendarEngine — Full calendar with day/week/month views
   ═══════════════════════════════════════════════════════════════ */

const CalendarEngine = (() => {
  const EVENT_COLORS = {
    parlay: 'var(--terra)',
    task: 'var(--sage)',
    proposed: 'var(--amber)',
    confirmed: '#7A6A9B',
    goal: 'var(--purple)',
  };

  // Get all events across the system for a given date range
  function eventsForDate(dateStr) {
    const events = [];

    // Parlays with dates
    Store.parlays().forEach(p => {
      if (p.confirmedDate && p.confirmedDate === dateStr) {
        const topic = TOPICS_V2.find(t => t.id === p.topicId) || TOPICS_V2[9];
        events.push({
          id: p.id, type: 'confirmed', icon: topic.icon,
          title: p.title, time: null,
          color: EVENT_COLORS.confirmed,
          route: 'parlay-detail', routeParams: { id: p.id },
          source: 'parlay',
        });
      }
      (p.dateOptions || []).forEach(opt => {
        if (opt.date === dateStr && !p.confirmedDate) {
          const topic = TOPICS_V2.find(t => t.id === p.topicId) || TOPICS_V2[9];
          events.push({
            id: p.id + '_' + opt.id, type: 'proposed', icon: topic.icon,
            title: p.title, time: opt.timeLabel || null,
            color: EVENT_COLORS.proposed,
            route: 'parlay-detail', routeParams: { id: p.id },
            source: 'parlay',
          });
        }
      });
    });

    // Tasks with due dates
    Store.tasks().forEach(t => {
      if (t.dueDate === dateStr) {
        const cat = TASK_CATEGORIES.find(c => c.id === t.categoryId) || TASK_CATEGORIES[7];
        events.push({
          id: t.id, type: 'task',
          icon: t.presetIcon || cat.icon,
          title: t.title,
          time: null,
          color: EVENT_COLORS.task,
          route: 'task-detail', routeParams: { id: t.id },
          source: 'task',
          status: t.status,
        });
      }
    });

    // Goals with target dates
    GoalStore.active().forEach(g => {
      if (g.targetDate === dateStr) {
        const cat = GoalStore.CATEGORIES.find(c => c.id === g.category) || GoalStore.CATEGORIES[0];
        events.push({
          id: g.id, type: 'goal', icon: cat.icon,
          title: g.title, time: null,
          color: EVENT_COLORS.goal,
          route: 'goals', routeParams: {},
          source: 'goal',
        });
      }
    });

    events.sort((a, b) => {
      if (a.time && b.time) return a.time.localeCompare(b.time);
      if (a.time) return -1;
      if (b.time) return 1;
      return 0;
    });

    return events;
  }

  // Get events for a date range
  function eventsForRange(startDate, endDate) {
    const events = {};
    const start = new Date(startDate);
    const end = new Date(endDate);
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const dateStr = d.toISOString().split('T')[0];
      const dayEvents = eventsForDate(dateStr);
      if (dayEvents.length > 0) events[dateStr] = dayEvents;
    }
    return events;
  }

  // Get month grid data
  function monthGrid(year, month) {
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDow = firstDay.getDay(); // 0=Sun
    const daysInMonth = lastDay.getDate();
    const today = new Date().toISOString().split('T')[0];

    const cells = [];

    // Previous month padding
    const prevMonth = new Date(year, month, 0);
    for (let i = startDow - 1; i >= 0; i--) {
      const day = prevMonth.getDate() - i;
      const dateStr = new Date(year, month - 1, day).toISOString().split('T')[0];
      cells.push({ day, dateStr, isCurrentMonth: false, isToday: dateStr === today, events: eventsForDate(dateStr) });
    }

    // Current month
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = new Date(year, month, day).toISOString().split('T')[0];
      cells.push({ day, dateStr, isCurrentMonth: true, isToday: dateStr === today, events: eventsForDate(dateStr) });
    }

    // Next month padding (fill to 42 cells for 6 rows)
    const remaining = 42 - cells.length;
    for (let day = 1; day <= remaining; day++) {
      const dateStr = new Date(year, month + 1, day).toISOString().split('T')[0];
      cells.push({ day, dateStr, isCurrentMonth: false, isToday: dateStr === today, events: eventsForDate(dateStr) });
    }

    return cells;
  }

  // Get week data
  function weekDays(centerDate) {
    const d = new Date(centerDate);
    const dow = d.getDay();
    const sunday = new Date(d);
    sunday.setDate(d.getDate() - dow);
    const today = new Date().toISOString().split('T')[0];
    const days = [];
    for (let i = 0; i < 7; i++) {
      const day = new Date(sunday);
      day.setDate(sunday.getDate() + i);
      const dateStr = day.toISOString().split('T')[0];
      days.push({
        date: dateStr,
        day: day.getDate(),
        dow: day.toLocaleDateString('en-US', { weekday: 'short' }),
        isToday: dateStr === today,
        events: eventsForDate(dateStr),
      });
    }
    return days;
  }

  // AI summary for a date range
  function aiSummary(events, view = 'day') {
    const total = Array.isArray(events) ? events.length : Object.values(events).flat().length;
    const allEvents = Array.isArray(events) ? events : Object.values(events).flat();

    if (total === 0) {
      const suggestions = [
        'A clear schedule — perfect time to plan something together.',
        'Nothing scheduled. How about a spontaneous date?',
        "All open! Great opportunity to catch up on goals.",
      ];
      return suggestions[Math.floor(Math.random() * suggestions.length)];
    }

    const confirmed = allEvents.filter(e => e.type === 'confirmed').length;
    const proposed = allEvents.filter(e => e.type === 'proposed').length;
    const tasks = allEvents.filter(e => e.type === 'task').length;
    const overdueTasks = allEvents.filter(e => e.type === 'task' && e.status === 'pending_response').length;

    const parts = [];
    if (confirmed > 0) parts.push(`${confirmed} confirmed event${confirmed > 1 ? 's' : ''}`);
    if (proposed > 0) parts.push(`${proposed} proposed`);
    if (tasks > 0) parts.push(`${tasks} task${tasks > 1 ? 's' : ''} due`);
    if (overdueTasks > 0) parts.push(`⚡ ${overdueTasks} need${overdueTasks > 1 ? '' : 's'} response`);

    const prefix = view === 'day' ? 'Today:' : view === 'week' ? 'This week:' : 'This month:';
    const summary = `${prefix} ${parts.join(' · ')}`;

    if (total > 5) return summary + ' — busy schedule! Prioritize what matters most.';
    if (overdueTasks > 0) return summary + ' — don\'t forget to respond!';
    return summary;
  }

  return { eventsForDate, eventsForRange, monthGrid, weekDays, aiSummary, EVENT_COLORS };
})();

const ReflectionStore = (() => {
  const KEY = 'parlay_reflections';

  function _load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
  }
  function _save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  function add(text, tag = 'general', mood = null) {
    const items = _load();
    items.unshift({
      id: 'ref_' + Date.now(),
      text,
      tag,
      mood,
      date: new Date().toISOString(),
    });
    _save(items);
    return items[0];
  }

  function all() { return _load(); }
  function recent(n = 10) { return _load().slice(0, n); }
  function count() { return _load().length; }

  function byTag(tag) { return _load().filter(r => r.tag === tag); }

  const TAGS = [
    { id: 'general', icon: '📝', label: 'General' },

  ];

  function getAll() {
    return DEFINITIONS.map(m => ({
      ...m,
      earned: m.check(),
    }));
  }

  function pending() { return DEFINITIONS.filter(m => !m.check()); }

/* ═══════════════════════════════════════════════════════════════
   CONFLICT TRACKER — Monitor and learn from disagreements
   ═══════════════════════════════════════════════════════════════ */

const ConflictTracker = (() => {
  const KEY = 'parlay_conflicts';

  function _load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
  }
  function _save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  function log(parlayId, details) {
    const items = _load();
    items.unshift({
      id: 'conf_' + Date.now(),
      parlayId,
      date: new Date().toISOString(),
      topic: details.topic || 'general',
      trigger: details.trigger || '',
      resolution: details.resolution || 'pending',
      whatHelped: details.whatHelped || '',
      lessonsLearned: details.lessonsLearned || '',
      intensityLevel: details.intensityLevel || 3,
    });
    _save(items);
    return items[0];
  }

  function all() { return _load(); }
  function recent(n = 5) { return _load().slice(0, n); }

  function patterns() {
    const items = _load();
    if (items.length < 2) return { topTrigger: null, avgIntensity: 0, resolutionRate: 0 };

    // Top trigger
    const triggers = {};
    items.forEach(c => {
      if (c.trigger) triggers[c.trigger] = (triggers[c.trigger] || 0) + 1;
    });
    const topTrigger = Object.entries(triggers).sort((a, b) => b[1] - a[1])[0]?.[0] || null;

    // Average intensity
    const avgIntensity = items.reduce((sum, c) => sum + (c.intensityLevel || 3), 0) / items.length;

    // Resolution rate
    const resolved = items.filter(c => c.resolution === 'resolved').length;
    const resolutionRate = Math.round((resolved / items.length) * 100);

    return { topTrigger, avgIntensity: Math.round(avgIntensity * 10) / 10, resolutionRate };
  }

  function getInsights() {
    const p = patterns();
    const insights = [];
    if (p.topTrigger) {
      insights.push({ icon: '⚡', text: `Your most common trigger is "${p.topTrigger}". Being aware of it helps you prepare.` });
    }
    if (p.avgIntensity > 3.5) {
      insights.push({ icon: '🌡️', text: 'Your conflicts tend to run hot. Try the "Gentle Startup" guided conversation before bringing things up.' });
    }
    if (p.resolutionRate > 70) {
      insights.push({ icon: '🎯', text: `You resolve ${p.resolutionRate}% of conflicts — that's strong! Keep using your strategies.` });
    } else if (p.resolutionRate > 0) {
      insights.push({ icon: '💡', text: `You've resolved ${p.resolutionRate}% of tracked conflicts. The AI Mediator can help with the rest.` });
    }
    return insights;
  }

  const TRIGGERS = [
    'Money / finances',
    'Household chores',
    'Kids / parenting',
    'Time management',
    'Communication gap',
    'In-law tension',
    'Work-life balance',
    'Social plans',
    'Intimacy',
    'Personal habits',
    'Other',
  ];

  return { log, all, recent, patterns, getInsights, TRIGGERS };
})();

const PartnerProfile = (() => {
  const KEY = 'parlay_partner_profile';

  function _load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; }
  }
  function _save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

    Object.assign(current, fields);
    _save(current);
    return current;
  }

    const p = _load();
    return p.loveLanguages || [];
  }

  function stressSignals() {

    return p.stressSignals || [];

  const msgs = EventMessages.list(id);
  const myN = Auth.myName();
  const theirN = Auth.theirName();

  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;padding:0;padding-top:max(52px,env(safe-area-inset-top));">

    <div style="padding:0 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">

        <div style="font-size:.62rem;color:var(--muted);">${msgs.length} messages</div>
      </div>
    </div>

    <!-- Messages -->
    <div style="flex:1;overflow-y:auto;padding:16px 20px;" id="thread-messages">
      ${msgs.length > 0 ? msgs.map(m => {
        const isMe = m.fromUid === Auth.myUid() || m.from === 'me';
        const isSystem = m.type === 'system';
        if (isSystem) {
          return `
          <div style="text-align:center;margin:12px 0;">
            <span style="font-size:.68rem;color:var(--muted);background:var(--parchment);padding:3px 12px;border-radius:12px;">${U.esc(m.filteredContent || m.rawContent)}</span>
          </div>`;
        }
        return `
        <div style="display:flex;${isMe ? 'justify-content:flex-end;' : ''}margin-bottom:12px;">
          <div style="max-width:80%;${isMe
            ? 'background:var(--terra);color:#fff;border-radius:16px 16px 4px 16px;'
            : 'background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;'
          }padding:10px 14px;">
            <div style="font-size:.62rem;font-weight:600;margin-bottom:3px;${isMe ? 'opacity:.8;' : 'color:var(--muted);'}">${isMe ? myN : theirN}</div>
            <div style="font-size:.85rem;line-height:1.55;">${U.esc(m.filteredContent || m.rawContent)}</div>
            <div style="font-size:.58rem;${isMe ? 'opacity:.6;' : 'color:var(--muted);'}margin-top:4px;text-align:right;">
              ${m.timestamp ? new Date(m.timestamp).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''}
              ${m.filteredContent && m.filteredContent !== m.rawContent ? ' · ✓ Filtered' : ''}
            </div>
          </div>
        </div>`;
      }).join('') : `
      <div style="text-align:center;padding:40px 0;">
        <div style="font-size:1.5rem;margin-bottom:8px;">💬</div>
        <div style="font-size:.82rem;color:var(--muted);">No messages yet. Start the conversation!</div>
      </div>`}
    </div>

    <!-- Reply Input -->
    <div style="padding:12px 20px;border-top:1px solid var(--border);background:var(--cream);padding-bottom:max(20px,env(safe-area-inset-bottom));">
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <textarea id="thread-input" class="input" rows="1" placeholder="Type a message..." style="flex:1;resize:none;font-size:.85rem;min-height:40px;max-height:100px;padding:10px 14px;border-radius:20px;"></textarea>
        <button class="btn btn-accent" style="border-radius:50%;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;" id="thread-send">↑</button>
      </div>
      <div class="tone-coach tone-coach-hidden" id="thread-coach" style="margin-top:4px;"></div>
    </div>
  </div>`;
}, (el, { id } = {}) => {
  const textarea = el.querySelector('#thread-input');
  const coach = el.querySelector('#thread-coach');
  if (textarea && coach) ToneCoach.attachToTextarea(textarea, coach);

  // Auto-resize textarea
  textarea?.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
  });

  // Scroll to bottom
  const msgContainer = el.querySelector('#thread-messages');
  if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;

  // Send message
  el.querySelector('#thread-send')?.addEventListener('click', async () => {
    const text = textarea?.value.trim();
    if (!text) return;

    const btn = el.querySelector('#thread-send');
    btn.disabled = true;
    btn.textContent = '…';

    let filtered = text;
    try {
      filtered = await AIContext.enhancedToneFilter(text);
    } catch(e) { filtered = text; }

    await EventMessages.send(id, {
      type: 'text',
      rawContent: text,
      filteredContent: filtered,
    });

    textarea.value = '';
    textarea.style.height = 'auto';
    btn.disabled = false;
    btn.textContent = '↑';

    // Re-render to show the new message
    Router.reload();
  });
});

// PARTNER CONNECTION — Comprehensive partner management
// ──────────────────────────────────────────────
const PartnerConnection = (() => {
  let _lastVerification = null;
  let _verifying = false;

  function inviteUrl() {
    const code = Auth.couple()?.invite_code;
    if (!code) return '';
    const base = location.origin + location.pathname;
    return base + '?invite=' + code;
  }

  function inviteMessage() {
    const myName = Auth.myName();
    const code = Auth.couple()?.invite_code || '';
    return `${myName} invited you to Parlay — the relationship app for couples. ` +
      `Use invite code: ${code}\n\n` +
      `Join here: ${inviteUrl()}`;
  }

  async function shareNative() {
    const code = Auth.couple()?.invite_code || '';
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'Join me on Parlay',
          text: inviteMessage(),
          url: inviteUrl(),
        });
        return { success: true };
      } catch (e) {
        if (e.name === 'AbortError') return { cancelled: true };
        return { error: e.message };
      }
    }
    // Fallback: copy to clipboard
    return copyInvite();
  }

  async function copyInvite() {
    try {
      await navigator.clipboard?.writeText(inviteMessage());
      return { success: true, method: 'clipboard' };
    } catch {
      return { error: 'Could not copy' };
    }
  }

  async function copyCode() {
    const code = Auth.couple()?.invite_code || '';
    try {
      await navigator.clipboard?.writeText(code);
      return { success: true };
    } catch {
      return { error: 'Could not copy' };
    }
  }

  function shareSMS() {
    const body = encodeURIComponent(inviteMessage());
    window.open('sms:?body=' + body, '_blank');
  }

  function shareEmail(toEmail) {
    const subject = encodeURIComponent(Auth.myName() + ' invited you to Parlay');
    const body = encodeURIComponent(inviteMessage());
    const mailto = 'mailto:' + (toEmail || '') + '?subject=' + subject + '&body=' + body;
    window.open(mailto, '_blank');
  }

  async function sendInAppInvite(email) {
    if (!email || !email.includes('@')) return { error: 'Invalid email' };
    // Store the invited email in the couple row metadata for tracking
    const couple = Auth.couple();
    if (!couple) return { error: 'Not in a couple' };
    const invitedEmails = couple.invited_emails || [];
    if (!invitedEmails.includes(email.toLowerCase())) {
      invitedEmails.push(email.toLowerCase());
    }
    // Update couple row with invited email tracking
    try {
      await Auth.sb().from('couples')
        .update({ invited_emails: invitedEmails })
        .eq('id', couple.id);
    } catch (e) {
      // Non-critical — column may not exist yet
      console.warn('[PartnerConnection] Could not save invited email:', e.message);
    }
    // Open email client with pre-filled invite
    shareEmail(email);
    return { success: true, email };
  }

  async function verify() {
    if (_verifying) return _lastVerification;
    _verifying = true;
    try {
      _lastVerification = await Auth.verifyConnection();
      _lastVerification.timestamp = new Date().toISOString();
    } catch (e) {
      _lastVerification = { status: 'error', ok: false, error: e.message, timestamp: new Date().toISOString() };
    }
    _verifying = false;
    return _lastVerification;
  }

  function lastVerification() { return _lastVerification; }

  function connectionSteps() {
    const couple = Auth.couple();
    const hasP = Auth.hasPartner();
    const steps = [
      { id: 'account', label: 'Account created', desc: 'You signed up for Parlay', done: true },
      { id: 'couple', label: 'Couple space created', desc: couple ? 'Your shared space is ready' : 'Create your couple space', done: !!couple },
      { id: 'invite', label: 'Invite sent', desc: couple?.invite_code ? 'Share code: ' + couple.invite_code : 'Generate an invite code', done: !!couple },
      { id: 'partner_joined', label: 'Partner joined', desc: hasP ? Auth.theirName() + ' is connected' : 'Waiting for partner to join', done: hasP },
      { id: 'synced', label: 'Data syncing', desc: hasP ? 'Parlays, tasks & chat flowing' : 'Will activate when partner joins', done: hasP },
    ];
    return steps;
  }

  function diagnostics() {
    const couple = Auth.couple();
    const hasP = Auth.hasPartner();
    const msgs = CoupleChat.messages();
    const parlays = typeof Store !== 'undefined' ? Store.parlays() : [];
    const tasks = typeof Store !== 'undefined' ? Store.tasks() : [];
    return {
      coupleId: couple?.id || null,
      mySlot: Auth.amSpouse1() ? 'spouse_1' : 'spouse_2',
      partnerSlot: Auth.amSpouse1() ? 'spouse_2' : 'spouse_1',
      connected: hasP,
      partnerName: Auth.theirName(),
      partnerEmail: Auth.them().email || 'Unknown',
      inviteCode: couple?.invite_code || 'N/A',
      connectionAge: Auth.connectionAge() || 'N/A',
      totalMessages: msgs.length,
      totalParlays: parlays.length,
      totalTasks: tasks.length,
      lastMessage: msgs.length > 0 ? msgs[msgs.length - 1].timestamp : null,
      myEmail: Auth.me().email,
      myName: Auth.myName(),
    };
  }

  return {
    inviteUrl, inviteMessage, shareNative, copyInvite, copyCode,
    shareSMS, shareEmail, sendInAppInvite,
    verify, lastVerification, connectionSteps, diagnostics,
  };
})();

// ──────────────────────────────────────────────
// SMART REPLIES — Context-aware chat suggestions
// (Must be defined before couple-chat screen)
// ──────────────────────────────────────────────
const SmartReplies = (() => {
  function forMessage(msg) {
    if (!msg || !msg.raw) return [];
    const text = (msg.filtered || msg.raw || '').toLowerCase();
    const replies = [];

    // ─── Question handling (context-specific) ─
    if (text.includes('?')) {
      if (text.includes('what do you think') || text.includes('what should we') || text.includes('your thoughts')) {
        replies.push("Good idea, let's do it!", 'I need to think about it', 'Can we discuss tonight?', "I'm open to anything");
      } else if (text.includes('want to') || text.includes('wanna') || text.includes('shall we')) {
        replies.push('Yes, sounds fun!', 'Maybe another time', 'What time?', "I'd love that!");
      } else if (text.includes('can you') || text.includes('could you') || text.includes('would you mind')) {
        replies.push('Sure, no problem!', "I'll try my best", 'When do you need it by?', 'Already on it!');
      } else if (text.includes('when') || text.includes('what time')) {
        replies.push('How about this evening?', 'This weekend works', 'Let me check my calendar', "I'm flexible, you pick!");
      } else if (text.includes('where') || text.includes('which place') || text.includes('restaurant')) {
        replies.push("You choose, I'm easy!", 'How about that new place?', "Let's look at options together", 'Somewhere close to home?');
      } else if (text.includes('how are') || text.includes('how was') || text.includes('how did')) {
        replies.push("Great, thanks for asking!", "It was good!", "A bit tired, but okay", "I'll tell you all about it later");
      } else if (text.includes('do you want') || text.includes('should i') || text.includes('should we')) {
        replies.push('Yes please!', "That'd be great", "I'm good either way", "Let's figure it out together");
      } else {
        replies.push('Yes!', 'Let me think about it', 'Can we talk later?', 'Tell me more');
      }
    }

    // ─── Emotional messages ────────────────────
    if (text.includes('thank') || text.includes('appreciate') || text.includes('love you')) {
      replies.push("You're the best!", 'Always here for you', 'That means so much', 'Love you too ❤️');
    }
    if (text.includes('miss') && (text.includes('you') || text.includes('home'))) {
      replies.push('Miss you too!', 'Coming home soon ❤️', "Can't wait to see you");
    }
    if (text.includes('sorry') || text.includes('apologize') || text.includes('my fault')) {
      replies.push("It's okay, I understand", "Let's move past it together", 'I appreciate you saying that', "We're good ❤️");
    }
    if (text.includes('stressed') || text.includes('tough day') || text.includes('exhausted') || text.includes('tired')) {
      replies.push("I'm here for you ❤️", 'What can I do to help?', "Let's have a relaxing evening", 'Want to talk about it?');
    }
    if (text.includes('good news') || text.includes('exciting') || text.includes('guess what') || text.includes('amazing')) {
      replies.push('Tell me everything!', "That's amazing! 🎉", "I'm so happy for you!", "Can't wait to hear!");
    }

    // ─── Logistics / coordination ──────────────
    if (text.includes('need to') || text.includes("don't forget") || text.includes('remember to')) {
      replies.push('On it!', 'Added to my list', "I'll take care of it", "Thanks for the reminder!");
    }
    if (text.includes('kids') || text.includes('school') || text.includes('pickup') || text.includes('daycare')) {
      replies.push('I got it covered', "I'll handle it", 'Can we split this?', "What time?");
    }
    if (text.includes('dinner') || text.includes('lunch') || text.includes('eat') || text.includes('food') || text.includes('cook')) {
      replies.push('Sounds delicious!', "I'll cook tonight", 'Want to order in?', "Let's try something new!");
    }
    if (text.includes('grocery') || text.includes('shopping') || text.includes('store') || text.includes('buy')) {
      replies.push("I'll add it to the list", 'Want me to grab it?', 'After work?', "I'll stop on the way home");
    }

    // ─── Plans / events ────────────────────────
    if (text.includes('weekend') || text.includes('saturday') || text.includes('sunday')) {
      replies.push("Let's make plans!", "That sounds perfect!", 'Check the calendar?', "I'm in!");
    }
    if (text.includes('tonight') || text.includes('this evening')) {
      replies.push("Can't wait!", "I'm free!", 'What time?', "Sounds like a plan!");
    }

    // ─── Fallback: add greetings if no replies yet ─
    if (replies.length === 0) {
      const hour = new Date().getHours();
      if (hour < 12) replies.push('Good morning! ☀️', 'Hope you slept well');
      else if (hour < 17) replies.push("How's your day?", 'Thinking of you 💛');
      else replies.push('How was your day?', 'Love you ❤️');
    }

    return [...new Set(replies)].slice(0, 4);
  }

  function greetings() {
    const hour = new Date().getHours();
    if (hour < 12) return ['Good morning! ☀️', 'Hope you slept well', 'Ready for the day?', "Can't wait to see you"];
    if (hour < 17) return ["How's your day going?", 'Thinking of you', 'Need anything?', 'Just checking in 💛'];
    return ['How was your day?', 'What should we do tonight?', 'I missed you today', 'Want to watch something?'];
  }

  function conversationStarters() {
    const mood = MoodStore.todayMood();
    const parlays = Store.activeParlays();
    const tasks = Store.myActionTasks();
    const hour = new Date().getHours();

    const starters = [];

    // Context-aware starters
    if (parlays.length > 0) {
      starters.push(`We have ${parlays.length} open plan${parlays.length > 1 ? 's' : ''} — want to go through them?`);
    }
    if (tasks.length > 0) {
      starters.push(`I noticed we have some tasks to coordinate — want to tackle them?`);
    }
    if (mood?.moodId === 'happy' || mood?.moodId === 'grateful') {
      starters.push("I'm feeling great today — let's plan something fun!");
    }
    if (mood?.moodId === 'stressed') {
      starters.push("I've had a stressful day and could use your support");
    }

    // Time-aware
    if (hour >= 17 && hour <= 21) {
      starters.push('What should we have for dinner tonight?');
      starters.push('Want to do something fun this evening?');
    }
    if (hour >= 6 && hour < 10) {
      starters.push("Good morning! What's your schedule like today?");
    }

    // Evergreen starters
    const evergreen = [
      'What was the best part of your day?',
      "I've been thinking about us...",
      'Can we plan something fun this weekend?',
      'I want to tell you something nice',
      'I need your opinion on something',
      "Let's plan a date night soon",
      'How are you really doing today?',
      'I had an idea I want to run by you',
      'What are you looking forward to this week?',
      "There's something I want to appreciate you for",
      'Remember when we... 💭',
      "What's one thing I can do for you today?",
    ];

    // Combine and deduplicate
    starters.push(...evergreen);
    return [...new Set(starters)].sort(() => Math.random() - 0.5).slice(0, 5);
  }

  return { forMessage, greetings, conversationStarters };
})();

/* ═══════════════════════════════════════════════════════════════
