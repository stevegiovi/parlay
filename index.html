// PARLAY DETAIL
// ──────────────────────────────────────────────
Router.register('parlay-detail', ({ id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return `<div style="padding:60px 24px;text-align:center;"><div style="font-size:1.2rem;">Parlay not found</div><button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="Router.go('plan')">‹ Back</button></div>`;

  const topic = TOPICS.find(t => t.id === p.topicId) || TOPICS[7];
  const isMine = p.isMine;
  const myN = Auth.myName();
  const theirN = Auth.theirName();
  const creatorN = isMine ? myN : theirN;
  const recipN = isMine ? theirN : myN;

  const statusText = {
    pending_partner: isMine ? `Waiting for ${recipN}` : 'Your turn to respond',
    partner_replied: isMine ? `${recipN} has replied` : 'Awaiting proposal',
    counter_proposed: isMine ? `${recipN} suggested new times` : 'Counter-proposal sent',
    active: 'Proposal ready',
    resolved: p.resolution === 'needs_discussion' ? 'Needs conversation'
      : p.resolution === 'date_accepted' ? 'Event confirmed'
      : 'Resolved',
  };

  const statusColor = { pending_partner:'#E8B88A', partner_replied:'#7A6A9B', counter_proposed:'#6A8CAA', active:'#C4714A', resolved:'#7A9E8A' };
  const sc = statusColor[p.status] || '#9B8880';

  // Date options
  const isConfirmed = p.resolution === 'date_accepted';
  const dateHtml = (p.dateOptions?.length > 0) ? `
    <div style="margin-top:12px;">
      <div class="input-label">📅 ${isConfirmed ? 'Confirmed date' : 'Proposed dates'}</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${p.dateOptions.map(o => {
          const d = new Date(o.date + 'T12:00:00');
          const label = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
          const sel = p.partnerDateResponse === o.id;
          if (isConfirmed && !sel) return '';
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1.5px solid ${sel ? 'var(--sage)' : 'var(--border)'};border-radius:12px;background:${sel ? '#EDF4F0' : 'var(--surface)'};">
            <div><div style="font-size:.88rem;font-weight:600;">${label}</div>${o.timeLabel ? `<div style="font-size:.72rem;color:var(--muted);">${o.timeLabel}</div>` : ''}</div>
            ${sel ? `<span style="font-size:.72rem;font-weight:700;color:var(--sage);">${isConfirmed ? '✓ Confirmed' : '✓ Selected'}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  // Counter-proposed dates
  const counterHtml = (p.counterDates?.length > 0) ? `
    <div style="margin-top:16px;margin-bottom:16px;">
      <div class="input-label">📅 ${!isMine ? 'Your suggested times' : recipN + "'s suggested times"}</div>
      <div style="display:flex;flex-direction:column;gap:6px;" id="counter-dates-list">
        ${p.counterDates.map(o => {
          const d = new Date(o.date + 'T12:00:00');
          const label = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
          const sel = p.confirmedDate?.id === o.id;
          return `<div class="counter-date-opt" data-opt="${o.id}" data-date="${o.date}" data-time="${o.timeLabel || ''}" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1.5px solid ${sel ? 'var(--sage)' : 'var(--border)'};border-radius:12px;background:${sel ? '#EDF4F0' : 'var(--surface)'};${p.status === 'counter_proposed' && isMine ? 'cursor:pointer;' : ''}">
            <div><div style="font-size:.88rem;font-weight:600;">${label}</div>${o.timeLabel ? `<div style="font-size:.72rem;color:var(--muted);">${o.timeLabel}</div>` : ''}</div>
            ${sel ? `<span style="font-size:.72rem;font-weight:700;color:var(--sage);">✓ Confirmed</span>` : (p.status === 'counter_proposed' && isMine ? `<div class="counter-check" style="width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;"></div>` : '')}
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  // Proposal
  let proposalHtml = '';
  if (p.proposal) {
    const pr = typeof p.proposal === 'string' ? (() => { try { return JSON.parse(p.proposal); } catch { return { proposal: p.proposal }; } })() : p.proposal;
    proposalHtml = `
    <div style="margin:16px 0;padding:16px;background:linear-gradient(135deg,rgba(122,106,155,.08),rgba(122,158,138,.06));border:1.5px solid rgba(122,106,155,.25);border-radius:var(--r-lg);">
      <div class="input-label" style="color:var(--purple);">⚖️ Parlay's Proposal</div>
      <div style="font-size:.88rem;line-height:1.65;margin-bottom:8px;">${pr.proposal || ''}</div>
      ${pr.reasoning ? `<div style="font-size:.76rem;color:var(--muted);line-height:1.5;padding-top:8px;border-top:1px solid rgba(122,106,155,.15);font-style:italic;">${pr.reasoning}</div>` : ''}
    </div>`;
  }

  // Actions — every status+role combo has an action or message
  let actionHtml = '';
  if (p.status === 'pending_partner' && !isMine) {
    actionHtml = `<button class="btn btn-primary" onclick="Router.go('parlay-reply',{id:'${p.id}'})">Share your position →</button>`;
  } else if (p.status === 'pending_partner' && isMine) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);"><div style="font-size:.85rem;color:var(--muted);">⏳ Waiting for ${U.esc(recipN)} to respond</div></div>`;
  } else if (p.status === 'partner_replied' && isMine) {
    actionHtml = `<button class="btn" style="background:linear-gradient(135deg,#4A3568,#7A6A9B);color:#fff;" id="gen-proposal-btn"><span id="gen-btn-text">⚖️ Generate Proposal</span></button>`;
  } else if (p.status === 'partner_replied' && !isMine) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);"><div style="font-size:.85rem;color:var(--muted);">✓ Position sent. Waiting for ${U.esc(creatorN)} to generate proposal.</div></div>`;
  } else if (p.status === 'counter_proposed' && isMine) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="accept-counter-btn" disabled><span id="accept-counter-text">Select a date above to confirm</span></button>
      <button class="btn btn-outline" id="discuss-btn">💬 This needs a conversation</button>
    </div>`;
  } else if (p.status === 'counter_proposed' && !isMine) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);"><div style="font-size:.85rem;color:var(--muted);">⏳ Waiting for ${U.esc(creatorN)} to pick a time</div></div>`;
  } else if (p.status === 'active' && p.proposal) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="accept-btn">✓ Accept Proposal</button>
      <button class="btn btn-outline" id="discuss-btn">💬 This needs a conversation</button>
    </div>`;
  } else if (p.status === 'resolved') {
    if (p.resolution === 'needs_discussion') {
      actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);">
        <div style="font-size:.85rem;color:var(--muted);font-weight:600;">💬 Marked for conversation</div>
        <div style="font-size:.75rem;color:var(--muted);margin-top:6px;">Talk it through together, then come back to resolve.</div>
        <button class="btn btn-outline btn-sm" style="margin-top:12px;" id="reopen-btn">↻ Reopen Parlay</button>
      </div>`;
    } else if (p.resolution === 'date_accepted') {
      actionHtml = `<div style="text-align:center;padding:16px;background:#EDF4F0;border:1.5px solid var(--sage);border-radius:var(--r-md);">
        <div style="font-size:1.5rem;margin-bottom:6px;">🎉</div>
        <div style="font-size:.92rem;color:var(--sage);font-weight:700;">Event Confirmed</div>
        <div style="font-size:.75rem;color:var(--muted);margin-top:4px;">You're all set — the date is locked in.</div>
      </div>`;
    } else {
      actionHtml = `<div style="text-align:center;padding:12px;font-size:.85rem;color:var(--sage);font-weight:600;">✓ Proposal accepted</div>`;
    }
  }

  return `
  <div data-parlay-id="${p.id}" style="min-height:100dvh;padding:0 20px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('plan')">‹ Plans</button>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">↻</button>
        <button class="btn-ghost" id="manage-btn">⋯ Manage</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;" class="a2">
      <div style="width:48px;height:48px;border-radius:14px;background:${topic.color}18;display:flex;align-items:center;justify-content:center;font-size:1.4rem;">${topic.icon}</div>
      <div>
        <div style="font-family:var(--font-display);font-size:1.35rem;">${U.esc(p.title)}</div>
        <div style="font-size:.72rem;color:var(--muted);">${p.date} · ${isMine ? 'You started this' : creatorN + ' started this'}</div>
      </div>
    </div>

    <div style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:${sc}18;border:1px solid ${sc}44;border-radius:var(--r-pill);margin-bottom:20px;" class="a2">
      <div style="width:6px;height:6px;border-radius:50%;background:${sc};"></div>
      <div style="font-size:.72rem;font-weight:700;color:${sc};">${statusText[p.status] || p.status}</div>
    </div>

    <!-- Creator's message -->
    <div style="margin-bottom:16px;" class="a3">
      <div class="input-label">${isMine ? 'Your position' : creatorN + "'s position"}</div>
      <div style="padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);">
        <div style="font-size:.88rem;line-height:1.65;">${p.filteredInput || p.rawInput || ''}</div>
        <div style="font-size:.68rem;color:var(--muted);margin-top:8px;">✓ Tone-filtered by Parlay</div>
      </div>
      ${dateHtml}
    </div>

    <!-- Reply -->
    ${p.partnerFilteredReply ? `
    <div style="margin-bottom:16px;" class="a4">
      <div class="input-label">${!isMine ? 'Your response' : recipN + "'s response"}</div>
      <div style="padding:14px 16px;background:var(--surface);border:1px solid rgba(122,106,155,.25);border-radius:var(--r-md);">
        <div style="font-size:.88rem;line-height:1.65;">${p.partnerFilteredReply}</div>
        <div style="font-size:.68rem;color:var(--muted);margin-top:8px;">✓ Tone-filtered by Parlay</div>
      </div>
    </div>` : ''}

    ${counterHtml}
    ${proposalHtml}

    <div style="margin-top:20px;" class="a5">${actionHtml}</div>
  </div>`;
}, (el, { id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return;

  // Generate proposal
  el.querySelector('#gen-proposal-btn')?.addEventListener('click', async () => {
    const btn = el.querySelector('#gen-proposal-btn');
    const txt = el.querySelector('#gen-btn-text');
    btn.disabled = true; txt.innerHTML = '<span class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,.3);margin-right:8px;"></span> Generating proposal…';

    try {
      const parsed = await generateProposal(p);
      await Store.updateParlay(p.id, { proposal: parsed, status: 'active' });
      Router.go('parlay-detail', { id: p.id });
    } catch(e) {
      btn.disabled = false; txt.textContent = '⚖️ Generate Proposal';
      U.toast('AI error — try again');
    }
  });

  // Accept
  el.querySelector('#accept-btn')?.addEventListener('click', async () => {
    await Store.updateParlay(p.id, { status: 'resolved', resolution: 'accepted' });
    Badges.update();
    U.toast('Proposal accepted ✓');
    Router.go('parlay-detail', { id: p.id });
  });

  // Discuss
  el.querySelector('#discuss-btn')?.addEventListener('click', async () => {
    await Store.updateParlay(p.id, { status: 'resolved', resolution: 'needs_discussion' });
    Badges.update();
    U.toast('💬 Time to talk this one through');
    Router.go('plan');
  });

  // Counter-proposed date selection + accept (creator picks from partner's counter-dates)
  let _selectedCounterDate = null;
  el.querySelectorAll('.counter-date-opt').forEach(card => {
    card.addEventListener('click', () => {
      if (p.status !== 'counter_proposed' || !p.isMine) return;
      _selectedCounterDate = card.dataset.opt;
      el.querySelectorAll('.counter-date-opt').forEach(c => {
        const sel = c.dataset.opt === _selectedCounterDate;
        c.style.borderColor = sel ? 'var(--sage)' : 'var(--border)';
        c.style.background = sel ? '#EDF4F0' : 'var(--surface)';
        const check = c.querySelector('.counter-check');
        if (check) {
          check.style.borderColor = sel ? 'var(--sage)' : 'var(--border)';
          check.style.background = sel ? 'rgba(122,158,138,.4)' : 'transparent';
          check.textContent = sel ? '✓' : '';
          check.style.color = 'var(--sage)';
        }
      });
      const btn = el.querySelector('#accept-counter-btn');
      if (btn) btn.disabled = false;
      const txt = el.querySelector('#accept-counter-text');
      if (txt) txt.textContent = '✓ Accept & Confirm Event';
    });
  });

  el.querySelector('#accept-counter-btn')?.addEventListener('click', async () => {
    if (!_selectedCounterDate) return;
    const btn = el.querySelector('#accept-counter-btn');
    const txt = el.querySelector('#accept-counter-text');
    btn.disabled = true; txt.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Confirming…';
    const selectedOpt = p.counterDates?.find(o => o.id === _selectedCounterDate);
    try {
      await Store.updateParlay(p.id, {
        confirmedDate: selectedOpt || { id: _selectedCounterDate },
        status: 'resolved',
        resolution: 'date_accepted',
      });
      Badges.update();
      U.toast('Event confirmed ✓');
      Router.go('parlay-detail', { id: p.id });
    } catch(e) {
      btn.disabled = false;
      txt.textContent = '✓ Accept & Confirm Event';
      U.toast('⚠️ Failed — try again');
    }
  });

  // Reopen (from needs_discussion resolved state)
  el.querySelector('#reopen-btn')?.addEventListener('click', async () => {
    // Reopen to partner_replied so the creator can re-generate a proposal
    await Store.updateParlay(p.id, { status: 'partner_replied', resolution: null });
    Badges.update();
    U.toast('Parlay reopened');
    Router.go('parlay-detail', { id: p.id });
  });

  // Manage
  el.querySelector('#manage-btn')?.addEventListener('click', async () => {
    const action = await U.sheet('Manage Parlay', [
      { key: 'archive', label: '📦 Archive', cls: 'btn-outline' },
      { key: 'delete', label: '🗑 Delete for both partners', cls: 'btn-danger' },
    ]);
    if (action === 'archive') {
      await Store.updateParlay(p.id, { archived: true });
      U.toast('Parlay archived');
      Router.go('plan');
    } else if (action === 'delete') {
      await Store.deleteParlay(p.id);
      U.toast('Parlay deleted');
      Router.go('plan');
    }
  });
});

Router.register('parlay-reply', ({ id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return `<div style="padding:60px 24px;text-align:center;">Parlay not found.<br><button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="Router.go('plan')">‹ Back</button></div>`;

  // Guard: only recipient, only pending_partner
  if (p.isMine || p.status !== 'pending_partner') {
    setTimeout(() => {
      let msg;
      if (p.isMine) {
        msg = p.status === 'pending_partner' ? 'Waiting for your partner to reply' : 'View the parlay details';
      } else {
        msg = 'Already responded';
      }
      U.toast(msg);
      Router.go('parlay-detail', { id });
    }, 50);
    return '<div></div>';
  }

  const topic = TOPICS.find(t => t.id === p.topicId) || TOPICS[7];
  const creatorN = Auth.theirName();
  const hasDates = p.dateOptions?.length > 0;

  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('parlay-detail',{id:'${p.id}'})">‹ Back</button>
      <span style="font-size:1.2rem;">${topic.icon}</span>
      <span style="font-family:var(--font-display);font-size:1.1rem;">${topic.label}</span>
    </div>

    <div style="background:var(--espresso);border-radius:var(--r-lg);padding:18px;margin-bottom:24px;" class="a2">
      <div class="input-label" style="color:rgba(232,184,138,.7);">${U.esc(creatorN)}'s position</div>
      <div style="font-size:.85rem;color:rgba(250,246,241,.88);line-height:1.65;font-style:italic;">"${p.filteredInput || p.rawInput || ''}"</div>
    </div>

    ${hasDates ? `
    <!-- ── Date selection: pick one and accept ── -->
    <div class="a3" style="margin-bottom:20px;">
      <div style="font-family:var(--font-display);font-size:1.5rem;font-weight:300;margin-bottom:6px;">Pick a <em style="color:var(--terra)">date</em></div>
      <div style="font-size:.8rem;color:var(--muted);line-height:1.6;">Select a time that works and confirm the event, or suggest different times below.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;" id="reply-dates">
      ${p.dateOptions.map(o => {
        const d = new Date(o.date + 'T12:00:00');
        const label = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
        return `<div class="reply-date-opt" data-opt="${o.id}" data-date="${o.date}" data-time="${o.timeLabel || ''}" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;background:var(--surface);transition:all .15s;">
          <div><div style="font-size:.88rem;font-weight:600;">${label}</div>${o.timeLabel ? `<div style="font-size:.72rem;color:var(--muted);">${o.timeLabel}</div>` : ''}</div>
          <div class="date-check" style="width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;"></div>
        </div>`;
      }).join('')}
    </div>

    <button class="btn" style="background:var(--sage);color:#fff;margin-bottom:24px;" id="accept-date-btn" disabled>
      <span id="accept-date-text">Select a date to confirm</span>
    </button>

    <!-- ── Divider ── -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
      <div style="flex:1;height:1px;background:var(--border);"></div>
      <div style="font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">or</div>
      <div style="flex:1;height:1px;background:var(--border);"></div>
    </div>

    <!-- ── Counter-propose dates ── -->
    <div style="margin-bottom:16px;">
      <div style="font-family:var(--font-display);font-size:1.2rem;font-weight:300;margin-bottom:8px;">Suggest <em style="color:var(--terra)">different times</em></div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:12px;">None of these work? Propose up to 4 alternatives.</div>
      <div style="display:flex;flex-direction:column;gap:8px;" id="counter-date-slots">
        <div style="display:flex;gap:8px;">
          <input type="date" class="input" style="flex:2;" data-cslot="1" data-type="date">
          ${U.timeSelectHtml('c1')}
        </div>
        <div style="display:flex;gap:8px;">
          <input type="date" class="input" style="flex:2;" data-cslot="2" data-type="date">
          ${U.timeSelectHtml('c2')}
        </div>
        <div style="display:flex;gap:8px;">
          <input type="date" class="input" style="flex:2;" data-cslot="3" data-type="date">
          ${U.timeSelectHtml('c3')}
        </div>
        <div style="display:flex;gap:8px;">
          <input type="date" class="input" style="flex:2;" data-cslot="4" data-type="date">
          ${U.timeSelectHtml('c4')}
        </div>
      </div>
    </div>

    <div style="margin-bottom:16px;">
      <div class="input-label">Add a note (optional)</div>
      <textarea id="reply-text" class="input" rows="3" placeholder="e.g. Those times don't work — how about these instead?" style="resize:none;line-height:1.6;"></textarea>
    </div>

    <button class="btn btn-accent" id="counter-submit"><span id="counter-btn-text">Send counter-proposal →</span></button>
    ` : `
    <!-- ── No dates: standard position reply ── -->
    <div class="a3" style="margin-bottom:16px;">
      <div style="font-family:var(--font-display);font-size:1.7rem;font-weight:300;margin-bottom:6px;">Your <em style="color:var(--terra)">position</em></div>
      <div style="font-size:.8rem;color:var(--muted);line-height:1.6;">Be honest — Parlay filters everything before ${U.esc(creatorN)} sees it.</div>
    </div>

    <div style="margin-bottom:16px;" class="a4">
      <div class="input-label">What do you want or need?</div>
      <textarea id="reply-text" class="input" rows="4" placeholder="e.g. That works but I need more notice next time." style="resize:none;line-height:1.6;"></textarea>
    </div>

    <div style="background:var(--parchment);border-radius:var(--r-md);padding:12px 14px;margin-bottom:20px;">
      <div style="font-size:.72rem;font-weight:600;color:var(--muted);">🔒 Private until filtered</div>
    </div>

    <button class="btn btn-accent" id="reply-submit"><span id="reply-btn-text">Send my position →</span></button>
    `}

    <button class="btn btn-outline" style="margin-top:10px;" onclick="Router.go('parlay-detail',{id:'${p.id}'})">Cancel</button>
  </div>`;
}, (el, { id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return;
  let _selectedDate = null;
  let _submitting = false;
  const hasDates = p.dateOptions?.length > 0;

  if (hasDates) {
    // ── Date selection (accept directly) ──
    el.querySelectorAll('.reply-date-opt').forEach(card => {
      card.addEventListener('click', () => {
        _selectedDate = card.dataset.opt;
        el.querySelectorAll('.reply-date-opt').forEach(c => {
          const sel = c.dataset.opt === _selectedDate;
          c.style.borderColor = sel ? 'var(--sage)' : 'var(--border)';
          c.style.background = sel ? '#EDF4F0' : 'var(--surface)';
          const check = c.querySelector('.date-check');
          if (check) {
            check.style.borderColor = sel ? 'var(--sage)' : 'var(--border)';
            check.style.background = sel ? 'rgba(122,158,138,.4)' : 'transparent';
            check.textContent = sel ? '✓' : '';
            check.style.color = 'var(--sage)';
          }
        });
        const btn = el.querySelector('#accept-date-btn');
        if (btn) { btn.disabled = false; }
        const txt = el.querySelector('#accept-date-text');
        if (txt) { txt.textContent = '✓ Accept & Confirm Event'; }
      });
    });

    // Accept date directly — confirms the event
    el.querySelector('#accept-date-btn')?.addEventListener('click', async () => {
      if (_submitting || !_selectedDate) return;
      _submitting = true;
      const btn = el.querySelector('#accept-date-btn');
      const txt = el.querySelector('#accept-date-text');
      btn.disabled = true; txt.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Confirming…';

      const selectedOpt = p.dateOptions.find(o => o.id === _selectedDate);
      try {
        await Store.updateParlay(p.id, {
          partnerDateResponse: _selectedDate,
          confirmedDate: selectedOpt || { id: _selectedDate },
          status: 'resolved',
          resolution: 'date_accepted',
        });
        Badges.update();
        U.toast('Event confirmed ✓');
        Router.go('parlay-detail', { id: p.id });
      } catch(e) {
        console.error('[reply] accept error:', e);
        _submitting = false;
        btn.disabled = false;
        txt.textContent = '✓ Accept & Confirm Event';
        U.toast('⚠️ Failed — try again');
      }
    });

    // Counter-propose dates
    el.querySelector('#counter-submit')?.addEventListener('click', async () => {
      if (_submitting) return;
      const counterDates = [];
      for (let n = 1; n <= 4; n++) {
        const d = el.querySelector(`[data-cslot="${n}"][data-type="date"]`)?.value;
        const t = el.querySelector(`[data-slot="c${n}"][data-type="time"]`)?.value || '';
        if (d) counterDates.push({ id: 'counter_' + n, date: d, timeLabel: t || 'Any time' });
      }
      if (counterDates.length === 0) {
        U.toast('Add at least one date to counter-propose');
        return;
      }
      _submitting = true;
      const btn = el.querySelector('#counter-submit');
      const txt = el.querySelector('#counter-btn-text');
      btn.disabled = true; txt.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Sending…';

      const raw = el.querySelector('#reply-text')?.value.trim() || '';
      let filtered = raw;
      if (raw) {
        try { filtered = await runToneFilter(raw, p.intentContext || ''); } catch(e) { filtered = raw; }
      }

      try {
        await Store.updateParlay(p.id, {
          partnerRawReply: raw || null,
          partnerFilteredReply: filtered || null,
          counterDates,
          status: 'counter_proposed',
        });
        Badges.update();
        U.toast('Counter-proposal sent ✓');
        Router.go('parlay-detail', { id: p.id });
      } catch(e) {
        console.error('[reply] counter error:', e);
        _submitting = false;
        btn.disabled = false;
        txt.textContent = 'Send counter-proposal →';
        U.toast('⚠️ Failed — try again');
      }
    });

  } else {
    // ── Standard position reply (no dates) ──
    el.querySelector('#reply-submit')?.addEventListener('click', async () => {
      if (_submitting) return;
      const raw = el.querySelector('#reply-text')?.value.trim();
      if (!raw) { U.toast('Share your position first'); return; }
      _submitting = true;

      const btn = el.querySelector('#reply-submit');
      const btnText = el.querySelector('#reply-btn-text');
      btn.disabled = true; btnText.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Filtering…';

      let filtered = raw;
      try {
        filtered = await runToneFilter(raw, p.intentContext || '');
      } catch(e) { filtered = raw; }

      const patch = {
        partnerRawReply: raw,
        partnerFilteredReply: filtered,
        status: 'partner_replied',
      };

      try {
        await Store.updateParlay(p.id, patch);
        Badges.update();
        U.toast('Position sent ✓');
        Router.go('parlay-detail', { id: p.id });
      } catch(e) {
        console.error('[reply] save error:', e);
        _submitting = false;
        btn.disabled = false;
        btnText.textContent = 'Send my position →';
        U.toast('⚠️ Failed to send — try again');
      }
    });
  }
});

Router.register('tasks', () => {

      <div style="font-size:.85rem;font-weight:700;color:var(--purple);">⚡ ${action.length} task${action.length !== 1 ? 's' : ''} need your response</div>
    </div>` : ''}

    <div style="padding:16px 20px 0;" class="a3">
      <button class="btn btn-primary" onclick="Router.go('task-new')">+ Assign a Task</button>

    ${my.length > 0 ? `

      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">${my.map(taskCard).join('')}</div>

    ${sent.length > 0 ? `

    ${done.length > 0 ? `

    return `
    <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;text-align:center;">
      <div style="font-size:2.8rem;margin-bottom:16px;">👫</div>
      <div style="font-family:var(--font-display);font-size:1.3rem;margin-bottom:8px;">Partner needed</div>

        You need a connected partner before you can assign tasks.
      </div>
      <button class="btn btn-primary" style="max-width:240px;" onclick="Router.go('setup')">Go to Setup</button>

    themBtn.style.color = _assignTo === 'them' ? '#fff' : '';
    themBtn.style.borderColor = _assignTo === 'them' ? 'var(--terra)' : '';
    meBtn.style.background = _assignTo === 'me' ? 'var(--terra)' : '';
    meBtn.style.color = _assignTo === 'me' ? '#fff' : '';
    meBtn.style.borderColor = _assignTo === 'me' ? 'var(--terra)' : '';
  };
  updateBtns();

  themBtn.addEventListener('click', () => { _assignTo = 'them'; updateBtns(); });
  meBtn.addEventListener('click', () => { _assignTo = 'me'; updateBtns(); });

  let _taskSubmitting = false;
  el.querySelector('#tn-submit').addEventListener('click', async () => {
    if (_taskSubmitting) return;
    const title = el.querySelector('#tn-title').value.trim();
    if (!title) { U.toast('Add a title'); return; }
    _taskSubmitting = true;
    const btn = el.querySelector('#tn-submit');
    btn.disabled = true; btn.textContent = 'Assigning…';

    const rawContext = el.querySelector('#tn-context').value.trim();
    const filteredContext = await filterTaskContext(rawContext);

    await Store.addTask({
      id: 'task_' + Date.now(),
      title,
      context: rawContext,
      rawContext,
      filteredContext,
      categoryId: 'other',
      priority: 'normal',
      dueDate: null,
      assignedTo: _assignTo,
      createdBy: 'me',
      status: 'pending_response',
      pendingResponseFrom: _assignTo,
      counterCount: 0,
    });

    Badges.update();
    U.toast('Task assigned ✓');
    Router.go('tasks');
  });
});

Router.register('task-detail', ({ id } = {}) => {
  const t = Store.findTask(id);
  if (!t) return `<div style="padding:60px 24px;text-align:center;">Task not found.<br><button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="Router.go('tasks')">‹ Back</button></div>`;

  const cat = TASK_CATEGORIES.find(c => c.id === t.categoryId) || TASK_CATEGORIES[6];
  const from = t.createdBy === 'me' ? Auth.myName() : Auth.theirName();
  const to = t.assignedTo === 'me' ? Auth.myName() : Auth.theirName();
  const needsMe = t.pendingResponseFrom === 'me';
  const iAmAssignee = t.assignedTo === 'me';

  // Status label
  const statusLabel = {
    pending_response: needsMe ? '⚡ Your turn' : 'Awaiting response',
    accepted: '✓ Accepted',
    declined: '❌ Declined',
    countered: '↩ Changes suggested',
    done: '✓ Done',
  }[t.status] || t.status;

  // Action area — every combo covered
  let actionHtml = '';
  if (t.status === 'pending_response' && needsMe) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="td-accept">✓ Accept</button>
      <button class="btn btn-outline" id="td-counter">↩ Suggest Changes</button>
      <button class="btn btn-outline" id="td-decline" style="color:#EF4444;border-color:#EF4444;">Decline</button>
    </div>
    <!-- Counter form (hidden until Suggest Changes clicked) -->
    <div id="td-counter-form" style="display:none;margin-top:12px;">
      <div class="input-label">What would work better?</div>
      <textarea id="td-counter-msg" class="input" rows="3" placeholder="e.g. I can do this Thursday instead" style="resize:none;margin-bottom:12px;"></textarea>
      <button class="btn btn-accent" id="td-counter-submit">Send suggestion &rarr;</button>
    </div>
    <!-- Decline form (hidden until Decline clicked) -->
    <div id="td-decline-form" style="display:none;margin-top:12px;">
      <div class="input-label">Why are you declining? <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">(optional)</span></div>
      <textarea id="td-decline-msg" class="input" rows="2" placeholder="e.g. I don't have bandwidth for this right now" style="resize:none;margin-bottom:12px;"></textarea>
      <button class="btn btn-danger" id="td-decline-submit">Decline task</button>
    </div>`;
  } else if (t.status === 'accepted' && iAmAssignee) {
    actionHtml = `<div style="margin-top:20px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="td-done">✓ Mark Done</button>
    </div>`;
  } else if (t.status === 'accepted' && !iAmAssignee) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);margin-top:20px;font-size:.85rem;color:var(--muted);">✓ Accepted — waiting for ${U.esc(to)} to complete</div>`;
  } else if (t.status === 'countered') {
    actionHtml = `<div style="margin-top:16px;">
      ${t.counterMessage ? `<div style="padding:14px 16px;background:var(--surface);border:1px solid rgba(122,106,155,.25);border-radius:var(--r-md);margin-bottom:12px;">
        <div class="input-label" style="color:var(--purple);">↩ Suggested change</div>
        <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredCounter || t.counterMessage)}</div>
      </div>` : ''}
      ${!iAmAssignee ? `<div style="display:flex;gap:8px;">
        <button class="btn" style="background:var(--sage);color:#fff;flex:1;" id="td-accept">✓ Accept change</button>
        <button class="btn btn-outline" style="flex:1;" id="td-decline">Decline</button>
      </div>` : `<div style="text-align:center;padding:12px;font-size:.85rem;color:var(--muted);">Waiting for ${U.esc(from)} to respond</div>`}
    </div>`;
  } else if (t.status === 'declined') {
    actionHtml = `<div style="margin-top:16px;">
      ${t.declineReason ? `<div style="padding:14px 16px;background:#FFF5F5;border:1px solid rgba(239,68,68,.2);border-radius:var(--r-md);margin-bottom:12px;">
        <div class="input-label" style="color:#EF4444;">Decline reason</div>
        <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredDecline || t.declineReason)}</div>
      </div>` : ''}
      <div style="text-align:center;padding:12px;font-size:.85rem;color:var(--muted);">This task was declined.</div>
    </div>`;
  } else if (t.status === 'done') {
    actionHtml = `<div style="text-align:center;padding:16px;color:var(--sage);font-weight:600;">✓ Completed</div>`;
  } else if (t.status === 'pending_response' && !needsMe) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);margin-top:20px;font-size:.85rem;color:var(--muted);">⏳ Waiting for ${U.esc(to)} to respond</div>`;
  }

  return `
  <div data-task-id="${t.id}" style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('tasks')">‹ Tasks</button>
      <button class="btn-ghost" onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">↻</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;" class="a2">
      <div style="width:48px;height:48px;border-radius:14px;background:var(--parchment);display:flex;align-items:center;justify-content:center;font-size:1.4rem;">${cat.icon}</div>
      <div>
        <div style="font-family:var(--font-display);font-size:1.3rem;">${U.esc(t.title)}</div>
        <div style="font-size:.72rem;color:var(--muted);">From ${U.esc(from)} → ${U.esc(to)}</div>
      </div>
    </div>
    <div style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:var(--parchment);border-radius:var(--r-pill);margin-bottom:16px;font-size:.72rem;font-weight:600;color:var(--muted);">${statusLabel}</div>
    ${t.filteredContext || t.context ? `
    <div style="padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:16px;" class="a3">
      <div class="input-label">Context</div>
      <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredContext || t.context)}</div>
    </div>` : ''}
    ${actionHtml}
    <div style="text-align:center;margin-top:20px;">
      <button class="btn-ghost" id="td-delete">Delete task</button>
    </div>
  </div>`;
}, (el, { id } = {}) => {
  const t = Store.findTask(id);
  if (!t) return;

  el.querySelector('#td-accept')?.addEventListener('click', async () => {
    await Store.updateTask(t.id, { status: 'accepted', pendingResponseFrom: null });
    Badges.update(); U.toast('Task accepted ✓');
    Router.go('tasks');
  });

  el.querySelector('#td-done')?.addEventListener('click', async () => {
    await Store.updateTask(t.id, { status: 'done', pendingResponseFrom: null });
    Badges.update(); U.toast('Task done ✓');
    Router.go('tasks');
  });

  // Suggest changes — show form, then submit
  el.querySelector('#td-counter')?.addEventListener('click', () => {
    const form = el.querySelector('#td-counter-form');
    if (form) form.style.display = 'block';
    el.querySelector('#td-counter').style.display = 'none';
  });

  el.querySelector('#td-counter-submit')?.addEventListener('click', async () => {
    const msg = el.querySelector('#td-counter-msg')?.value.trim();
    if (!msg) { U.toast('Say what would work better'); return; }

    const btn = el.querySelector('#td-counter-submit');
    btn.disabled = true; btn.textContent = 'Sending…';

    // AI filter the counter message (best-effort)
    let filtered = msg;
    try {
      filtered = await AI.call(
        'You are Parlay\'s Communication Translator. Rewrite this task counter-proposal to be constructive. 1-2 sentences. First person. ONLY the rewrite.',
        `${Auth.myName()} wrote: "${msg}"\nRewrite:`
      );
    } catch(e) { filtered = msg; }

    await Store.updateTask(t.id, {
      status: 'countered',
      counterMessage: msg,
      filteredCounter: filtered,
      counterCount: (t.counterCount || 0) + 1,
      pendingResponseFrom: t.createdBy === 'me' ? 'me' : 'them',
    });
    Badges.update();
    U.toast('Suggestion sent ✓');
    Router.go('tasks');
  });

  el.querySelector('#td-decline')?.addEventListener('click', () => {
    const form = el.querySelector('#td-decline-form');
    if (form) form.style.display = 'block';
    el.querySelector('#td-decline').style.display = 'none';
    // Hide counter form if open
    const cf = el.querySelector('#td-counter-form');
    if (cf) cf.style.display = 'none';
    const cb = el.querySelector('#td-counter');
    if (cb) cb.style.display = '';
  });

  el.querySelector('#td-decline-submit')?.addEventListener('click', async () => {
    const reason = el.querySelector('#td-decline-msg')?.value.trim() || '';
    const btn = el.querySelector('#td-decline-submit');
    btn.disabled = true; btn.textContent = 'Declining…';

    let filtered = reason;
    if (reason) {
      try {
        filtered = await AI.call(
          'Rewrite this task decline reason to be respectful. 1 sentence. First person. ONLY the rewrite.',
          `${Auth.myName()} wrote: "${reason}"\nRewrite:`
        );
      } catch(e) { filtered = reason; }
    }
    await Store.updateTask(t.id, {
      status: 'declined',
      declineReason: reason,
      filteredDecline: filtered,
      pendingResponseFrom: null,
    });
    Badges.update(); U.toast('Task declined');
    Router.go('tasks');
  });

  el.querySelector('#td-delete')?.addEventListener('click', async () => {
    const action = await U.sheet('Delete this task?', [
      { key: 'delete', label: '🗑 Delete task', cls: 'btn-danger' },
    ]);
    if (action === 'delete') {
      await Store.deleteTask(t.id);
      Badges.update(); U.toast('Task deleted');
      Router.go('tasks');
    }
  });
});

/* ═══════════════════════════════════════════════════════════════
   ██╗███╗   ██╗██╗████████╗
   ██║████╗  ██║██║╚══██╔══╝
   ██║██╔██╗ ██║██║   ██║
   ██║██║╚██╗██║██║   ██║
   ██║██║ ╚████║██║   ██║
   ╚═╝╚═╝  ╚═══╝╚═╝   ╚═╝

   App initialization
   ═══════════════════════════════════════════════════════════════ */

(async () => {
  Router.initNav();

  // ── Dev toolbar ───────────────────────────────
  if (DEV.enabled) {
    document.body.style.paddingTop = '28px';
    const bar = document.createElement('div');
    bar.id = 'dev-bar';
    bar.innerHTML = `
      <span>🔧 v${VERSION}</span>
      <span class="sep"></span>
      <span id="dev-user">...</span>
      <span class="sep"></span>
      <button onclick="navigator.clipboard?.writeText(Auth.couple()?.invite_code||'none');U.toast('Code copied')">Copy invite</button>
      <button onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">Refresh</button>
      <button onclick="Auth.signOut()">Sign out</button>
      <button onclick="localStorage.clear();sessionStorage.clear();location.reload()" style="color:#f66;">Clear & reload</button>
      <span style="margin-left:auto;">
        <button onclick="location.search='?dev&as=1'">→ P1</button>
        <button onclick="location.search='?dev&as=2'">→ P2</button>
      </span>
    `;
    document.body.prepend(bar);
  }

  function updateDevBar() {
    if (!DEV.enabled) return;
    const el = document.getElementById('dev-user');
    if (el) {
      const m = Auth.me();
      el.textContent = m.name ? `${m.name} (${Auth.amSpouse1() ? 'P1' : 'P2'})` : 'Not signed in';
    }
  }

  // ── Auto-login for dev mode ───────────────────
  if (DEV.autoAs && DEV.accounts[DEV.autoAs]) {
    const acct = DEV.accounts[DEV.autoAs];
    console.log(`[DEV] Auto-login as ${acct.label}...`);

    // Try sign in first (account may already exist)
    let result = await Auth.signIn(acct.email, acct.password);
    if (result.error && result.error.includes('Invalid login')) {
      // Account doesn't exist yet — create it
      console.log('[DEV] Account not found, creating...');
      result = await Auth.signUp(acct.email, acct.password, acct.label.split(' ')[0]);
      if (result.error) {
        console.error('[DEV] Signup failed:', result.error);
        Router.go('auth-entry');
        updateDevBar();
        return;
      }
      if (result.confirmEmail) {
        console.warn('[DEV] Email confirmation required — disable in Supabase Auth settings for dev');
        U.toast('⚠️ Disable email confirmation in Supabase for dev mode');
        Router.go('auth-entry');
        updateDevBar();
        return;
      }
    }

    if (result.error) {
      console.error('[DEV] Login failed:', result.error);
      Router.go('auth-entry');
      updateDevBar();
      return;
    }

    // Bootstrap
    const boot = await Auth.bootstrap();
    console.log('[DEV] Bootstrap:', boot);

    // Auto-create/join couple for dev
    if (!boot.coupled) {
      if (DEV.autoAs === '1') {
        // Partner 1 creates the couple
        const { code } = await Auth.createCouple();
        console.log(`[DEV] Created couple. Invite code: ${code}`);
        await Auth.bootstrap();
        Router.go('home');
      } else {
        // Partner 2 needs to join — find Partner 1's couple
        // Sign in as P1 briefly to get the code, then switch back
        // Actually simpler: just go to the join screen
        Router.go('ob-join');
      }
    } else {
      Router.go('home');
    }
    updateDevBar();
    return;
  }

  // ── Normal flow ───────────────────────────────
  const boot = await Auth.bootstrap();

  if (boot.mode === 'unauthenticated') {
    Router.go('auth-entry');
  } else if (!boot.coupled) {
    Router.go('ob-couple');
  } else if (!boot.hasPartner && boot.coupled) {
    Router.go('ob-invite');
  } else {
    Router.go('home');
  }
  updateDevBar();

  // Auth state change listener (handles page reload, OAuth redirect)
  Auth.sb().auth.onAuthStateChange(async (event, session) => {
    if (event === 'INITIAL_SESSION') return;
    if (event === 'SIGNED_IN' && session) {
      const b = await Auth.bootstrap();
      if (b.coupled && b.hasPartner) Router.go('home');
      else if (b.coupled) Router.go('ob-invite');
      else Router.go('ob-couple');
      updateDevBar();
    }
    if (event === 'SIGNED_OUT') {
      Router.go('auth-entry');
      updateDevBar();
    }
  });
})();

</script>
