Router.register('couple-chat', () => {
  const myN = Auth.myName();
  const theirN = Auth.theirName();
  const rawMsgs = CoupleChat.recentMessages(150);
  const msgs = CoupleChat.groupedMessages(rawMsgs);
  const score = Insights.communicationScore();
  const pinnedMsgs = CoupleChat.pinnedMessages();
  const chatStats = CoupleChat.stats();
  const draft = CoupleChat.getDraft();
  const unreadIdx = CoupleChat.firstUnreadIndex();
  CoupleChat.markAllRead();

  // ─── Date formatting ───────────────────────
  function formatDate(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }

  // ─── Status icon for sent messages ─────────
  function statusIcon(msg) {
    if (msg.from !== 'me') return '';
    const s = msg.status || 'read';
    if (s === 'sent') return '<span class="cc-status sent">●</span>';
    if (s === 'delivered') return '<span class="cc-status delivered">✓</span>';
    return '<span class="cc-status read">✓✓</span>';
  }

  // ─── Bubble class for grouping ─────────────
  function groupClass(msg) {
    if (msg._groupPos === 'first') return 'grouped-top';
    if (msg._groupPos === 'mid') return 'grouped-mid';
    if (msg._groupPos === 'last') return 'grouped-bot';
    return '';
  }

  // ─── Render link previews ──────────────────
  function renderLinkPreview(text) {
    const links = CoupleChat.detectLinks(text);
    if (links.length === 0) return '';
    try {
      const url = new URL(links[0]);
      return `<div class="cc-link-preview">
        <div class="lp-domain">${U.esc(url.hostname)}</div>
        <div class="lp-title">${U.esc(links[0].length > 50 ? links[0].slice(0, 50) + '...' : links[0])}</div>
      </div>`;
    } catch { return ''; }
  }

  // ─── Render reply-to preview ───────────────
  function renderReplyTo(msg) {
    if (!msg.replyTo) return '';
    const orig = CoupleChat.getById(msg.replyTo);
    if (!orig) return '';
    const name = orig.from === 'me' ? 'You' : U.esc(theirN);
    const preview = (orig.filtered || orig.raw || '').slice(0, 60);
    return `<div class="cc-reply-preview" data-scroll-to="${orig.id}">
      <div style="font-size:.6rem;font-weight:700;margin-bottom:1px;">${name}</div>
      ${U.esc(preview)}${preview.length >= 60 ? '...' : ''}
    </div>`;
  }

  // ─── Render reactions ──────────────────────
  function renderReactions(msg) {
    if (!msg.reactions || msg.reactions.length === 0) return '';
    const grouped = {};
    msg.reactions.forEach(r => {
      if (!grouped[r.emoji]) grouped[r.emoji] = { count: 0, mine: false };
      grouped[r.emoji].count++;
      if (r.from === 'me') grouped[r.emoji].mine = true;
    });
    return `<div class="cc-reactions">${Object.entries(grouped).map(([emoji, data]) =>
      `<span class="cc-reaction-badge${data.mine ? ' mine' : ''}" data-msg-id="${msg.id}" data-emoji="${emoji}">${emoji}${data.count > 1 ? ' ' + data.count : ''}</span>`
    ).join('')}</div>`;
  }

  // ─── Render each message ───────────────────
  let lastDateLabel = '';
  let insertedNewDivider = false;
  const rendered = msgs.map((m, idx) => {
    let dateDiv = '';
    const dateLabel = formatDate(m.timestamp);

    // Date divider
    if (m.type !== 'system' && dateLabel !== lastDateLabel) {
      lastDateLabel = dateLabel;
      dateDiv = `<div class="cc-date-divider">${dateLabel}</div>`;
    }

    // New messages divider
    let newMsgDiv = '';
    if (!insertedNewDivider && unreadIdx >= 0 && idx === unreadIdx) {
      insertedNewDivider = true;
      newMsgDiv = `<div class="cc-new-msgs-divider" id="cc-new-msgs">New messages</div>`;
    }

    // System messages
    if (m.type === 'system') {
      lastDateLabel = m.raw || '';
      return `${newMsgDiv}<div class="cc-date-divider">${U.esc(m.filtered || m.raw)}</div>`;
    }

    // AI insight messages
    if (m.type === 'ai-insight') {
      return `${dateDiv}${newMsgDiv}
        <div class="cc-ai-insight" ${m.metadata?.actionRoute ? `onclick="Router.go('${U.esc(m.metadata.actionRoute)}')"` : ''}>
          <div class="cc-ai-icon">🤖</div>
          <div class="cc-ai-text">${U.esc(m.filtered || m.raw)}</div>
        </div>`;
    }

    // Deleted message placeholder
    if (m.deleted) {
      return `${dateDiv}${newMsgDiv}
        <div class="cc-bubble-wrap ${m.from === 'me' ? 'me' : 'them'}" data-msg-id="${m.id}">
          <div><div class="cc-bubble deleted">This message was deleted</div></div>
        </div>`;
    }

    const isMe = m.from === 'me';
    const time = new Date(m.timestamp).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const wasFiltered = m.filtered && m.filtered !== m.raw && m.from === 'me';
    const showMeta = m._groupPos === 'single' || m._groupPos === 'last';
    const gClass = groupClass(m);
    const bubbleContent = U.esc(m.filtered || m.raw);
    const linkPreview = renderLinkPreview(m.filtered || m.raw);
    const replyTo = renderReplyTo(m);
    const reactions = renderReactions(m);
    const pinIcon = m.pinned ? '<span style="font-size:.55rem;margin-left:2px;">📌</span>' : '';

    return `${dateDiv}${newMsgDiv}
      <div class="cc-bubble-wrap ${isMe ? 'me' : 'them'}${m._grouped ? ' grouped' : ''}" data-msg-id="${m.id}">
        <div class="cc-swipe-hint">↩</div>
        <div>
          ${replyTo}
          <div class="cc-bubble ${isMe ? 'me' : 'them'} ${gClass}">${bubbleContent}${linkPreview}</div>
          ${reactions}
          ${showMeta ? `<div class="cc-meta">${time}${wasFiltered ? ' · <span class="cc-filtered-tag">✓ Filtered</span>' : ''}${m.editedAt ? ' · <span class="cc-edited-tag">edited</span>' : ''}${pinIcon}${isMe ? ' ' + statusIcon(m) : ''}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  const actions = CoupleChat.quickActions();
  const hasRealMessages = msgs.filter(m => m.from !== 'system' && m.from !== 'ai' && !m.deleted).length > 0;

  return `
  <div class="cc-wrapper">
    <!-- Header -->
    <div class="cc-header">
      <div class="partner-avatar" onclick="CoupleChat._showInfo()">
        ${U.initials(theirN)}
        ${Auth.hasPartner() ? '<div class="online-dot"></div>' : ''}
      </div>
      <div style="flex:1;min-width:0;" onclick="CoupleChat._showInfo()">
        <div class="partner-name">${U.esc(theirN)}</div>
        <div class="partner-status">
          ${Auth.hasPartner() ? 'Connected' : '⏳ Awaiting partner'}${score.score > 0 ? ` · Health: <span style="color:${score.score >= 60 ? 'var(--sage)' : 'var(--amber)'};font-weight:700;">${score.score}</span>` : ''}
        </div>
      </div>
      <div class="cc-header-actions">
        <button class="cc-header-btn" onclick="Router.go('mediator')" title="AI Mediator">🤖</button>
        <button class="cc-header-btn" id="cc-search-btn" title="Search messages">🔍</button>
        <button class="cc-header-btn" id="cc-info-btn" title="Chat info">ℹ️</button>
      </div>
    </div>

    <!-- Pinned message banner -->
    ${pinnedMsgs.length > 0 ? `
    <div class="cc-pinned-banner" id="cc-pinned" data-msg-id="${pinnedMsgs[pinnedMsgs.length - 1].id}">
      <span class="pin-icon">📌</span>
      <span class="pin-text">${U.esc((pinnedMsgs[pinnedMsgs.length - 1].filtered || pinnedMsgs[pinnedMsgs.length - 1].raw).slice(0, 80))}</span>
      <span style="font-size:.58rem;color:var(--muted);">${pinnedMsgs.length > 1 ? pinnedMsgs.length + ' pinned' : ''}</span>
    </div>` : ''}

    <!-- Search bar (hidden by default) -->
    <div id="cc-search-bar" class="cc-search-bar" style="display:none;">
      <div class="search-row">
        <input type="text" id="cc-search-input" placeholder="Search messages..." autocomplete="off">
        <div class="search-nav" id="cc-search-nav" style="display:none;">
          <span id="cc-search-count">0/0</span>
          <button id="cc-search-prev" title="Previous">▲</button>
          <button id="cc-search-next" title="Next">▼</button>
        </div>
        <button class="search-close" id="cc-search-close">✕</button>
      </div>
    </div>

    <!-- Messages area (with scroll container for FAB) -->
    <div style="flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0;">
      <div class="cc-msgs" id="cc-messages">
        ${hasRealMessages ? rendered : `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;">
            <div style="font-size:2.4rem;margin-bottom:12px;">💬</div>
            <div style="font-family:var(--font-display);font-size:1.3rem;margin-bottom:4px;">Start chatting</div>
            <div style="font-size:.78rem;color:var(--muted);line-height:1.6;max-width:260px;">
              This is your private conversation with ${U.esc(theirN)}. Messages are AI-enhanced for better communication.
            </div>
          </div>
        `}
      </div>
      <!-- Scroll to bottom FAB (hidden by default) -->
      <div class="cc-scroll-fab" id="cc-scroll-fab" style="display:none;">
        ↓
      </div>
    </div>

    <!-- Smart Replies -->
    <div id="cc-smart-replies" style="display:none;padding:6px 16px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;border-top:1px solid var(--border);background:var(--cream);flex-shrink:0;"></div>

    <!-- Conversation Starters (shown when no real messages) -->
    ${!hasRealMessages ? `
    <div id="cc-starters" style="padding:8px 16px;">
      <div style="font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:6px;">Start the conversation</div>
      ${SmartReplies.conversationStarters().map(s => `<div class="starter-chip" data-starter="${U.esc(s)}">${U.esc(s)}</div>`).join('')}
    </div>` : ''}

    <!-- AI Hint (appears contextually) -->
    <div id="cc-ai-hint" style="display:none;"></div>

    <!-- Input Area -->
    <div class="cc-input-area">
      <div class="tone-coach tone-coach-hidden" id="cc-coach" style="margin-bottom:4px;"></div>
      <!-- Reply / Edit banner (injected dynamically) -->
      <div id="cc-reply-banner-slot"></div>
      <!-- Emoji tray (hidden by default) -->
      <div id="cc-emoji-slot"></div>
      <div class="cc-input-row">
        <button class="cc-send-btn" style="background:var(--parchment);color:var(--muted);font-size:.82rem;" id="cc-plus-btn">+</button>
        <textarea class="cc-textarea" id="cc-input" rows="1" placeholder="Message ${U.esc(theirN)}...">${U.esc(draft)}</textarea>
        <button class="cc-send-btn" id="cc-send" ${draft ? '' : 'disabled'}>↑</button>
      </div>
      <div class="cc-actions" id="cc-quick-actions" style="display:none;">
        ${actions.map(a => `<div class="cc-action-chip" data-cmd="${a.command}"><span>${a.icon}</span> ${a.label}</div>`).join('')}
      </div>
    </div>
  </div>`;
}, (el) => {
  // ─── DOM references ─────────────────────────
  const input = el.querySelector('#cc-input');
  const sendBtn = el.querySelector('#cc-send');
  const msgContainer = el.querySelector('#cc-messages');
  const coach = el.querySelector('#cc-coach');
  const hintArea = el.querySelector('#cc-ai-hint');
  const plusBtn = el.querySelector('#cc-plus-btn');
  const quickActionsEl = el.querySelector('#cc-quick-actions');
  const scrollFab = el.querySelector('#cc-scroll-fab');
  const replySlot = el.querySelector('#cc-reply-banner-slot');
  const emojiSlot = el.querySelector('#cc-emoji-slot');

  // ─── State ──────────────────────────────────
  let _actionsOpen = false;
  let _emojiOpen = false;
  let _replyingTo = null; // message id
  let _editingMsg = null; // message id
  let _aiHintTimer = null;
  let _searchTimer = null;
  let _searchResults = [];
  let _searchIdx = -1;
  let _contextMenuMsgId = null;
  let _draftTimer = null;

  // ─── Auto-scroll to bottom or to new messages ─
  if (msgContainer) {
    requestAnimationFrame(() => {
      const newMsgsDivider = el.querySelector('#cc-new-msgs');
      if (newMsgsDivider) {
        newMsgsDivider.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        msgContainer.scrollTop = msgContainer.scrollHeight;
      }
    });
  }

  // ─── Scroll FAB logic ──────────────────────
  if (msgContainer && scrollFab) {
    msgContainer.addEventListener('scroll', () => {
      const distFromBottom = msgContainer.scrollHeight - msgContainer.scrollTop - msgContainer.clientHeight;
      scrollFab.style.display = distFromBottom > 200 ? 'flex' : 'none';
    });
    scrollFab.addEventListener('click', () => {
      msgContainer.scrollTo({ top: msgContainer.scrollHeight, behavior: 'smooth' });
      scrollFab.style.display = 'none';
    });
  }

  // ─── Smart replies ─────────────────────────
  const smartRepliesEl = el.querySelector('#cc-smart-replies');
  const lastTheirMsg = CoupleChat.messages().filter(m => m.from === 'them' && !m.deleted).slice(-1)[0];
  if (lastTheirMsg && smartRepliesEl) {
    const replies = SmartReplies.forMessage(lastTheirMsg);
    if (replies.length > 0) {
      smartRepliesEl.style.display = 'block';
      smartRepliesEl.innerHTML = replies.map(r =>
        `<span class="smart-reply-chip" data-reply="${U.esc(r)}">${U.esc(r)}</span>`
      ).join(' ');
      smartRepliesEl.querySelectorAll('.smart-reply-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          input.value = chip.dataset.reply;
          input.dispatchEvent(new Event('input'));
          input.focus();
          smartRepliesEl.style.display = 'none';
        });
      });
    }
  }

  // ─── Conversation starters ─────────────────
  el.querySelectorAll('.starter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      input.value = chip.dataset.starter;
      input.dispatchEvent(new Event('input'));
      input.focus();
    });
  });

  // ─── ToneCoach on input ────────────────────
  if (input && coach) ToneCoach.attachToTextarea(input, coach);

  // ─── Input handling ────────────────────────
  input?.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim();
    // Auto-resize (iMessage-style: textarea grows, messages stay scrolled to bottom)
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    // Keep messages scrolled to bottom as textarea grows
    if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;

    // Update send button appearance for edit mode
    if (_editingMsg) {
      sendBtn.classList.toggle('editing', !!input.value.trim());
    }

    // Draft saving (debounced)
    clearTimeout(_draftTimer);
    _draftTimer = setTimeout(() => {
      if (!_editingMsg) CoupleChat.saveDraft(input.value);
    }, 500);

    // AI hint (debounced)
    clearTimeout(_aiHintTimer);
    if (input.value.length > 15 && !_editingMsg) {
      _aiHintTimer = setTimeout(() => {
        const hint = CoupleChat.getAIHint(input.value);
        if (hint && hint.type !== 'tone' && hintArea) {
          hintArea.style.display = 'block';
          hintArea.innerHTML = `
            <div class="cc-ai-insight" style="margin:0 12px 4px;" ${hint.action ? `onclick="Router.go('${U.esc(hint.action)}')"` : ''}>
              <div class="cc-ai-icon">🤖</div>
              <div class="cc-ai-text">${hint.msg}</div>
            </div>`;
        } else if (hintArea) {
          hintArea.style.display = 'none';
        }
      }, 600);
    } else if (hintArea) {
      hintArea.style.display = 'none';
    }
  });

  // ─── Restore draft ─────────────────────────
  if (input && input.value) {
    sendBtn.disabled = false;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  // ─── Plus button / quick actions ───────────
  plusBtn?.addEventListener('click', () => {
    _actionsOpen = !_actionsOpen;
    // Close emoji tray if open
    if (_emojiOpen) { _emojiOpen = false; emojiSlot.innerHTML = ''; }
    quickActionsEl.style.display = _actionsOpen ? 'flex' : 'none';
    plusBtn.textContent = _actionsOpen ? '×' : '+';
    plusBtn.style.background = _actionsOpen ? 'var(--terra)' : 'var(--parchment)';
    plusBtn.style.color = _actionsOpen ? '#fff' : 'var(--muted)';
  });

  // ─── Quick action commands ─────────────────
  el.querySelectorAll('.cc-action-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const cmd = chip.dataset.cmd;
      _actionsOpen = false;
      quickActionsEl.style.display = 'none';
      plusBtn.textContent = '+';
      plusBtn.style.background = 'var(--parchment)';
      plusBtn.style.color = 'var(--muted)';
      switch (cmd) {
        case '/plan': Router.go('compose-pick'); break;
        case '/task': Router.go('task-create'); break;
        case '/appreciate': Router.go('appreciation'); break;
        case '/plans': Router.go('plan'); break;
        case '/mytasks': Router.go('tasks'); break;
        case '/ai': Router.go('mediator'); break;
        case '/emoji': toggleEmojiTray(); break;
        case '/stats': showChatStats(); break;
        case '/greet-morning':
          input.value = 'Good morning! Hope you slept well ☀️';
          input.dispatchEvent(new Event('input'));
          input.focus();
          break;
        case '/greet-afternoon':
          input.value = 'Hey, just thinking of you 💛';
          input.dispatchEvent(new Event('input'));
          input.focus();
          break;
        case '/greet-evening':
          input.value = 'Hey! How was your day?';
          input.dispatchEvent(new Event('input'));
          input.focus();
          break;
        case '/space':
          CoupleChat.send("I need a little space right now. I'll come back when I'm ready to talk. 🙏", {
            filtered: "I need a little space right now. I'll come back when I'm ready to talk. 🙏"
          });
          Router.reload();
          break;
        default:
          input.value = cmd + ' ';
          input.focus();
      }
    });
  });

  // ─── Emoji tray ────────────────────────────
  const COMMON_EMOJIS = ['❤️','😊','😂','👍','🙏','😘','🥰','💛','😍','🎉','✨','🔥','💪','😢','🤔','👏','💯','😎','🤗','😴'];
  function toggleEmojiTray() {
    _emojiOpen = !_emojiOpen;
    if (_emojiOpen) {
      emojiSlot.innerHTML = `<div class="cc-emoji-tray">${COMMON_EMOJIS.map(e =>
        `<button data-emoji="${e}">${e}</button>`
      ).join('')}</div>`;
      emojiSlot.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const pos = input.selectionStart || input.value.length;
          input.value = input.value.slice(0, pos) + btn.dataset.emoji + input.value.slice(pos);
          input.dispatchEvent(new Event('input'));
          input.focus();
        });
      });
    } else {
      emojiSlot.innerHTML = '';
    }
  }

  // ─── Chat stats modal ─────────────────────
  function showChatStats() {
    const stats = ChatAnalytics.summary(30);
    const digest = ChatAnalytics.weeklyDigest();
    const overlay = document.createElement('div');
    overlay.className = 'cc-context-overlay';
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:201;background:var(--surface);border-radius:18px;padding:24px;min-width:280px;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:ccFadeScale .2s ease both;';
    modal.innerHTML = `
      <div style="font-size:1rem;font-weight:700;margin-bottom:12px;">📊 Chat Statistics</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
        <div style="background:var(--parchment);padding:10px;border-radius:10px;text-align:center;">
          <div style="font-size:1.3rem;font-weight:700;color:var(--terra);">${stats.totalMessages}</div>
          <div style="font-size:.6rem;color:var(--muted);">Messages (30d)</div>
        </div>
        <div style="background:var(--parchment);padding:10px;border-radius:10px;text-align:center;">
          <div style="font-size:1.3rem;font-weight:700;color:var(--sage);">${stats.daysActive}</div>
          <div style="font-size:.6rem;color:var(--muted);">Days Active</div>
        </div>
        <div style="background:var(--parchment);padding:10px;border-radius:10px;text-align:center;">
          <div style="font-size:1.3rem;font-weight:700;color:var(--amber);">${stats.avgResponseTime > 0 ? stats.avgResponseTime + 'min' : '—'}</div>
          <div style="font-size:.6rem;color:var(--muted);">Avg Reply Time</div>
        </div>
        <div style="background:var(--parchment);padding:10px;border-radius:10px;text-align:center;">
          <div style="font-size:1.3rem;font-weight:700;color:var(--purple);">${stats.myMessages}/${stats.theirMessages}</div>
          <div style="font-size:.6rem;color:var(--muted);">You / Them</div>
        </div>
      </div>
      <div style="font-size:.72rem;color:var(--muted);line-height:1.6;">
        ${digest.map(d => '<div>• ' + d + '</div>').join('')}
      </div>
      <button class="btn btn-outline btn-sm" style="width:100%;margin-top:12px;" id="cc-stats-close">Close</button>
    `;
    document.body.appendChild(overlay);
    document.body.appendChild(modal);
    overlay.addEventListener('click', () => { overlay.remove(); modal.remove(); });
    modal.querySelector('#cc-stats-close').addEventListener('click', () => { overlay.remove(); modal.remove(); });
  }

  // ─── Reply-to functionality ────────────────
  function startReply(msgId) {
    const msg = CoupleChat.getById(msgId);
    if (!msg || msg.deleted) return;
    _replyingTo = msgId;
    _editingMsg = null;
    const name = msg.from === 'me' ? 'yourself' : Auth.theirName();
    const preview = (msg.filtered || msg.raw || '').slice(0, 60);
    replySlot.innerHTML = `
      <div class="cc-reply-banner">
        <div style="flex:1;min-width:0;">
          <div class="reply-name">Replying to ${U.esc(name)}</div>
          <div class="reply-text">${U.esc(preview)}</div>
        </div>
        <button class="reply-close" id="cc-reply-close">✕</button>
      </div>`;
    replySlot.querySelector('#cc-reply-close').addEventListener('click', cancelReply);
    input.focus();
  }

  function cancelReply() {
    _replyingTo = null;
    replySlot.innerHTML = '';
  }

  // ─── Edit functionality ────────────────────
  function startEdit(msgId) {
    const msg = CoupleChat.getById(msgId);
    if (!msg || msg.from !== 'me' || msg.deleted) return;
    _editingMsg = msgId;
    _replyingTo = null;
    input.value = msg.raw;
    input.dispatchEvent(new Event('input'));
    sendBtn.classList.add('editing');
    sendBtn.textContent = '✓';
    replySlot.innerHTML = `
      <div class="cc-edit-banner">
        <div class="edit-label">✏️ Editing message</div>
        <button class="edit-close" id="cc-edit-close">✕</button>
      </div>`;
    replySlot.querySelector('#cc-edit-close').addEventListener('click', cancelEdit);
    input.focus();
  }

  function cancelEdit() {
    _editingMsg = null;
    input.value = '';
    input.dispatchEvent(new Event('input'));
    sendBtn.classList.remove('editing');
    sendBtn.textContent = '↑';
    replySlot.innerHTML = '';
  }

  // ─── Context menu (long-press / right-click) ─
  const REACTION_EMOJIS = ['❤️', '👍', '😂', '😢', '🙏', '🔥'];

  function showContextMenu(msgId, x, y) {
    dismissContextMenu();
    _contextMenuMsgId = msgId;
    const msg = CoupleChat.getById(msgId);
    if (!msg || msg.deleted) return;

    const overlay = document.createElement('div');
    overlay.className = 'cc-context-overlay';
    overlay.id = 'cc-ctx-overlay';

    const menu = document.createElement('div');
    menu.className = 'cc-context-menu';
    menu.id = 'cc-ctx-menu';

    // Reaction bar at top
    const reactionBar = document.createElement('div');
    reactionBar.style.cssText = 'display:flex;justify-content:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);';
    REACTION_EMOJIS.forEach(emoji => {
      const btn = document.createElement('button');
      btn.style.cssText = 'width:36px;height:36px;border-radius:50%;background:none;border:none;font-size:1.2rem;cursor:pointer;transition:transform .1s ease;display:flex;align-items:center;justify-content:center;';
      btn.textContent = emoji;
      btn.addEventListener('click', () => {
        CoupleChat.react(msgId, emoji);
        dismissContextMenu();
        Router.reload();
      });
      reactionBar.appendChild(btn);
    });
    menu.appendChild(reactionBar);

    // Menu items
    const items = [
      { icon: '↩', label: 'Reply', action: () => { startReply(msgId); } },
      { icon: '📋', label: 'Copy text', action: () => {
        navigator.clipboard?.writeText(msg.filtered || msg.raw).then(() => U.toast('Copied!'));
      }},
      { icon: '📌', label: msg.pinned ? 'Unpin' : 'Pin', action: () => {
        CoupleChat.togglePin(msgId);
        Router.reload();
      }},
    ];

    // Only allow edit/delete on own messages
    if (msg.from === 'me') {
      items.push({ icon: '✏️', label: 'Edit', action: () => { startEdit(msgId); } });
      items.push({ icon: '🗑', label: 'Delete', danger: true, action: () => {
        CoupleChat.deleteMessage(msgId);
        Router.reload();
      }});
    }

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'cc-ctx-item' + (item.danger ? ' danger' : '');
      div.innerHTML = `<span class="ctx-icon">${item.icon}</span> ${item.label}`;
      div.addEventListener('click', () => {
        dismissContextMenu();
        item.action();
      });
      menu.appendChild(div);
    });

    // Position menu
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;
    let left = Math.min(x, viewW - 200);
    let top = Math.min(y, viewH - 300);
    if (left < 10) left = 10;
    if (top < 10) top = 10;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';

    overlay.addEventListener('click', dismissContextMenu);
    document.body.appendChild(overlay);
    document.body.appendChild(menu);
  }

  function dismissContextMenu() {
    document.querySelector('#cc-ctx-overlay')?.remove();
    document.querySelector('#cc-ctx-menu')?.remove();
    _contextMenuMsgId = null;
  }

  // ─── Bubble interactions ───────────────────
  el.querySelectorAll('.cc-bubble-wrap').forEach(wrap => {
    const msgId = wrap.dataset.msgId;
    if (!msgId) return;

    // Double-tap for quick heart react
    let _tapCount = 0;
    let _tapTimer = null;
    wrap.addEventListener('click', (e) => {
      if (e.target.closest('.cc-reaction-badge') || e.target.closest('.cc-reply-preview')) return;
      _tapCount++;
      if (_tapCount === 2) {
        clearTimeout(_tapTimer);
        _tapCount = 0;
        CoupleChat.react(msgId, '❤️');
        Router.reload();
      } else {
        _tapTimer = setTimeout(() => { _tapCount = 0; }, 350);
      }
    });

    // Long-press for context menu
    let _longPressTimer = null;
    let _longPressed = false;
    wrap.addEventListener('touchstart', (e) => {
      _longPressed = false;
      const touch = e.touches[0];
      _longPressTimer = setTimeout(() => {
        _longPressed = true;
        if (navigator.vibrate) navigator.vibrate(30);
        showContextMenu(msgId, touch.clientX, touch.clientY);
      }, 500);
    }, { passive: true });
    wrap.addEventListener('touchend', () => {
      clearTimeout(_longPressTimer);
    });
    wrap.addEventListener('touchmove', () => {
      clearTimeout(_longPressTimer);
    });

    // Right-click for context menu (desktop)
    wrap.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(msgId, e.clientX, e.clientY);
    });
  });

  // ─── Tap on reaction badges to toggle ──────
  el.querySelectorAll('.cc-reaction-badge').forEach(badge => {
    badge.addEventListener('click', (e) => {
      e.stopPropagation();
      const msgId = badge.dataset.msgId;
      const emoji = badge.dataset.emoji;
      if (msgId && emoji) {
        CoupleChat.react(msgId, emoji);
        Router.reload();
      }
    });
  });

  // ─── Tap on reply previews to scroll to original ─
  el.querySelectorAll('.cc-reply-preview').forEach(rp => {
    rp.addEventListener('click', (e) => {
      e.stopPropagation();
      const targetId = rp.dataset.scrollTo;
      if (!targetId) return;
      const target = el.querySelector(`.cc-bubble-wrap[data-msg-id="${targetId}"]`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.classList.add('selected');
        setTimeout(() => target.classList.remove('selected'), 1500);
      }
    });
  });

  // ─── Pinned banner tap to scroll ───────────
  el.querySelector('#cc-pinned')?.addEventListener('click', () => {
    const msgId = el.querySelector('#cc-pinned').dataset.msgId;
    if (!msgId) return;
    const target = el.querySelector(`.cc-bubble-wrap[data-msg-id="${msgId}"]`);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.add('selected');
      setTimeout(() => target.classList.remove('selected'), 1500);
    }
  });

  // ─── Search functionality ──────────────────
  const searchBar = el.querySelector('#cc-search-bar');
  const searchInput = el.querySelector('#cc-search-input');
  const searchNav = el.querySelector('#cc-search-nav');
  const searchCount = el.querySelector('#cc-search-count');

  el.querySelector('#cc-search-btn')?.addEventListener('click', () => {
    const isHidden = searchBar.style.display === 'none';
    searchBar.style.display = isHidden ? 'block' : 'none';
    if (isHidden) { searchInput.value = ''; searchInput.focus(); }
    else { clearSearch(); }
  });

  el.querySelector('#cc-search-close')?.addEventListener('click', () => {
    searchBar.style.display = 'none';
    clearSearch();
  });

  function clearSearch() {
    _searchResults = [];
    _searchIdx = -1;
    searchNav.style.display = 'none';
    el.querySelectorAll('.cc-bubble-wrap, .cc-date-divider, .cc-ai-insight').forEach(n => {
      n.style.opacity = '1';
    });
    // Remove highlights
    el.querySelectorAll('.cc-search-highlight, .cc-search-current').forEach(h => {
      h.outerHTML = h.textContent;
    });
  }

  function navigateSearch(direction) {
    if (_searchResults.length === 0) return;
    _searchIdx = (_searchIdx + direction + _searchResults.length) % _searchResults.length;
    searchCount.textContent = `${_searchIdx + 1}/${_searchResults.length}`;
    const targetId = _searchResults[_searchIdx].id;
    const target = el.querySelector(`.cc-bubble-wrap[data-msg-id="${targetId}"]`);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.add('selected');
      setTimeout(() => target.classList.remove('selected'), 1000);
    }
  }

  searchInput?.addEventListener('input', (e) => {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(() => {
      const query = e.target.value.trim();
      if (query.length < 2) { clearSearch(); return; }
      _searchResults = CoupleChat.searchMessages(query);
      const matchIds = new Set(_searchResults.map(r => r.id));
      el.querySelectorAll('.cc-bubble-wrap').forEach(wrap => {
        wrap.style.opacity = matchIds.has(wrap.dataset.msgId) ? '1' : '0.15';
      });
      if (_searchResults.length > 0) {
        searchNav.style.display = 'flex';
        _searchIdx = _searchResults.length - 1; // Start from most recent
        searchCount.textContent = `${_searchIdx + 1}/${_searchResults.length}`;
        navigateSearch(0);
      } else {
        searchNav.style.display = 'none';
      }
    }, 250);
  });

  el.querySelector('#cc-search-prev')?.addEventListener('click', () => navigateSearch(-1));
  el.querySelector('#cc-search-next')?.addEventListener('click', () => navigateSearch(1));

  // ─── Info panel ────────────────────────────
  CoupleChat._showInfo = function() {
    const stats = CoupleChat.stats();
    const pinned = CoupleChat.pinnedMessages();
    const theirN = Auth.theirName();
    const drawer = document.createElement('div');
    drawer.className = 'cc-info-drawer';
    drawer.id = 'cc-info-drawer';
    drawer.innerHTML = `
      <div class="info-header">
        <button style="background:none;border:none;color:var(--cream);font-size:1.1rem;cursor:pointer;" id="cc-info-back">‹</button>
        <div style="flex:1;font-size:.92rem;font-weight:600;">Chat with ${U.esc(theirN)}</div>
      </div>
      <div class="info-body">
        <div style="text-align:center;padding:20px 0;">
          <div style="width:64px;height:64px;border-radius:50%;background:#1a2d24;color:var(--sage);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;margin:0 auto 8px;">${U.initials(theirN)}</div>
          <div style="font-size:1.1rem;font-weight:700;">${U.esc(theirN)}</div>
          <div style="font-size:.68rem;color:var(--muted);">${Auth.hasPartner() ? 'Connected partner' : 'Awaiting connection'}</div>
        </div>

        <div class="cc-info-section">
          <div class="section-title">Chat Summary</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
            <div style="text-align:center;padding:10px;background:var(--parchment);border-radius:10px;">
              <div style="font-size:1.1rem;font-weight:700;color:var(--terra);">${stats.total}</div>
              <div style="font-size:.58rem;color:var(--muted);">Messages</div>
            </div>
            <div style="text-align:center;padding:10px;background:var(--parchment);border-radius:10px;">
              <div style="font-size:1.1rem;font-weight:700;color:var(--sage);">${stats.filtered}</div>
              <div style="font-size:.58rem;color:var(--muted);">Filtered</div>
            </div>
            <div style="text-align:center;padding:10px;background:var(--parchment);border-radius:10px;">
              <div style="font-size:1.1rem;font-weight:700;color:var(--amber);">${stats.pinned}</div>
              <div style="font-size:.58rem;color:var(--muted);">Pinned</div>
            </div>
          </div>
        </div>

        ${pinned.length > 0 ? `
        <div class="cc-info-section">
          <div class="section-title">Pinned Messages (${pinned.length})</div>
          ${pinned.map(m => `
            <div class="cc-info-item" data-pin-msg="${m.id}">
              <span class="ii-icon">📌</span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.esc((m.filtered || m.raw).slice(0, 60))}</div>
                <div style="font-size:.58rem;color:var(--muted);">${new Date(m.timestamp).toLocaleDateString()}</div>
              </div>
            </div>
          `).join('')}
        </div>` : ''}

        <div class="cc-info-section">
          <div class="section-title">Actions</div>
          <div class="cc-info-item" id="cc-export-chat">
            <span class="ii-icon">📤</span> Export chat history
          </div>
          <div class="cc-info-item" id="cc-clear-chat" style="color:#E05555;">
            <span class="ii-icon">🗑</span> Clear all messages
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(drawer);

    drawer.querySelector('#cc-info-back').addEventListener('click', () => drawer.remove());

    // Pinned message taps
    drawer.querySelectorAll('[data-pin-msg]').forEach(item => {
      item.addEventListener('click', () => {
        drawer.remove();
        const target = el.querySelector(`.cc-bubble-wrap[data-msg-id="${item.dataset.pinMsg}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('selected');
          setTimeout(() => target.classList.remove('selected'), 1500);
        }
      });
    });

    // Export chat
    drawer.querySelector('#cc-export-chat')?.addEventListener('click', () => {
      const text = CoupleChat.exportChat('text');
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `parlay-chat-${new Date().toISOString().split('T')[0]}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      U.toast('Chat exported!');
    });

    // Clear chat
    drawer.querySelector('#cc-clear-chat')?.addEventListener('click', async () => {
      if (confirm('Are you sure you want to clear all messages? This cannot be undone.')) {
        const coupleId = Auth.couple()?.id;
        if (coupleId) {
          await Auth.sb().from('chat_messages').delete().eq('couple_id', coupleId);
        }
        CoupleChat.invalidate();
        drawer.remove();
        Router.reload();
        U.toast('Chat cleared');
      }
    });
  };

  el.querySelector('#cc-info-btn')?.addEventListener('click', () => CoupleChat._showInfo());

  // ─── Dismiss any open toxicity review prompt ─
  function dismissToxicityPrompt() {
    const prompt = document.querySelector('#cc-toxicity-prompt');
    if (prompt) prompt.remove();
  }

  // ─── Show toxicity filtering prompt ────────
  function showToxicityPrompt(rawText, filteredText) {
    dismissToxicityPrompt();
    const inputArea = el.querySelector('.cc-input-area');
    if (!inputArea) return;
    const promptDiv = document.createElement('div');
    promptDiv.id = 'cc-toxicity-prompt';
    promptDiv.style.cssText = 'padding:12px 16px;background:linear-gradient(135deg,rgba(122,158,138,.12),rgba(196,113,74,.08));border-top:1px solid var(--border);';
    promptDiv.innerHTML = `
      <div style="font-size:.72rem;font-weight:600;color:var(--sage);margin-bottom:6px;">✨ Parlay refined your message</div>
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:4px;text-decoration:line-through;opacity:.6;">${U.esc(rawText)}</div>
      <div style="font-size:.88rem;line-height:1.5;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:10px;color:var(--espresso);">${U.esc(filteredText)}</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-accent btn-sm" id="cc-send-filtered" style="flex:1;font-size:.82rem;padding:8px 12px;">Send refined ✓</button>
        <button class="btn btn-outline btn-sm" id="cc-send-original" style="font-size:.72rem;padding:8px 10px;color:var(--muted);">Send original</button>
        <button class="btn btn-outline btn-sm" id="cc-send-cancel" style="font-size:.72rem;padding:8px 10px;color:var(--muted);">Cancel</button>
      </div>
    `;
    inputArea.insertBefore(promptDiv, inputArea.firstChild);
    promptDiv.querySelector('#cc-send-filtered').addEventListener('click', () => finishSend(rawText, filteredText));
    promptDiv.querySelector('#cc-send-original').addEventListener('click', () => finishSend(rawText, rawText));
    promptDiv.querySelector('#cc-send-cancel').addEventListener('click', () => {
      dismissToxicityPrompt();
      input.value = rawText;
      input.dispatchEvent(new Event('input'));
      input.focus();
    });
  }

  // ─── Send message flow ─────────────────────
  async function doSend() {
    const text = input.value.trim();
    if (!text) return;

    // Handle edit mode
    if (_editingMsg) {
      CoupleChat.editMessage(_editingMsg, text);
      cancelEdit();
      Router.reload();
      return;
    }

    dismissToxicityPrompt();
    sendBtn.disabled = true;
    sendBtn.textContent = '…';
    const savedReplyTo = _replyingTo;
    input.value = '';
    input.style.height = 'auto';
    cancelReply();

    // Hide hints and actions
    if (hintArea) hintArea.style.display = 'none';
    if (quickActionsEl) quickActionsEl.style.display = 'none';
    if (plusBtn) { plusBtn.textContent = '+'; plusBtn.style.background = 'var(--parchment)'; plusBtn.style.color = 'var(--muted)'; }
    _actionsOpen = false;
    if (_emojiOpen) { _emojiOpen = false; emojiSlot.innerHTML = ''; }

    // Filter through AI
    let filtered = text;
    try {
      filtered = await AIContext.enhancedToneFilter(text);
    } catch(e) { filtered = text; }

    sendBtn.textContent = '↑';
    sendBtn.disabled = false;

    // If the message was meaningfully changed by the filter, show the prompt
    // Ignore trivial changes: capitalization, trailing punctuation, extra spaces
    const normalize = s => s.toLowerCase().replace(/[\s.!?,;:]+/g, ' ').trim();
    if (filtered && filtered !== text && normalize(filtered) !== normalize(text)) {
      showToxicityPrompt(text, filtered);
      return;
    }

    // Message wasn't changed — send directly
    finishSend(text, filtered, savedReplyTo);
  }

  // ─── Finish sending ────────────────────────
  function finishSend(text, filtered, replyTo) {
    dismissToxicityPrompt();
    const opts = { filtered };
    if (replyTo || _replyingTo) opts.replyTo = replyTo || _replyingTo;
    const msg = CoupleChat.send(text, opts);
    _replyingTo = null;

    // Check if AI insight should be injected
    const hint = CoupleChat.getAIHint(text);
    if (hint && hint.type !== 'tone') {
      setTimeout(() => {
        CoupleChat.addAIInsight(hint.msg, hint.action);
        if (Router.current() === 'couple-chat') Router.reload();
      }, 500);
    }

    sendBtn.textContent = '↑';

    // Re-render to show new message
    Router.reload();
  }

  // ─── Send button + Enter key ───────────────
  sendBtn?.addEventListener('click', doSend);
  input?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      doSend();
    }
    // Escape cancels reply/edit
    if (e.key === 'Escape') {
      if (_editingMsg) cancelEdit();
      else if (_replyingTo) cancelReply();
    }
  });

  // ─── Swipe-to-reply (touch) ────────────────
  el.querySelectorAll('.cc-bubble-wrap').forEach(wrap => {
    const msgId = wrap.dataset.msgId;
    if (!msgId) return;

    let _startX = 0, _startY = 0, _swiping = false;
    wrap.addEventListener('touchstart', (e) => {
      _startX = e.touches[0].clientX;
      _startY = e.touches[0].clientY;
      _swiping = false;
    }, { passive: true });

    wrap.addEventListener('touchmove', (e) => {
      const dx = e.touches[0].clientX - _startX;
      const dy = Math.abs(e.touches[0].clientY - _startY);
      // Only trigger horizontal swipe
      if (dy > 30) return;
      const isMe = wrap.classList.contains('me');
      const swipeDir = isMe ? dx < -30 : dx > 30;
      if (swipeDir && !_swiping) {
        _swiping = true;
        wrap.classList.add('swiping');
      }
    }, { passive: true });

    wrap.addEventListener('touchend', () => {
      if (_swiping) {
        wrap.classList.remove('swiping');
        startReply(msgId);
      }
      _swiping = false;
    });
  });
});

  const grid = CalendarEngine.monthGrid(currentYear, currentMonth);
  const todayEvents = CalendarEngine.eventsForDate(today);
  const weekDays = CalendarEngine.weekDays(now);
  const aiSummary = CalendarEngine.aiSummary(todayEvents, 'day');
  const tools = ContextTools.forScreen('calendar');

  return `
  <div class="cal-wrapper">
    <!-- Header -->
    <div class="cal-header" id="cal-header">
      <div class="cal-title-row">
        <div class="cal-title" id="cal-month-label">${monthName}</div>
        <div class="cal-nav-btns">

          <button class="cal-nav-btn" id="cal-today-btn" style="font-size:.62rem;font-weight:700;">Today</button>
          <button class="cal-nav-btn" id="cal-next">›</button>
        </div>
      </div>

      <!-- View Tabs -->
      <div class="cal-view-tabs" id="cal-view-tabs">
        <button class="cal-view-tab active" data-view="month">Month</button>
        <button class="cal-view-tab" data-view="week">Week</button>
        <button class="cal-view-tab" data-view="day">Day</button>
      </div>

      <!-- Day of week headers (month view) -->
      <div class="cal-month-grid" id="cal-dow-row" style="padding-bottom:0;">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
      </div>

      <!-- Month Grid -->
      <div class="cal-month-grid" id="cal-grid">
        ${grid.map(cell => {
          const dotColors = cell.events.slice(0, 3).map(e => e.color);
          return `
          <div class="cal-cell${cell.isToday ? ' today' : ''}${!cell.isCurrentMonth ? ' other-month' : ''}${cell.dateStr === today ? ' selected' : ''}"
               data-date="${cell.dateStr}">
            ${cell.day}
            ${dotColors.length > 0 ? `<div class="cal-dot-row">${dotColors.map(c => `<div class="cal-dot" style="background:${c};"></div>`).join('')}</div>` : ''}
          </div>`;
        }).join('')}
      </div>

      <!-- Week View (hidden by default) -->
      <div id="cal-week-view" style="display:none;padding:8px;">
        <div class="cal-week-row">
          ${weekDays.map(d => `
            <div class="cal-week-cell${d.isToday ? ' today' : ''}${d.date === today ? ' selected' : ''}" data-date="${d.date}">
              <span class="cal-dow-label">${d.dow}</span>
              ${d.day}
              ${d.events.length > 0 ? `<div style="display:flex;gap:2px;justify-content:center;margin-top:2px;">${d.events.slice(0,3).map(e => `<div class="cal-dot" style="background:${e.color};"></div>`).join('')}</div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <!-- Context Toolbar -->
    <div class="ctx-toolbar">
      ${tools.map(t => `<div class="ctx-tool" onclick="Router.go('${t.route}')"><span class="ctx-icon">${t.icon}</span>${t.label}</div>`).join('')}
    </div>

    <!-- Day Detail Body -->
    <div class="cal-body" id="cal-body">
      <!-- AI Summary -->
      <div class="cal-ai-summary" id="cal-ai-summary">
        🤖 ${aiSummary}
      </div>

      <!-- Selected Day Header -->
      <div class="cal-day-header" id="cal-day-header">
        <div class="cal-day-label" id="cal-day-label">${now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</div>
        <button class="btn btn-outline btn-sm" onclick="Router.go('compose-pick')">+ Add</button>
      </div>

      <!-- Events List -->
      <div id="cal-events">
        ${todayEvents.length > 0 ? todayEvents.map(ev => `
          <div class="cal-event-card" onclick="Router.go('${ev.route}',${JSON.stringify(ev.routeParams)})">
            <div class="cal-event-dot" style="background:${ev.color};"></div>
            <span style="font-size:1rem;">${ev.icon}</span>
            <div style="flex:1;min-width:0;">
              <div class="cal-event-title">${U.esc(ev.title)}</div>
              <div class="cal-event-sub">${ev.type === 'confirmed' ? '✓ Confirmed' : ev.type === 'proposed' ? '🔄 Proposed' : ev.type === 'task' ? (ev.status === 'done' ? '✅ Done' : '📋 Due') : '🎯 Goal'}</div>
            </div>
            ${ev.time ? `<div class="cal-event-time">${ev.time}</div>` : ''}
          </div>
        `).join('') : `
          <div class="cal-empty">
            <div style="font-size:1.3rem;margin-bottom:8px;">✨</div>
            <div>Nothing scheduled</div>
            <div style="font-size:.72rem;margin-top:4px;">A clear day — perfect for planning something together.</div>
          </div>
        `}
      </div>
    </div>
  </div>`;
}, (el) => {
  let _currentDate = new Date();
  let _selectedDate = new Date().toISOString().split('T')[0];
  let _currentView = 'month';

  // View tab switching
  el.querySelectorAll('.cal-view-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      el.querySelectorAll('.cal-view-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      _currentView = tab.dataset.view;

      const grid = el.querySelector('#cal-grid');
      const dowRow = el.querySelector('#cal-dow-row');
      const weekView = el.querySelector('#cal-week-view');

      if (_currentView === 'month') {
        grid.style.display = 'grid';
        dowRow.style.display = 'grid';
        weekView.style.display = 'none';
      } else if (_currentView === 'week') {
        grid.style.display = 'none';
        dowRow.style.display = 'none';
        weekView.style.display = 'block';
        renderWeek();
      } else {
        grid.style.display = 'none';
        dowRow.style.display = 'none';
        weekView.style.display = 'none';
      }
      renderDayDetail(_selectedDate);
    });
  });

  // Cell click → select date
  function onCellClick(e) {
    const cell = e.target.closest('[data-date]');
    if (!cell) return;
    _selectedDate = cell.dataset.date;

    // Update selection highlight
    el.querySelectorAll('.cal-cell, .cal-week-cell').forEach(c => c.classList.remove('selected'));
    el.querySelectorAll(`[data-date="${_selectedDate}"]`).forEach(c => c.classList.add('selected'));

    renderDayDetail(_selectedDate);
  }
  el.querySelector('#cal-grid')?.addEventListener('click', onCellClick);
  el.querySelector('#cal-week-view')?.addEventListener('click', onCellClick);

  // Render day detail panel
  function renderDayDetail(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    const events = CalendarEngine.eventsForDate(dateStr);
    const ai = CalendarEngine.aiSummary(events, _currentView === 'week' ? 'week' : 'day');

    el.querySelector('#cal-day-label').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    el.querySelector('#cal-ai-summary').innerHTML = `🤖 ${ai}`;

    const eventsEl = el.querySelector('#cal-events');
    if (events.length > 0) {
      eventsEl.innerHTML = events.map(ev => `
        <div class="cal-event-card" onclick="Router.go('${ev.route}',${JSON.stringify(ev.routeParams)})">
          <div class="cal-event-dot" style="background:${ev.color};"></div>
          <span style="font-size:1rem;">${ev.icon}</span>
          <div style="flex:1;min-width:0;">
            <div class="cal-event-title">${U.esc(ev.title)}</div>
            <div class="cal-event-sub">${ev.type === 'confirmed' ? '✓ Confirmed' : ev.type === 'proposed' ? '🔄 Proposed' : ev.type === 'task' ? (ev.status === 'done' ? '✅ Done' : '📋 Due') : '🎯 Goal'}</div>
          </div>
          ${ev.time ? `<div class="cal-event-time">${ev.time}</div>` : ''}
        </div>
      `).join('');
    } else {
      eventsEl.innerHTML = `
        <div class="cal-empty">
          <div style="font-size:1.3rem;margin-bottom:8px;">✨</div>
          <div>Nothing scheduled</div>
          <div style="font-size:.72rem;margin-top:4px;">
            <span style="color:var(--terra);cursor:pointer;font-weight:600;" onclick="Router.go('compose-pick')">Plan something →</span>
          </div>
        </div>`;
    }
  }

  // Navigate months
  function renderMonth() {
    const year = _currentDate.getFullYear();
    const month = _currentDate.getMonth();
    const cells = CalendarEngine.monthGrid(year, month);
    const today = new Date().toISOString().split('T')[0];

    el.querySelector('#cal-month-label').textContent = _currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    el.querySelector('#cal-grid').innerHTML = cells.map(cell => {
      const dotColors = cell.events.slice(0, 3).map(e => e.color);
      return `
      <div class="cal-cell${cell.isToday ? ' today' : ''}${!cell.isCurrentMonth ? ' other-month' : ''}${cell.dateStr === _selectedDate ? ' selected' : ''}"
           data-date="${cell.dateStr}">
        ${cell.day}
        ${dotColors.length > 0 ? `<div class="cal-dot-row">${dotColors.map(c => `<div class="cal-dot" style="background:${c};"></div>`).join('')}</div>` : ''}
      </div>`;
    }).join('');
  }

  function renderWeek() {
    const days = CalendarEngine.weekDays(_currentDate);
    el.querySelector('#cal-week-view').innerHTML = `
      <div class="cal-week-row">
        ${days.map(d => `
          <div class="cal-week-cell${d.isToday ? ' today' : ''}${d.date === _selectedDate ? ' selected' : ''}" data-date="${d.date}">
            <span class="cal-dow-label">${d.dow}</span>
            ${d.day}
            ${d.events.length > 0 ? `<div style="display:flex;gap:2px;justify-content:center;margin-top:2px;">${d.events.slice(0,3).map(e => `<div class="cal-dot" style="background:${e.color};"></div>`).join('')}</div>` : ''}
          </div>
        `).join('')}
      </div>`;
  }

  el.querySelector('#cal-prev')?.addEventListener('click', () => {
    if (_currentView === 'month') {
      _currentDate.setMonth(_currentDate.getMonth() - 1);
      renderMonth();
    } else if (_currentView === 'week') {
      _currentDate.setDate(_currentDate.getDate() - 7);
      renderWeek();
      el.querySelector('#cal-month-label').textContent = _currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    } else {
      _currentDate.setDate(_currentDate.getDate() - 1);
      _selectedDate = _currentDate.toISOString().split('T')[0];
      renderDayDetail(_selectedDate);
      el.querySelector('#cal-month-label').textContent = _currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }
  });

  el.querySelector('#cal-next')?.addEventListener('click', () => {
    if (_currentView === 'month') {
      _currentDate.setMonth(_currentDate.getMonth() + 1);
      renderMonth();
    } else if (_currentView === 'week') {
      _currentDate.setDate(_currentDate.getDate() + 7);
      renderWeek();
      el.querySelector('#cal-month-label').textContent = _currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    } else {
      _currentDate.setDate(_currentDate.getDate() + 1);
      _selectedDate = _currentDate.toISOString().split('T')[0];
      renderDayDetail(_selectedDate);
      el.querySelector('#cal-month-label').textContent = _currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }
  });

  el.querySelector('#cal-today-btn')?.addEventListener('click', () => {
    _currentDate = new Date();
    _selectedDate = _currentDate.toISOString().split('T')[0];
    if (_currentView === 'month') renderMonth();
    else if (_currentView === 'week') renderWeek();
    renderDayDetail(_selectedDate);
    el.querySelector('#cal-month-label').textContent = _currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    // Update selection
    el.querySelectorAll('.cal-cell, .cal-week-cell').forEach(c => c.classList.remove('selected'));
    el.querySelectorAll(`[data-date="${_selectedDate}"]`).forEach(c => c.classList.add('selected'));
  });
});

// SHARED NOTES — Couple's shared lists & notes
// ──────────────────────────────────────────────
const SharedNotes = (() => {
  const KEY = 'parlay_shared_notes';
  let _cache = null;

  function _load() {
    if (_cache) return _cache;
    try { _cache = JSON.parse(localStorage.getItem(KEY) || '[]'); }
    catch(e) { _cache = []; }
    return _cache;
  }

  function _save() { localStorage.setItem(KEY, JSON.stringify(_cache)); }

  function all() { return _load(); }

  function create(title, type, color) {
    _load();
    const COLORS = ['#C4714A', '#7A9E8A', '#6A8CAA', '#7A6A9B', '#E8B88A', '#9B8880'];
    const note = {
      id: 'sn_' + Date.now(), title, type: type || 'note',
      color: color || COLORS[Math.floor(Math.random() * COLORS.length)],
      content: '', items: [], createdBy: 'me',
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
      pinned: false, archived: false,
    };
    _cache.unshift(note);
    _save();
    return note;
  }

  function get(id) { return _load().find(n => n.id === id); }

  function update(id, changes) {
    _load();
    const note = _cache.find(n => n.id === id);
    if (!note) return null;
    Object.assign(note, changes, { updatedAt: new Date().toISOString() });
    _save();
    return note;
  }

  function addListItem(noteId, text) {
    _load();
    const note = _cache.find(n => n.id === noteId);
    if (!note) return null;
    const item = { id: 'si_' + Date.now(), text, checked: false, addedBy: 'me' };
    note.items.push(item);
    note.updatedAt = new Date().toISOString();
    _save();
    return item;
  }

  function toggleListItem(noteId, itemId) {
    _load();
    const note = _cache.find(n => n.id === noteId);
    if (!note) return;
    const item = note.items.find(i => i.id === itemId);
    if (item) item.checked = !item.checked;
    note.updatedAt = new Date().toISOString();
    _save();
  }

  function removeListItem(noteId, itemId) {
    _load();
    const note = _cache.find(n => n.id === noteId);
    if (!note) return;
    note.items = note.items.filter(i => i.id !== itemId);
    note.updatedAt = new Date().toISOString();
    _save();
  }

  function remove(id) { _load(); _cache = _cache.filter(n => n.id !== id); _save(); }

  function pin(id) {
    _load();
    const note = _cache.find(n => n.id === id);
    if (note) note.pinned = !note.pinned;
    _save();
  }

  function archive(id) {
    _load();
    const note = _cache.find(n => n.id === id);
    if (note) note.archived = true;
    _save();
  }

  function active() { return _load().filter(n => !n.archived); }
  function pinned() { return _load().filter(n => n.pinned && !n.archived); }
  function count() { return active().length; }
  function invalidate() { _cache = null; }

  const TEMPLATES = [
    { icon: '🛒', title: 'Grocery List', type: 'list', items: ['Milk', 'Bread', 'Eggs', 'Fruit', 'Vegetables'] },
    { icon: '🏠', title: 'Household To-Dos', type: 'list', items: ['Vacuum living room', 'Clean bathroom', 'Take out trash'] },

    { icon: '🎉', title: 'Party Planning', type: 'plan', items: ['Guest list', 'Food & drinks', 'Decorations', 'Music'] },
    { icon: '📝', title: 'Blank Note', type: 'note', items: [] },
  ];

  return { all, create, get, update, addListItem, toggleListItem, removeListItem, remove, pin, archive, active, pinned, count, invalidate, TEMPLATES };
})();

// BUDGET TRACKER — Simple shared expenses
// ──────────────────────────────────────────────
const BudgetTracker = (() => {
  const KEY = 'parlay_budget';
  let _cache = null;
  function _load() { if (_cache) return _cache; try { _cache = JSON.parse(localStorage.getItem(KEY) || '{"expenses":[],"monthlyBudget":0}'); } catch(e) { _cache = { expenses: [], monthlyBudget: 0 }; } return _cache; }
  function _save() { localStorage.setItem(KEY, JSON.stringify(_cache)); }

  function addExpense(title, amount, category, paidBy, date) {
    _load();
    const expense = { id: 'exp_' + Date.now(), title, amount: parseFloat(amount), category, paidBy: paidBy || 'me', date: date || new Date().toISOString().split('T')[0], createdAt: new Date().toISOString() };
    _cache.expenses.unshift(expense);
    _save();
    return expense;
  }

  function removeExpense(id) { _load(); _cache.expenses = _cache.expenses.filter(e => e.id !== id); _save(); }
  function expenses(month) { _load(); if (!month) return _cache.expenses; return _cache.expenses.filter(e => e.date.startsWith(month)); }
  function thisMonth() { return expenses(new Date().toISOString().slice(0, 7)); }
  function totalThisMonth() { return thisMonth().reduce((sum, e) => sum + e.amount, 0); }

  function byCategory(month) {
    const exps = month ? expenses(month) : thisMonth();
    const cats = {};
    exps.forEach(e => { cats[e.category] = (cats[e.category] || 0) + e.amount; });
    return cats;
  }

  function splitSummary(month) {
    const exps = month ? expenses(month) : thisMonth();
    let myTotal = 0, theirTotal = 0;
    exps.forEach(e => { if (e.paidBy === 'me') myTotal += e.amount; else theirTotal += e.amount; });
    const total = myTotal + theirTotal;
    const fair = total / 2;
    return { myTotal, theirTotal, total, iOwe: Math.max(0, fair - myTotal), theyOwe: Math.max(0, fair - theirTotal), balanced: Math.abs(myTotal - theirTotal) < 1 };
  }

  function setMonthlyBudget(amount) { _load(); _cache.monthlyBudget = parseFloat(amount); _save(); }
  function monthlyBudget() { _load(); return _cache.monthlyBudget; }
  function budgetRemaining() { return monthlyBudget() - totalThisMonth(); }
  function budgetPct() { const b = monthlyBudget(); return b > 0 ? Math.min(100, Math.round(totalThisMonth() / b * 100)) : 0; }

// ──────────────────────────────────────────────
// DECISION HELPER — AI-guided decision making
// ──────────────────────────────────────────────
const DecisionHelper = (() => {
  const KEY = 'parlay_decisions';
  let _cache = null;
  function _load() { if (_cache) return _cache; try { _cache = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { _cache = []; } return _cache; }
  function _save() { localStorage.setItem(KEY, JSON.stringify(_cache)); }

  function create(question, options, context) {
    _load();
    const decision = {
      id: 'dec_' + Date.now(), question,
      options: (options || []).map((o, i) => ({ id: 'opt_' + i, text: o, myVote: null, theirVote: null, pros: [], cons: [] })),
      context: context || '', status: 'open', decided: null,
      createdAt: new Date().toISOString(), decidedAt: null,
    };
    _cache.unshift(decision);
    _save();
    return decision;
  }

  function get(id) { return _load().find(d => d.id === id); }

  function vote(decisionId, optionId, who) {
    _load();
    const dec = _cache.find(d => d.id === decisionId);
    if (!dec) return;
    dec.options.forEach(o => {
      if ((who || 'me') === 'me') o.myVote = o.id === optionId ? true : null;
      else o.theirVote = o.id === optionId ? true : null;
    });
    if (dec.options.some(o => o.myVote && o.theirVote)) dec.status = 'voted';
    _save();
  }

  function addPro(decisionId, optionId, text) {
    _load();
    const dec = _cache.find(d => d.id === decisionId);
    if (!dec) return;
    const opt = dec.options.find(o => o.id === optionId);
    if (opt) opt.pros.push(text);
    _save();
  }

  function addCon(decisionId, optionId, text) {
    _load();
    const dec = _cache.find(d => d.id === decisionId);
    if (!dec) return;
    const opt = dec.options.find(o => o.id === optionId);
    if (opt) opt.cons.push(text);
    _save();
  }

  function decide(decisionId, optionId) {
    _load();
    const dec = _cache.find(d => d.id === decisionId);
    if (!dec) return;
    dec.status = 'decided'; dec.decided = optionId; dec.decidedAt = new Date().toISOString();
    _save();
  }

  function all() { return _load(); }
  function open() { return _load().filter(d => d.status === 'open'); }
  function decided() { return _load().filter(d => d.status === 'decided'); }
  function remove(id) { _load(); _cache = _cache.filter(d => d.id !== id); _save(); }
  function invalidate() { _cache = null; }

  return { create, get, vote, addPro, addCon, decide, all, open, decided, remove, invalidate };
})();

// CHAT ANALYTICS — Chat insights and patterns
// ──────────────────────────────────────────────
const ChatAnalytics = (() => {
  function summary(days) {
    const messages = CoupleChat.messages();
    const cutoff = new Date(Date.now() - (days || 30) * 86400000).toISOString();
    const recent = messages.filter(m => m.timestamp > cutoff && m.from !== 'system' && m.from !== 'ai' && !m.deleted);
    const myMsgs = recent.filter(m => m.from === 'me');
    const theirMsgs = recent.filter(m => m.from === 'them');
    const myAvgLen = myMsgs.length > 0 ? Math.round(myMsgs.reduce((sum, m) => sum + (m.raw || '').length, 0) / myMsgs.length) : 0;
    const theirAvgLen = theirMsgs.length > 0 ? Math.round(theirMsgs.reduce((sum, m) => sum + (m.raw || '').length, 0) / theirMsgs.length) : 0;

    let totalResponseTime = 0, responseCount = 0;
    for (let i = 1; i < recent.length; i++) {
      if (recent[i].from !== recent[i - 1].from) {
        const diff = new Date(recent[i].timestamp) - new Date(recent[i - 1].timestamp);
        if (diff < 3600000) { totalResponseTime += diff; responseCount++; }
      }
    }

    const hourCounts = {};
    recent.forEach(m => { const h = new Date(m.timestamp).getHours(); hourCounts[h] = (hourCounts[h] || 0) + 1; });
    const peakHour = Object.entries(hourCounts).sort((a, b) => b[1] - a[1])[0];

    // Conversation streaks (consecutive days with messages)
    const daySet = new Set(recent.map(m => m.timestamp.split('T')[0]));
    const days_sorted = [...daySet].sort();
    let maxStreak = 0, currentStreak = 0;
    for (let i = 0; i < days_sorted.length; i++) {
      if (i === 0) { currentStreak = 1; }
      else {
        const prev = new Date(days_sorted[i - 1]);
        const curr = new Date(days_sorted[i]);
        const diffDays = (curr - prev) / 86400000;
        currentStreak = diffDays <= 1 ? currentStreak + 1 : 1;
      }
      maxStreak = Math.max(maxStreak, currentStreak);
    }

    // Filtered message count
    const filteredCount = myMsgs.filter(m => m.filtered && m.filtered !== m.raw).length;

    // Reaction stats
    const totalReactions = recent.reduce((sum, m) => sum + (m.reactions?.length || 0), 0);

    // Emoji usage
    const emojiRegex = /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu;
    let topEmoji = null;
    const emojiCounts = {};
    recent.forEach(m => {
      const emojis = (m.raw || '').match(emojiRegex) || [];
      emojis.forEach(e => { emojiCounts[e] = (emojiCounts[e] || 0) + 1; });
    });
    const topEmojiEntry = Object.entries(emojiCounts).sort((a, b) => b[1] - a[1])[0];
    if (topEmojiEntry) topEmoji = { emoji: topEmojiEntry[0], count: topEmojiEntry[1] };

    // Longest conversation (most messages in one day)
    const dayCounts = {};
    recent.forEach(m => {
      const day = m.timestamp.split('T')[0];
      dayCounts[day] = (dayCounts[day] || 0) + 1;
    });
    const busiestDay = Object.entries(dayCounts).sort((a, b) => b[1] - a[1])[0];

    return {
      totalMessages: recent.length, myMessages: myMsgs.length, theirMessages: theirMsgs.length,
      myAvgLen, theirAvgLen,
      avgResponseTime: responseCount > 0 ? Math.round(totalResponseTime / responseCount / 60000) : 0,
      peakHour: peakHour ? parseInt(peakHour[0]) : 12,
      daysActive: daySet.size,
      conversationStreak: maxStreak,
      filteredCount, totalReactions,
      topEmoji,
      busiestDay: busiestDay ? { date: busiestDay[0], count: busiestDay[1] } : null,
    };
  }

  function weeklyDigest() {
    const stats = summary(7);
    const parts = [];
    if (stats.totalMessages > 0) {
      parts.push(stats.totalMessages + ' messages exchanged this week');

      // Balance insight
      const total = stats.myMessages + stats.theirMessages;
      if (total > 0) {
        const myPct = Math.round(stats.myMessages / total * 100);
        if (myPct > 65) parts.push('You\'re doing most of the talking (' + myPct + '%) — try asking more questions');
        else if (myPct < 35) parts.push(Auth.theirName() + ' is more active — try initiating more');
        else parts.push('Great balance! You\'re both contributing equally');
      }

      if (stats.avgResponseTime > 0) {
        if (stats.avgResponseTime < 5) parts.push('⚡ Average reply time: ' + stats.avgResponseTime + ' min — super responsive!');
        else if (stats.avgResponseTime < 30) parts.push('Average reply time: ' + stats.avgResponseTime + ' min');
        else parts.push('Average reply time: ' + stats.avgResponseTime + ' min — try replying sooner');
      }

      if (stats.peakHour) {
        const h = stats.peakHour;
        const period = h >= 12 ? 'PM' : 'AM';
        const display = h > 12 ? h - 12 : h === 0 ? 12 : h;
        parts.push('Most chatty around ' + display + ' ' + period);
      }

      if (stats.conversationStreak > 1) {
        parts.push('🔥 ' + stats.conversationStreak + '-day conversation streak!');
      }

      if (stats.filteredCount > 0) {
        parts.push('✨ ' + stats.filteredCount + ' message' + (stats.filteredCount > 1 ? 's' : '') + ' improved by tone filter');
      }

      if (stats.topEmoji) {
        parts.push('Most used emoji: ' + stats.topEmoji.emoji + ' (' + stats.topEmoji.count + ' times)');
      }

      if (stats.totalReactions > 0) {
        parts.push(stats.totalReactions + ' reactions shared');
      }
    } else {
      parts.push('No messages this week — time to start a conversation!');
    }
    return parts;
  }

  // Daily engagement score (0-100)
  function engagementScore() {
    const stats = summary(7);
    let score = 0;
    if (stats.totalMessages >= 5) score += 20;
    else if (stats.totalMessages >= 1) score += 10;
    if (stats.daysActive >= 5) score += 25;
    else if (stats.daysActive >= 3) score += 15;
    else if (stats.daysActive >= 1) score += 5;
    if (stats.avgResponseTime > 0 && stats.avgResponseTime < 15) score += 20;
    else if (stats.avgResponseTime > 0 && stats.avgResponseTime < 60) score += 10;
    const balance = stats.myMessages + stats.theirMessages > 0
      ? Math.min(stats.myMessages, stats.theirMessages) / Math.max(stats.myMessages, stats.theirMessages)
      : 0;
    score += Math.round(balance * 20);
    if (stats.totalReactions > 0) score += 10;
    if (stats.filteredCount > 0) score += 5;
    return Math.min(100, score);
  }

  return { summary, weeklyDigest, engagementScore };
})();

// COUPLE STATS — Aggregate relationship statistics
// ──────────────────────────────────────────────
const CoupleStats = (() => {
  function compute() {
    const parlays = Store.parlays();
    const tasks = Store.tasks();
    const appreciations = AppreciationStore.all();
    const conflicts = ConflictTracker.all();
    const goals = GoalStore.all();

    const resolved = parlays.filter(p => p.status === 'resolved');
    const resolvedPct = parlays.length > 0 ? Math.round(resolved.length / parlays.length * 100) : 0;
    const completedTasks = tasks.filter(t => t.status === 'completed');
    const taskPct = tasks.length > 0 ? Math.round(completedTasks.length / tasks.length * 100) : 0;
    const resolvedConflicts = conflicts.filter(c => c.resolution === 'resolved');
    const conflictResRate = conflicts.length > 0 ? Math.round(resolvedConflicts.length / conflicts.length * 100) : 0;

    return {
      totalParlays: parlays.length, resolvedParlays: resolved.length, resolvedPct,
      totalTasks: tasks.length, completedTasks: completedTasks.length, taskPct,
      totalAppreciations: appreciations.length,
      appStreak: AppreciationStore.streak(), ritualStreak: DailyRitual.streak(),
      totalConflicts: conflicts.length, conflictResRate,
      activeGoals: goals.filter(g => !g.completedAt).length,
      completedGoals: goals.filter(g => g.completedAt).length,
    };
  }

  return { compute };
})();

// NAVIGATION BREADCRUMBS — Track screen history
// ──────────────────────────────────────────────
const Breadcrumbs = (() => {
  const _history = [];
  const MAX = 10;

  function push(screen, params) {
    if (_history.length > 0 && _history[_history.length - 1].screen === screen) return;
    _history.push({ screen, params, ts: Date.now() });
    if (_history.length > MAX) _history.shift();
  }

  function back() {
    _history.pop();
    const prev = _history[_history.length - 1];
    return prev || { screen: 'home', params: {} };
  }

  function current() { return _history[_history.length - 1] || { screen: 'home', params: {} }; }
  function trail() { return [..._history]; }
  function canGoBack() { return _history.length > 1; }
  function clear() { _history.length = 0; }

  return { push, back, current, trail, canGoBack, clear };
})();

Router.register('note-detail', (params) => {
  const note = SharedNotes.get(params.id);
  if (!note) return '<div style="padding:40px;text-align:center;">Note not found</div>';
  const myN = Auth.myName();
  const theirN = Auth.theirName();

  const isListType = note.type === 'list' || note.type === 'idea' || note.type === 'plan' || note.items.length > 0;

  let html = '<div style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:calc(var(--nav-h) + 24px);">';
  html += ScreenHeader.render({ title: U.esc(note.title), subtitle: 'Updated ' + U.ago(note.updatedAt), back: 'shared-notes',
    rightAction: '<div style="display:flex;gap:6px;">' +
      '<button class="btn btn-sm btn-outline" onclick="SharedNotes.pin(\'' + note.id + '\');Router.reload();">' + (note.pinned ? 'Unpin' : 'Pin') + '</button>' +
      '<button class="btn btn-sm btn-outline" style="color:var(--terra);" onclick="if(confirm(\'Delete this note?\')){SharedNotes.remove(\'' + note.id + '\');Router.go(\'shared-notes\');}">Delete</button>' +
    '</div>' });

  // Content area for notes
  if (note.type === 'note' && !isListType) {
    html += '<div class="insight-card" style="margin-bottom:12px;">';
    html += '<textarea id="note-content" style="width:100%;min-height:200px;border:none;background:transparent;font-family:var(--font-body);font-size:.82rem;color:var(--text);resize:vertical;outline:none;line-height:1.65;" placeholder="Start writing...">' + U.esc(note.content) + '</textarea>';
    html += '</div>';
    html += '<button class="btn btn-accent btn-sm" id="save-note-content">Save</button>';
  }

  // List items
  if (isListType) {
    const unchecked = note.items.filter(i => !i.checked);
    const checked = note.items.filter(i => i.checked);

    html += '<div id="note-items" style="margin-bottom:12px;">';

    // Add item input
    html += '<div style="display:flex;gap:8px;margin-bottom:12px;">';
    html += '<input type="text" id="new-item-input" class="field-input" placeholder="Add an item..." style="flex:1;">';
    html += '<button class="btn btn-sm btn-accent" id="add-item-btn">Add</button>';
    html += '</div>';

    // Unchecked items
    unchecked.forEach(item => {
      html += '<div class="list-item-row" data-item-id="' + item.id + '" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:6px;cursor:pointer;">';
      html += '<div class="list-checkbox" style="width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;"></div>';
      html += '<div style="flex:1;min-width:0;">';
      html += '<div style="font-size:.82rem;">' + U.esc(item.text) + '</div>';
      html += '<div style="font-size:.6rem;color:var(--muted);">Added by ' + (item.addedBy === 'me' ? U.esc(myN) : U.esc(theirN)) + '</div>';
      html += '</div>';
      html += '<button class="btn-ghost" style="font-size:.7rem;color:var(--muted);padding:4px;" onclick="event.stopPropagation();SharedNotes.removeListItem(\'' + note.id + '\',\'' + item.id + '\');Router.reload();">x</button>';
      html += '</div>';
    });

    // Checked items (collapsed)
    if (checked.length > 0) {
      html += '<div style="margin-top:12px;">';
      html += '<div style="font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:6px;">' + checked.length + ' completed</div>';
      checked.forEach(item => {
        html += '<div class="list-item-row checked" data-item-id="' + item.id + '" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--parchment);border-radius:var(--r-md);margin-bottom:4px;cursor:pointer;opacity:.6;">';
        html += '<div style="width:22px;height:22px;border-radius:6px;background:var(--sage);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:.7rem;">✓</div>';
        html += '<div style="font-size:.78rem;text-decoration:line-through;flex:1;">' + U.esc(item.text) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '</div>';
  }

  // Contextual shortcuts
  html += ContextTools.renderToolbar('shared-notes');

  html += '</div>';
  return html;
}, (el, params) => {
  // Wire list item toggling
  el.querySelectorAll('.list-item-row').forEach(row => {
    row.addEventListener('click', () => {
      SharedNotes.toggleListItem(params.id, row.dataset.itemId);
      Router.reload();
    });
  });

  // Wire add item
  const addBtn = el.querySelector('#add-item-btn');
  const addInput = el.querySelector('#new-item-input');
  if (addBtn && addInput) {
    const doAdd = () => {
      const text = addInput.value.trim();
      if (!text) return;
      SharedNotes.addListItem(params.id, text);
      Router.reload();
    };
    addBtn.addEventListener('click', doAdd);
    addInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAdd(); });
  }

  // Wire save note content
  const saveBtn = el.querySelector('#save-note-content');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const content = el.querySelector('#note-content').value;
      SharedNotes.update(params.id, { content });
      U.toast('Note saved');
    });
  }
});

      '</div>' +

      '<div class="insight-card" style="margin-bottom:12px;">' +
        '<label class="field-label">Pre-filled items</label>' +
        '<div style="font-size:.75rem;color:var(--muted);">' + selectedTemplate.items.join(', ') + '</div>' +
      '</div>' : '') +

    '<button class="btn btn-accent" id="create-note-btn" style="width:100%;margin-top:8px;">Create Note</button>' +
  '</div>';
}, (el, params) => {
  // Type picker
  el.querySelectorAll('#note-type-picker .pill').forEach(pill => {
    pill.addEventListener('click', () => {
      el.querySelectorAll('#note-type-picker .pill').forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
    });
  });

  // Create
  el.querySelector('#create-note-btn').addEventListener('click', () => {
    const title = el.querySelector('#note-title').value.trim();
    if (!title) { U.toast('Enter a title'); return; }
    const type = el.querySelector('#note-type-picker .pill.selected')?.dataset.type || 'list';
    const note = SharedNotes.create(title, type);

    // Add template items if applicable
    const templates = SharedNotes.TEMPLATES;
    const tmpl = params.template ? templates.find(t => t.title === params.template) : null;
    if (tmpl && tmpl.items.length > 0) {
      tmpl.items.forEach(item => SharedNotes.addListItem(note.id, item));
    }

    U.toast('Note created');
    Router.go('note-detail', { id: note.id });
  });
});

  el.querySelector('#save-expense').addEventListener('click', () => {

    Router.go('budget');
  });

              '<div style="font-size:.72rem;color:var(--muted);">' + dec.options.length + ' options · ' +
