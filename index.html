  // ── Session ───────────────────────────────────
  async function refreshSession() {
    const { data } = await sb.auth.getSession();
    _session = data.session;
    _uid = _session?.user?.id || null;
    return _session;
  }

  function getToken() { return _session?.access_token || null; }

  function normalizeInviteCode(rawCode) {
    return (rawCode || '')
      .toString()
      .trim()
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, '');
  }

  function chooseBestCoupleRow(rows, preferredId = null) {
    if (!rows || rows.length === 0) return null;
    const scored = rows
      .filter(r => r && (r.spouse_1_id === _uid || r.spouse_2_id === _uid))
      .map(r => {
        const amS1 = r.spouse_1_id === _uid;
        const partnerUid = amS1 ? r.spouse_2_id : r.spouse_1_id;
        let score = 0;
        if (preferredId && r.id === preferredId) score += 100;
        if (partnerUid) score += 20;
        if (partnerUid && partnerUid !== _uid) score += 20;
        if (r.spouse_1_id && r.spouse_2_id) score += 10;
        return { r, score, ts: new Date(r.updated_at || r.created_at || 0).getTime() || 0 };
      });
    if (scored.length === 0) return null;
    scored.sort((a, b) => (b.score - a.score) || (b.ts - a.ts));
    return scored[0].r;
  }

  // ── Couple operations ─────────────────────────
  async function createCouple() {
    if (!_uid) return { error: 'Not authenticated' };
    // Guard: if already in a couple with a partner, don't create another
    if (_couple && hasPartner()) return { error: 'Already connected with a partner' };
    // If user already has a solo couple, return its existing code
    if (_couple && !hasPartner()) {
      return { data: _couple, code: _couple.invite_code };
    }
    const code = U.code();
    const { data, error } = await sb.from('couples')
      .insert({ spouse_1_id: _uid, invite_code: code })
      .select().maybeSingle();
    if (error) return { error: error.message };
    _couple = data;
    _amSpouse1 = true;
    return { data, code };
  }

  async function joinCouple(code) {
    if (!_uid) return { error: 'Not authenticated' };
    const normalizedCode = normalizeInviteCode(code);
    if (!normalizedCode || normalizedCode.length < 4) return { error: 'Invalid invite code' };
    console.log('[joinCouple] START code=%s uid=%s _couple=%o hasPartner=%s', normalizedCode, _uid, _couple?.id, _couple ? hasPartner() : 'n/a');

    // Guard: if already connected with a partner, don't join another couple
    if (_couple && hasPartner()) {
      console.warn('[joinCouple] BLOCKED — already connected with partner');
      return { error: 'Already connected with a partner' };
    }

    // Guard: don't let user join their own couple (would corrupt the row)
    if (_couple && _couple.invite_code && _couple.invite_code === normalizedCode) {
      return { error: 'That is your own invite code. Share it with your partner instead.' };
    }

    // If user already created their own couple (but no partner joined yet),
    // delete that orphan row first so the RPC doesn't get confused.
    // Try direct delete; if RLS blocks it, also try nulling the spouse slot.
    let orphanId = null;
    if (_couple && !hasPartner()) {
      orphanId = _couple.id;
      const mySlot = _amSpouse1 ? 'spouse_1_id' : 'spouse_2_id';
      console.log('[joinCouple] Cleaning orphan couple id=%s slot=%s', orphanId, mySlot);
      try {
        const { error: delErr } = await sb.from('couples').delete().eq('id', orphanId).eq(mySlot, _uid);
        if (delErr) console.warn('[joinCouple] orphan delete error:', delErr.message);
      } catch(e) {
        console.warn('[joinCouple] orphan delete exception:', e);
      }
      // Verify delete worked; if not, null out our slot so RPC won't see us in a couple
      try {
        const { data: check } = await sb.from('couples').select('id').eq('id', orphanId).maybeSingle();
        if (check) {
          console.log('[joinCouple] Orphan still exists, nulling slot');
          // Delete was blocked by RLS — null out our slot instead
          const { error: updErr } = await sb.from('couples').update({ [mySlot]: null }).eq('id', orphanId);
          if (updErr) console.warn('[joinCouple] orphan slot-null error:', updErr.message);
        } else {
          console.log('[joinCouple] Orphan deleted successfully');
        }
      } catch(e) {
        console.warn('[joinCouple] orphan cleanup fallback failed:', e);
      }
      _couple = null;
    }

    // Use RPC function that runs with SECURITY DEFINER to bypass RLS
    // (Spouse 2 isn't in the couples row yet, so normal RLS blocks them)
    const { data, error } = await sb.rpc('join_couple_by_code', {
      p_code: normalizedCode,
      p_user_id: _uid,
    });
    console.log('[joinCouple] RPC result:', { data, error: error?.message });
    if (error) return { error: error.message || 'Failed to join' };
    if (!data || data.error) return { error: data?.error || 'Invalid or expired invite code' };

    // Handle RPC returning an array (SETOF) vs a single object
    const coupleRow = Array.isArray(data) ? data[0] : data;

    // Re-fetch the couple row to guarantee we have correct, complete data.
    // The RPC may return a sparse object or unexpected format.
    let finalCouple = null;
    if (coupleRow && coupleRow.id) {
      const { data: fresh, error: fetchErr } = await sb.from('couples').select('*').eq('id', coupleRow.id).maybeSingle();
      console.log('[joinCouple] Re-fetch result:', { fresh: fresh?.id, fetchErr: fetchErr?.message });
      finalCouple = fresh || coupleRow;
    }
    // Fallback: query by user ID if RPC didn't return a usable row
    if (!finalCouple || !finalCouple.id) {
      console.log('[joinCouple] Primary fetch failed, falling back to user-ID query');
      const { data: rows } = await sb.from('couples').select('*')
        .or(`spouse_1_id.eq.${_uid},spouse_2_id.eq.${_uid}`);
      console.log('[joinCouple] Fallback query returned %d rows', rows?.length || 0);
      if (rows && rows.length > 0) {
        finalCouple = chooseBestCoupleRow(rows);
      }
    }
    if (!finalCouple || !finalCouple.id) return { error: 'Join succeeded but could not load couple data. Please refresh.' };

    _couple = finalCouple;
    _amSpouse1 = finalCouple.spouse_1_id === _uid;

    // Cache couple ID so bootstrap can find it even if RLS blocks the OR query
    localStorage.setItem('parlay_couple_id', finalCouple.id);

    // Load partner profile immediately so screens show their name/email
    const partnerUid = _amSpouse1 ? finalCouple.spouse_2_id : finalCouple.spouse_1_id;
    if (partnerUid) {
      try {
        const { data: theirP } = await sb.from('profiles')
          .select('*').eq('id', partnerUid).maybeSingle();
        console.log('[joinCouple] Partner profile fetch:', { partnerUid, found: !!theirP, name: theirP?.name });
        _themProfile = theirP || null;
      } catch(e) {
        console.warn('[joinCouple] Partner profile fetch failed:', e);
      }
    }

    // Clean up any leftover orphan rows in the background
    if (orphanId && orphanId !== finalCouple.id) {
      sb.from('couples').delete().eq('id', orphanId).catch(() => {});
    }

    return { data: finalCouple };
  }

  // ── Bootstrap (THE critical function) ─────────
  async function bootstrap() {
    if (_bootstrapping) return { mode: 'pending' };
    _bootstrapping = true;

    try {
      // 1. Session
      await refreshSession();
      if (!_session) { _bootstrapping = false; return { mode: 'unauthenticated' }; }

      // 2. Load couple FIRST — determines which slot I am
      //    Use a multi-row query so that if duplicate couple rows exist
      //    (e.g. user created one then joined another) we pick the best one.
      let coupleData = null;
      {
        const { data: coupleRows, error: coupleErr } = await sb.from('couples')
          .select('*')
          .or(`spouse_1_id.eq.${_uid},spouse_2_id.eq.${_uid}`);
        if (coupleErr) console.warn('[bootstrap] Couple query error:', coupleErr.message);
        if (coupleRows && coupleRows.length > 0) {
          const cachedId = localStorage.getItem('parlay_couple_id');
          coupleData = chooseBestCoupleRow(coupleRows, cachedId) || coupleRows[0];
          // Clean up orphan couple rows in the background
          for (const c of coupleRows) {
            if (c.id !== coupleData.id) {
              sb.from('couples').delete().eq('id', c.id).catch(() => {});
            }
          }
        }

        // Fallback: if direct query returned nothing, try fetching by cached couple ID.
        // This handles cases where RLS blocks the OR filter for spouse_2.
        if (!coupleData) {
          const cachedId = localStorage.getItem('parlay_couple_id');
          if (cachedId) {
            console.log('[bootstrap] Direct couple query empty, trying cached ID:', cachedId);
            const { data: cached } = await sb.from('couples')
              .select('*').eq('id', cachedId).maybeSingle();
            if (cached && (cached.spouse_1_id === _uid || cached.spouse_2_id === _uid)) {
              coupleData = cached;
            } else {
              // Cached ID is stale — remove it
              localStorage.removeItem('parlay_couple_id');
            }
          }
        }
      }

      // 2b. Fallback: if no couple found, check if there's an existing account
      //     with the same email that IS in a couple (Google OAuth may create a
      //     new user ID for an existing email/password account).
      if (!coupleData && _session.user?.email) {
        const email = _session.user.email;
        const { data: oldProfile } = await sb.from('profiles')
          .select('id')
          .eq('email', email)
          .neq('id', _uid)
          .maybeSingle();

        if (oldProfile) {
          const oldId = oldProfile.id;
          const { data: oldCouple } = await sb.from('couples')
            .select('*')
            .or(`spouse_1_id.eq.${oldId},spouse_2_id.eq.${oldId}`)
            .maybeSingle();

          if (oldCouple) {
            // Migrate: update the couple row to reference the new user ID
            const isSpouse1 = oldCouple.spouse_1_id === oldId;
            const updateCol = isSpouse1 ? 'spouse_1_id' : 'spouse_2_id';
            await sb.from('couples').update({ [updateCol]: _uid }).eq('id', oldCouple.id);

            // Copy profile data from old account if current profile is empty
            const { data: oldFullProfile } = await sb.from('profiles')
              .select('*').eq('id', oldId).maybeSingle();
            if (oldFullProfile) {
              const { id: _drop, ...profileData } = oldFullProfile;
              await sb.from('profiles').upsert({ id: _uid, ...profileData, email });
            }

            // Re-fetch the updated couple
            const { data: refreshedRows } = await sb.from('couples')
              .select('*')
              .or(`spouse_1_id.eq.${_uid},spouse_2_id.eq.${_uid}`);
            coupleData = refreshedRows?.[0] || null;
            console.log('[bootstrap] Migrated couple from old account to Google OAuth user');
          }
        }
      }

      _couple = coupleData || null;
      _amSpouse1 = _couple ? (_couple.spouse_1_id === _uid) : true;

      // Cache couple ID for fallback on next load (handles RLS edge cases)
      if (_couple) {
        localStorage.setItem('parlay_couple_id', _couple.id);
      }

      // 3. Load my profile
      const { data: myP } = await sb.from('profiles').select('*').eq('id', _uid).maybeSingle();
      _myProfile = myP || null;

      // 4. Persist email
      if (_session.user?.email) {
        sb.from('profiles').upsert({ id: _uid, email: _session.user.email }).catch(() => {});
      }

      // 5. Load partner profile (may fail due to RLS — ok)
      if (_couple && them().uid) {
        const { data: theirP } = await sb.from('profiles')
          .select('*').eq('id', them().uid).maybeSingle();
        // Only overwrite if we got a result — preserve profile loaded by joinCouple
        if (theirP) _themProfile = theirP;
      }

      // 6. Load shared data
      if (_couple) {
        await Promise.all([
          Store.loadParlays(),
          Store.loadTasks(),
          Store.loadCommPrefs(),
          FamilyStore.load(),
          CoupleChat.loadMessages(),
        ]);
        _subscribeRealtime();
      }

      // 7. Store settings from couple row
      if (_couple) {
        Store.set('mediatorTone', _couple.mediator_tone || 'neutral');
        Store.set('equity', _couple.equity || {});
      }

      _bootstrapping = false;

      return {
        mode: 'supabase',
        coupled: !!_couple,
        hasPartner: hasPartner(),
        onboarded: !!_myProfile?.name,
        setupDone: !!_myProfile?.love_language,
      };
    } catch(e) {
      console.error('[bootstrap] Error:', e);
      _bootstrapping = false;
      return { mode: 'error', error: e.message };
    }
  }

  // ── Profile updates ───────────────────────────
  async function updateMyProfile(updates) {
    if (!_uid) return;
    await sb.from('profiles').upsert({ id: _uid, ...updates });
    _myProfile = { ..._myProfile, ...updates };
  }

  async function saveCoupleSettings(patch) {
    if (!_couple) return;
    await sb.from('couples').update(patch).eq('id', _couple.id);
    _couple = { ..._couple, ...patch };
  }

  async function saveMyCommPrefs(traits) {
    if (!_uid) return;
    await sb.from('comm_self').upsert(
      { user_id: _uid, traits, setup_done: traits.length > 0 },
      { onConflict: 'user_id' }
    );
  }

  // ── Realtime ──────────────────────────────────
  function _subscribeRealtime() {
    if (!_couple || _realtime) return;
    _realtime = sb.channel('couple-' + _couple.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'negotiations',
          filter: `couple_id=eq.${_couple.id}` }, (payload) => {
        Store.loadParlays().then(() => {
          Badges.update();
          // Re-render whatever screen is active (Router.reload preserves params like parlay id)
          Router.reload();
          // Toast for other person's actions
          if (payload.eventType === 'INSERT' && payload.new?.created_by !== _uid) {
            U.toast('📬 New parlay from ' + theirName());
          }
          if (payload.eventType === 'UPDATE' && payload.old?.status !== payload.new?.status) {
            const newStatus = payload.new?.status;
            const isCreator = payload.new?.created_by === _uid;
            // partner_replied: notify the creator (the partner just replied)
            if (newStatus === 'partner_replied' && isCreator) U.toast('💬 ' + theirName() + ' responded');
            // counter_proposed: notify the creator (the partner suggested new times)
            else if (newStatus === 'counter_proposed' && isCreator) U.toast('📅 ' + theirName() + ' suggested different times');
            // active (proposal generated): notify the recipient (the creator generated it)
            else if (newStatus === 'active' && !isCreator) U.toast('⚖️ Proposal is ready');
            // resolved: notify both — use specific message for date confirmation
            else if (newStatus === 'resolved') {
              const res = payload.new?.resolution;
              if (res === 'date_accepted') U.toast('🎉 Event confirmed!');
              else U.toast('✓ Parlay resolved');
            }
          }
        });
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks',
          filter: `couple_id=eq.${_couple.id}` }, (payload) => {
        Store.loadTasks().then(() => {
          Badges.update();
          Router.reload();
          if (payload.eventType === 'INSERT' && payload.new?.created_by !== _uid) {
            U.toast('📬 New task from ' + theirName());
          }
          if (payload.eventType === 'UPDATE' && payload.old?.status !== payload.new?.status && payload.new?.created_by !== _uid) {
            const s = payload.new?.status;
            if (s === 'accepted') U.toast('✓ Task accepted by ' + theirName());
            else if (s === 'declined') U.toast('❌ Task declined by ' + theirName());
            else if (s === 'countered') U.toast('↩ ' + theirName() + ' suggested changes');
            else if (s === 'done') U.toast('✓ Task marked done');
          }
        });
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages',
          filter: `couple_id=eq.${_couple.id}` }, (payload) => {
        CoupleChat._handleRealtime(payload);
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'couples',
          filter: `id=eq.${_couple.id}` }, async (payload) => {
        _couple = payload.new;
        Store.set('mediatorTone', payload.new.mediator_tone);
        Store.set('equity', payload.new.equity);

        // If partner just joined, load their profile
        const newPartnerUid = them().uid;
        if (newPartnerUid && !_themProfile) {
          try {
            const { data: theirP } = await sb.from('profiles')
              .select('*').eq('id', newPartnerUid).maybeSingle();
            _themProfile = theirP || null;
          } catch(e) {}
        }
        Router.reload();
      })
      .subscribe((status) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          console.warn('[realtime] Disconnected — reconnecting in 3s');
          clearTimeout(_reconnectTimer);
          _reconnectTimer = setTimeout(() => {
            _realtime = null;
            _subscribeRealtime();
          }, 3000);
        }
      });
  }

  // ── Manual refresh (called by pull-to-refresh / refresh button) ──
  async function refresh() {
    if (!_session || !_uid) return;

    // Reload couple row (catches partner joining)
    const { data: coupleRows } = await sb.from('couples')
      .select('*').or(`spouse_1_id.eq.${_uid},spouse_2_id.eq.${_uid}`);
    let coupleData = null;
    if (coupleRows && coupleRows.length > 0) {
      const cachedId = localStorage.getItem('parlay_couple_id');
      coupleData = chooseBestCoupleRow(coupleRows, cachedId) || coupleRows[0];
      for (const c of coupleRows) {
        if (c.id !== coupleData.id) sb.from('couples').delete().eq('id', c.id).catch(() => {});
      }
    }
    if (coupleData) {
      _couple = coupleData;
      _amSpouse1 = _couple.spouse_1_id === _uid;
      Store.set('mediatorTone', _couple.mediator_tone);
      Store.set('equity', _couple.equity);
    }

    // Reload partner profile if we have a partner but no profile yet
    const partnerUid = them().uid;
    if (partnerUid && !_themProfile) {
      const { data: theirP } = await sb.from('profiles')
        .select('*').eq('id', partnerUid).maybeSingle();
      _themProfile = theirP || null;
    }

    // Reload shared data
    if (_couple) {
      await Promise.all([Store.loadParlays(), Store.loadTasks(), Store.loadCommPrefs(), FamilyStore.load(), CoupleChat.loadMessages()]);
      if (!_realtime) _subscribeRealtime();
    }

    Badges.update();
    Router.reload();
  }

  // ── Partner connection management ───────────
  async function regenerateInviteCode() {
    if (!_couple) return { error: 'No couple record' };
    if (hasPartner()) return { error: 'Partner already connected' };
    const newCode = U.code();
    const { error } = await sb.from('couples')
      .update({ invite_code: newCode })
      .eq('id', _couple.id);
    if (error) return { error: error.message };
    _couple = { ..._couple, invite_code: newCode };
    return { code: newCode };
  }

  async function disconnectPartner() {
    if (!_couple || !hasPartner()) return { error: 'No partner to disconnect' };
    const mySlot = _amSpouse1 ? 'spouse_1_id' : 'spouse_2_id';
    const theirSlot = _amSpouse1 ? 'spouse_2_id' : 'spouse_1_id';
    // Remove partner from couple row, generate new invite code
    const newCode = U.code();
    const { error } = await sb.from('couples')
      .update({ [theirSlot]: null, invite_code: newCode })
      .eq('id', _couple.id);
    if (error) return { error: error.message };
    _couple = { ..._couple, [theirSlot]: null, invite_code: newCode };
    _themProfile = null;
    return { success: true };
  }

  async function verifyConnection() {
    if (!_couple) return { status: 'no_couple', ok: false };
    // Re-fetch couple row to verify
    const { data, error } = await sb.from('couples')
      .select('*')
      .eq('id', _couple.id)
      .maybeSingle();
    if (error || !data) return { status: 'fetch_error', ok: false, error: error?.message };
    _couple = data;
    _amSpouse1 = _couple.spouse_1_id === _uid;

    const partnerUid = _amSpouse1 ? data.spouse_2_id : data.spouse_1_id;
    if (!partnerUid) return { status: 'waiting', ok: false, couple: data };

    // Verify partner profile is accessible
    const { data: partnerProfile, error: pErr } = await sb.from('profiles')
      .select('*').eq('id', partnerUid).maybeSingle();
    if (pErr || !partnerProfile) {
      return { status: 'partner_profile_missing', ok: false, partnerUid };
    }
    _themProfile = partnerProfile;

    // Verify realtime is connected
    const realtimeOk = !!_realtime;

    // Verify shared data loads
    let dataOk = true;
    try {
      const { data: testData, error: testErr } = await sb.from('negotiations')
        .select('id').eq('couple_id', _couple.id).limit(1);
      if (testErr) dataOk = false;
    } catch { dataOk = false; }

    return {
      status: 'connected',
      ok: true,
      partner: { name: partnerProfile.name, email: partnerProfile.email },
      realtimeOk,
      dataOk,
      couple: data,
    };
  }

  function connectionAge() {
    if (!_couple?.created_at) return null;
    const created = new Date(_couple.created_at);
    const now = new Date();
    const days = Math.floor((now - created) / 86400000);
    if (days < 1) return 'Today';
    if (days === 1) return '1 day';
    if (days < 30) return days + ' days';
    if (days < 365) return Math.floor(days / 30) + ' months';
    return Math.floor(days / 365) + ' years';
  }

  return {
    sb: () => sb, me, them, user: () => (_session?.user ? { id: _session.user.id, email: _session.user.email } : null), myName, theirName, myUid, theirUid,
    couple, isReady, hasPartner, amSpouse1, getToken,
    signUp, signIn, signOut, signInWithGoogle, refreshSession, refresh,
    createCouple, joinCouple, bootstrap,
    updateMyProfile, saveCoupleSettings, saveMyCommPrefs,
    regenerateInviteCode, disconnectPartner, verifyConnection, connectionAge,
  };
})();

// ──────────────────────────────────────────────
// STORE — In-memory state, Supabase as source of truth
// ──────────────────────────────────────────────
const Store = (() => {
  let _parlays = [];
  let _tasks   = [];
  let _commPrefs = { me: null, them: null };
  let _kv = {};  // simple key-value for settings (mediatorTone, equity, etc.)

  // ── Parlay helpers ────────────────────────────
  function _rowToParlay(row) {
    return {
      id: row.id,
      topicId: row.topic_id,
      title: row.title,
      date: U.shortDate(row.created_at),
      rawInput: row.raw_input,
      filteredInput: row.filtered_input,
      intentContext: row.intent_context,
      dateOptions: typeof row.date_options === 'string'
        ? (() => { try { return JSON.parse(row.date_options); } catch { return []; } })()
        : (row.date_options || []),
      status: row.status,
      createdByUid: row.created_by,  // RAW UUID — the only authority
      isMine: row.created_by === Auth.myUid(),
      partnerRawReply: row.partner_raw_reply,
      partnerFilteredReply: row.partner_filtered_reply,
      partnerDateResponse: row.partner_date_response,
      counterDates: typeof row.counter_dates === 'string'
        ? (() => { try { return JSON.parse(row.counter_dates); } catch { return []; } })()
        : (row.counter_dates || []),
      confirmedDate: typeof row.confirmed_date === 'string'
        ? (() => { try { return JSON.parse(row.confirmed_date); } catch { return null; } })()
        : (row.confirmed_date || null),
      proposal: row.proposal,
      resolution: row.resolution,
      archived: row.archived || false,
    };
  }

  function _parlayToRow(p) {
    return {
      id: p.id,
      couple_id: Auth.couple()?.id,
      topic_id: p.topicId,
      title: p.title,
      raw_input: p.rawInput,
      filtered_input: p.filteredInput,
      intent_context: p.intentContext,
      date_options: p.dateOptions,
      status: p.status,
      created_by: p.createdByUid || Auth.myUid(),
      partner_raw_reply: p.partnerRawReply,
      partner_filtered_reply: p.partnerFilteredReply,
      partner_date_response: p.partnerDateResponse,
      counter_dates: p.counterDates,
      confirmed_date: p.confirmedDate,
      proposal: p.proposal,
      resolution: p.resolution,
      archived: p.archived || false,
    };
  }

  function _patchToRow(patch) {
    const map = {
      topicId:'topic_id', title:'title', rawInput:'raw_input',
      filteredInput:'filtered_input', intentContext:'intent_context',
      dateOptions:'date_options', status:'status',
      partnerRawReply:'partner_raw_reply', partnerFilteredReply:'partner_filtered_reply',
      partnerDateResponse:'partner_date_response', counterDates:'counter_dates',
      confirmedDate:'confirmed_date',
      proposal:'proposal', resolution:'resolution', archived:'archived',
    };
    const row = {};
    for (const [k,v] of Object.entries(patch)) { if (map[k]) row[map[k]] = v; }
    return row;
  }

  // ── Task helpers ──────────────────────────────
  function _uidToRole(uid) {
    return uid === Auth.myUid() ? 'me' : 'them';
  }

  function _rowToTask(row) {
    return {
      id: row.id,
      title: row.title,
      context: row.context,
      rawContext: row.raw_context,
      filteredContext: row.filtered_context,
      categoryId: row.category_id || 'other',
      presetIcon: row.preset_icon || null,
      priority: row.priority || 'normal',
      dueDate: row.due_date,
      assignedTo: _uidToRole(row.assigned_to),
      createdBy: _uidToRole(row.created_by),
      status: row.status || 'pending_response',
      pendingResponseFrom: row.pending_response_from ? _uidToRole(row.pending_response_from) : null,
      counterCount: row.counter_count || 0,
      counterMessage: row.counter_message,
      filteredCounter: row.filtered_counter,
      declineReason: row.decline_reason,
      filteredDecline: row.filtered_decline,
      completedAt: row.completed_at || null,
      completedBy: row.completed_by || null,
    };
  }

  function _taskToRow(t) {
    return {
      id: t.id,
      couple_id: Auth.couple()?.id,
      title: t.title,
      context: t.context,
      raw_context: t.rawContext,
      filtered_context: t.filteredContext,
      category_id: t.categoryId,
      preset_icon: t.presetIcon || null,
      priority: t.priority,
      due_date: t.dueDate || null,
      assigned_to: t.assignedTo === 'me' ? Auth.myUid() : Auth.theirUid(),
      created_by: t.createdBy === 'me' ? Auth.myUid() : Auth.theirUid(),
      status: t.status,
      pending_response_from: t.pendingResponseFrom === 'me' ? Auth.myUid()
        : t.pendingResponseFrom === 'them' ? Auth.theirUid() : null,
      counter_count: t.counterCount,
      counter_message: t.counterMessage,
      filtered_counter: t.filteredCounter,
      decline_reason: t.declineReason,
      filtered_decline: t.filteredDecline,
      completed_at: t.completedAt || null,
      completed_by: t.completedBy || null,
    };
  }

  // ── CRUD: Parlays ─────────────────────────────
  async function loadParlays() {
    if (!Auth.isReady()) return;
    const { data, error } = await Auth.sb().from('negotiations')
      .select('*').eq('couple_id', Auth.couple().id)
      .is('deleted_at', null).order('created_at', { ascending: false });
    if (error) { console.warn('[Store] loadParlays error:', error.message); return; }
    _parlays = (data || []).map(_rowToParlay);
  }

  function parlays()        { return _parlays; }
  function activeParlays()  { return _parlays.filter(p => !p.archived && p.status !== 'resolved'); }
  function resolvedParlays(){ return _parlays.filter(p => !p.archived && p.status === 'resolved'); }
  function findParlay(id)   { return _parlays.find(p => p.id === id) || null; }

  /** Count of parlays that need MY attention */
  function myPendingParlayCount() {
    return activeParlays().filter(p =>
      (p.status === 'pending_partner' && !p.isMine) ||
      (p.status === 'partner_replied' && p.isMine) ||
      (p.status === 'counter_proposed' && p.isMine) ||
      (p.status === 'in_discussion' && p.lastActivityBy && p.lastActivityBy !== Auth.myUid()) ||
      (p.status === 'active')
    ).length;

      console.error('[Store] addParlay DB error:', e);

  async function updateParlay(id, patch) {
    const i = _parlays.findIndex(p => p.id === id);
    if (i > -1) {
      _parlays[i] = { ..._parlays[i], ...patch };
      try {
        await Auth.sb().from('negotiations').update(_patchToRow(patch)).eq('id', id);
      } catch(e) { console.error('[Store] updateParlay DB error:', e); }

    _parlays = _parlays.filter(p => p.id !== id);
    try {
      await Auth.sb().from('negotiations')
        .update({ deleted_at: new Date().toISOString() }).eq('id', id);
    } catch(e) { console.error('[Store] deleteParlay error:', e); }
  }

  async function loadTasks() {
    if (!Auth.isReady()) return;
    const { data, error } = await Auth.sb().from('tasks')
      .select('*').eq('couple_id', Auth.couple().id)
      .is('deleted_at', null).order('created_at', { ascending: false });
    if (error) { console.warn('[Store] loadTasks error:', error.message); return; }
    _tasks = (data || []).map(_rowToTask);
  }

  function tasks()        { return _tasks; }
  function myTasks()      { return _tasks.filter(t => t.assignedTo === 'me' && t.status !== 'done'); }
  function sentTasks()    { return _tasks.filter(t => t.createdBy === 'me' && t.assignedTo === 'them'); }
  function myActionTasks(){ return _tasks.filter(t => t.pendingResponseFrom === 'me' && t.status !== 'done'); }
  function doneTasks()    { return _tasks.filter(t => t.status === 'done'); }
  function findTask(id)   { return _tasks.find(t => t.id === id) || null; }

  async function addTask(task) {
    _tasks.unshift(task);
    try {
      await Auth.sb().from('tasks').upsert(_taskToRow(task), { onConflict: 'id' });
    } catch(e) {
      console.error('[Store] addTask DB error:', e);
      U.toast('⚠️ Task may not have synced');
    }
  }

  async function updateTask(id, patch) {
    const i = _tasks.findIndex(t => t.id === id);
    if (i > -1) {
      _tasks[i] = { ..._tasks[i], ...patch, updatedAt: new Date().toISOString() };
      const rowPatch = {};
      const map = {
        title:'title', context:'context', rawContext:'raw_context',
        filteredContext:'filtered_context', priority:'priority',
        dueDate:'due_date', status:'status', categoryId:'category_id',
        presetIcon:'preset_icon', assignedTo:'assigned_to',
        counterMessage:'counter_message', filteredCounter:'filtered_counter',
        declineReason:'decline_reason', filteredDecline:'filtered_decline',
        counterCount:'counter_count',
        completedAt:'completed_at', completedBy:'completed_by',
      };
      for (const [k,v] of Object.entries(patch)) {
        if (k === 'assignedTo' || k === 'pendingResponseFrom') continue; // handled below
        if (map[k]) rowPatch[map[k]] = v;
      }
      if (patch.assignedTo !== undefined) {
        rowPatch.assigned_to = patch.assignedTo === 'me' ? Auth.myUid()
          : patch.assignedTo === 'them' ? Auth.theirUid() : patch.assignedTo;
      }
      if (patch.pendingResponseFrom !== undefined) {
        rowPatch.pending_response_from = patch.pendingResponseFrom === 'me' ? Auth.myUid()
          : patch.pendingResponseFrom === 'them' ? Auth.theirUid() : null;
      }
      try {
        await Auth.sb().from('tasks').update(rowPatch).eq('id', id);
      } catch(e) { console.error('[Store] updateTask DB error:', e); }
    }
  }

  async function deleteTask(id) {
    _tasks = _tasks.filter(t => t.id !== id);
    try {
      await Auth.sb().from('tasks')
        .update({ deleted_at: new Date().toISOString() }).eq('id', id);

  // ── Comm Prefs ────────────────────────────────
  async function loadCommPrefs() {
    if (!Auth.isReady()) return;
    const myId = Auth.myUid();
    const theirId = Auth.theirUid();
    const promises = [
      Auth.sb().from('comm_self').select('*').eq('user_id', myId).maybeSingle(),
    ];
    if (theirId) {
      promises.push(Auth.sb().from('comm_self').select('*').eq('user_id', theirId).maybeSingle());
    }
    const results = await Promise.all(promises);
    _commPrefs.me = results[0]?.data || null;
    _commPrefs.them = results[1]?.data || null;
  }

  function commPrefs() { return _commPrefs; }

  // ── KV store ──────────────────────────────────
  function get(key) { return _kv[key]; }
  function set(key, val) { _kv[key] = val; }

  // ── Clear ─────────────────────────────────────
  function clear() {
    _parlays = []; _tasks = []; _commPrefs = { me: null, them: null }; _kv = {};
    try { CoupleChat.invalidate(); } catch(e) {}
    try { FamilyStore.clear(); } catch(e) {}
    try { EventMessages.clear(); } catch(e) {}
  }

  return {
    loadParlays, parlays, activeParlays, resolvedParlays,
    findParlay, myPendingParlayCount, addParlay, updateParlay, deleteParlay,
    loadTasks, tasks, myTasks, sentTasks, myActionTasks, doneTasks,
    findTask, addTask, updateTask, deleteTask,
    loadCommPrefs, commPrefs,
    get, set, clear,
  };
})();

// FAMILY STORE — Household members for contextual planning
// ──────────────────────────────────────────────
const FamilyStore = (() => {
  let _members = [];

  function _rowToMember(row) {
    return {
      id: row.id,
      name: row.name,
      role: row.role,           // 'child', 'extended', 'contact'
      relation: row.relation,   // 'son', 'daughter', 'grandparent', 'babysitter', etc.
      belongsTo: row.belongs_to, // 'both', or a specific uid
      birthDate: row.birth_date,
      notes: row.notes,
      sortOrder: row.sort_order || 0,
    };
  }

  function _memberToRow(m) {
    return {
      id: m.id,
      couple_id: Auth.couple()?.id,
      name: m.name,
      role: m.role,
      relation: m.relation || null,
      belongs_to: m.belongsTo || 'both',
      birth_date: m.birthDate || null,
      notes: m.notes || null,
      sort_order: m.sortOrder || 0,
    };
  }

  async function load() {
    if (!Auth.isReady()) return;
    const { data, error } = await Auth.sb().from('family_members')
      .select('*').eq('couple_id', Auth.couple().id)
      .is('deleted_at', null).order('sort_order', { ascending: true });
    if (error) { console.warn('[FamilyStore] load error:', error.message); return; }
    _members = (data || []).map(_rowToMember);
  }

  function members()  { return _members; }
  function children() { return _members.filter(m => m.role === 'child'); }
  function extended() { return _members.filter(m => m.role === 'extended'); }
  function contacts() { return _members.filter(m => m.role === 'contact'); }
  function find(id)   { return _members.find(m => m.id === id) || null; }
  function hasKids()  { return _members.some(m => m.role === 'child'); }

  function childAge(m) {
    if (!m.birthDate) return null;
    const diff = Date.now() - new Date(m.birthDate).getTime();
    return Math.floor(diff / (365.25 * 86400000));
  }

  async function add(member) {
    _members.push(member);
    try {
      await Auth.sb().from('family_members').upsert(_memberToRow(member), { onConflict: 'id' });
    } catch(e) { console.error('[FamilyStore] add error:', e); U.toast('Failed to save'); }
  }

  async function update(id, patch) {
    const i = _members.findIndex(m => m.id === id);
    if (i > -1) {
      _members[i] = { ..._members[i], ...patch };
      const rowPatch = {};
      const map = { name:'name', role:'role', relation:'relation', belongsTo:'belongs_to', birthDate:'birth_date', notes:'notes', sortOrder:'sort_order' };
      for (const [k,v] of Object.entries(patch)) { if (map[k]) rowPatch[map[k]] = v; }
      try {
        await Auth.sb().from('family_members').update(rowPatch).eq('id', id);
      } catch(e) { console.error('[FamilyStore] update error:', e); }
    }
  }

  async function remove(id) {
    _members = _members.filter(m => m.id !== id);
    try {
      await Auth.sb().from('family_members')
        .update({ deleted_at: new Date().toISOString() }).eq('id', id);
    } catch(e) { console.error('[FamilyStore] remove error:', e); }
  }

  function clear() { _members = []; }

  return { load, members, children, extended, contacts, find, hasKids, childAge, add, update, remove, clear };
})();

// ──────────────────────────────────────────────
const EventMessages = (() => {
  let _cache = {}; // eventId → [messages]

  function _rowToMsg(row) {
    return {
      id: row.id,
      eventId: row.event_id,
      senderUid: row.sender_uid,
      isMine: row.sender_uid === Auth.myUid(),
      type: row.message_type || 'text',
      rawContent: row.raw_content,
      filteredContent: row.filtered_content,
      structuredData: typeof row.structured_data === 'string'
        ? (() => { try { return JSON.parse(row.structured_data); } catch { return null; } })()
        : (row.structured_data || null),
      createdAt: row.created_at,
    };
  }

  async function loadForEvent(eventId) {
    if (!Auth.isReady()) return [];
    const { data, error } = await Auth.sb().from('event_messages')
      .select('*').eq('event_id', eventId)
      .is('deleted_at', null).order('created_at', { ascending: true });
    if (error) { console.warn('[EventMessages] load error:', error.message); return []; }
    _cache[eventId] = (data || []).map(_rowToMsg);
    return _cache[eventId];
  }

  function getForEvent(eventId) { return _cache[eventId] || []; }

  async function send(eventId, { type = 'text', rawContent = '', filteredContent = '', structuredData = null } = {}) {
    const msg = {
      id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      eventId,
      senderUid: Auth.myUid(),
      isMine: true,
      type,
      rawContent,
      filteredContent: filteredContent || rawContent,
      structuredData,
      createdAt: new Date().toISOString(),
    };
    if (!_cache[eventId]) _cache[eventId] = [];
    _cache[eventId].push(msg);

    try {
      await Auth.sb().from('event_messages').insert({
        id: msg.id,
        event_id: eventId,
        couple_id: Auth.couple()?.id,
        sender_uid: Auth.myUid(),
        message_type: type,
        raw_content: rawContent,
        filtered_content: filteredContent || rawContent,
        structured_data: structuredData,
      });
    } catch(e) { console.error('[EventMessages] send error:', e); U.toast('Message may not have synced'); }
    return msg;
  }

  function clear() { _cache = {}; }

  return { loadForEvent, getForEvent, send, clear };
})();

const MOODS = [
  { id: 'great',     emoji: '😊', label: 'Great',     energy: 5 },
  { id: 'good',      emoji: '🙂', label: 'Good',      energy: 4 },
  { id: 'okay',      emoji: '😐', label: 'Okay',      energy: 3 },
  { id: 'stressed',  emoji: '😤', label: 'Stressed',  energy: 2 },
  { id: 'upset',     emoji: '😢', label: 'Upset',     energy: 1 },
];

const MoodStore = (() => {
  const _KEY = 'parlay_moods';
  let _entries = [];

  function _load() {
    try { _entries = JSON.parse(localStorage.getItem(_KEY) || '[]'); }
    catch { _entries = []; }
  }

  function log(moodId, context = '') {
    _load();
    const entry = {
      id: 'mood_' + Date.now(),
      moodId,
      context,
      uid: Auth.myUid(),
      timestamp: new Date().toISOString(),
    };
    _entries.push(entry);
    // Keep last 100 entries
    if (_entries.length > 100) _entries = _entries.slice(-100);
    localStorage.setItem(_KEY, JSON.stringify(_entries));
    return entry;
  }

  function recent(days = 7) {
    _load();
    const cutoff = new Date(Date.now() - days * 86400000).toISOString();
    return _entries.filter(e => e.timestamp > cutoff);
  }

  function todayMood() {
    _load();
    const today = new Date().toISOString().split('T')[0];
    const uid = Auth.myUid();
    return _entries.filter(e => e.timestamp?.startsWith(today) && e.uid === uid).pop() || null;
  }

  function averageEnergy(days = 7) {
    const r = recent(days);
    if (r.length === 0) return null;
    const total = r.reduce((sum, e) => {
      const mood = MOODS.find(m => m.id === e.moodId);
      return sum + (mood ? mood.energy : 3);
    }, 0);
    return +(total / r.length).toFixed(1);
  }

  function trend(days = 14) {
    const first7 = recent(days).filter(e => {
      const d = new Date(e.timestamp);
      return d < new Date(Date.now() - 7 * 86400000);
    });
    const last7 = recent(7);
    if (first7.length < 2 || last7.length < 2) return 'neutral';
    const avgFirst = first7.reduce((s, e) => s + (MOODS.find(m => m.id === e.moodId)?.energy || 3), 0) / first7.length;
    const avgLast = last7.reduce((s, e) => s + (MOODS.find(m => m.id === e.moodId)?.energy || 3), 0) / last7.length;
    if (avgLast - avgFirst > 0.5) return 'improving';
    if (avgFirst - avgLast > 0.5) return 'declining';
    return 'stable';
  }

  function clear() { _entries = []; localStorage.removeItem(_KEY); }

  return { log, recent, todayMood, averageEnergy, trend, clear };
})();

/* ═══════════════════════════════════════════════════════════════
   Tone Coaching — Real-time typing feedback
   ═══════════════════════════════════════════════════════════════ */

const ToneCoach = (() => {
  // Pattern → feedback mapping
  const PATTERNS = [
    { rx: /\byou (never|always)\b/i, level: 'warn', msg: 'Absolutes like "always" or "never" can feel like accusations. Try being specific about the instance.' },
    { rx: /\byou don'?t (care|listen|try)\b/i, level: 'warn', msg: 'Character judgments trigger defensiveness. Try describing how you feel instead.' },
    { rx: /\bwhy can'?t you\b/i, level: 'warn', msg: 'This can sound demanding. Try "I\'d appreciate if..." instead.' },
    { rx: /\byou('re| are) (so|such a)\b/i, level: 'warn', msg: 'Labeling can shut down dialogue. Focus on the behavior, not the person.' },
    { rx: /\bfuck|shit|bitch|damn|hell|crap\b/i, level: 'warn', msg: 'Strong language can escalate. Parlay will soften this, but starting calmer helps you feel calmer too.' },
    { rx: /\bI feel\b/i, level: 'gentle', msg: '"I feel" statements are great — they express your experience without blaming.' },
    { rx: /\bI('d| would) (love|like|appreciate)\b/i, level: 'gentle', msg: 'Nice! Framing requests positively makes them easier to hear.' },
    { rx: /\bcould we\b/i, level: 'gentle', msg: 'Using "we" shows you\'re approaching this as a team.' },
    { rx: /\bI understand\b/i, level: 'gentle', msg: 'Acknowledging their perspective builds trust.' },
    { rx: /\bwhatever\b/i, level: 'warn', msg: '"Whatever" signals disengagement. Try expressing what you actually want instead.' },
    { rx: /\bfine\b.*\bfine\b/i, level: 'warn', msg: 'Repeating "fine" often masks frustration. Try naming the real feeling.' },
    { rx: /\bshould have\b/i, level: 'warn', msg: '"Should have" can feel like hindsight criticism. Focus on what you need going forward.' },
    { rx: /\bI need\b/i, level: 'gentle', msg: 'Stating needs clearly is healthy. Make sure to frame it as a request, not a demand.' },
    { rx: /\bthank you|thanks\b/i, level: 'gentle', msg: 'Gratitude is powerful — it opens the door for productive conversation.' },
    { rx: /\bI('m| am) sorry\b/i, level: 'gentle', msg: 'Apologies show emotional courage. They tend to de-escalate tension quickly.' },
    { rx: /\bcan we talk\b/i, level: 'gentle', msg: 'Asking to talk shows respect for the process. Great way to open a conversation.' },
    { rx: /\byou should\b/i, level: 'warn', msg: '"You should" can feel preachy. Try "Would you be open to..." instead.' },
    { rx: /\bI don'?t care\b/i, level: 'warn', msg: '"I don\'t care" can shut down collaboration. If you truly have no preference, try "I\'m flexible on this."' },
    { rx: /\bforget it\b/i, level: 'warn', msg: '"Forget it" can feel like withdrawal. Try saying what would actually help.' },
  ];

  let _debounceTimer = null;

  function analyze(text) {
    if (!text || text.length < 10) return null;
    for (const p of PATTERNS) {
      if (p.rx.test(text)) return { level: p.level, msg: p.msg };
    }
    return null;
  }

  function attachToTextarea(textarea, feedbackEl) {
    if (!textarea || !feedbackEl) return;
    textarea.addEventListener('input', () => {
      clearTimeout(_debounceTimer);
      _debounceTimer = setTimeout(() => {
        const result = analyze(textarea.value);
        if (result) {
          feedbackEl.className = 'tone-coach ' + result.level;
          feedbackEl.textContent = result.msg;
        } else {
          feedbackEl.className = 'tone-coach tone-coach-hidden';
          feedbackEl.textContent = '';
        }
      }, 400);
    });
  }

  return { analyze, attachToTextarea };
})();

const Insights = (() => {
  function communicationScore() {
    const parlays = Store.parlays();
    const tasks = Store.tasks();
    if (parlays.length === 0 && tasks.length === 0) return { score: 0, label: 'No data yet' };

    let score = 50; // baseline

    // Positive signals
    const resolved = parlays.filter(p => p.status === 'resolved').length;
    score += Math.min(resolved * 5, 20);

    const completedTasks = tasks.filter(t => t.status === 'done').length;
    score += Math.min(completedTasks * 2, 15);

    // Active engagement
    const active = parlays.filter(p => p.status === 'active' || p.status === 'in_discussion').length;
    score += Math.min(active * 3, 10);

    // Negative signals
    const declined = tasks.filter(t => t.status === 'declined').length;
    score -= Math.min(declined * 3, 10);

    const stale = parlays.filter(p => {
      if (p.status === 'resolved' || p.archived) return false;
      const d = new Date(p.date);
      return (Date.now() - d.getTime()) > 7 * 86400000;
    }).length;
    score -= Math.min(stale * 4, 15);

    // Mood bonus
    const avgMood = MoodStore.averageEnergy(7);
    if (avgMood !== null) {
      score += Math.round((avgMood - 3) * 5);
    }

    score = Math.max(0, Math.min(100, Math.round(score)));
    let label = 'Needs attention';
    if (score >= 80) label = 'Thriving';
    else if (score >= 60) label = 'Healthy';
    else if (score >= 40) label = 'Room to grow';

    return { score, label };
  }

  function equityBalance() {
    const tasks = Store.tasks();
    const myDone = tasks.filter(t => t.status === 'done' && t.completedBy === Auth.myUid()).length;
    const theirDone = tasks.filter(t => t.status === 'done' && t.completedBy === Auth.theirUid()).length;
    const total = myDone + theirDone;
    if (total === 0) return { me: 50, them: 50, myCount: 0, theirCount: 0 };
    return {
      me: Math.round((myDone / total) * 100),
      them: Math.round((theirDone / total) * 100),
      myCount: myDone,
      theirCount: theirDone,
    };
  }

  function topicBreakdown() {
    const parlays = Store.parlays();
    const counts = {};
    parlays.forEach(p => {
      const tid = p.topicId || 'other';
      counts[tid] = (counts[tid] || 0) + 1;
    });
    return Object.entries(counts)
      .map(([id, count]) => ({ id, count }))
      .sort((a, b) => b.count - a.count);
  }

  function responseTime() {
    const parlays = Store.parlays();
    const replied = parlays.filter(p => p.partnerRawReply);
    if (replied.length === 0) return null;
    // Average: rough estimate based on status transitions
    return { avg: 'Under 24h', fast: replied.length };
  }

  function weeklyStats() {
    const now = Date.now();
    const weekAgo = now - 7 * 86400000;
    const parlays = Store.parlays();
    const tasks = Store.tasks();

    const newParlays = parlays.filter(p => {
      const d = new Date(p.date);
      return d.getTime() > weekAgo;
    }).length;

    const resolvedParlays = parlays.filter(p => p.status === 'resolved').length;
    const completedTasks = tasks.filter(t => t.status === 'done').length;
    const totalTasks = tasks.length;

    return {
      newParlays,
      resolvedParlays,
      completedTasks,
      totalTasks,
      tasksCompletionRate: totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0,
    };
  }

  function streaks() {
    const tasks = Store.tasks();
    const doneTasks = tasks.filter(t => t.status === 'done' && t.completedAt)
      .sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt));
    if (doneTasks.length === 0) return { current: 0, best: 0 };

    // Count consecutive days with at least 1 completed task
    let current = 0;
    let best = 0;
    let streak = 1;
    let lastDay = new Date(doneTasks[0].completedAt).toISOString().split('T')[0];

    for (let i = 1; i < doneTasks.length; i++) {
      const day = new Date(doneTasks[i].completedAt).toISOString().split('T')[0];
      if (day === lastDay) continue;
      const diff = (new Date(day) - new Date(lastDay)) / 86400000;
      if (diff <= 1) { streak++; }
      else { best = Math.max(best, streak); streak = 1; }
      lastDay = day;
    }
    best = Math.max(best, streak);

    // Check if current streak is active (includes today or yesterday)
    const today = new Date().toISOString().split('T')[0];
    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
    current = (lastDay === today || lastDay === yesterday) ? streak : 0;

    return { current, best };
  }

  function tips() {
    const score = communicationScore();
    const equity = equityBalance();
    const topics = topicBreakdown();
    const tipsArr = [];

    if (score.score < 60) {
      tipsArr.push({ icon: '💡', text: 'Try starting a conversation about something light — like planning a date night. Small wins build momentum.' });
    }
    if (Math.abs(equity.me - equity.them) > 30) {
      const heavy = equity.me > equity.them ? Auth.myName() : Auth.theirName();
      tipsArr.push({ icon: '⚖️', text: `${heavy} has been carrying more tasks lately. Consider rebalancing to prevent burnout.` });
    }
    if (topics.length === 0) {
      tipsArr.push({ icon: '🌱', text: 'You haven\'t planned any events yet! Start with a simple date night to get the ball rolling.' });
    }
    if (MoodStore.trend() === 'declining') {
      tipsArr.push({ icon: '🫂', text: 'Mood trend is dipping. Consider checking in with each other — a simple "how are you feeling?" goes a long way.' });
    }
    // Always have at least one
    if (tipsArr.length === 0) {
      tipsArr.push({ icon: '✨', text: 'You\'re doing great! Keep up the open communication — it\'s the foundation of a strong partnership.' });
    }
    return tipsArr;
  }

  return { communicationScore, equityBalance, topicBreakdown, responseTime, weeklyStats, streaks, tips };
})();

const NotifStore = (() => {
  const _KEY = 'parlay_notifs';
  let _items = [];

  function _load() {
    try { _items = JSON.parse(localStorage.getItem(_KEY) || '[]'); }
    catch { _items = []; }
  }

  function add(type, title, body, meta = {}) {
    _load();
    const item = {
      id: 'notif_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
      type, title, body,
      read: false,
      timestamp: new Date().toISOString(),
      ...meta,
    };
    _items.unshift(item);
    if (_items.length > 50) _items = _items.slice(0, 50);
    localStorage.setItem(_KEY, JSON.stringify(_items));
    return item;
  }

  function all() { _load(); return _items; }

  function unreadCount() { _load(); return _items.filter(n => !n.read).length; }

  function markRead(id) {
    _load();
    const n = _items.find(i => i.id === id);
    if (n) { n.read = true; localStorage.setItem(_KEY, JSON.stringify(_items)); }
  }

  function markAllRead() {
    _load();
    _items.forEach(n => { n.read = true; });
    localStorage.setItem(_KEY, JSON.stringify(_items));
  }

  function clear() { _items = []; localStorage.removeItem(_KEY); }

  return { add, all, unreadCount, markRead, markAllRead, clear };
})();

const COMM_TRAITS = [
  { id: 'direct-indirect', left: 'Direct', right: 'Indirect', desc: 'How straightforward are you in expressing needs?' },
  { id: 'logic-emotion', left: 'Logic-first', right: 'Feelings-first', desc: 'Do you lead with reasoning or emotions?' },
  { id: 'process-resolve', left: 'Need to process', right: 'Resolve now', desc: 'Do you need time to think or prefer to address things immediately?' },
  { id: 'verbal-actions', left: 'Words matter', right: 'Actions matter', desc: 'How do you show and receive care?' },
  { id: 'detail-bigpic', left: 'Details', right: 'Big picture', desc: 'Do you focus on specifics or the overall direction?' },
];

const CommProfile = (() => {
  const _KEY = 'parlay_comm_profile';

  function save(profile) {
    localStorage.setItem(_KEY, JSON.stringify(profile));
  }

  function load() {
    try { return JSON.parse(localStorage.getItem(_KEY) || '{}'); }
    catch { return {}; }
  }

  function get(traitId) {
    const p = load();
    return p[traitId] ?? 3; // 1-5 scale, 3 = center
  }

  function set(traitId, value) {
    const p = load();
    p[traitId] = value;
    save(p);
  }

  function isComplete() {
    const p = load();
    return COMM_TRAITS.every(t => p[t.id] !== undefined);
  }

  function summary() {
    const p = load();
    const parts = [];
    COMM_TRAITS.forEach(t => {
      const val = p[t.id] ?? 3;
      if (val <= 2) parts.push(t.left);
      else if (val >= 4) parts.push(t.right);
    });
    return parts.length > 0 ? parts.join(', ') : 'Not set';
  }

  function clear() { localStorage.removeItem(_KEY); }

  return { save, load, get, set, isComplete, summary, clear };
})();

const MediatorChat = (() => {
  const _KEY = 'parlay_mediator_chat';
  let _messages = [];

  function _load() {
    try { _messages = JSON.parse(localStorage.getItem(_KEY) || '[]'); }
    catch { _messages = []; }
  }

  function _save() {
    localStorage.setItem(_KEY, JSON.stringify(_messages));
  }

  function messages() { _load(); return _messages; }

  function addUser(text) {
    _load();
    const msg = { id: 'mc_' + Date.now(), role: 'user', text, timestamp: new Date().toISOString() };
    _messages.push(msg);
    _save();
    return msg;
  }

  function addAI(text) {
    _load();
    const msg = { id: 'mc_' + Date.now(), role: 'ai', text, timestamp: new Date().toISOString() };
    _messages.push(msg);
    _save();
    return msg;
  }

  function addSystem(text) {
    _load();
    const msg = { id: 'mc_' + Date.now(), role: 'system', text, timestamp: new Date().toISOString() };
    _messages.push(msg);
    _save();
    return msg;
  }

  async function send(userText) {
    addUser(userText);

    // Build context for the AI
    const myN = Auth.myName();
    const theirN = Auth.theirName();
    const tone = TONES[Store.get('mediatorTone') || 'neutral'];
    const commSummary = CommProfile.summary();
    const moodAvg = MoodStore.averageEnergy(7);
    const activeParlays = Store.activeParlays();
    const pendingTasks = Store.myTasks();

    const contextParts = [];
    if (activeParlays.length > 0) {
      contextParts.push(`Active plans: ${activeParlays.map(p => p.title).join(', ')}`);
    }
    if (pendingTasks.length > 0) {
      contextParts.push(`Open tasks for ${myN}: ${pendingTasks.length}`);
    }
    if (moodAvg) {
      contextParts.push(`${myN}'s recent mood average: ${moodAvg}/5`);
    }

    // Use enhanced system prompt that includes partner profile, conflict patterns, etc.
    let systemPrompt;
    try {
      systemPrompt = AIContext.mediatorSystemPrompt();
      // Append the tone setting
      systemPrompt += `\n\nTONE SETTING: ${tone?.label || 'Neutral'} — ${tone?.filterInstructions || 'Be balanced and clear.'}`;
      // Append active context
      if (contextParts.length > 0) {
        systemPrompt += `\n\nACTIVE CONTEXT:\n- ${contextParts.join('\n- ')}`;
      }
    } catch(e) {
      // Fallback to basic system prompt
      systemPrompt = `You are Parlay's AI Mediator — a warm, wise relationship coach embedded in a couples planning app. Your role is to help ${myN} and ${theirN} communicate better.

TONE: ${tone?.label || 'Neutral'} — ${tone?.filterInstructions || 'Be balanced and clear.'}

CONTEXT:
- ${myN}'s communication style: ${commSummary}
${contextParts.length > 0 ? '- ' + contextParts.join('\n- ') : ''}

RULES:
1. Never take sides. Always validate both perspectives.
2. Use "I notice..." and "It sounds like..." framing.
3. Offer practical, specific suggestions — not generic advice.
4. If someone vents, empathize first, then gently redirect.
5. Reference Gottman's research naturally (not by name).
6. Keep responses concise (2-4 sentences usually).
7. Never make up information about the couple — only use what's provided.`;
    }

    const recent = _messages.slice(-10).map(m =>
      m.role === 'user' ? `${myN}: ${m.text}` : m.role === 'ai' ? `Mediator: ${m.text}` : `[${m.text}]`
    ).join('\n');

    const userPrompt = `Conversation so far:\n${recent}\n\n${myN}: ${userText}`;

    try {
      const response = await AI.call(systemPrompt, userPrompt);
      addAI(response);
      return response;
    } catch(e) {
      const fallback = "I'm having trouble connecting right now, but I'm here. Could you try again in a moment?";
      addAI(fallback);
      return fallback;
    }
  }

  function clear() { _messages = []; localStorage.removeItem(_KEY); }

  function suggestions(context = '') {
    const parlays = Store.activeParlays();
    const tasks = Store.myTasks();
    const suggs = [];

    if (parlays.length > 0) {
      suggs.push({ icon: '📅', text: `How should I approach "${parlays[0].title}"?` });
    }
    if (tasks.length > 2) {
      suggs.push({ icon: '📋', text: "I'm feeling overwhelmed with tasks. Can you help?" });
    }
    suggs.push({ icon: '💬', text: 'I need help starting a difficult conversation.' });
    suggs.push({ icon: '🤝', text: 'How can we communicate better as a couple?' });
    if (MoodStore.averageEnergy(7) !== null && MoodStore.averageEnergy(7) < 3) {
      suggs.push({ icon: '🫂', text: "I've been feeling down lately. Any advice?" });
    }
    suggs.push({ icon: '🌟', text: 'What are we doing well as a couple?' });
    return suggs.slice(0, 4);
  }

  return { messages, addUser, addAI, addSystem, send, clear, suggestions };
})();

const SmartSuggestions = (() => {
  function forHome() {
    const suggs = [];
    const now = new Date();
    const hour = now.getHours();
    const day = now.getDay();
    const parlays = Store.activeParlays();
    const tasks = Store.myTasks();
    const todayMood = MoodStore.todayMood();
    const pendingCount = Store.myPendingParlayCount();

    // Time-based suggestions
    if (hour >= 17 && hour < 21 && (day === 5 || day === 6)) {
      suggs.push({ icon: '🌹', text: 'Plan a date night?', action: () => Router.go('compose', { topicId: 'date' }) });
    }
    if (hour >= 7 && hour < 10 && !todayMood) {
      suggs.push({ icon: '🌤️', text: 'Log your mood', action: () => Router.go('mood-checkin') });
    }

    // Context-based suggestions
    if (pendingCount > 0) {
      suggs.push({ icon: '📬', text: `${pendingCount} waiting on you`, action: () => Router.go('plan') });
    }
    if (tasks.length > 0) {
      const overdue = tasks.filter(t => t.dueDate && t.dueDate < now.toISOString().split('T')[0]);
      if (overdue.length > 0) {
        suggs.push({ icon: '⏰', text: `${overdue.length} overdue task${overdue.length > 1 ? 's' : ''}`, action: () => Router.go('tasks') });
      }
    }
    if (parlays.length === 0) {
      suggs.push({ icon: '✨', text: 'Start your first plan', action: () => Router.go('compose-pick') });
    }

    // Relationship suggestions
    if (!CommProfile.isComplete()) {
      suggs.push({ icon: '💬', text: 'Set up your comm style', action: () => Router.go('comm-style') });
    }

    suggs.push({ icon: '🤖', text: 'Chat with mediator', action: () => Router.go('mediator') });

    return suggs.slice(0, 5);
  }

  function forReply(parlay) {
    const suggs = [];
    if (parlay.status === 'pending_partner' && !parlay.isMine) {
      suggs.push({ text: "That works for me!", positive: true });
      suggs.push({ text: "I'd prefer a different time", positive: false });
      suggs.push({ text: "Let me think about it", positive: null });
    }
    if (parlay.status === 'active' && parlay.proposal) {
      suggs.push({ text: "I accept this proposal", positive: true });
      suggs.push({ text: "Can we adjust one thing?", positive: null });
    }
    return suggs;
  }

  return { forHome, forReply };
})();

const WeeklyRecap = (() => {
  const _KEY = 'parlay_last_recap';

  function isAvailable() {
    const last = localStorage.getItem(_KEY);
    if (!last) return true;
    const daysSince = (Date.now() - new Date(last).getTime()) / 86400000;
    return daysSince >= 6;
  }

  function markSeen() {
    localStorage.setItem(_KEY, new Date().toISOString());
  }

  function generate() {
    const stats = Insights.weeklyStats();
    const score = Insights.communicationScore();
    const equity = Insights.equityBalance();
    const streak = Insights.streaks();
    const moodTrend = MoodStore.trend();
    const tips = Insights.tips();

    return {
      period: `${U.shortDate(new Date(Date.now() - 7 * 86400000))} — ${U.shortDate(new Date())}`,
      stats,
      score,
      equity,
      streak,
      moodTrend,
      topTip: tips[0],
    };
  }

  function clear() { localStorage.removeItem(_KEY); }

  return { isAvailable, markSeen, generate, clear };
})();

// ──────────────────────────────────────────────
const Router = (() => {
  const _routes = {};
  let _current = null;
  let _currentParams = {};
  const NAV_SCREENS = ['home','couple-chat','calendar','tasks','setup','plan'];

  function register(name, renderFn, initFn) {
    _routes[name] = { render: renderFn, init: initFn };
  }

  function go(name, params = {}) {
    const route = _routes[name];
    if (!route) { console.error('[Router] Unknown route:', name); return; }

    _current = name;
    _currentParams = params;
    const app = document.getElementById('app');

    // Render
    let html;
    try { html = route.render(params); }
    catch(e) { console.error('[Router] render error on', name, e); html = `<div style="padding:40px;color:red;">Render error: ${e.message}</div>`; }
    let el = document.getElementById('screen-' + name);
    if (!el) {
      el = document.createElement('div');
      el.id = 'screen-' + name;
      el.className = 'screen';
      app.appendChild(el);
    }
    el.innerHTML = html;

    // Hide all, show this
    app.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    el.classList.add('active');

    // Scroll to top
    window.scrollTo(0, 0);

    // Nav visibility + active state
    const nav = document.getElementById('nav');
    if (nav) {
      nav.style.display = NAV_SCREENS.includes(name) ? 'flex' : 'none';
      nav.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.screen === name);
      });
    }

    // Update badges on every main nav
    if (NAV_SCREENS.includes(name)) { try { Badges.update(); } catch(e) {} }

    // Init
    if (route.init) {
      try { route.init(el, params); } catch(e) { console.error('[Router] init error on', name, e); }
    }
  }

  /** Re-render the current screen with the same params */
  function reload() {
    if (_current) go(_current, _currentParams);
  }

  function current() { return _current; }
  function currentParams() { return _currentParams; }

  function initNav() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => go(btn.dataset.screen));
    });
  }

  return { register, go, reload, current, currentParams, initNav };
})();

const AI = (() => {
  async function call(systemPrompt, userMessage) {
    const token = Auth.getToken();
    const headers = {
      'Content-Type': 'application/json',
      'apikey': CONFIG.SUPABASE_KEY,
      'Authorization': `Bearer ${token || CONFIG.SUPABASE_KEY}`,
    };
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), CONFIG.AI_TIMEOUT);

    try {
      const res = await fetch(CONFIG.EDGE_URL, {
        method: 'POST',
        headers,
        body: JSON.stringify({ systemPrompt, userMessage }),
        signal: controller.signal,
      });
      clearTimeout(timeout);

      if (!res.ok) {
        const body = await res.text().catch(() => '');
        throw new Error(`AI error ${res.status}: ${body.slice(0,150)}`);
      }

      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch { return raw.trim(); }
      return data.content?.[0]?.text || data.text || data.result || data.message || '';
    } catch(e) {
      clearTimeout(timeout);
      throw e;
    }
  }

  return { call };
})();

// ── DEMO: Local tone rewriter (no AI needed) ──
const DemoRewriter = (() => {
  // Profanity → clean replacement map
  const PROFANITY = [
    [/\bfuck(?:en|ing|ed|s)?\b/gi, ''],
    [/\bshit(?:ty|s)?\b/gi, ''],
    [/\bbitch(?:ing|y|es)?\b/gi, ''],
    [/\bdamn(?:ed|it)?\b/gi, ''],
    [/\bass(?:hole|es)?\b/gi, ''],
    [/\bcrap(?:py|s)?\b/gi, ''],
    [/\bhell\b/gi, ''],
    [/\bwtf\b/gi, ''],
    [/\bstfu\b/gi, ''],
  ];

  // Aggressive phrases → softer alternatives
  const SOFTENERS = [
    [/\byou need to\b/gi, `I'd really appreciate if you could`],
    [/\byou have to\b/gi, `it would mean a lot if you could`],
    [/\byou never\b/gi, `I've been noticing that sometimes`],
    [/\byou always\b/gi, `I feel like sometimes`],
    [/\byou don'?t even\b/gi, `I wish we could`],
    [/\byou don'?t care\b/gi, `I need to feel that this matters to both of us`],
    [/\bI don'?t care\b/gi, `I'm flexible on this`],
    [/\bwhatever\b/gi, `I'm open to options`],
    [/\blet me\b/gi, `I'd like to`],
    [/\bjust let me\b/gi, `I'd really like to`],
    [/\bI want to\b/gi, `I'd love to`],
    [/\bI want\b/gi, `I'd like`],
    [/\bI need\b/gi, `It's important to me to`],
  ];

  /** Extract the quoted raw message from the prompt format:
   *  'Name wrote: "message text"\n\nApply the framework...' */
  function extractQuoted(usr) {
    // Match various AI prompt formats: wrote: "...", Rewrite this: "...", etc.
    const m = usr.match(/(?:wrote|Rewrite this|Rewrite|Filter this):\s*"([\s\S]*?)"/) ;
    return m ? m[1].trim() : usr.trim();
  }

  /** Clean profanity and soften aggressive phrasing */
  function rewrite(text) {
    let out = text;
    // Remove profanity
    for (const [rx, rep] of PROFANITY) out = out.replace(rx, rep);
    // Soften aggressive phrases
    for (const [rx, rep] of SOFTENERS) out = out.replace(rx, rep);
    // Collapse multiple spaces / clean up punctuation
    out = out.replace(/\s{2,}/g, ' ').replace(/\s+([.,!?])/g, '$1').trim();
    // Ensure ends with punctuation
    if (out && !/[.!?]$/.test(out)) out += '.';
    // Capitalize first letter
    if (out) out = out[0].toUpperCase() + out.slice(1);
    return out;
  }

  return { extractQuoted, rewrite };
})();

      });

      const raw = DemoRewriter.extractQuoted(usr);
      return DemoRewriter.rewrite(raw);
    }

    // ── Fallback for any other AI call ──
    return DemoRewriter.rewrite(DemoRewriter.extractQuoted(usr));
  };
})();

function autoCategorize(title) {
  const t = title.toLowerCase();
  if (/grocer|pick up|buy|errand|return|dry clean|gas|pharmacy|prescription|store/.test(t)) return 'errands';
  if (/dish|laundry|vacuum|mop|clean|trash|tidy|organiz|declutter|dust/.test(t)) return 'household';
  if (/kid|school|homework|lunch|bath|playdate|doctor|dentist|permission|daycare|pickup|drop.?off/.test(t)) return 'kids';
  if (/fix|repair|mow|lawn|yard|install|hang|lightbulb|faucet|paint|car.*service|garage/.test(t)) return 'fix';
  if (/call|pay|bill|insurance|appoint|file|paper|tax|subscri|renew|cancel/.test(t)) return 'admin';
  if (/dog|cat|pet|vet|walk|feed|groom/.test(t)) return 'pets';
  if (/hair|gym|workout|massage|spa|self.?care|nail/.test(t)) return 'selfcare';
  return 'other';
}

function dueLabel(dueDate) {
  if (!dueDate) return { text: 'No due date', color: 'var(--muted)', urgent: false };
  const now = new Date(); now.setHours(0,0,0,0);
  const due = new Date(dueDate + 'T12:00:00'); due.setHours(0,0,0,0);
  const diff = Math.round((due - now) / 86400000);
  if (diff < 0) return { text: 'Overdue!', color: '#EF4444', urgent: true };
  if (diff === 0) return { text: 'Due today', color: '#E8913A', urgent: true };
  if (diff === 1) return { text: 'Due tomorrow', color: '#E8B88A', urgent: false };
  if (diff <= 7) {
    const dayName = due.toLocaleDateString('en-US', { weekday: 'short' });
    return { text: `Due ${dayName}`, color: 'var(--muted)', urgent: false };
  }
  const label = due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return { text: `Due ${label}`, color: 'var(--muted)', urgent: false };
}

function sortTasks(tasks) {
  return [...tasks].sort((a, b) => {
    // Overdue first, then today, then by date ascending, no-date last
    const da = dueLabel(a.dueDate);
    const db = dueLabel(b.dueDate);
    if (da.urgent && !db.urgent) return -1;
    if (!da.urgent && db.urgent) return 1;
    if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if (a.dueDate && !b.dueDate) return -1;
    if (!a.dueDate && b.dueDate) return 1;
    return 0;
  });
}

/** Render structured fields for a given topic as HTML */
function renderStructuredFields(topicId) {
  const fields = EVENT_FIELDS[topicId] || [];
  if (fields.length === 0 && topicId !== 'other') return '';

  return fields.map(field => {
    // Check showIf condition
    if (field.showIf && !field.showIf()) return '';

    // Build options, including family-aware dynamic options
    let opts = [...field.options];

    // Filter options with showIf
    opts = opts.filter(o => !o.showIf || o.showIf());

    // Add kids as options for family-aware fields
    if (field.familyAware) {
      const kids = FamilyStore.children();
      if (field.kidsOnly) {
        // Replace options entirely with kid names
        opts = kids.map(k => ({ val: k.id, label: k.name, icon: '👧' }));
        if (opts.length === 0) opts = [{ val: 'kids', label: 'Kids', icon: '👧' }];
      } else {
        // Append kid names to existing options
        kids.forEach(k => opts.push({ val: k.id, label: k.name, icon: '👧' }));
      }
    }

    const isMulti = field.type === 'select-many';

    return `
    <div style="margin-bottom:14px;" data-field-id="${field.id}">
      <div class="input-label">${field.label}</div>
      <div class="pill-group" data-field="${field.id}" data-multi="${isMulti}">
        ${opts.map(o => `
          <div class="pill" data-val="${o.val}">
            ${o.icon ? `<span class="pill-icon">${o.icon}</span>` : ''}
            ${U.esc(o.label)}
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

/** Collect structured field selections from the compose form */
function collectStructuredSelections(el) {
  const selections = {};
  el.querySelectorAll('.pill-group').forEach(group => {
    const fieldId = group.dataset.field;
    const isMulti = group.dataset.multi === 'true';
    const selected = [...group.querySelectorAll('.pill.selected')].map(p => p.dataset.val);
    if (selected.length > 0) {
      selections[fieldId] = isMulti ? selected : selected[0];
    }
  });
  return selections;
}

/** Generate a structured summary HTML from selections */
function renderStructuredSummary(topicId, selections) {
  if (!selections || Object.keys(selections).length === 0) return '';
  const fields = EVENT_FIELDS[topicId] || [];

  const rows = [];
  for (const field of fields) {
    const val = selections[field.id];
    if (!val) continue;
    const vals = Array.isArray(val) ? val : [val];
    const labels = vals.map(v => {
      // Check field options
      const opt = field.options.find(o => o.val === v);
      if (opt) return opt.label;
      // Check family members
      const fm = FamilyStore.find(v);
      if (fm) return fm.name;
      return v;
    });
    rows.push(`<div class="summary-row">
      <div class="summary-label">${U.esc(field.label.replace('?',''))}</div>
      <div class="summary-value">${labels.map(l => U.esc(l)).join(', ')}</div>
    </div>`);
  }
  if (rows.length === 0) return '';
  return `<div class="summary-card">${rows.join('')}</div>`;
}

// ── The complete tone filter ────────────────────
async function runToneFilter(rawText, intentContext = '') {
  const tone = Store.get('mediatorTone') || 'neutral';
  const profile = TONES[tone] || TONES.neutral;
  const senderBlock = getSenderPrefsPrompt();
  const recipientBlock = getRecipientPrefsPrompt();
  const intentBlock = intentContext
    ? `\nCRITICAL INTENT CONSTRAINT (non-negotiable — must be preserved exactly):\n${intentContext}\nDo NOT change who is going, who stays home, or any logistical facts.\n`
    : '';

  return AI.call(
    `You are Parlay's Communication Translator — an expert in couples communication grounded in research-backed relationship psychology.

═══ PHASE 1: DECODE THE MESSAGE ═══

Classify the message type BEFORE rewriting:

TYPE A — AGREEMENT / ACCEPTANCE: Core is "yes" or acceptance, even wrapped in frustration.
→ Extract the agreement clearly. DROP all venting — the agreement IS the message.

TYPE B — REFUSAL / BOUNDARY / COUNTER: Core is "no" or "not that, but this instead."
→ Preserve the boundary clearly. Remove blame. Soften HOW it's expressed, not WHAT is said.

TYPE C — REQUEST / NEGOTIATION: The speaker wants something requiring coordination.
→ Apply the full framework below.

TYPE D — EMOTIONAL EXPRESSION: Feelings with no clear ask.
→ Distill to the underlying feeling + a brief request to connect.

TYPE E — LOGISTICS / INFORMATION: Neutral factual content.
→ Light polish only. Do not over-soften factual messages.

═══ PHASE 2: GOTTMAN FOUR HORSEMEN SCAN (Types B, C, D) ═══

1. CRITICISM ("You never…" / "You always…") → SOFT STARTUP: specific behavior + "I feel…" + "I need…"
2. CONTEMPT (sarcasm, mockery, name-calling) → REMOVE ENTIRELY. Replace with direct statement of unmet need.
3. DEFENSIVENESS ("It's not my fault" / counter-attacking) → OWNERSHIP: acknowledge a part, then state perspective.
4. STONEWALLING ("whatever", "fine", "I don't care") → REQUEST FOR SPACE framed as care for the relationship.

═══ PHASE 3: NVC TRANSLATION (Types C, D) ═══

Extract: Observation → Feeling → Need → Request
• NEVER manufacture feelings the sender didn't express or imply.
• NEVER project emotions onto the recipient.
• NEVER write empathy statements directed at the partner.
• NEVER add "I understand" as a hedge.

═══ PHASE 4: ATTACHMENT-AWARE FRAMING ═══

• Replace DEMANDS with INVITATIONS ("Would you be open to…" / "How would you feel about…")
• Replace BLAME with VULNERABILITY ("I felt hurt when…" not "You hurt me by…")
• Replace GLOBAL LABELS with SPECIFIC MOMENTS ("When X happened" not "You're always X")
• Frame requests as TEAM PROBLEMS ("How can we handle…" not "You need to…")

═══ PHASE 5: LANGUAGE SAFETY ═══
${intentBlock}${LANGUAGE_SAFETY}

═══ PHASE 6: CALIBRATE DELIVERY ═══
TONE: ${profile.label} — ${profile.filterInstructions}
${senderBlock}${recipientBlock}

═══ OUTPUT ═══
1-3 sentences. First person as the sender. Preserve message type and all facts. Sound like a real person, not a therapist. Return ONLY the rewritten message.`,
    `${Auth.myName()} wrote: "${rawText}"\n\nApply the full methodology and return the rewritten message only:`
  );
}

Return ONLY valid JSON:
{
  "proposal": "The concrete compromise in 2-4 sentences",
  "reasoning": "One sentence on why this is fair",
  "userConcession": "What ${creatorN} gives up or adjusts",
  "partnerConcession": "What ${recipN} gives up or adjusts"
}`,
    `Topic: ${parlay.title}
${creatorN}'s position: "${parlay.filteredInput || parlay.rawInput}"
${recipN}'s position: "${parlay.partnerFilteredReply || parlay.partnerRawReply}"

Generate a fair compromise.`
  );

  try {
    return JSON.parse(raw.replace(/^```json?\s*/i,'').replace(/```\s*$/,'').trim());
  } catch {
    return { proposal: raw, reasoning: '', userConcession: '', partnerConcession: '' };
  }
}

// ── Task context filter ─────────────────────────
async function filterTaskContext(rawContext) {
  if (!rawContext || rawContext.length < 10) return rawContext;
  try {
    return await AI.call(
      `You are Parlay's Communication Translator. Rewrite this task description using relationship-safe communication:
• Remove blame, criticism, or passive aggression
• Frame as a team need, not a personal failing ("We need…" or "This needs…")
• Keep it brief and actionable — facts only, no emotional loading
• First person. Return ONLY the rewrite.`,
      `"${rawContext}"\nRewrite:`
    );
  } catch { return rawContext; }
}

Router.register('ob-join', () => `
  <div style="min-height:100dvh;background:var(--espresso);padding:0 28px;padding-top:max(60px,env(safe-area-inset-top));display:flex;flex-direction:column;">

    <div style="text-align:center;" class="a1">
      <div style="font-size:2.8rem;margin-bottom:12px;">🔑</div>
      <div style="font-family:var(--font-display);font-size:2rem;color:var(--cream);margin-bottom:6px;">Enter invite <em style="color:var(--amber)">code</em></div>
      <div style="font-size:.82rem;color:rgba(250,246,241,.65);margin-bottom:32px;">Your partner will have a 6-character code for you.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;" class="a2">
      <input id="join-code" class="input" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:var(--cream);font-size:1.8rem;text-align:center;letter-spacing:.25em;text-transform:uppercase;padding:18px;" placeholder="ABC123" maxlength="6" autocomplete="off" autocapitalize="characters">
      <div id="join-error" style="display:none;font-size:.8rem;color:#EF4444;text-align:center;"></div>
      <button class="btn btn-accent" id="join-submit" style="padding:16px;">Connect with Partner</button>
    </div>

    <div style="margin-top:32px;padding:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-lg);" class="a3">
