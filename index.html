const NotifStore = (() => {
  const _KEY = 'parlay_notifs';
  let _items = [];

  function _load() {
    try { _items = JSON.parse(localStorage.getItem(_KEY) || '[]'); }
    catch { _items = []; }
  }

  function add(type, title, body, meta = {}) {
    _load();
    const item = {
      id: 'notif_' + Date.now() + '_' + Math.random().toString(36).slice(2,5),
      type, title, body,
      read: false,
      timestamp: new Date().toISOString(),
      ...meta,
    };
    _items.unshift(item);
    if (_items.length > 50) _items = _items.slice(0, 50);
    localStorage.setItem(_KEY, JSON.stringify(_items));
    return item;
  }

  function all() { _load(); return _items; }

  function unreadCount() { _load(); return _items.filter(n => !n.read).length; }

  function markRead(id) {
    _load();
    const n = _items.find(i => i.id === id);
    if (n) { n.read = true; localStorage.setItem(_KEY, JSON.stringify(_items)); }
  }

  function markAllRead() {
    _load();
    _items.forEach(n => { n.read = true; });
    localStorage.setItem(_KEY, JSON.stringify(_items));
  }

  function clear() { _items = []; localStorage.removeItem(_KEY); }

  return { add, all, unreadCount, markRead, markAllRead, clear };
})();

const CommProfile = (() => {
  const _KEY = 'parlay_comm_profile';

  function save(profile) {
    localStorage.setItem(_KEY, JSON.stringify(profile));
  }

  function load() {
    try { return JSON.parse(localStorage.getItem(_KEY) || '{}'); }
    catch { return {}; }
  }

  function get(traitId) {
    const p = load();
    return p[traitId] ?? 3; // 1-5 scale, 3 = center
  }

  function set(traitId, value) {
    const p = load();
    p[traitId] = value;
    save(p);
  }

  function isComplete() {
    const p = load();
    return COMM_TRAITS.every(t => p[t.id] !== undefined);
  }

  function summary() {
    const p = load();
    const parts = [];
    COMM_TRAITS.forEach(t => {
      const val = p[t.id] ?? 3;
      if (val <= 2) parts.push(t.left);
      else if (val >= 4) parts.push(t.right);
    });
    return parts.length > 0 ? parts.join(', ') : 'Not set';
  }

  function clear() { localStorage.removeItem(_KEY); }

  return { save, load, get, set, isComplete, summary, clear };
})();

const MediatorChat = (() => {
  const _KEY = 'parlay_mediator_chat';
  let _messages = [];

  function _load() {
    try { _messages = JSON.parse(localStorage.getItem(_KEY) || '[]'); }
    catch { _messages = []; }
  }

  function _save() {
    localStorage.setItem(_KEY, JSON.stringify(_messages));
  }

  function messages() { _load(); return _messages; }

  function addUser(text) {
    _load();
    const msg = { id: 'mc_' + Date.now(), role: 'user', text, timestamp: new Date().toISOString() };
    _messages.push(msg);
    _save();
    return msg;
  }

  function addAI(text) {
    _load();
    const msg = { id: 'mc_' + Date.now(), role: 'ai', text, timestamp: new Date().toISOString() };
    _messages.push(msg);
    _save();
    return msg;
  }

  function addSystem(text) {
    _load();
    const msg = { id: 'mc_' + Date.now(), role: 'system', text, timestamp: new Date().toISOString() };
    _messages.push(msg);
    _save();
    return msg;
  }

  async function send(userText) {
    addUser(userText);

    // Build context for the AI
    const myN = Auth.myName();
    const theirN = Auth.theirName();
    const tone = TONES[Store.get('mediatorTone') || 'neutral'];
    const commSummary = CommProfile.summary();
    const moodAvg = MoodStore.averageEnergy(7);
    const activeParlays = Store.activeParlays();
    const pendingTasks = Store.myTasks();

    const contextParts = [];
    if (activeParlays.length > 0) {
      contextParts.push(`Active plans: ${activeParlays.map(p => p.title).join(', ')}`);
    }
    if (pendingTasks.length > 0) {
      contextParts.push(`Open tasks for ${myN}: ${pendingTasks.length}`);
    }
    if (moodAvg) {
      contextParts.push(`${myN}'s recent mood average: ${moodAvg}/5`);
    }

    // Use enhanced system prompt that includes partner profile, conflict patterns, etc.
    let systemPrompt;
    try {
      systemPrompt = AIContext.mediatorSystemPrompt();
      // Append the tone setting
      systemPrompt += `\n\nTONE SETTING: ${tone?.label || 'Neutral'} — ${tone?.filterInstructions || 'Be balanced and clear.'}`;
      // Append active context
      if (contextParts.length > 0) {
        systemPrompt += `\n\nACTIVE CONTEXT:\n- ${contextParts.join('\n- ')}`;
      }
    } catch(e) {
      // Fallback to basic system prompt
      systemPrompt = `You are Parlay's AI Mediator — a warm, wise relationship coach embedded in a couples planning app. Your role is to help ${myN} and ${theirN} communicate better.

TONE: ${tone?.label || 'Neutral'} — ${tone?.filterInstructions || 'Be balanced and clear.'}

CONTEXT:
- ${myN}'s communication style: ${commSummary}
${contextParts.length > 0 ? '- ' + contextParts.join('\n- ') : ''}

RULES:
1. Never take sides. Always validate both perspectives.
2. Use "I notice..." and "It sounds like..." framing.
3. Offer practical, specific suggestions — not generic advice.
4. If someone vents, empathize first, then gently redirect.
5. Reference Gottman's research naturally (not by name).
6. Keep responses concise (2-4 sentences usually).
7. Never make up information about the couple — only use what's provided.`;
    }

    const recent = _messages.slice(-10).map(m =>
      m.role === 'user' ? `${myN}: ${m.text}` : m.role === 'ai' ? `Mediator: ${m.text}` : `[${m.text}]`
    ).join('\n');

    const userPrompt = `Conversation so far:\n${recent}\n\n${myN}: ${userText}`;

    try {
      const response = await AI.call(systemPrompt, userPrompt);
      addAI(response);
      return response;
    } catch(e) {
      const fallback = "I'm having trouble connecting right now, but I'm here. Could you try again in a moment?";
      addAI(fallback);
      return fallback;
    }
  }

  function clear() { _messages = []; localStorage.removeItem(_KEY); }

  function suggestions(context = '') {
    const parlays = Store.activeParlays();
    const tasks = Store.myTasks();
    const suggs = [];

    if (parlays.length > 0) {
      suggs.push({ icon: '📅', text: `How should I approach "${parlays[0].title}"?` });
    }
    if (tasks.length > 2) {
      suggs.push({ icon: '📋', text: "I'm feeling overwhelmed with tasks. Can you help?" });
    }
    suggs.push({ icon: '💬', text: 'I need help starting a difficult conversation.' });
    suggs.push({ icon: '🤝', text: 'How can we communicate better as a couple?' });
    if (MoodStore.averageEnergy(7) !== null && MoodStore.averageEnergy(7) < 3) {
      suggs.push({ icon: '🫂', text: "I've been feeling down lately. Any advice?" });
    }
    suggs.push({ icon: '🌟', text: 'What are we doing well as a couple?' });
    return suggs.slice(0, 4);
  }

  return { messages, addUser, addAI, addSystem, send, clear, suggestions };
})();

const SmartSuggestions = (() => {
  function forHome() {
    const suggs = [];
    const now = new Date();
    const hour = now.getHours();
    const day = now.getDay();
    const parlays = Store.activeParlays();
    const tasks = Store.myTasks();
    const todayMood = MoodStore.todayMood();
    const pendingCount = Store.myPendingParlayCount();

    // Time-based suggestions
    if (hour >= 17 && hour < 21 && (day === 5 || day === 6)) {
      suggs.push({ icon: '🌹', text: 'Plan a date night?', action: () => Router.go('compose', { topicId: 'date' }) });
    }
    if (hour >= 7 && hour < 10 && !todayMood) {
      suggs.push({ icon: '🌤️', text: 'Log your mood', action: () => Router.go('mood-checkin') });
    }

    // Context-based suggestions
    if (pendingCount > 0) {
      suggs.push({ icon: '📬', text: `${pendingCount} waiting on you`, action: () => Router.go('plan') });
    }
    if (tasks.length > 0) {
      const overdue = tasks.filter(t => t.dueDate && t.dueDate < now.toISOString().split('T')[0]);
      if (overdue.length > 0) {
        suggs.push({ icon: '⏰', text: `${overdue.length} overdue task${overdue.length > 1 ? 's' : ''}`, action: () => Router.go('tasks') });
      }
    }
    if (parlays.length === 0) {
      suggs.push({ icon: '✨', text: 'Start your first plan', action: () => Router.go('compose-pick') });
    }

    // Relationship suggestions
    if (!CommProfile.isComplete()) {
      suggs.push({ icon: '💬', text: 'Set up your comm style', action: () => Router.go('comm-style') });
    }

    suggs.push({ icon: '🤖', text: 'Chat with mediator', action: () => Router.go('mediator') });

    return suggs.slice(0, 5);
  }

  function forReply(parlay) {
    const suggs = [];
    if (parlay.status === 'pending_partner' && !parlay.isMine) {
      suggs.push({ text: "That works for me!", positive: true });
      suggs.push({ text: "I'd prefer a different time", positive: false });
      suggs.push({ text: "Let me think about it", positive: null });
    }
    if (parlay.status === 'active' && parlay.proposal) {
      suggs.push({ text: "I accept this proposal", positive: true });
      suggs.push({ text: "Can we adjust one thing?", positive: null });
    }
    return suggs;
  }

  return { forHome, forReply };
})();

const WeeklyRecap = (() => {
  const _KEY = 'parlay_last_recap';

  function isAvailable() {
    const last = localStorage.getItem(_KEY);
    if (!last) return true;
    const daysSince = (Date.now() - new Date(last).getTime()) / 86400000;
    return daysSince >= 6;
  }

  function markSeen() {
    localStorage.setItem(_KEY, new Date().toISOString());
  }

  function generate() {
    const stats = Insights.weeklyStats();
    const score = Insights.communicationScore();
    const equity = Insights.equityBalance();
    const streak = Insights.streaks();
    const moodTrend = MoodStore.trend();
    const tips = Insights.tips();

    return {
      period: `${U.shortDate(new Date(Date.now() - 7 * 86400000))} — ${U.shortDate(new Date())}`,
      stats,
      score,
      equity,
      streak,
      moodTrend,
      topTip: tips[0],
    };
  }

  function clear() { localStorage.removeItem(_KEY); }

  return { isAvailable, markSeen, generate, clear };
})();

// ROUTER — Hash-based SPA
// ──────────────────────────────────────────────
const Router = (() => {
  const _routes = {};
  let _current = null;
  let _currentParams = {};
  const NAV_SCREENS = ['home','plan','tasks','setup'];

  function register(name, renderFn, initFn) {
    _routes[name] = { render: renderFn, init: initFn };
  }

  function go(name, params = {}) {
    const route = _routes[name];
    if (!route) { console.error('[Router] Unknown route:', name); return; }

    _current = name;
    _currentParams = params;
    const app = document.getElementById('app');

    // Render
    let html;
    try { html = route.render(params); }
    catch(e) { console.error('[Router] render error on', name, e); html = `<div style="padding:40px;color:red;">Render error: ${e.message}</div>`; }
    let el = document.getElementById('screen-' + name);
    if (!el) {
      el = document.createElement('div');
      el.id = 'screen-' + name;
      el.className = 'screen';
      app.appendChild(el);
    }
    el.innerHTML = html;

    // Hide all, show this
    app.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    el.classList.add('active');

    // Scroll to top
    window.scrollTo(0, 0);

    // Nav visibility + active state
    const nav = document.getElementById('nav');
    if (nav) {
      nav.style.display = NAV_SCREENS.includes(name) ? 'flex' : 'none';
      nav.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.screen === name);
      });
    }

    // Update badges on every main nav
    if (NAV_SCREENS.includes(name)) { try { Badges.update(); } catch(e) {} }

    // Init
    if (route.init) {
      try { route.init(el, params); } catch(e) { console.error('[Router] init error on', name, e); }
    }
  }

  /** Re-render the current screen with the same params */
  function reload() {
    if (_current) go(_current, _currentParams);
  }

  function current() { return _current; }
  function currentParams() { return _currentParams; }

  function initNav() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => go(btn.dataset.screen));
    });
  }

  return { register, go, reload, current, currentParams, initNav };
})();

const AI = (() => {
  async function call(systemPrompt, userMessage) {
    const token = Auth.getToken();
    const headers = {
      'Content-Type': 'application/json',
      'apikey': CONFIG.SUPABASE_KEY,
      'Authorization': `Bearer ${token || CONFIG.SUPABASE_KEY}`,
    };
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), CONFIG.AI_TIMEOUT);

    try {
      const res = await fetch(CONFIG.EDGE_URL, {
        method: 'POST',
        headers,
        body: JSON.stringify({ systemPrompt, userMessage }),
        signal: controller.signal,
      });
      clearTimeout(timeout);

      if (!res.ok) {
        const body = await res.text().catch(() => '');
        throw new Error(`AI error ${res.status}: ${body.slice(0,150)}`);
      }

      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch { return raw.trim(); }
      return data.content?.[0]?.text || data.text || data.result || data.message || '';
    } catch(e) {
      clearTimeout(timeout);
      throw e;
    }
  }

  return { call };
})();

// ── DEMO: Local tone rewriter (no AI needed) ──
const DemoRewriter = (() => {
  // Profanity → clean replacement map
  const PROFANITY = [
    [/\bfuck(?:en|ing|ed|s)?\b/gi, ''],
    [/\bshit(?:ty|s)?\b/gi, ''],
    [/\bbitch(?:ing|y|es)?\b/gi, ''],
    [/\bdamn(?:ed|it)?\b/gi, ''],
    [/\bass(?:hole|es)?\b/gi, ''],
    [/\bcrap(?:py|s)?\b/gi, ''],
    [/\bhell\b/gi, ''],
    [/\bwtf\b/gi, ''],
    [/\bstfu\b/gi, ''],
  ];

  // Aggressive phrases → softer alternatives
  const SOFTENERS = [
    [/\byou need to\b/gi, `I'd really appreciate if you could`],
    [/\byou have to\b/gi, `it would mean a lot if you could`],
    [/\byou never\b/gi, `I've been noticing that sometimes`],
    [/\byou always\b/gi, `I feel like sometimes`],
    [/\byou don'?t even\b/gi, `I wish we could`],
    [/\byou don'?t care\b/gi, `I need to feel that this matters to both of us`],
    [/\bI don'?t care\b/gi, `I'm flexible on this`],
    [/\bwhatever\b/gi, `I'm open to options`],
    [/\blet me\b/gi, `I'd like to`],
    [/\bjust let me\b/gi, `I'd really like to`],
    [/\bI want to\b/gi, `I'd love to`],
    [/\bI want\b/gi, `I'd like`],
    [/\bI need\b/gi, `It's important to me to`],
  ];

  /** Extract the quoted raw message from the prompt format:
   *  'Name wrote: "message text"\n\nApply the framework...' */
  function extractQuoted(usr) {
    const m = usr.match(/wrote:\s*"([\s\S]*?)"\s*\n/);
    return m ? m[1].trim() : usr.trim();
  }

  /** Clean profanity and soften aggressive phrasing */
  function rewrite(text) {
    let out = text;
    // Remove profanity
    for (const [rx, rep] of PROFANITY) out = out.replace(rx, rep);
    // Soften aggressive phrases
    for (const [rx, rep] of SOFTENERS) out = out.replace(rx, rep);
    // Collapse multiple spaces / clean up punctuation
    out = out.replace(/\s{2,}/g, ' ').replace(/\s+([.,!?])/g, '$1').trim();
    // Ensure ends with punctuation
    if (out && !/[.!?]$/.test(out)) out += '.';
    // Capitalize first letter
    if (out) out = out[0].toUpperCase() + out.slice(1);
    return out;
  }

  return { extractQuoted, rewrite };
})();

function autoCategorize(title) {
  const t = title.toLowerCase();
  if (/grocer|pick up|buy|errand|return|dry clean|gas|pharmacy|prescription|store/.test(t)) return 'errands';
  if (/dish|laundry|vacuum|mop|clean|trash|tidy|organiz|declutter|dust/.test(t)) return 'household';
  if (/kid|school|homework|lunch|bath|playdate|doctor|dentist|permission|daycare|pickup|drop.?off/.test(t)) return 'kids';
  if (/fix|repair|mow|lawn|yard|install|hang|lightbulb|faucet|paint|car.*service|garage/.test(t)) return 'fix';
  if (/call|pay|bill|insurance|appoint|file|paper|tax|subscri|renew|cancel/.test(t)) return 'admin';
  if (/dog|cat|pet|vet|walk|feed|groom/.test(t)) return 'pets';
  if (/hair|gym|workout|massage|spa|self.?care|nail/.test(t)) return 'selfcare';
  return 'other';
}

function dueLabel(dueDate) {
  if (!dueDate) return { text: 'No due date', color: 'var(--muted)', urgent: false };
  const now = new Date(); now.setHours(0,0,0,0);
  const due = new Date(dueDate + 'T12:00:00'); due.setHours(0,0,0,0);
  const diff = Math.round((due - now) / 86400000);
  if (diff < 0) return { text: 'Overdue!', color: '#EF4444', urgent: true };
  if (diff === 0) return { text: 'Due today', color: '#E8913A', urgent: true };
  if (diff === 1) return { text: 'Due tomorrow', color: '#E8B88A', urgent: false };
  if (diff <= 7) {
    const dayName = due.toLocaleDateString('en-US', { weekday: 'short' });
    return { text: `Due ${dayName}`, color: 'var(--muted)', urgent: false };
  }
  const label = due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return { text: `Due ${label}`, color: 'var(--muted)', urgent: false };
}

function sortTasks(tasks) {
  return [...tasks].sort((a, b) => {
    // Overdue first, then today, then by date ascending, no-date last
    const da = dueLabel(a.dueDate);
    const db = dueLabel(b.dueDate);
    if (da.urgent && !db.urgent) return -1;
    if (!da.urgent && db.urgent) return 1;
    if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if (a.dueDate && !b.dueDate) return -1;
    if (!a.dueDate && b.dueDate) return 1;
    return 0;
  });
}

/** Render structured fields for a given topic as HTML */
function renderStructuredFields(topicId) {
  const fields = EVENT_FIELDS[topicId] || [];
  if (fields.length === 0 && topicId !== 'other') return '';

  return fields.map(field => {
    // Check showIf condition
    if (field.showIf && !field.showIf()) return '';

    // Build options, including family-aware dynamic options
    let opts = [...field.options];

    // Filter options with showIf
    opts = opts.filter(o => !o.showIf || o.showIf());

    // Add kids as options for family-aware fields
    if (field.familyAware) {
      const kids = FamilyStore.children();
      if (field.kidsOnly) {
        // Replace options entirely with kid names
        opts = kids.map(k => ({ val: k.id, label: k.name, icon: '👧' }));
        if (opts.length === 0) opts = [{ val: 'kids', label: 'Kids', icon: '👧' }];
      } else {
        // Append kid names to existing options
        kids.forEach(k => opts.push({ val: k.id, label: k.name, icon: '👧' }));
      }
    }

    const isMulti = field.type === 'select-many';

    return `
    <div style="margin-bottom:14px;" data-field-id="${field.id}">
      <div class="input-label">${field.label}</div>
      <div class="pill-group" data-field="${field.id}" data-multi="${isMulti}">
        ${opts.map(o => `
          <div class="pill" data-val="${o.val}">
            ${o.icon ? `<span class="pill-icon">${o.icon}</span>` : ''}
            ${U.esc(o.label)}
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

/** Collect structured field selections from the compose form */
function collectStructuredSelections(el) {
  const selections = {};
  el.querySelectorAll('.pill-group').forEach(group => {
    const fieldId = group.dataset.field;
    const isMulti = group.dataset.multi === 'true';
    const selected = [...group.querySelectorAll('.pill.selected')].map(p => p.dataset.val);
    if (selected.length > 0) {
      selections[fieldId] = isMulti ? selected : selected[0];
    }
  });
  return selections;
}

/** Generate a human-readable title from structured selections */
function autoTitle(topicId, selections, dateOptions) {
  const topic = TOPICS_V2.find(t => t.id === topicId) || TOPICS_V2[9];
  let title = topic.label;

  // Add date if available
  if (dateOptions?.length > 0) {
    const d = new Date(dateOptions[0].date + 'T12:00:00');
    const dayLabel = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    title += ` — ${dayLabel}`;
    if (dateOptions[0].timeLabel && dateOptions[0].timeLabel !== 'Any time') {
      title += `, ${dateOptions[0].timeLabel}`;
    }
  }

  return title;
}

/** Generate a structured summary HTML from selections */
function renderStructuredSummary(topicId, selections) {
  if (!selections || Object.keys(selections).length === 0) return '';
  const fields = EVENT_FIELDS[topicId] || [];

  const rows = [];
  for (const field of fields) {
    const val = selections[field.id];
    if (!val) continue;
    const vals = Array.isArray(val) ? val : [val];
    const labels = vals.map(v => {
      // Check field options
      const opt = field.options.find(o => o.val === v);
      if (opt) return opt.label;
      // Check family members
      const fm = FamilyStore.find(v);
      if (fm) return fm.name;
      return v;
    });
    rows.push(`<div class="summary-row">
      <div class="summary-label">${U.esc(field.label.replace('?',''))}</div>
      <div class="summary-value">${labels.map(l => U.esc(l)).join(', ')}</div>
    </div>`);
  }
  if (rows.length === 0) return '';
  return `<div class="summary-card">${rows.join('')}</div>`;
}

// Topics that need structured intent questions before the free-text input

// ── Comm prefs prompt builders ──────────────────
function getSenderPrefsPrompt() {
  const cp = Store.commPrefs();
  const traits = cp.me?.traits || [];
  if (traits.length === 0) return '';
  return `\nSENDER'S SELF-REPORTED COMMUNICATION STYLE:\n${traits.map(t => '• ' + t).join('\n')}\nHonour these traits when shaping the message — the sender identifies this way.\n`;
}

function getRecipientPrefsPrompt() {
  const cp = Store.commPrefs();
  const traits = cp.them?.traits || [];
  const theirN = Auth.theirName();
  if (traits.length === 0) return '';
  return `\nRECIPIENT (${theirN}) SELF-REPORTED COMMUNICATION STYLE:\n${traits.map(t => '• ' + t).join('\n')}\nCalibrate the message for this specific person.\n`;
}

// ── Universal language safety rules ─────────────
const LANGUAGE_SAFETY = `
UNIVERSAL LANGUAGE RULES (apply to every word — no exceptions):
1. NEVER use terms of endearment unless specified in profiles above.
2. NEVER use comparative/historical framing — "just this time", "for once", "unlike last time" imply negative history.
3. NEVER use exclusion language implying someone is left out.
4. NEVER use scarcity/urgency framing — "I really need this", "I just want one thing".
5. NEVER reference patterns or frequency — "we never", "you always", "last time".
6. NEVER use minimising language — "it's just a quick trip", "it won't be a big deal".
7. For family visits, never use territorial phrasing or score-keeping references.
`;

// ── The complete tone filter ────────────────────
async function runToneFilter(rawText, intentContext = '') {
  const tone = Store.get('mediatorTone') || 'neutral';
  const profile = TONES[tone] || TONES.neutral;
  const senderBlock = getSenderPrefsPrompt();
  const recipientBlock = getRecipientPrefsPrompt();
  const intentBlock = intentContext
    ? `\nCRITICAL INTENT CONSTRAINT (non-negotiable — must be preserved exactly):\n${intentContext}\nDo NOT change who is going, who stays home, or any logistical facts.\n`
    : '';

  return AI.call(
    `You are Parlay's Communication Translator — a specialist in couples communication.

STEP 0 — CLASSIFY THE MESSAGE FIRST:

TYPE A — AGREEMENT: Core content is "yes" or acceptance, even if wrapped in frustration.
• Extract the agreement clearly. DROP all venting entirely — the agreement IS the message.

TYPE B — REFUSAL or COUNTER-PROPOSAL: Core content is "no" or "not that, but this instead."
• Preserve the no/counter clearly. Remove blame. Apply NVC only to soften HOW the refusal is expressed.

TYPE C — NEGOTIATION REQUEST (most common): There's something the speaker wants that requires coordination.
• Apply the full framework below.

TYPE D — EMOTIONAL EXPRESSION: Venting with no clear ask.
• Distill to the underlying feeling + a request to talk. Brief.

---

DISCIPLINE 1 — GOTTMAN FOUR HORSEMEN (Type C and D only):
• Criticism → soft complaint (specific behaviour + feeling + need)
• Contempt → direct statement of unmet need. Remove entirely, never soften.
• Defensiveness → simple ownership
• Stonewalling → request for space framed as care

DISCIPLINE 2 — NVC TRANSLATION (Type C and D only):
Find the Observation → Feeling → Need → Request underneath.
NEVER manufacture feelings. NEVER project emotions. NEVER write empathy statements directed at the partner.

DISCIPLINE 3 — RECIPIENT CALIBRATION (always):
${intentBlock}${LANGUAGE_SAFETY}
TONE: ${profile.label} — ${profile.filterInstructions}
${senderBlock}${recipientBlock}
OUTPUT: 1-3 sentences. First person as the sender. Preserve the core message type. Return ONLY the rewritten message.`,
    `${Auth.myName()} wrote: "${rawText}"\n\nApply the framework and return the rewritten message only:`
  );
}

// ── Proposal generation ─────────────────────────
async function generateProposal(parlay) {
  const tone = Store.get('mediatorTone') || 'neutral';
  const profile = TONES[tone] || TONES.neutral;
  const myN = Auth.myName();
  const theirN = Auth.theirName();
  const creatorN = parlay.isMine ? myN : theirN;
  const recipN = parlay.isMine ? theirN : myN;
  const senderPrefs = getSenderPrefsPrompt();
  const recipientPrefs = getRecipientPrefsPrompt();

  const raw = await AI.call(
    `You are Parlay's Compromise Generator for a couple (${creatorN} and ${recipN}).

Given two positions, create a fair compromise that:
1. Acknowledges both people's needs
2. Identifies what each person can give
3. Proposes a concrete plan of action
4. Uses ${profile.label} tone (${profile.filterInstructions})

${senderPrefs}${recipientPrefs}
${parlay.intentContext ? `CONTEXT: ${parlay.intentContext}` : ''}

Return ONLY valid JSON:
{
  "proposal": "The concrete compromise in 2-4 sentences",
  "reasoning": "One sentence on why this is fair",
  "userConcession": "What ${creatorN} gives up or adjusts",
  "partnerConcession": "What ${recipN} gives up or adjusts"
}`,
    `Topic: ${parlay.title}
${creatorN}'s position: "${parlay.filteredInput || parlay.rawInput}"
${recipN}'s position: "${parlay.partnerFilteredReply || parlay.partnerRawReply}"

Generate a fair compromise.`
  );

  try {
    return JSON.parse(raw.replace(/^```json?\s*/i,'').replace(/```\s*$/,'').trim());
  } catch {
    return { proposal: raw, reasoning: '', userConcession: '', partnerConcession: '' };
  }
}

// ── Task context filter ─────────────────────────
async function filterTaskContext(rawContext) {
  if (!rawContext || rawContext.length < 10) return rawContext;
  try {
    return await AI.call(
      `You are Parlay's Communication Translator. Rewrite this task description to be constructive and non-blaming. Keep it brief and actionable. First person. Return ONLY the rewrite.`,
      `"${rawContext}"\nRewrite:`
    );
  } catch { return rawContext; }
}

        <div class="radio-opt" data-val="plan-together"><div class="dot"></div><div>Plan it together</div></div>
      </div>
    </div>`);
  }

  if (topicId === 'playdate') {
    return wrap(`
    <div style="margin-bottom:14px;">
      <div class="input-label">Who is going?</div>
      <div class="radio-group" id="iq-who">
        <div class="radio-opt" data-val="just-me"><div class="dot"></div><div>Just me and the kids</div></div>
        <div class="radio-opt" data-val="whole-family"><div class="dot"></div><div>Both of us and the kids</div></div>
      </div>
    </div>
    <div>
      <div class="input-label">Is ${U.esc(theirN)} involved?</div>
      <div class="radio-group" id="iq-role">
        <div class="radio-opt" data-val="not-involved"><div class="dot"></div><div>No &mdash; they stay home</div></div>
        <div class="radio-opt" data-val="aware"><div class="dot"></div><div>Just needs to know the timing</div></div>
        <div class="radio-opt" data-val="covering-kids"><div class="dot"></div><div>Comes along</div></div>
      </div>
    </div>`);
  }

  return '';
}

`, (el) => {
  el.querySelector('#su-submit').addEventListener('click', async () => {

    const pass  = el.querySelector('#su-pass').value;
    const errEl = el.querySelector('#su-error');
    errEl.style.display = 'none';

    if (!name) { errEl.textContent = 'Name is required'; errEl.style.display = 'block'; return; }
    if (!email) { errEl.textContent = 'Email is required'; errEl.style.display = 'block'; return; }

    el.querySelector('#su-submit').disabled = true;
    el.querySelector('#su-submit').textContent = 'Creating…';

    const result = await Auth.signUp(email, pass, name);
    if (result.error) {

      errEl.style.display = 'block';
      el.querySelector('#su-submit').disabled = false;
      el.querySelector('#su-submit').textContent = 'Create Account';

Router.register('plan', () => {
  const all = Store.parlays().filter(p => !p.archived);
  const myN = Auth.myName();
  const theirN = Auth.theirName();

  // Smart sections
  const needsMe = all.filter(p => p.status !== 'resolved' && p.status !== 'declined' && (
    (p.status === 'pending_partner' && !p.isMine) ||
    (p.status === 'partner_replied' && p.isMine) ||
    (p.status === 'counter_proposed' && p.isMine) ||
    (p.status === 'in_discussion' && p.lastActivityBy && p.lastActivityBy !== Auth.myUid()) ||
    (p.status === 'active')
  ));
  const active = all.filter(p => !['resolved','declined'].includes(p.status) && !needsMe.includes(p));
  const upcoming = all.filter(p => p.status === 'resolved' && p.resolution === 'date_accepted');
  const past = all.filter(p => p.status === 'resolved' && p.resolution !== 'date_accepted');
  const declined = all.filter(p => p.status === 'declined');

  const topicForP = (p) => TOPICS_V2.find(t => t.id === p.topicId) || TOPICS_V2[9];

  const statusLabel = (p) => {
    if (p.status === 'pending_partner' && !p.isMine) return ['Your turn', '#C4714A', '#C4714A18'];
    if (p.status === 'pending_partner' && p.isMine)  return ['Sent', '#E8B88A', '#E8B88A18'];
    if (p.status === 'partner_replied' && p.isMine)   return ['Reply received', '#7A6A9B', '#7A6A9B18'];
    if (p.status === 'partner_replied' && !p.isMine)  return ['Awaiting proposal', '#7A6A9B', '#7A6A9B18'];
    if (p.status === 'in_discussion')                  return ['In discussion', '#6A8CAA', '#6A8CAA18'];
    if (p.status === 'counter_proposed' && p.isMine)   return ['New times', '#6A8CAA', '#6A8CAA18'];
    if (p.status === 'counter_proposed' && !p.isMine)  return ['Counter sent', '#6A8CAA', '#6A8CAA18'];
    if (p.status === 'active')                         return ['Proposal ready', '#C4714A', '#C4714A18'];
    if (p.status === 'resolved' && p.resolution === 'date_accepted') return ['Confirmed', '#7A9E8A', '#7A9E8A18'];
    if (p.status === 'resolved')                       return ['Resolved', '#7A9E8A', '#7A9E8A18'];
    if (p.status === 'declined')                       return ['Declined', '#9B8880', '#9B888018'];
    return [p.status, '#9B8880', '#9B888018'];
  };

  const cardHtml = (p) => {
    const topic = topicForP(p);
    const [label, color, bg] = statusLabel(p);
    return `<div class="parlay-card" onclick="Router.go('parlay-detail',{id:'${p.id}'})">
      <div style="width:38px;height:38px;border-radius:10px;background:${topic.color}18;display:flex;align-items:center;justify-content:center;font-size:1.15rem;">${topic.icon}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.esc(p.title)}</div>
        <div style="font-size:.68rem;color:var(--muted);">${p.date}${p.isMine ? '' : ' · from ' + U.esc(theirN)}</div>
      </div>
      <div class="status-chip" style="background:${bg};color:${color};">${label}</div>
    </div>`;
  };

  const sectionHtml = (title, items, opts = {}) => {
    if (items.length === 0) return '';
    const collapsed = opts.collapsed ? ' collapsed' : '';
    return `
    <div style="padding:8px 0;">
      <div class="section-toggle${collapsed}" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
        <div class="section-label">${title} (${items.length})</div>
        <div class="toggle-arrow">▾</div>
      </div>
      <div class="section-body${collapsed}">
        <div style="display:flex;flex-direction:column;gap:8px;padding:0 20px;">
          ${items.map(cardHtml).join('')}
        </div>
      </div>
    </div>`;
  };

  return `
  <div style="padding-bottom:calc(var(--nav-h) + 20px);">
    <div style="background:var(--espresso);padding:0 24px 24px;padding-top:max(52px,env(safe-area-inset-top));">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-family:var(--font-display);font-size:2.4rem;font-weight:300;color:var(--cream);" class="a1">Plan <em style="color:var(--amber)">Events</em></div>
        <button class="btn-ghost" style="color:rgba(250,246,241,.65);font-size:1.1rem;" onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">↻</button>
      </div>
      <div style="font-size:.72rem;color:rgba(250,246,241,.65);" class="a1">Propose, discuss, decide — together.</div>
    </div>

    <div style="padding:16px 20px 8px;" class="a2">
      <button class="btn btn-accent" onclick="Router.go('compose-pick')">+ New Event Proposal</button>
    </div>

    ${needsMe.length > 0 ? `
    <div style="padding:8px 0;">
      <div class="section-label" style="color:var(--terra);">⚡ NEEDS YOUR RESPONSE (${needsMe.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;padding:0 20px;">
        ${needsMe.map(cardHtml).join('')}
      </div>
    </div>` : ''}

    ${sectionHtml('Active', active)}
    ${sectionHtml('Upcoming', upcoming)}
    ${sectionHtml('Resolved', past, { collapsed: true })}
    ${sectionHtml('Declined', declined, { collapsed: true })}

    ${all.length === 0 ? `
    <div style="padding:52px 24px;text-align:center;" class="a3">
      <div style="font-size:2.8rem;margin-bottom:16px;">📅</div>
      <div style="font-family:var(--font-display);font-size:1.3rem;margin-bottom:8px;">No events yet</div>
      <div style="font-size:.82rem;color:var(--muted);max-width:240px;margin:0 auto;">Propose a date night, family visit, trip, or anything else.</div>
    </div>` : ''}

    ${all.length >= 10 ? `
    <div class="filter-bar a3">
      <div class="filter-chip active" data-filter="all">All</div>
      <div class="filter-chip" data-filter="needs-me">⚡ Needs me</div>
      <div class="filter-chip" data-filter="active">Active</div>
      <div class="filter-chip" data-filter="accepted">Accepted</div>
      <div class="filter-chip" data-filter="declined">Declined</div>
    </div>` : ''}
  </div>`;
}, (el) => {
  // Filter chip logic
  el.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      el.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      // TODO: implement client-side filtering
    });
  });
  Badges.update();
});

    <div style="display:flex;flex-direction:column;gap:12px;" class="a3">

      ${hasStructured ? `<div id="structured-fields">${structuredHtml}</div>` : ''}

      <div style="margin-top:4px;">

          <span>💬</span> Add a personal note
        </div>
        <div id="note-area" style="display:none;">
          <textarea id="compose-text" class="input" rows="3" placeholder="Optional — add context, feelings, or details..." style="resize:none;line-height:1.6;"></textarea>

      <!-- Tone warning -->
      <div id="tone-warn" style="display:none;padding:12px 14px;background:#FFF5E0;border:1px solid #E8B88A;border-radius:var(--r-md);font-size:.78rem;color:#8A6A2A;line-height:1.5;">

      <div style="background:var(--parchment);border-radius:var(--r-md);padding:12px 14px;margin-top:4px;">
        <div style="font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:2px;">🔒 Safe by design</div>

}, (el, { topicId } = {}) => {
  let _submitting = false;
  let _dateSlotCount = 1;
  const textarea = el.querySelector('#compose-text');
  const warn = el.querySelector('#tone-warn');

  // Wire pill selectors
  el.querySelectorAll('.pill-group').forEach(group => {
    const isMulti = group.dataset.multi === 'true';
    group.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        if (isMulti) {
          pill.classList.toggle('selected');
        } else {
          group.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
          pill.classList.add('selected');
        }
      });
    });
  });

  // ToneCoach on compose textarea
  const composeCoach = el.querySelector('#compose-coach');
  if (textarea && composeCoach) ToneCoach.attachToTextarea(textarea, composeCoach);

  // Note toggle
  el.querySelector('#note-toggle')?.addEventListener('click', () => {
    const area = el.querySelector('#note-area');
    const toggle = el.querySelector('#note-toggle');
    if (area.style.display === 'none') {
      area.style.display = 'block';
      toggle.style.display = 'none';
      textarea?.focus();
    }
  });

  // Add date slot
  el.querySelector('#add-date-slot')?.addEventListener('click', () => {
    if (_dateSlotCount >= 4) return;
    _dateSlotCount++;
    const slots = el.querySelector('#date-slots');
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;gap:8px;align-items:center;';
    div.innerHTML = `
      <div class="slot-num">${_dateSlotCount}</div>
      <input type="date" class="input" style="flex:2;" data-slot="${_dateSlotCount}" data-type="date">
      ${U.timeSelectHtml(_dateSlotCount)}
    `;
    slots.appendChild(div);
    if (_dateSlotCount >= 4) el.querySelector('#add-date-slot').style.display = 'none';
    // Set min date
    const today = new Date().toISOString().split('T')[0];
    div.querySelector('input[type="date"]').min = today;
  });

  // Set min date on first slot
  const today = new Date().toISOString().split('T')[0];
  el.querySelectorAll('input[type="date"]').forEach(d => { d.min = today; });

  // Smart date conflict detection
  el.querySelector('#date-slots')?.addEventListener('change', (e) => {
    if (e.target.type !== 'date' || !e.target.value) return;
    const conflicts = SmartSchedule.checkConflicts(e.target.value);
    if (conflicts.length > 0) {
      const names = conflicts.map(c => c.title).join(', ');
      U.toast(`⚠️ Conflict: ${names} is already on this date`);
    }
  });

  // Suggest open dates (populate first empty slot)
  const suggestions = SmartSchedule.suggestDates(2, true);
  if (suggestions.length > 0) {
    const firstDateInput = el.querySelector('input[data-slot="1"][data-type="date"]');
    if (firstDateInput && !firstDateInput.value) {
      firstDateInput.value = suggestions[0].date;
    }
  }

  // Tension detection on note (debounced)
  let _toneTimer, _tensionV = 0;
  textarea?.addEventListener('input', () => {
    clearTimeout(_toneTimer);
    if (textarea.value.length > 40) {
      _toneTimer = setTimeout(async () => {
        const v = ++_tensionV;
        try {
          const t = await AI.call(
            `Analyze for Gottman Four Horsemen. Return ONLY JSON: {"flag":true/false,"horseman":"criticism|contempt|defensiveness|stonewalling|none","note":"one sentence"}`,
            textarea.value
          );
          if (v !== _tensionV) return;
          const parsed = typeof t === 'string' ? JSON.parse(t) : t;
          if (parsed.flag && warn) {
            const h = el.querySelector('#warn-head');
            const b = el.querySelector('#warn-body');
            if (h) h.textContent = parsed.horseman === 'contempt' ? '🚨 Contempt detected' : '⚡ Some heat detected';
            if (b) b.textContent = parsed.note || "That's okay — Parlay will cool it down.";
            warn.style.display = 'block';
          } else if (warn) { warn.style.display = 'none'; }
        } catch(e) { /* best-effort */ }
      }, 800);
    } else if (warn) { warn.style.display = 'none'; }
  });

  // Submit
  el.querySelector('#compose-submit')?.addEventListener('click', async () => {
    if (_submitting) return;
    _submitting = true;

    const btn = el.querySelector('#compose-submit');
    const btnText = el.querySelector('#compose-btn-text');
    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Sending…';

    // Collect structured selections
    const selections = collectStructuredSelections(el);

    // Collect date options
    const dateOptions = [];
    for (let n = 1; n <= 4; n++) {
      const d = el.querySelector(`input[data-slot="${n}"][data-type="date"]`)?.value;
      const t = el.querySelector(`[data-slot="${n}"][data-type="time"]`)?.value || '';
      if (d) dateOptions.push({ id: 'opt_' + n, date: d, timeLabel: t || 'Any time' });
    }

    // Build intent context from selections
    let intentContext = '';
    for (const [k, v] of Object.entries(selections)) {
      const vals = Array.isArray(v) ? v.join(', ') : v;
      intentContext += `${k}: ${vals}\n`;
    }

    // Get optional note
    const rawNote = textarea?.value.trim() || '';

    // Enrich intent context with AI context
    try {
      const aiCtx = AIContext.buildContext();
      if (aiCtx) intentContext += '\n' + aiCtx;
    } catch(e) { /* non-critical */ }

    // AI filter the note if present (with enhanced context)
    let filteredNote = rawNote;
    if (rawNote) {
      try {
        filteredNote = await AIContext.enhancedToneFilter(rawNote, intentContext);
      } catch(e) {
        try { filteredNote = await runToneFilter(rawNote, intentContext); } catch(e2) { filteredNote = rawNote; }
      }
    }

    // Auto-generate title
    const title = autoTitle(topicId, selections, dateOptions);

    // Save
    const id = 'neg_' + Date.now();
    try {
      await Store.addParlay({
        id, topicId, title,
        date: U.shortDate(new Date()),
        rawInput: rawNote,
        filteredInput: filteredNote,
        intentContext,
        structuredSelections: selections,
        dateOptions,
        status: 'pending_partner',
        createdByUid: Auth.myUid(),
        isMine: true,
        partnerRawReply: null, partnerFilteredReply: null,
        partnerDateResponse: null, counterDates: [], confirmedDate: null,
        proposal: null, resolution: null, archived: false,
        messageCount: 0, lastActivityBy: Auth.myUid(),
      });

      // Add initial message to thread if note was sent
      if (rawNote) {
        await EventMessages.send(id, { type: 'text', rawContent: rawNote, filteredContent: filteredNote });
      }

      Router.go('parlay-sent', { id, aiWorked: !!rawNote ? filteredNote !== rawNote : true });
    } catch(e) {
      console.error('[compose] save error:', e);
      _submitting = false;
      btn.disabled = false;
      btnText.textContent = `Send to ${Auth.theirName()} →`;
      U.toast('Failed to send — try again');
    }
  });
});

    const btn = el.querySelector('#inline-reply-send');
    const txt = el.querySelector('#inline-reply-btn-text');
    btn.disabled = true; txt.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Filtering…';

    let filtered = raw;
    try { filtered = await runToneFilter(raw, p.intentContext || ''); } catch(e) { filtered = raw; }

    await EventMessages.send(p.id, { type: 'text', rawContent: raw, filteredContent: filtered });

    // Update parlay status to in_discussion if it was pending
    if (['pending_partner', 'partner_replied'].includes(p.status)) {
      await Store.updateParlay(p.id, {
        status: p.status === 'pending_partner' && !p.isMine ? 'partner_replied' : 'in_discussion',
        partnerRawReply: p.isMine ? p.partnerRawReply : raw,
        partnerFilteredReply: p.isMine ? p.partnerFilteredReply : filtered,
        lastActivityBy: Auth.myUid(),
      });
    } else {
      await Store.updateParlay(p.id, { status: 'in_discussion', lastActivityBy: Auth.myUid() });
    }

    Badges.update();
    Router.go('parlay-detail', { id: p.id });
  });

  // Decline
  el.querySelector('#decline-btn')?.addEventListener('click', () => {
    el.querySelector('#decline-form').style.display = 'block';
    el.querySelector('#decline-btn').style.display = 'none';
  });
  el.querySelector('#decline-confirm')?.addEventListener('click', async () => {
    const btn = el.querySelector('#decline-confirm');
    btn.disabled = true; btn.textContent = 'Declining…';
    const reason = el.querySelector('#decline-text')?.value.trim() || '';
    let filtered = reason;
    if (reason) {
      try { filtered = await runToneFilter(reason, ''); } catch(e) { filtered = reason; }
    }
    await Store.updateParlay(p.id, { status: 'declined', resolution: 'declined' });
    if (reason) {
      await EventMessages.send(p.id, { type: 'text', rawContent: reason, filteredContent: filtered });
    }
    await EventMessages.send(p.id, { type: 'system', rawContent: `${Auth.myName()} declined`, filteredContent: `${Auth.myName()} declined the proposal` });
    Badges.update();
    U.toast('Declined');
    Router.go('plan');
  });

  // Counter-date selection
  let _selectedCounterDate = null;
  el.querySelectorAll('.counter-date-opt').forEach(card => {
    card.addEventListener('click', () => {
      if (p.status !== 'counter_proposed' || !p.isMine) return;
      _selectedCounterDate = card.dataset.opt;
      el.querySelectorAll('.counter-date-opt').forEach(c => {
        const sel = c.dataset.opt === _selectedCounterDate;
        c.classList.toggle('selected', sel);
      });
      const btn = el.querySelector('#accept-counter-btn');
      if (btn) btn.disabled = false;
      const txt = el.querySelector('#accept-counter-text');
      if (txt) txt.textContent = '✓ Confirm this date';
    });
  });

  el.querySelector('#accept-counter-btn')?.addEventListener('click', async () => {
    if (!_selectedCounterDate) return;
    const btn = el.querySelector('#accept-counter-btn');
    btn.disabled = true;
    const selectedOpt = p.counterDates?.find(o => o.id === _selectedCounterDate);
    await Store.updateParlay(p.id, { confirmedDate: selectedOpt || { id: _selectedCounterDate }, status: 'resolved', resolution: 'date_accepted' });
    await EventMessages.send(p.id, { type: 'system', rawContent: 'Date confirmed', filteredContent: `${Auth.myName()} confirmed the date` });
    Badges.update();
    U.toast('Event confirmed ✓');
    Router.go('parlay-detail', { id: p.id });
  });

  // Reopen
  el.querySelector('#reopen-btn')?.addEventListener('click', async () => {
    await Store.updateParlay(p.id, { status: 'in_discussion', resolution: null });
    Badges.update();
    U.toast('Reopened');
    Router.go('parlay-detail', { id: p.id });
  });

  // Manage
  el.querySelector('#manage-btn')?.addEventListener('click', async () => {
    const action = await U.sheet('Manage Event', [
      { key: 'archive', label: '📦 Archive', cls: 'btn-outline' },
      { key: 'delete', label: '🗑 Delete', cls: 'btn-danger' },
    ]);
    if (action === 'archive') {
      await Store.updateParlay(p.id, { archived: true });
      U.toast('Archived');
      Router.go('plan');
    } else if (action === 'delete') {
      await Store.deleteParlay(p.id);
      U.toast('Deleted');
      Router.go('plan');
    }
  });
});

Router.register('parlay-reply', ({ id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return `<div style="padding:60px 24px;text-align:center;">Event not found.<br><button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="Router.go('plan')">‹ Back</button></div>`;

  const topic = TOPICS_V2.find(t => t.id === p.topicId) || TOPICS_V2[9];
  const creatorN = p.isMine ? Auth.myName() : Auth.theirName();

  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('parlay-detail',{id:'${p.id}'})">‹ Back</button>
      <span style="font-size:1.2rem;">${topic.icon}</span>
      <span style="font-family:var(--font-display);font-size:1.1rem;">${topic.label}</span>
    </div>

    <div class="a2" style="margin-bottom:16px;">
      <div style="font-family:var(--font-display);font-size:1.5rem;font-weight:300;margin-bottom:6px;">Suggest <em style="color:var(--terra)">different times</em></div>
      <div style="font-size:.78rem;color:var(--muted);line-height:1.6;">Propose up to 4 alternative dates.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;" id="counter-date-slots">
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="slot-num">1</div>
        <input type="date" class="input" style="flex:2;" data-cslot="1" data-type="date">
        ${U.timeSelectHtml('c1')}
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="slot-num">2</div>
        <input type="date" class="input" style="flex:2;" data-cslot="2" data-type="date">
        ${U.timeSelectHtml('c2')}
      </div>
    </div>
    <div class="add-row" id="add-counter-slot" style="margin-bottom:16px;">+ Add another option</div>

    <div style="margin-bottom:16px;">
      <div class="input-label">Add a note (optional)</div>
      <textarea id="reply-text" class="input" rows="3" placeholder="e.g. Those times don't work — how about these instead?" style="resize:none;line-height:1.6;"></textarea>
      <div class="tone-coach tone-coach-hidden" id="reply-coach"></div>
    </div>

    <button class="btn btn-accent" id="counter-submit"><span id="counter-btn-text">Send counter-proposal →</span></button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="Router.go('parlay-detail',{id:'${p.id}'})">Cancel</button>
  </div>`;
}, (el, { id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return;
  let _submitting = false;
  let _counterSlots = 2;

  // ToneCoach on reply textarea
  const replyTA = el.querySelector('#reply-text');
  const replyCoach = el.querySelector('#reply-coach');
  if (replyTA && replyCoach) ToneCoach.attachToTextarea(replyTA, replyCoach);

  // Set min dates
  const today = new Date().toISOString().split('T')[0];
  el.querySelectorAll('input[type="date"]').forEach(d => { d.min = today; });

  // Add counter slot
  el.querySelector('#add-counter-slot')?.addEventListener('click', () => {
    if (_counterSlots >= 4) return;
    _counterSlots++;
    const slots = el.querySelector('#counter-date-slots');
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;gap:8px;align-items:center;';
    div.innerHTML = `
      <div class="slot-num">${_counterSlots}</div>
      <input type="date" class="input" style="flex:2;" data-cslot="${_counterSlots}" data-type="date" min="${today}">
      ${U.timeSelectHtml('c' + _counterSlots)}
    `;
    slots.appendChild(div);
    if (_counterSlots >= 4) el.querySelector('#add-counter-slot').style.display = 'none';
  });

  // Submit
  el.querySelector('#counter-submit')?.addEventListener('click', async () => {
    if (_submitting) return;
    const counterDates = [];
    for (let n = 1; n <= _counterSlots; n++) {
      const d = el.querySelector(`[data-cslot="${n}"][data-type="date"]`)?.value;
      const t = el.querySelector(`[data-slot="c${n}"][data-type="time"]`)?.value || '';
      if (d) counterDates.push({ id: 'counter_' + n, date: d, timeLabel: t || 'Any time' });
    }
    if (counterDates.length === 0) { U.toast('Add at least one date'); return; }
    _submitting = true;
    const btn = el.querySelector('#counter-submit');
    const txt = el.querySelector('#counter-btn-text');
    btn.disabled = true; txt.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Sending…';

    const raw = el.querySelector('#reply-text')?.value.trim() || '';
    let filtered = raw;
    if (raw) {
      try { filtered = await runToneFilter(raw, p.intentContext || ''); } catch(e) { filtered = raw; }
    }

    await Store.updateParlay(p.id, {
      partnerRawReply: raw || p.partnerRawReply,
      partnerFilteredReply: filtered || p.partnerFilteredReply,
      counterDates,
      status: 'counter_proposed',
      lastActivityBy: Auth.myUid(),
    });

    if (raw) {
      await EventMessages.send(p.id, { type: 'text', rawContent: raw, filteredContent: filtered });
    }
    await EventMessages.send(p.id, { type: 'system', rawContent: 'Counter-proposed', filteredContent: `${Auth.myName()} suggested different times` });

    Badges.update();
    U.toast('Counter-proposal sent ✓');
    Router.go('parlay-detail', { id: p.id });
  });
});

Router.register('tasks', () => {

  const done = Store.doneTasks();
  const myN = Auth.myName();
  const theirN = Auth.theirName();

  const taskCard = (t, opts = {}) => {
    const cat = TASK_CATEGORIES.find(c => c.id === t.categoryId) || TASK_CATEGORIES[7];
    const icon = t.presetIcon || cat.icon;
    const from = t.createdBy === 'me' ? myN : theirN;
    const to = t.assignedTo === 'me' ? myN : theirN;
    const dl = dueLabel(t.dueDate);
    const needsMe = t.pendingResponseFrom === 'me';
    const showDone = opts.showDone && t.status === 'accepted' && t.assignedTo === 'me';
    return `<div class="task-card" data-task-id="${t.id}" ${!showDone ? `onclick="Router.go('task-detail',{id:'${t.id}'})"` : ''}>

        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;">
          <span style="font-size:.68rem;color:${dl.color};${dl.urgent ? 'font-weight:700;' : ''}">${dl.text}</span>
          ${t.priority === 'high' ? '<span style="font-size:.62rem;font-weight:700;color:#EF4444;background:#FEE2E2;padding:1px 6px;border-radius:8px;">⚡ HIGH</span>' : ''}
          <span style="font-size:.68rem;color:var(--muted);">· ${t.assignedTo === 'me' ? from : 'To ' + to}</span>
        </div>
        ${needsMe ? '<div style="font-size:.68rem;font-weight:700;color:var(--purple);margin-top:4px;">⚡ Accept or respond</div>' : ''}
      </div>
      ${showDone ? `<button class="btn btn-sm" style="background:var(--sage);color:#fff;flex-shrink:0;font-size:.72rem;padding:6px 12px;" data-done-id="${t.id}" onclick="event.stopPropagation()">✓ Done</button>` : ''}
    </div>`;
  };

  const sectionHtml = (title, items, opts = {}) => {
    if (items.length === 0) return '';
    const sorted = sortTasks(items);
    const collapsed = opts.collapsed ? ' collapsed' : '';
    return `
    <div style="padding:8px 0;">
      <div class="section-toggle${collapsed}" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');" style="padding:0 20px;">
        <div class="section-label" style="margin-bottom:0;padding:0;${opts.labelColor ? 'color:' + opts.labelColor + ';' : ''}">${title} (${items.length})</div>
        <div class="toggle-arrow">▾</div>
      </div>
      <div class="section-body${collapsed}">
        <div style="display:flex;flex-direction:column;gap:8px;padding:4px 20px 0;">${sorted.map(t => taskCard(t, opts)).join('')}</div>
      </div>
    </div>`;
  };

  const total = allOpen.length + done.length;

  return `
  <div style="padding-bottom:calc(var(--nav-h) + 20px);">
    <div style="background:var(--espresso);padding:0 24px 24px;padding-top:max(52px,env(safe-area-inset-top));">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-family:var(--font-display);font-size:2.4rem;font-weight:300;color:var(--cream);" class="a1">Tasks <em style="color:var(--amber)">& To-Dos</em></div>
        <button class="btn-ghost" style="color:rgba(250,246,241,.65);font-size:1.1rem;" onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">↻</button>
      </div>
      <div style="font-size:.72rem;color:rgba(250,246,241,.65);" class="a1">Quick asks, household ops, life logistics.</div>
    </div>

    <div style="padding:16px 20px 0;" class="a2">
      <button class="btn btn-accent" onclick="Router.go('task-new')">+ Assign a Task</button>
    </div>

    ${action.length > 0 ? `
    <div style="padding:12px 0 0;">
      <div class="section-label" style="color:var(--terra);">⚡ NEEDS YOUR ACTION (${action.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;padding:0 20px;">
        ${sortTasks(action).map(t => taskCard(t)).join('')}
      </div>
    </div>` : ''}

    ${sectionHtml('My Tasks', myAccepted.concat(myOther), { showDone: true })}
    ${sectionHtml('I Assigned', sent.filter(t => t.status !== 'done'))}
    ${sectionHtml('Completed', done, { collapsed: true, labelColor: 'var(--sage)' })}

    ${total === 0 ? `
    <div style="padding:52px 24px;text-align:center;" class="a3">
      <div style="font-size:2.8rem;margin-bottom:16px;">📋</div>
      <div style="font-family:var(--font-display);font-size:1.3rem;margin-bottom:8px;">No tasks yet</div>

    </div>` : ''}

}, (el) => {

  el.querySelectorAll('[data-done-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.doneId;
      btn.disabled = true; btn.textContent = '...';
      await Store.updateTask(id, { status: 'done', pendingResponseFrom: null });
      Badges.update(); U.toast('Task done ✓');
      Router.go('tasks');
    });
  });
  Badges.update();
});

      <!-- Optional details -->
      <div>
        <div id="tnd-note-toggle" style="display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;color:var(--terra);font-size:.82rem;font-weight:600;">
          <span>💬</span> Add details
        </div>
        <div id="tnd-note-area" style="display:none;">
          <textarea id="tnd-context" class="input" rows="3" placeholder="Why, when, any specifics..." style="resize:none;line-height:1.6;"></textarea>
          <div style="font-size:.68rem;color:var(--muted);margin-top:4px;">🔒 Filtered by Parlay before ${U.esc(theirN)} sees it</div>
        </div>
      </div>

      <input type="hidden" id="tnd-cat" value="${categoryId}">
      <input type="hidden" id="tnd-icon" value="${U.esc(icon)}">

      <button class="btn btn-accent" id="tnd-submit"><span id="tnd-btn-text">Assign Task →</span></button>
      <button class="btn btn-outline" onclick="Router.go('task-new')" style="margin-top:-4px;">Cancel</button>
    </div>
  </div>`;
}, (el) => {
  let _submitting = false;

  // Wire pill groups
  el.querySelectorAll('.pill-group').forEach(group => {
    group.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        group.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
        pill.classList.add('selected');
      });
    });
  });

  // Note toggle
  el.querySelector('#tnd-note-toggle')?.addEventListener('click', () => {
    el.querySelector('#tnd-note-area').style.display = 'block';
    el.querySelector('#tnd-note-toggle').style.display = 'none';
    el.querySelector('#tnd-context')?.focus();
  });

  // Submit
  el.querySelector('#tnd-submit')?.addEventListener('click', async () => {
    if (_submitting) return;
    const title = el.querySelector('#tnd-title')?.value.trim();
    if (!title) { U.toast('Add a title'); return; }
    _submitting = true;
    const btn = el.querySelector('#tnd-submit');
    const txt = el.querySelector('#tnd-btn-text');
    btn.disabled = true; txt.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Assigning…';

    const assignTo = el.querySelector('[data-field="tnd-assign"] .pill.selected')?.dataset.val || 'them';
    const priority = el.querySelector('[data-field="tnd-priority"] .pill.selected')?.dataset.val || 'normal';
    const dueDate = el.querySelector('#tnd-due')?.value || null;
    const rawContext = el.querySelector('#tnd-context')?.value.trim() || '';
    const filteredContext = await filterTaskContext(rawContext);
    const categoryId = el.querySelector('#tnd-cat')?.value || autoCategorize(title);
    const presetIcon = el.querySelector('#tnd-icon')?.value || null;

    const id = 'task_' + Date.now();
    await Store.addTask({
      id, title, context: rawContext, rawContext, filteredContext,
      categoryId, presetIcon: presetIcon || null,
      priority, dueDate,
      assignedTo: assignTo, createdBy: 'me',
      status: 'pending_response',
      pendingResponseFrom: assignTo,
      counterCount: 0,
      completedAt: null, completedBy: null,
    });

    Badges.update();
    Router.go('task-sent', { id, title });
  });
});

// TASK DETAIL — Enhanced with due date, priority, manage menu
// ──────────────────────────────────────────────
Router.register('task-detail', ({ id } = {}) => {
  const t = Store.findTask(id);
  if (!t) return `<div style="padding:60px 24px;text-align:center;">Task not found.<br><button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="Router.go('tasks')">‹ Back</button></div>`;

  const cat = TASK_CATEGORIES.find(c => c.id === t.categoryId) || TASK_CATEGORIES[7];
  const icon = t.presetIcon || cat.icon;
  const from = t.createdBy === 'me' ? Auth.myName() : Auth.theirName();
  const to = t.assignedTo === 'me' ? Auth.myName() : Auth.theirName();
  const needsMe = t.pendingResponseFrom === 'me';
  const iAmAssignee = t.assignedTo === 'me';
  const dl = dueLabel(t.dueDate);

  // Status config
  const statusMap = {
    pending_response: needsMe ? ['⚡ Your turn', 'var(--terra)', 'rgba(196,113,74,.12)'] : ['Awaiting response', '#E8B88A', '#E8B88A18'],
    accepted: ['✓ Accepted', 'var(--sage)', 'rgba(122,158,138,.12)'],
    declined: ['✕ Declined', '#EF4444', 'rgba(239,68,68,.08)'],
    countered: ['↩ Changes suggested', 'var(--purple)', 'rgba(122,106,155,.12)'],
    done: ['✓ Done', 'var(--sage)', 'rgba(122,158,138,.12)'],
  };
  const [statusLabel, statusColor, statusBg] = statusMap[t.status] || [t.status, 'var(--muted)', 'var(--parchment)'];

  // Action area
  let actionHtml = '';
  if (t.status === 'pending_response' && needsMe) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="td-accept">✓ Accept</button>
      <button class="btn btn-outline" id="td-counter">↩ Suggest Changes</button>
      <button class="btn btn-outline" id="td-decline" style="color:#EF4444;border-color:#EF4444;">✕ Decline</button>
    </div>
    <div id="td-counter-form" style="display:none;margin-top:12px;">
      <div class="input-label">What would work better?</div>
      <textarea id="td-counter-msg" class="input" rows="3" placeholder="e.g. I can do this Thursday instead" style="resize:none;margin-bottom:8px;"></textarea>
      <div class="tone-coach tone-coach-hidden" id="td-counter-coach"></div>
      <button class="btn btn-accent" style="margin-top:8px;" id="td-counter-submit"><span id="td-counter-text">Send suggestion →</span></button>
    </div>
    <div id="td-decline-form" style="display:none;margin-top:12px;">
      <div class="input-label">Why are you declining? <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">(optional)</span></div>
      <textarea id="td-decline-msg" class="input" rows="2" placeholder="e.g. I don't have bandwidth right now" style="resize:none;margin-bottom:8px;"></textarea>
      <div class="tone-coach tone-coach-hidden" id="td-decline-coach"></div>
      <button class="btn btn-danger" style="margin-top:8px;" id="td-decline-submit">Decline task</button>
    </div>`;
  } else if (t.status === 'accepted' && iAmAssignee) {
    actionHtml = `<div style="margin-top:20px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="td-done">✓ Mark Done</button>
    </div>`;
  } else if (t.status === 'accepted' && !iAmAssignee) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);margin-top:20px;font-size:.85rem;color:var(--muted);">✓ Accepted — waiting for ${U.esc(to)} to complete</div>`;
  } else if (t.status === 'countered') {
    actionHtml = `<div style="margin-top:16px;">
      ${t.counterMessage ? `<div style="padding:14px 16px;background:var(--surface);border:1px solid rgba(122,106,155,.25);border-radius:var(--r-md);margin-bottom:12px;">
        <div class="input-label" style="color:var(--purple);">↩ Suggested change</div>
        <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredCounter || t.counterMessage)}</div>
      </div>` : ''}
      ${!iAmAssignee ? `<div style="display:flex;gap:8px;">
        <button class="btn" style="background:var(--sage);color:#fff;flex:1;" id="td-accept">✓ Accept change</button>
        <button class="btn btn-outline" style="flex:1;" id="td-decline">Decline</button>
      </div>` : `<div style="text-align:center;padding:12px;font-size:.85rem;color:var(--muted);">Waiting for ${U.esc(from)} to respond</div>`}
    </div>`;
  } else if (t.status === 'declined') {
    actionHtml = `<div style="margin-top:16px;">
      ${t.declineReason ? `<div style="padding:14px 16px;background:#FFF5F5;border:1px solid rgba(239,68,68,.2);border-radius:var(--r-md);margin-bottom:12px;">
        <div class="input-label" style="color:#EF4444;">Decline reason</div>
        <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredDecline || t.declineReason)}</div>
      </div>` : ''}
      <div style="text-align:center;padding:12px;font-size:.85rem;color:var(--muted);">This task was declined.</div>
    </div>`;
  } else if (t.status === 'done') {
    actionHtml = `<div style="text-align:center;padding:16px;background:#EDF4F0;border:1.5px solid var(--sage);border-radius:var(--r-md);margin-top:20px;">
      <div style="font-size:1.3rem;margin-bottom:4px;">🎉</div>
      <div style="font-size:.92rem;color:var(--sage);font-weight:700;">Completed</div>
      ${t.completedAt ? `<div style="font-size:.68rem;color:var(--muted);margin-top:4px;">${new Date(t.completedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>` : ''}
    </div>`;
  } else if (t.status === 'pending_response' && !needsMe) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);margin-top:20px;font-size:.85rem;color:var(--muted);">⏳ Waiting for ${U.esc(to)} to respond</div>`;
  }

  return `
  <div data-task-id="${t.id}" style="min-height:100dvh;padding:0 20px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('tasks')">‹ Tasks</button>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">↻</button>
        <button class="btn-ghost" id="td-manage">⋯</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;" class="a2">
      <div style="width:48px;height:48px;border-radius:14px;background:${cat.color}18;display:flex;align-items:center;justify-content:center;font-size:1.4rem;">${icon}</div>
      <div>
        <div style="font-family:var(--font-display);font-size:1.3rem;">${U.esc(t.title)}</div>
        <div style="font-size:.72rem;color:var(--muted);">From ${U.esc(from)} → ${U.esc(to)}</div>
      </div>
    </div>

    <!-- Status + meta -->
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;" class="a2">
      <div style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:${statusBg};border:1px solid ${statusColor}44;border-radius:var(--r-pill);">
        <div style="width:6px;height:6px;border-radius:50%;background:${statusColor};"></div>
        <div style="font-size:.72rem;font-weight:700;color:${statusColor};">${statusLabel}</div>
      </div>
      <div style="display:inline-flex;align-items:center;gap:4px;padding:5px 12px;background:var(--parchment);border-radius:var(--r-pill);font-size:.72rem;color:${dl.color};${dl.urgent ? 'font-weight:700;' : ''}">📅 ${dl.text}</div>
      ${t.priority === 'high' ? '<div style="display:inline-flex;align-items:center;gap:4px;padding:5px 12px;background:#FEE2E2;border-radius:var(--r-pill);font-size:.72rem;font-weight:700;color:#EF4444;">⚡ High priority</div>' : ''}
    </div>

    ${t.filteredContext || t.context ? `
    <div style="padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:16px;" class="a3">
      <div class="input-label">Details</div>
      <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredContext || t.context)}</div>
      <div style="font-size:.65rem;color:var(--sage);margin-top:6px;">✓ Filtered by Parlay</div>
    </div>` : ''}

    ${actionHtml}
  </div>`;
}, (el, { id } = {}) => {
  const t = Store.findTask(id);
  if (!t) return;

  el.querySelector('#td-accept')?.addEventListener('click', async () => {
    const btn = el.querySelector('#td-accept');
    btn.disabled = true; btn.textContent = 'Accepting…';
    await Store.updateTask(t.id, { status: 'accepted', pendingResponseFrom: null });
    Badges.update(); U.toast('Task accepted ✓');
    Router.go('tasks');
  });

  el.querySelector('#td-done')?.addEventListener('click', async () => {
    const btn = el.querySelector('#td-done');
    btn.disabled = true; btn.textContent = 'Completing…';
    await Store.updateTask(t.id, { status: 'done', pendingResponseFrom: null });
    Badges.update(); U.toast('Task done ✓');
    Router.go('tasks');
  });

  // ToneCoach on task detail textareas
  const tdCounterTA = el.querySelector('#td-counter-msg');
  const tdCounterCoach = el.querySelector('#td-counter-coach');
  if (tdCounterTA && tdCounterCoach) ToneCoach.attachToTextarea(tdCounterTA, tdCounterCoach);
  const tdDeclineTA = el.querySelector('#td-decline-msg');
  const tdDeclineCoach = el.querySelector('#td-decline-coach');
  if (tdDeclineTA && tdDeclineCoach) ToneCoach.attachToTextarea(tdDeclineTA, tdDeclineCoach);

  // Suggest changes
  el.querySelector('#td-counter')?.addEventListener('click', () => {
    el.querySelector('#td-counter-form').style.display = 'block';
    el.querySelector('#td-counter').style.display = 'none';
  });

  el.querySelector('#td-counter-submit')?.addEventListener('click', async () => {
    const msg = el.querySelector('#td-counter-msg')?.value.trim();
    if (!msg) { U.toast('Say what would work better'); return; }
    const btn = el.querySelector('#td-counter-submit');
    const txt = el.querySelector('#td-counter-text');
    btn.disabled = true; txt.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Sending…';

    let filtered = msg;
    try {
      filtered = await AI.call(
        `You are Parlay's Communication Translator. Rewrite this task counter-proposal to be constructive. 1-2 sentences. First person. ONLY the rewrite.`,
        `${Auth.myName()} wrote: "${msg}"\nRewrite:`
      );
    } catch(e) { filtered = msg; }

    await Store.updateTask(t.id, {
      status: 'countered',
      counterMessage: msg,
      filteredCounter: filtered,
      counterCount: (t.counterCount || 0) + 1,
      pendingResponseFrom: t.createdBy === 'me' ? 'me' : 'them',
    });
    Badges.update(); U.toast('Suggestion sent ✓');
    Router.go('tasks');
  });

  // Decline
  el.querySelector('#td-decline')?.addEventListener('click', () => {
    const form = el.querySelector('#td-decline-form');
    if (form) form.style.display = 'block';
    el.querySelector('#td-decline').style.display = 'none';
    const cf = el.querySelector('#td-counter-form');
    if (cf) cf.style.display = 'none';
    const cb = el.querySelector('#td-counter');
    if (cb) cb.style.display = '';
  });

  el.querySelector('#td-decline-submit')?.addEventListener('click', async () => {
    const reason = el.querySelector('#td-decline-msg')?.value.trim() || '';
    const btn = el.querySelector('#td-decline-submit');
    btn.disabled = true; btn.textContent = 'Declining…';

    let filtered = reason;
    if (reason) {
      try {
        filtered = await AI.call(
          'Rewrite this task decline reason to be respectful. 1 sentence. First person. ONLY the rewrite.',
          `${Auth.myName()} wrote: "${reason}"\nRewrite:`
        );
      } catch(e) { filtered = reason; }
    }
    await Store.updateTask(t.id, {
      status: 'declined',
      declineReason: reason,
      filteredDecline: filtered,
      pendingResponseFrom: null,
    });
    Badges.update(); U.toast('Task declined');
    Router.go('tasks');
  });

  // Manage menu
  el.querySelector('#td-manage')?.addEventListener('click', async () => {
    const action = await U.sheet('Manage Task', [
      { key: 'delete', label: '🗑 Delete task', cls: 'btn-danger' },
    ]);
    if (action === 'delete') {
      await Store.deleteTask(t.id);
      Badges.update(); U.toast('Task deleted');
      Router.go('tasks');
    }
  });
});

Router.register('profile-edit', () => {

  return `
  <div style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('setup')">‹ Back</button>

      <div style="width:72px;height:72px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem;margin:0 auto 12px;">${U.initials(myN)}</div>

    <div style="display:flex;flex-direction:column;gap:14px;" class="a3">

      </div>
      <button class="btn btn-accent" id="profile-save">Save changes</button>
    </div>

    ${couple?.invite_code ? `
    <div style="margin-top:28px;padding:16px;background:var(--parchment);border-radius:var(--r-md);" class="a4">
      <div class="input-label">Invite code</div>
      <div style="display:flex;align-items:center;gap:12px;">

});
