  return `
  <div data-topic="${topicId}" style="min-height:100dvh;display:flex;flex-direction:column;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('compose-pick')">‹ Back</button>
      <span style="font-size:1.2rem;">${topic.icon}</span>
      <span style="font-family:var(--font-display);font-size:1.1rem;">${topic.label}</span>
    </div>

    <div class="a2" style="margin-bottom:16px;">
      <div style="font-family:var(--font-display);font-size:1.9rem;font-weight:300;margin-bottom:4px;">Quick <em style="color:var(--terra)">setup</em></div>
      <div style="font-size:.78rem;color:var(--muted);line-height:1.6;">Tap your selections — ${U.esc(theirN)} sees the summary, not your raw words.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;" class="a3">
      <!-- Structured fields -->
      ${hasStructured ? `<div id="structured-fields">${structuredHtml}</div>` : ''}

      <!-- Date options -->
      <div style="margin-top:4px;">
        <div class="input-label">📅 When? <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">(up to 4 options)</span></div>
        <div style="display:flex;flex-direction:column;gap:8px;" id="date-slots">
          <div style="display:flex;gap:8px;align-items:center;">
            <div class="slot-num">1</div>
            <input type="date" class="input" style="flex:2;" data-slot="1" data-type="date">
            ${U.timeSelectHtml(1)}
          </div>
        </div>
        <div class="add-row" id="add-date-slot" style="margin-top:8px;">+ Add another date option</div>
      </div>

      <!-- Optional note -->
      <div>
        <div id="note-toggle" style="display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer;color:var(--terra);font-size:.82rem;font-weight:600;">
          <span>💬</span> Add a personal note
        </div>
        <div id="note-area" style="display:none;">
          <textarea id="compose-text" class="input" rows="3" placeholder="Optional — add context, feelings, or details..." style="resize:none;line-height:1.6;"></textarea>
          <div style="font-size:.68rem;color:var(--muted);margin-top:4px;">🔒 Filtered by Parlay before ${U.esc(theirN)} sees it</div>
        </div>
      </div>

      <!-- Tone warning -->
      <div id="tone-warn" style="display:none;padding:12px 14px;background:#FFF5E0;border:1px solid #E8B88A;border-radius:var(--r-md);font-size:.78rem;color:#8A6A2A;line-height:1.5;">
        <div style="font-weight:700;margin-bottom:3px;" id="warn-head">⚡ Parlay detected some heat</div>
        <div id="warn-body">That's okay — Parlay will cool it down before sending.</div>
      </div>

      <div style="background:var(--parchment);border-radius:var(--r-md);padding:12px 14px;margin-top:4px;">
        <div style="font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:2px;">🔒 Safe by design</div>
        <div style="font-size:.75rem;color:var(--muted);line-height:1.55;">Structured selections are neutral. Any notes are AI-filtered before sending.</div>
      </div>

      <button class="btn btn-accent" id="compose-submit">
        <span id="compose-btn-text">Send to ${U.esc(theirN)} →</span>
      </button>
      <button class="btn btn-outline" onclick="Router.go('compose-pick')" style="margin-top:-4px;">Cancel</button>
    </div>
  </div>`;
}, (el, { topicId } = {}) => {
  let _submitting = false;
  let _dateSlotCount = 1;
  const textarea = el.querySelector('#compose-text');
  const warn = el.querySelector('#tone-warn');

  // Wire pill selectors
  el.querySelectorAll('.pill-group').forEach(group => {
    const isMulti = group.dataset.multi === 'true';
    group.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        if (isMulti) {
          pill.classList.toggle('selected');
        } else {
          group.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
          pill.classList.add('selected');
        }
      });
    });
  });

  // Note toggle
  el.querySelector('#note-toggle')?.addEventListener('click', () => {
    const area = el.querySelector('#note-area');
    const toggle = el.querySelector('#note-toggle');
    if (area.style.display === 'none') {
      area.style.display = 'block';
      toggle.style.display = 'none';
      textarea?.focus();
    }
  });

  // Add date slot
  el.querySelector('#add-date-slot')?.addEventListener('click', () => {
    if (_dateSlotCount >= 4) return;
    _dateSlotCount++;
    const slots = el.querySelector('#date-slots');
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;gap:8px;align-items:center;';
    div.innerHTML = `
      <div class="slot-num">${_dateSlotCount}</div>
      <input type="date" class="input" style="flex:2;" data-slot="${_dateSlotCount}" data-type="date">
      ${U.timeSelectHtml(_dateSlotCount)}
    `;
    slots.appendChild(div);
    if (_dateSlotCount >= 4) el.querySelector('#add-date-slot').style.display = 'none';
    // Set min date
    const today = new Date().toISOString().split('T')[0];
    div.querySelector('input[type="date"]').min = today;
  });

  // Set min date on first slot
  const today = new Date().toISOString().split('T')[0];
  el.querySelectorAll('input[type="date"]').forEach(d => { d.min = today; });

  // Tension detection on note (debounced)
  let _toneTimer, _tensionV = 0;
  textarea?.addEventListener('input', () => {
    clearTimeout(_toneTimer);
    if (textarea.value.length > 40) {
      _toneTimer = setTimeout(async () => {
        const v = ++_tensionV;
        try {
          const t = await AI.call(
            `Analyze for Gottman Four Horsemen. Return ONLY JSON: {"flag":true/false,"horseman":"criticism|contempt|defensiveness|stonewalling|none","note":"one sentence"}`,
            textarea.value
          );
          if (v !== _tensionV) return;
          const parsed = typeof t === 'string' ? JSON.parse(t) : t;
          if (parsed.flag && warn) {
            const h = el.querySelector('#warn-head');
            const b = el.querySelector('#warn-body');
            if (h) h.textContent = parsed.horseman === 'contempt' ? '🚨 Contempt detected' : '⚡ Some heat detected';
            if (b) b.textContent = parsed.note || "That's okay — Parlay will cool it down.";
            warn.style.display = 'block';
          } else if (warn) { warn.style.display = 'none'; }
        } catch(e) { /* best-effort */ }
      }, 800);
    } else if (warn) { warn.style.display = 'none'; }
  });

  // Submit
  el.querySelector('#compose-submit')?.addEventListener('click', async () => {
    if (_submitting) return;
    _submitting = true;

    const btn = el.querySelector('#compose-submit');
    const btnText = el.querySelector('#compose-btn-text');
    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Sending…';

    // Collect structured selections
    const selections = collectStructuredSelections(el);

    // Collect date options
    const dateOptions = [];
    for (let n = 1; n <= 4; n++) {
      const d = el.querySelector(`input[data-slot="${n}"][data-type="date"]`)?.value;
      const t = el.querySelector(`[data-slot="${n}"][data-type="time"]`)?.value || '';
      if (d) dateOptions.push({ id: 'opt_' + n, date: d, timeLabel: t || 'Any time' });
    }

    // Build intent context from selections
    let intentContext = '';
    for (const [k, v] of Object.entries(selections)) {
      const vals = Array.isArray(v) ? v.join(', ') : v;
      intentContext += `${k}: ${vals}\n`;
    }

    // Get optional note
    const rawNote = textarea?.value.trim() || '';

    // AI filter the note if present
    let filteredNote = rawNote;
    if (rawNote) {
      try {
        filteredNote = await runToneFilter(rawNote, intentContext);
      } catch(e) { filteredNote = rawNote; }
    }

    // Auto-generate title
    const title = autoTitle(topicId, selections, dateOptions);

    // Save
    const id = 'neg_' + Date.now();
    try {
      await Store.addParlay({
        id, topicId, title,
        date: U.shortDate(new Date()),
        rawInput: rawNote,
        filteredInput: filteredNote,
        intentContext,
        structuredSelections: selections,
        dateOptions,
        status: 'pending_partner',
        createdByUid: Auth.myUid(),
        isMine: true,
        partnerRawReply: null, partnerFilteredReply: null,
        partnerDateResponse: null, counterDates: [], confirmedDate: null,
        proposal: null, resolution: null, archived: false,
        messageCount: 0, lastActivityBy: Auth.myUid(),
      });

      // Add initial message to thread if note was sent
      if (rawNote) {
        await EventMessages.send(id, { type: 'text', rawContent: rawNote, filteredContent: filteredNote });
      }

      Router.go('parlay-sent', { id, aiWorked: !!rawNote ? filteredNote !== rawNote : true });
    } catch(e) {
      console.error('[compose] save error:', e);
      _submitting = false;
      btn.disabled = false;
      btnText.textContent = `Send to ${Auth.theirName()} →`;
      U.toast('Failed to send — try again');
    }
  });
});

    <div style="font-size:3rem;margin-bottom:20px;animation:float 4s ease-in-out infinite;">📬</div>
    <div style="font-family:var(--font-display);font-size:2rem;font-weight:300;margin-bottom:8px;" class="a1">Proposal <em style="color:var(--terra)">sent</em></div>
    <div style="font-size:.85rem;color:var(--muted);line-height:1.7;max-width:280px;margin-bottom:24px;" class="a2">
      ${U.esc(Auth.theirName())} will see your structured proposal${aiWorked ? ' with any notes filtered for tone' : ''}.
    </div>
    ${p ? `<div style="font-size:.75rem;color:var(--muted);background:var(--parchment);border-radius:var(--r-pill);padding:5px 14px;margin-bottom:28px;">${topic.icon} ${U.esc(p.title)}</div>` : ''}
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;" class="a3">
      <button class="btn btn-primary" onclick="Router.go('plan')">View All Plans →</button>
      <button class="btn btn-outline" onclick="Router.go('home')">Back to Home</button>
    </div>
  </div>`;
});


// ──────────────────────────────────────────────
// PARLAY DETAIL — View event + thread + actions
// ──────────────────────────────────────────────
Router.register('parlay-detail', ({ id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return `<div style="padding:60px 24px;text-align:center;"><div style="font-size:1.2rem;">Event not found</div><button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="Router.go('plan')">‹ Back</button></div>`;

  const topic = TOPICS_V2.find(t => t.id === p.topicId) || TOPICS_V2[9];
  const isMine = p.isMine;
  const myN = Auth.myName();
  const theirN = Auth.theirName();
  const creatorN = isMine ? myN : theirN;
  const recipN = isMine ? theirN : myN;
  const messages = EventMessages.getForEvent(id);

  // Status config
  const statusText = {
    pending_partner: isMine ? `Waiting for ${recipN}` : 'Your turn to respond',
    partner_replied: isMine ? `${recipN} has replied` : 'Awaiting proposal',
    in_discussion: 'In discussion',
    counter_proposed: isMine ? `${recipN} suggested new times` : 'Counter sent',
    active: 'Proposal ready',
    resolved: p.resolution === 'needs_discussion' ? 'Needs conversation'
      : p.resolution === 'date_accepted' ? 'Event confirmed'
      : 'Resolved',
    declined: 'Declined',
  };
  const statusColor = { pending_partner:'#E8B88A', partner_replied:'#7A6A9B', in_discussion:'#6A8CAA', counter_proposed:'#6A8CAA', active:'#C4714A', resolved:'#7A9E8A', declined:'#9B8880' };
  const sc = statusColor[p.status] || '#9B8880';

  // Structured summary
  const summaryHtml = renderStructuredSummary(p.topicId, p.structuredSelections);

  // Date options
  const isConfirmed = p.resolution === 'date_accepted';
  const dateHtml = (p.dateOptions?.length > 0) ? `
    <div style="margin-top:12px;">
      <div class="input-label">📅 ${isConfirmed ? 'Confirmed date' : 'Proposed dates'}</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${p.dateOptions.map(o => {
          const d = new Date(o.date + 'T12:00:00');
          const label = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
          const sel = p.confirmedDate?.id === o.id || p.partnerDateResponse === o.id;
          if (isConfirmed && !sel) return '';
          return `<div class="date-opt-card${sel ? ' selected' : ''}">
            <div><div class="date-label">${label}</div>${o.timeLabel ? `<div class="date-time">${o.timeLabel}</div>` : ''}</div>
            ${sel ? `<span style="font-size:.72rem;font-weight:700;color:var(--sage);">${isConfirmed ? '✓ Confirmed' : '✓ Selected'}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  // Counter dates
  const counterHtml = (p.counterDates?.length > 0) ? `
    <div style="margin-top:16px;">
      <div class="input-label">📅 ${!isMine ? 'Your suggested times' : recipN + "'s suggested times"}</div>
      <div style="display:flex;flex-direction:column;gap:6px;" id="counter-dates-list">
        ${p.counterDates.map(o => {
          const d = new Date(o.date + 'T12:00:00');
          const label = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
          const sel = p.confirmedDate?.id === o.id;
          return `<div class="date-opt-card counter-date-opt${sel ? ' selected' : ''}" data-opt="${o.id}" data-date="${o.date}" data-time="${o.timeLabel || ''}" style="${p.status === 'counter_proposed' && isMine ? 'cursor:pointer;' : ''}">
            <div><div class="date-label">${label}</div>${o.timeLabel ? `<div class="date-time">${o.timeLabel}</div>` : ''}</div>
            ${sel ? `<span style="font-size:.72rem;font-weight:700;color:var(--sage);">✓ Confirmed</span>` : (p.status === 'counter_proposed' && isMine ? `<div class="date-check"></div>` : '')}
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  // Proposal
  let proposalHtml = '';
  if (p.proposal) {
    const pr = typeof p.proposal === 'string' ? (() => { try { return JSON.parse(p.proposal); } catch { return { proposal: p.proposal }; } })() : p.proposal;
    proposalHtml = `
    <div style="margin:16px 0;padding:16px;background:linear-gradient(135deg,rgba(122,106,155,.08),rgba(122,158,138,.06));border:1.5px solid rgba(122,106,155,.25);border-radius:var(--r-lg);">
      <div class="input-label" style="color:var(--purple);">⚖️ Parlay's Proposal</div>
      <div style="font-size:.88rem;line-height:1.65;margin-bottom:8px;">${pr.proposal || ''}</div>
      ${pr.reasoning ? `<div style="font-size:.76rem;color:var(--muted);line-height:1.5;padding-top:8px;border-top:1px solid rgba(122,106,155,.15);font-style:italic;">${pr.reasoning}</div>` : ''}
    </div>`;
  }

  // Message thread
  const threadHtml = messages.length > 0 ? `
    <div style="margin:16px 0;">
      <div class="input-label">💬 Conversation</div>
      <div class="msg-thread">
        ${messages.map(m => {
          const sender = m.isMine ? myN : theirN;
          const time = new Date(m.createdAt).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
          const dateStr = new Date(m.createdAt).toLocaleDateString('en-US', { month:'short', day:'numeric' });
          if (m.type === 'system') {
            return `<div class="msg-bubble system">${U.esc(m.filteredContent)}</div>`;
          }
          return `<div>
            <div class="msg-bubble ${m.isMine ? 'mine' : 'theirs'}">${U.esc(m.filteredContent)}</div>
            <div class="msg-meta${m.isMine ? ' right' : ''}">${U.esc(sender)} · ${dateStr} ${time} <span class="msg-filtered-tag">· ✓ Filtered</span></div>
          </div>`;
        }).join('')}
      </div>
    </div>` : '';

  // Actions
  let actionHtml = '';
  if (p.status === 'pending_partner' && !isMine) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="accept-btn">✓ Accept as is</button>
      ${p.dateOptions?.length > 0 ? `<button class="btn btn-outline" onclick="Router.go('parlay-reply',{id:'${p.id}'})">📅 Suggest other times</button>` : ''}
      <button class="btn btn-outline" id="reply-msg-btn">💬 Send a message</button>
      <button class="btn btn-outline" style="color:#EF4444;border-color:#EF4444;" id="decline-btn">✕ Decline</button>
    </div>`;
  } else if (p.status === 'pending_partner' && isMine) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);"><div style="font-size:.85rem;color:var(--muted);">⏳ Waiting for ${U.esc(recipN)} to respond</div></div>`;
  } else if (p.status === 'in_discussion') {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="accept-btn">✓ Accept</button>
      <button class="btn btn-outline" id="reply-msg-btn">💬 Send a message</button>
      ${p.dateOptions?.length > 0 ? `<button class="btn btn-outline" onclick="Router.go('parlay-reply',{id:'${p.id}'})">📅 Suggest other times</button>` : ''}
    </div>`;
  } else if (p.status === 'partner_replied' && isMine) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" style="background:linear-gradient(135deg,#4A3568,#7A6A9B);color:#fff;" id="gen-proposal-btn"><span id="gen-btn-text">⚖️ Generate Proposal</span></button>
      <button class="btn" style="background:var(--sage);color:#fff;" id="accept-btn">✓ Accept as is</button>
      <button class="btn btn-outline" id="reply-msg-btn">💬 Reply</button>
    </div>`;
  } else if (p.status === 'partner_replied' && !isMine) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);"><div style="font-size:.85rem;color:var(--muted);">✓ Position sent. Waiting for ${U.esc(creatorN)} to continue.</div></div>`;
  } else if (p.status === 'counter_proposed' && isMine) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="accept-counter-btn" disabled><span id="accept-counter-text">Select a date above to confirm</span></button>
      <button class="btn btn-outline" id="reply-msg-btn">💬 Send a message</button>
    </div>`;
  } else if (p.status === 'counter_proposed' && !isMine) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);"><div style="font-size:.85rem;color:var(--muted);">⏳ Waiting for ${U.esc(creatorN)} to pick a time</div></div>`;
  } else if (p.status === 'active' && p.proposal) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="accept-btn">✓ Accept Proposal</button>
      <button class="btn btn-outline" id="reply-msg-btn">💬 Discuss further</button>
    </div>`;
  } else if (p.status === 'resolved') {
    if (p.resolution === 'needs_discussion') {
      actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);">
        <div style="font-size:.85rem;color:var(--muted);font-weight:600;">💬 Marked for conversation</div>
        <button class="btn btn-outline btn-sm" style="margin-top:12px;" id="reopen-btn">↻ Reopen</button>
      </div>`;
    } else if (p.resolution === 'date_accepted') {
      actionHtml = `<div style="text-align:center;padding:16px;background:#EDF4F0;border:1.5px solid var(--sage);border-radius:var(--r-md);">
        <div style="font-size:1.5rem;margin-bottom:6px;">🎉</div>
        <div style="font-size:.92rem;color:var(--sage);font-weight:700;">Event Confirmed</div>
      </div>`;
    } else {
      actionHtml = `<div style="text-align:center;padding:12px;font-size:.85rem;color:var(--sage);font-weight:600;">✓ Accepted</div>`;
    }
  } else if (p.status === 'declined') {
    actionHtml = `<div style="text-align:center;padding:16px;background:#FFF5F5;border:1px solid rgba(239,68,68,.2);border-radius:var(--r-md);">
      <div style="font-size:.85rem;color:#EF4444;font-weight:600;">✕ Declined</div>
      <button class="btn btn-outline btn-sm" style="margin-top:12px;" id="reopen-btn">↻ Reopen</button>
    </div>`;
  }

  // Inline reply box
  const replyBoxHtml = `
    <div id="inline-reply" style="display:none;margin-top:12px;">
      <textarea id="inline-reply-text" class="input" rows="3" placeholder="Type your message..." style="resize:none;line-height:1.6;"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-accent" style="flex:1;" id="inline-reply-send"><span id="inline-reply-btn-text">Send →</span></button>
        <button class="btn btn-outline" style="width:auto;" id="inline-reply-cancel">Cancel</button>
      </div>
    </div>`;

  // Decline form
  const declineFormHtml = `
    <div id="decline-form" style="display:none;margin-top:12px;">
      <div class="input-label">Reason (optional)</div>
      <textarea id="decline-text" class="input" rows="2" placeholder="e.g. This doesn't work for me right now" style="resize:none;"></textarea>
      <button class="btn btn-danger" style="margin-top:8px;" id="decline-confirm">Decline event</button>
    </div>`;

  return `
  <div data-parlay-id="${p.id}" style="min-height:100dvh;padding:0 20px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('plan')">‹ Plans</button>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">↻</button>
        <button class="btn-ghost" id="manage-btn">⋯</button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;" class="a2">
      <div style="width:48px;height:48px;border-radius:14px;background:${topic.color}18;display:flex;align-items:center;justify-content:center;font-size:1.4rem;">${topic.icon}</div>
      <div>
        <div style="font-family:var(--font-display);font-size:1.3rem;">${U.esc(p.title)}</div>
        <div style="font-size:.72rem;color:var(--muted);">${p.date} · ${isMine ? 'You proposed' : creatorN + ' proposed'}</div>
      </div>
    </div>

    <div style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:${sc}18;border:1px solid ${sc}44;border-radius:var(--r-pill);margin-bottom:16px;" class="a2">
      <div style="width:6px;height:6px;border-radius:50%;background:${sc};"></div>
      <div style="font-size:.72rem;font-weight:700;color:${sc};">${statusText[p.status] || p.status}</div>
    </div>

    <!-- Structured summary -->
    ${summaryHtml ? `<div style="margin-bottom:16px;" class="a3">${summaryHtml}</div>` : ''}

    <!-- Creator's note -->
    ${p.filteredInput ? `
    <div style="margin-bottom:12px;" class="a3">
      <div class="input-label">${isMine ? 'Your note' : creatorN + "'s note"}</div>
      <div style="padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);">
        <div style="font-size:.85rem;line-height:1.65;">${U.esc(p.filteredInput)}</div>
        <div style="font-size:.65rem;color:var(--sage);margin-top:6px;">✓ Filtered by Parlay</div>
      </div>
    </div>` : ''}

    ${dateHtml}

    <!-- Partner's reply (legacy, for existing parlays) -->
    ${p.partnerFilteredReply && messages.length === 0 ? `
    <div style="margin:12px 0;" class="a4">
      <div class="input-label">${!isMine ? 'Your response' : recipN + "'s response"}</div>
      <div style="padding:12px 14px;background:var(--surface);border:1px solid rgba(122,106,155,.25);border-radius:var(--r-md);">
        <div style="font-size:.85rem;line-height:1.65;">${U.esc(p.partnerFilteredReply)}</div>
        <div style="font-size:.65rem;color:var(--sage);margin-top:6px;">✓ Filtered by Parlay</div>
      </div>
    </div>` : ''}

    ${counterHtml}
    ${proposalHtml}
    ${threadHtml}

    <div style="margin-top:20px;" class="a5">${actionHtml}</div>
    ${replyBoxHtml}
    ${declineFormHtml}
  </div>`;
}, (el, { id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return;

  // Load messages
  EventMessages.loadForEvent(id).then(() => {
    // Re-render only if messages loaded after initial render
    const msgs = EventMessages.getForEvent(id);
    if (msgs.length > 0 && !el.querySelector('.msg-thread')) {
      Router.reload();
    }
  });

  // Accept
  el.querySelector('#accept-btn')?.addEventListener('click', async () => {
    const btn = el.querySelector('#accept-btn');
    btn.disabled = true; btn.textContent = 'Accepting…';
    await Store.updateParlay(p.id, { status: 'resolved', resolution: p.dateOptions?.length > 0 ? 'date_accepted' : 'accepted' });
    await EventMessages.send(p.id, { type: 'system', rawContent: `${Auth.myName()} accepted the proposal`, filteredContent: `${Auth.myName()} accepted the proposal` });
    Badges.update();
    U.toast('Accepted ✓');
    Router.go('parlay-detail', { id: p.id });
  });

  // Generate proposal
  el.querySelector('#gen-proposal-btn')?.addEventListener('click', async () => {
    const btn = el.querySelector('#gen-proposal-btn');
    const txt = el.querySelector('#gen-btn-text');
    btn.disabled = true; txt.innerHTML = '<span class="spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,.3);margin-right:8px;"></span> Generating…';
    try {
      const parsed = await generateProposal(p);
      await Store.updateParlay(p.id, { proposal: parsed, status: 'active' });
      Router.go('parlay-detail', { id: p.id });
    } catch(e) {
      btn.disabled = false; txt.textContent = '⚖️ Generate Proposal';
      U.toast('AI error — try again');
    }
  });

  // Inline reply toggle + send
  el.querySelector('#reply-msg-btn')?.addEventListener('click', () => {
    el.querySelector('#inline-reply').style.display = 'block';
    el.querySelector('#inline-reply-text')?.focus();
  });
  el.querySelector('#inline-reply-cancel')?.addEventListener('click', () => {
    el.querySelector('#inline-reply').style.display = 'none';
  });
  el.querySelector('#inline-reply-send')?.addEventListener('click', async () => {
    const raw = el.querySelector('#inline-reply-text')?.value.trim();
    if (!raw) { U.toast('Type a message'); return; }
    const btn = el.querySelector('#inline-reply-send');
    const txt = el.querySelector('#inline-reply-btn-text');
    btn.disabled = true; txt.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Filtering…';

    let filtered = raw;
    try { filtered = await runToneFilter(raw, p.intentContext || ''); } catch(e) { filtered = raw; }

    await EventMessages.send(p.id, { type: 'text', rawContent: raw, filteredContent: filtered });

    // Update parlay status to in_discussion if it was pending
    if (['pending_partner', 'partner_replied'].includes(p.status)) {
      await Store.updateParlay(p.id, {
        status: p.status === 'pending_partner' && !p.isMine ? 'partner_replied' : 'in_discussion',
        partnerRawReply: p.isMine ? p.partnerRawReply : raw,
        partnerFilteredReply: p.isMine ? p.partnerFilteredReply : filtered,
        lastActivityBy: Auth.myUid(),
      });
    } else {
      await Store.updateParlay(p.id, { status: 'in_discussion', lastActivityBy: Auth.myUid() });
    }

    Badges.update();
    Router.go('parlay-detail', { id: p.id });
  });

  // Decline
  el.querySelector('#decline-btn')?.addEventListener('click', () => {
    el.querySelector('#decline-form').style.display = 'block';
    el.querySelector('#decline-btn').style.display = 'none';
  });
  el.querySelector('#decline-confirm')?.addEventListener('click', async () => {
    const btn = el.querySelector('#decline-confirm');
    btn.disabled = true; btn.textContent = 'Declining…';
    const reason = el.querySelector('#decline-text')?.value.trim() || '';
    let filtered = reason;
    if (reason) {
      try { filtered = await runToneFilter(reason, ''); } catch(e) { filtered = reason; }
    }
    await Store.updateParlay(p.id, { status: 'declined', resolution: 'declined' });
    if (reason) {
      await EventMessages.send(p.id, { type: 'text', rawContent: reason, filteredContent: filtered });
    }
    await EventMessages.send(p.id, { type: 'system', rawContent: `${Auth.myName()} declined`, filteredContent: `${Auth.myName()} declined the proposal` });
    Badges.update();
    U.toast('Declined');
    Router.go('plan');
  });

  // Counter-date selection
  let _selectedCounterDate = null;
  el.querySelectorAll('.counter-date-opt').forEach(card => {
    card.addEventListener('click', () => {
      if (p.status !== 'counter_proposed' || !p.isMine) return;
      _selectedCounterDate = card.dataset.opt;
      el.querySelectorAll('.counter-date-opt').forEach(c => {
        const sel = c.dataset.opt === _selectedCounterDate;
        c.classList.toggle('selected', sel);
      });
      const btn = el.querySelector('#accept-counter-btn');
      if (btn) btn.disabled = false;
      const txt = el.querySelector('#accept-counter-text');
      if (txt) txt.textContent = '✓ Confirm this date';
    });
  });

  el.querySelector('#accept-counter-btn')?.addEventListener('click', async () => {
    if (!_selectedCounterDate) return;
    const btn = el.querySelector('#accept-counter-btn');
    btn.disabled = true;
    const selectedOpt = p.counterDates?.find(o => o.id === _selectedCounterDate);
    await Store.updateParlay(p.id, { confirmedDate: selectedOpt || { id: _selectedCounterDate }, status: 'resolved', resolution: 'date_accepted' });
    await EventMessages.send(p.id, { type: 'system', rawContent: 'Date confirmed', filteredContent: `${Auth.myName()} confirmed the date` });
    Badges.update();
    U.toast('Event confirmed ✓');
    Router.go('parlay-detail', { id: p.id });
  });

  // Reopen
  el.querySelector('#reopen-btn')?.addEventListener('click', async () => {
    await Store.updateParlay(p.id, { status: 'in_discussion', resolution: null });
    Badges.update();
    U.toast('Reopened');
    Router.go('parlay-detail', { id: p.id });
  });

  // Manage
  el.querySelector('#manage-btn')?.addEventListener('click', async () => {
    const action = await U.sheet('Manage Event', [
      { key: 'archive', label: '📦 Archive', cls: 'btn-outline' },
      { key: 'delete', label: '🗑 Delete', cls: 'btn-danger' },
    ]);
    if (action === 'archive') {
      await Store.updateParlay(p.id, { archived: true });
      U.toast('Archived');
      Router.go('plan');
    } else if (action === 'delete') {
      await Store.deleteParlay(p.id);
      U.toast('Deleted');
      Router.go('plan');
    }
  });
});


// ──────────────────────────────────────────────
// PARLAY REPLY — Suggest other times + optional note
// ──────────────────────────────────────────────
Router.register('parlay-reply', ({ id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return `<div style="padding:60px 24px;text-align:center;">Event not found.<br><button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="Router.go('plan')">‹ Back</button></div>`;

  const topic = TOPICS_V2.find(t => t.id === p.topicId) || TOPICS_V2[9];
  const creatorN = p.isMine ? Auth.myName() : Auth.theirName();

  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('parlay-detail',{id:'${p.id}'})">‹ Back</button>
      <span style="font-size:1.2rem;">${topic.icon}</span>
      <span style="font-family:var(--font-display);font-size:1.1rem;">${topic.label}</span>
    </div>

    <div class="a2" style="margin-bottom:16px;">
      <div style="font-family:var(--font-display);font-size:1.5rem;font-weight:300;margin-bottom:6px;">Suggest <em style="color:var(--terra)">different times</em></div>
      <div style="font-size:.78rem;color:var(--muted);line-height:1.6;">Propose up to 4 alternative dates.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;" id="counter-date-slots">
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="slot-num">1</div>
        <input type="date" class="input" style="flex:2;" data-cslot="1" data-type="date">
        ${U.timeSelectHtml('c1')}
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="slot-num">2</div>
        <input type="date" class="input" style="flex:2;" data-cslot="2" data-type="date">
        ${U.timeSelectHtml('c2')}
      </div>
    </div>
    <div class="add-row" id="add-counter-slot" style="margin-bottom:16px;">+ Add another option</div>

    <div style="margin-bottom:16px;">
      <div class="input-label">Add a note (optional)</div>
      <textarea id="reply-text" class="input" rows="3" placeholder="e.g. Those times don't work — how about these instead?" style="resize:none;line-height:1.6;"></textarea>
    </div>

    <button class="btn btn-accent" id="counter-submit"><span id="counter-btn-text">Send counter-proposal →</span></button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="Router.go('parlay-detail',{id:'${p.id}'})">Cancel</button>
  </div>`;
}, (el, { id } = {}) => {
  const p = Store.findParlay(id);
  if (!p) return;
  let _submitting = false;
  let _counterSlots = 2;

  // Set min dates
  const today = new Date().toISOString().split('T')[0];
  el.querySelectorAll('input[type="date"]').forEach(d => { d.min = today; });

  // Add counter slot
  el.querySelector('#add-counter-slot')?.addEventListener('click', () => {
    if (_counterSlots >= 4) return;
    _counterSlots++;
    const slots = el.querySelector('#counter-date-slots');
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;gap:8px;align-items:center;';
    div.innerHTML = `
      <div class="slot-num">${_counterSlots}</div>
      <input type="date" class="input" style="flex:2;" data-cslot="${_counterSlots}" data-type="date" min="${today}">
      ${U.timeSelectHtml('c' + _counterSlots)}
    `;
    slots.appendChild(div);
    if (_counterSlots >= 4) el.querySelector('#add-counter-slot').style.display = 'none';
  });

  // Submit
  el.querySelector('#counter-submit')?.addEventListener('click', async () => {
    if (_submitting) return;
    const counterDates = [];
    for (let n = 1; n <= _counterSlots; n++) {
      const d = el.querySelector(`[data-cslot="${n}"][data-type="date"]`)?.value;
      const t = el.querySelector(`[data-slot="c${n}"][data-type="time"]`)?.value || '';
      if (d) counterDates.push({ id: 'counter_' + n, date: d, timeLabel: t || 'Any time' });
    }
    if (counterDates.length === 0) { U.toast('Add at least one date'); return; }
    _submitting = true;
    const btn = el.querySelector('#counter-submit');
    const txt = el.querySelector('#counter-btn-text');
    btn.disabled = true; txt.innerHTML = '<span class="spinner" style="margin-right:8px;"></span> Sending…';

    const raw = el.querySelector('#reply-text')?.value.trim() || '';
    let filtered = raw;
    if (raw) {
      try { filtered = await runToneFilter(raw, p.intentContext || ''); } catch(e) { filtered = raw; }
    }

    await Store.updateParlay(p.id, {
      partnerRawReply: raw || p.partnerRawReply,
      partnerFilteredReply: filtered || p.partnerFilteredReply,
      counterDates,
      status: 'counter_proposed',
      lastActivityBy: Auth.myUid(),
    });

    if (raw) {
      await EventMessages.send(p.id, { type: 'text', rawContent: raw, filteredContent: filtered });
    }
    await EventMessages.send(p.id, { type: 'system', rawContent: 'Counter-proposed', filteredContent: `${Auth.myName()} suggested different times` });

    Badges.update();
    U.toast('Counter-proposal sent ✓');
    Router.go('parlay-detail', { id: p.id });
  });
});

    themBtn.style.background = _assignTo === 'them' ? 'var(--terra)' : '';

    meBtn.style.background = _assignTo === 'me' ? 'var(--terra)' : '';

    meBtn.style.borderColor = _assignTo === 'me' ? 'var(--terra)' : '';

  meBtn.addEventListener('click', () => { _assignTo = 'me'; updateBtns(); });

      title,
      context: rawContext,
      rawContext,
      filteredContext,
      categoryId: 'other',
      priority: 'normal',
      dueDate: null,
      assignedTo: _assignTo,
      createdBy: 'me',
      status: 'pending_response',
      pendingResponseFrom: _assignTo,
      counterCount: 0,
    });

    Badges.update();
    U.toast('Task assigned ✓');
    Router.go('tasks');
  });
});

Router.register('task-detail', ({ id } = {}) => {
  const t = Store.findTask(id);
  if (!t) return `<div style="padding:60px 24px;text-align:center;">Task not found.<br><button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="Router.go('tasks')">‹ Back</button></div>`;

  const cat = TASK_CATEGORIES.find(c => c.id === t.categoryId) || TASK_CATEGORIES[6];
  const from = t.createdBy === 'me' ? Auth.myName() : Auth.theirName();
  const to = t.assignedTo === 'me' ? Auth.myName() : Auth.theirName();
  const needsMe = t.pendingResponseFrom === 'me';
  const iAmAssignee = t.assignedTo === 'me';

  // Status label
  const statusLabel = {
    pending_response: needsMe ? '⚡ Your turn' : 'Awaiting response',
    accepted: '✓ Accepted',
    declined: '❌ Declined',
    countered: '↩ Changes suggested',
    done: '✓ Done',
  }[t.status] || t.status;

  // Action area — every combo covered
  let actionHtml = '';
  if (t.status === 'pending_response' && needsMe) {
    actionHtml = `<div style="display:flex;flex-direction:column;gap:8px;margin-top:20px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="td-accept">✓ Accept</button>
      <button class="btn btn-outline" id="td-counter">↩ Suggest Changes</button>
      <button class="btn btn-outline" id="td-decline" style="color:#EF4444;border-color:#EF4444;">Decline</button>
    </div>
    <!-- Counter form (hidden until Suggest Changes clicked) -->
    <div id="td-counter-form" style="display:none;margin-top:12px;">
      <div class="input-label">What would work better?</div>
      <textarea id="td-counter-msg" class="input" rows="3" placeholder="e.g. I can do this Thursday instead" style="resize:none;margin-bottom:12px;"></textarea>
      <button class="btn btn-accent" id="td-counter-submit">Send suggestion &rarr;</button>
    </div>
    <!-- Decline form (hidden until Decline clicked) -->
    <div id="td-decline-form" style="display:none;margin-top:12px;">
      <div class="input-label">Why are you declining? <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">(optional)</span></div>
      <textarea id="td-decline-msg" class="input" rows="2" placeholder="e.g. I don't have bandwidth for this right now" style="resize:none;margin-bottom:12px;"></textarea>
      <button class="btn btn-danger" id="td-decline-submit">Decline task</button>
    </div>`;
  } else if (t.status === 'accepted' && iAmAssignee) {
    actionHtml = `<div style="margin-top:20px;">
      <button class="btn" style="background:var(--sage);color:#fff;" id="td-done">✓ Mark Done</button>
    </div>`;
  } else if (t.status === 'accepted' && !iAmAssignee) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);margin-top:20px;font-size:.85rem;color:var(--muted);">✓ Accepted — waiting for ${U.esc(to)} to complete</div>`;
  } else if (t.status === 'countered') {
    actionHtml = `<div style="margin-top:16px;">
      ${t.counterMessage ? `<div style="padding:14px 16px;background:var(--surface);border:1px solid rgba(122,106,155,.25);border-radius:var(--r-md);margin-bottom:12px;">
        <div class="input-label" style="color:var(--purple);">↩ Suggested change</div>
        <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredCounter || t.counterMessage)}</div>
      </div>` : ''}
      ${!iAmAssignee ? `<div style="display:flex;gap:8px;">
        <button class="btn" style="background:var(--sage);color:#fff;flex:1;" id="td-accept">✓ Accept change</button>
        <button class="btn btn-outline" style="flex:1;" id="td-decline">Decline</button>
      </div>` : `<div style="text-align:center;padding:12px;font-size:.85rem;color:var(--muted);">Waiting for ${U.esc(from)} to respond</div>`}
    </div>`;
  } else if (t.status === 'declined') {
    actionHtml = `<div style="margin-top:16px;">
      ${t.declineReason ? `<div style="padding:14px 16px;background:#FFF5F5;border:1px solid rgba(239,68,68,.2);border-radius:var(--r-md);margin-bottom:12px;">
        <div class="input-label" style="color:#EF4444;">Decline reason</div>
        <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredDecline || t.declineReason)}</div>
      </div>` : ''}
      <div style="text-align:center;padding:12px;font-size:.85rem;color:var(--muted);">This task was declined.</div>
    </div>`;
  } else if (t.status === 'done') {
    actionHtml = `<div style="text-align:center;padding:16px;color:var(--sage);font-weight:600;">✓ Completed</div>`;
  } else if (t.status === 'pending_response' && !needsMe) {
    actionHtml = `<div style="text-align:center;padding:16px;background:var(--parchment);border-radius:var(--r-md);margin-top:20px;font-size:.85rem;color:var(--muted);">⏳ Waiting for ${U.esc(to)} to respond</div>`;
  }

  return `
  <div data-task-id="${t.id}" style="min-height:100dvh;padding:0 24px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;" class="a1">

      </div>

    ${t.filteredContext || t.context ? `
    <div style="padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:16px;" class="a3">
      <div class="input-label">Context</div>
      <div style="font-size:.88rem;line-height:1.65;">${U.esc(t.filteredContext || t.context)}</div>
    </div>` : ''}
    ${actionHtml}
    <div style="text-align:center;margin-top:20px;">
      <button class="btn-ghost" id="td-delete">Delete task</button>
    </div>
  </div>`;
}, (el, { id } = {}) => {
  const t = Store.findTask(id);
  if (!t) return;

  el.querySelector('#td-accept')?.addEventListener('click', async () => {
    await Store.updateTask(t.id, { status: 'accepted', pendingResponseFrom: null });
    Badges.update(); U.toast('Task accepted ✓');
    Router.go('tasks');
  });

  el.querySelector('#td-done')?.addEventListener('click', async () => {
    await Store.updateTask(t.id, { status: 'done', pendingResponseFrom: null });
    Badges.update(); U.toast('Task done ✓');
    Router.go('tasks');
  });

  // Suggest changes — show form, then submit
  el.querySelector('#td-counter')?.addEventListener('click', () => {
    const form = el.querySelector('#td-counter-form');
    if (form) form.style.display = 'block';
    el.querySelector('#td-counter').style.display = 'none';
  });

  el.querySelector('#td-counter-submit')?.addEventListener('click', async () => {
    const msg = el.querySelector('#td-counter-msg')?.value.trim();
    if (!msg) { U.toast('Say what would work better'); return; }

    const btn = el.querySelector('#td-counter-submit');
    btn.disabled = true; btn.textContent = 'Sending…';

    // AI filter the counter message (best-effort)
    let filtered = msg;
    try {
      filtered = await AI.call(
        'You are Parlay\'s Communication Translator. Rewrite this task counter-proposal to be constructive. 1-2 sentences. First person. ONLY the rewrite.',
        `${Auth.myName()} wrote: "${msg}"\nRewrite:`
      );
    } catch(e) { filtered = msg; }

    await Store.updateTask(t.id, {
      status: 'countered',
      counterMessage: msg,
      filteredCounter: filtered,
      counterCount: (t.counterCount || 0) + 1,
      pendingResponseFrom: t.createdBy === 'me' ? 'me' : 'them',
    });
    Badges.update();
    U.toast('Suggestion sent ✓');
    Router.go('tasks');
  });

  el.querySelector('#td-decline')?.addEventListener('click', () => {
    const form = el.querySelector('#td-decline-form');
    if (form) form.style.display = 'block';
    el.querySelector('#td-decline').style.display = 'none';
    // Hide counter form if open
    const cf = el.querySelector('#td-counter-form');
    if (cf) cf.style.display = 'none';
    const cb = el.querySelector('#td-counter');
    if (cb) cb.style.display = '';
  });

  el.querySelector('#td-decline-submit')?.addEventListener('click', async () => {
    const reason = el.querySelector('#td-decline-msg')?.value.trim() || '';
    const btn = el.querySelector('#td-decline-submit');
    btn.disabled = true; btn.textContent = 'Declining…';

    let filtered = reason;
    if (reason) {
      try {
        filtered = await AI.call(
          'Rewrite this task decline reason to be respectful. 1 sentence. First person. ONLY the rewrite.',
          `${Auth.myName()} wrote: "${reason}"\nRewrite:`
        );
      } catch(e) { filtered = reason; }
    }
    await Store.updateTask(t.id, {
      status: 'declined',
      declineReason: reason,
      filteredDecline: filtered,
      pendingResponseFrom: null,
    });
    Badges.update(); U.toast('Task declined');
    Router.go('tasks');
  });

  el.querySelector('#td-delete')?.addEventListener('click', async () => {
    const action = await U.sheet('Delete this task?', [
      { key: 'delete', label: '🗑 Delete task', cls: 'btn-danger' },
    ]);
    if (action === 'delete') {
      await Store.deleteTask(t.id);

Router.register('family-setup', () => {
  const members = FamilyStore.members();
  const kids = FamilyStore.children();
  const extended = FamilyStore.extended();
  const contacts = FamilyStore.contacts();

  const RELATIONS = {

    extended: ['Grandparent', 'Aunt', 'Uncle', 'Cousin', 'Sibling', 'In-law', 'Other'],
    contact: ['Babysitter', 'Nanny', 'Tutor', 'Coach', 'Other'],
  };

  const memberCard = (m) => {
    const age = FamilyStore.childAge(m);
    const ageStr = age !== null ? ` · ${age}y` : '';
    const relation = m.relation ? ` · ${m.relation}` : '';
    const roleIcon = m.role === 'child' ? '👶' : m.role === 'extended' ? '👪' : '📇';
    return `<div class="family-card" data-member-id="${m.id}">
      <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;">${roleIcon}</div>
        <div style="min-width:0;">
          <div style="font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.esc(m.name)}</div>
          <div style="font-size:.7rem;color:var(--muted);">${m.role}${relation}${ageStr}${m.notes ? ' · ' + U.esc(m.notes) : ''}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn-ghost edit-member-btn" data-id="${m.id}" style="font-size:.85rem;padding:4px 8px;">✏️</button>
        <button class="btn-ghost remove-member-btn" data-id="${m.id}" style="font-size:.85rem;padding:4px 8px;color:#EF4444;">✕</button>
      </div>
    </div>`;
  };

  return `
  <div style="min-height:100dvh;padding:0 20px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('setup')">‹ Back</button>
      <span style="font-family:var(--font-display);font-size:1.1rem;">Family Members</span>
    </div>

    <div class="a2" style="margin-bottom:20px;">
      <div style="font-family:var(--font-display);font-size:1.9rem;font-weight:300;margin-bottom:4px;">Your <em style="color:var(--terra)">family</em></div>
      <div style="font-size:.78rem;color:var(--muted);line-height:1.6;">Add kids, grandparents, babysitters — they appear as smart options when planning events.</div>
    </div>

    <!-- Add member form -->
    <div id="member-form" style="display:none;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;" class="a3">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="input-label" style="margin-bottom:0;" id="form-title">Add family member</div>
        <button class="btn-ghost" id="form-cancel" style="font-size:.85rem;">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div>
          <div class="input-label">Name</div>
          <input type="text" id="fm-name" class="input" placeholder="e.g. Emma">
        </div>
        <div>
          <div class="input-label">Type</div>
          <div class="pill-group" data-field="fm-role">
            <div class="pill" data-val="child">Child</div>
            <div class="pill" data-val="extended">Extended family</div>
            <div class="pill" data-val="contact">Contact</div>
          </div>
        </div>
        <div id="fm-relation-wrap" style="display:none;">
          <div class="input-label">Relation</div>
          <div class="pill-group" data-field="fm-relation" id="fm-relation-pills"></div>
        </div>
        <div id="fm-birth-wrap" style="display:none;">
          <div class="input-label">Birth date <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">(optional)</span></div>
          <input type="date" id="fm-birth" class="input">
        </div>
        <div>
          <div class="input-label">Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">(optional)</span></div>
          <input type="text" id="fm-notes" class="input" placeholder="e.g. Allergic to peanuts">
        </div>
        <input type="hidden" id="fm-edit-id" value="">
        <button class="btn btn-accent" id="fm-save"><span id="fm-save-text">Add member</span></button>
      </div>
    </div>

    <div class="a3">
      <button class="btn btn-outline" id="add-member-btn" style="margin-bottom:16px;">+ Add a family member</button>
    </div>

    <!-- Members list -->
    ${kids.length > 0 ? `
    <div class="a4" style="margin-bottom:16px;">
      <div class="input-label">👶 Children (${kids.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;">${kids.map(memberCard).join('')}</div>
    </div>` : ''}

    ${extended.length > 0 ? `
    <div class="a4" style="margin-bottom:16px;">
      <div class="input-label">👪 Extended Family (${extended.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;">${extended.map(memberCard).join('')}</div>
    </div>` : ''}

    ${contacts.length > 0 ? `
    <div class="a4" style="margin-bottom:16px;">
      <div class="input-label">📇 Contacts (${contacts.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;">${contacts.map(memberCard).join('')}</div>
    </div>` : ''}

    ${members.length === 0 ? `
    <div style="text-align:center;padding:40px 20px;" class="a4">
      <div style="font-size:2.4rem;margin-bottom:12px;">👨‍👩‍👧‍👦</div>
      <div style="font-size:.88rem;color:var(--muted);line-height:1.6;max-width:260px;margin:0 auto;">No family members yet. Add kids, grandparents, or key contacts to get smarter event suggestions.</div>
    </div>` : ''}
  </div>`;
}, (el) => {
  const RELATIONS = {
    child: ['Son', 'Daughter', 'Stepson', 'Stepdaughter'],
    extended: ['Grandparent', 'Aunt', 'Uncle', 'Cousin', 'Sibling', 'In-law', 'Other'],
    contact: ['Babysitter', 'Nanny', 'Tutor', 'Coach', 'Other'],
  };

  const form = el.querySelector('#member-form');
  const addBtn = el.querySelector('#add-member-btn');
  let _selectedRole = null;
  let _selectedRelation = null;

  // Show/hide form
  addBtn?.addEventListener('click', () => {
    resetForm();
    form.style.display = 'block';
    addBtn.style.display = 'none';
    el.querySelector('#fm-name')?.focus();
  });
  el.querySelector('#form-cancel')?.addEventListener('click', () => {
    form.style.display = 'none';
    addBtn.style.display = 'block';
  });

  function resetForm() {
    el.querySelector('#fm-name').value = '';
    el.querySelector('#fm-birth').value = '';
    el.querySelector('#fm-notes').value = '';
    el.querySelector('#fm-edit-id').value = '';
    el.querySelector('#form-title').textContent = 'Add family member';
    el.querySelector('#fm-save-text').textContent = 'Add member';
    _selectedRole = null;
    _selectedRelation = null;
    el.querySelectorAll('[data-field="fm-role"] .pill').forEach(p => p.classList.remove('selected'));
    el.querySelector('#fm-relation-wrap').style.display = 'none';
    el.querySelector('#fm-birth-wrap').style.display = 'none';
  }

  // Role pill selection
  el.querySelectorAll('[data-field="fm-role"] .pill').forEach(pill => {
    pill.addEventListener('click', () => {
      el.querySelectorAll('[data-field="fm-role"] .pill').forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
      _selectedRole = pill.dataset.val;

      // Show relation pills
      const relationWrap = el.querySelector('#fm-relation-wrap');
      const relationPills = el.querySelector('#fm-relation-pills');
      const relations = RELATIONS[_selectedRole] || [];
      relationPills.innerHTML = relations.map(r => `<div class="pill" data-val="${r}">${r}</div>`).join('');
      relationWrap.style.display = relations.length > 0 ? 'block' : 'none';
      _selectedRelation = null;

      // Wire relation pills
      relationPills.querySelectorAll('.pill').forEach(rp => {
        rp.addEventListener('click', () => {
          relationPills.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
          rp.classList.add('selected');
          _selectedRelation = rp.dataset.val;
        });
      });

      // Show birth date for children
      el.querySelector('#fm-birth-wrap').style.display = _selectedRole === 'child' ? 'block' : 'none';
    });
  });

  // Save
  el.querySelector('#fm-save')?.addEventListener('click', async () => {
    const name = el.querySelector('#fm-name')?.value.trim();
    if (!name) { U.toast('Enter a name'); return; }
    if (!_selectedRole) { U.toast('Select a type'); return; }

    const btn = el.querySelector('#fm-save');
    btn.disabled = true;

    const member = {
      id: el.querySelector('#fm-edit-id').value || ('fm_' + Date.now()),
      name,
      role: _selectedRole,
      relation: _selectedRelation || null,
      belongsTo: 'both',
      birthDate: el.querySelector('#fm-birth')?.value || null,
      notes: el.querySelector('#fm-notes')?.value.trim() || null,
      sortOrder: FamilyStore.members().length,
    };

    const editId = el.querySelector('#fm-edit-id').value;
    if (editId) {
      await FamilyStore.update(editId, member);
      U.toast('Updated');
    } else {
      await FamilyStore.add(member);
      U.toast('Added');
    }

    Router.go('family-setup');
  });

  // Edit member
  el.querySelectorAll('.edit-member-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const m = FamilyStore.find(btn.dataset.id);
      if (!m) return;

      form.style.display = 'block';
      addBtn.style.display = 'none';
      el.querySelector('#form-title').textContent = 'Edit family member';
      el.querySelector('#fm-save-text').textContent = 'Save changes';
      el.querySelector('#fm-name').value = m.name;
      el.querySelector('#fm-edit-id').value = m.id;
      el.querySelector('#fm-notes').value = m.notes || '';
      el.querySelector('#fm-birth').value = m.birthDate || '';

      // Select role pill
      _selectedRole = m.role;
      el.querySelectorAll('[data-field="fm-role"] .pill').forEach(p => {
        p.classList.toggle('selected', p.dataset.val === m.role);
      });

      // Show relation pills and select
      const relations = RELATIONS[m.role] || [];
      const relationPills = el.querySelector('#fm-relation-pills');
      relationPills.innerHTML = relations.map(r => `<div class="pill${r === m.relation ? ' selected' : ''}" data-val="${r}">${r}</div>`).join('');
      el.querySelector('#fm-relation-wrap').style.display = relations.length > 0 ? 'block' : 'none';
      _selectedRelation = m.relation;

      // Wire relation pills
      relationPills.querySelectorAll('.pill').forEach(rp => {
        rp.addEventListener('click', () => {
          relationPills.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
          rp.classList.add('selected');
          _selectedRelation = rp.dataset.val;
        });
      });

      el.querySelector('#fm-birth-wrap').style.display = m.role === 'child' ? 'block' : 'none';
      el.querySelector('#fm-name')?.focus();
    });
  });

  // Remove member
  el.querySelectorAll('.remove-member-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const m = FamilyStore.find(btn.dataset.id);
      if (!m) return;
      const action = await U.sheet(`Remove ${m.name}?`, [
        { key: 'remove', label: 'Remove', cls: 'btn-danger' },
      ]);
      if (action === 'remove') {
        await FamilyStore.remove(m.id);
        U.toast('Removed');
        Router.go('family-setup');
      }
    });
  });
});

      <span class="sep"></span>
      <button onclick="navigator.clipboard?.writeText(Auth.couple()?.invite_code||'none');U.toast('Code copied')">Copy invite</button>
      <button onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">Refresh</button>
      <button onclick="Auth.signOut()">Sign out</button>
      <button onclick="localStorage.clear();sessionStorage.clear();location.reload()" style="color:#f66;">Clear & reload</button>
      <span style="margin-left:auto;">
        <button onclick="location.search='?dev&as=1'">→ P1</button>
        <button onclick="location.search='?dev&as=2'">→ P2</button>
      </span>
    `;
    document.body.prepend(bar);
  }

  function updateDevBar() {
    if (!DEV.enabled) return;
    const el = document.getElementById('dev-user');
    if (el) {
      const m = Auth.me();
      el.textContent = m.name ? `${m.name} (${Auth.amSpouse1() ? 'P1' : 'P2'})` : 'Not signed in';
    }
  }

  // ── Auto-login for dev mode ───────────────────
  if (DEV.autoAs && DEV.accounts[DEV.autoAs]) {
    const acct = DEV.accounts[DEV.autoAs];
    console.log(`[DEV] Auto-login as ${acct.label}...`);

    // Try sign in first (account may already exist)
    let result = await Auth.signIn(acct.email, acct.password);
    if (result.error && result.error.includes('Invalid login')) {
      // Account doesn't exist yet — create it
      console.log('[DEV] Account not found, creating...');
      result = await Auth.signUp(acct.email, acct.password, acct.label.split(' ')[0]);
      if (result.error) {
        console.error('[DEV] Signup failed:', result.error);
        Router.go('auth-entry');
        updateDevBar();
        return;
      }
      if (result.confirmEmail) {
        console.warn('[DEV] Email confirmation required — disable in Supabase Auth settings for dev');
        U.toast('⚠️ Disable email confirmation in Supabase for dev mode');
        Router.go('auth-entry');
        updateDevBar();
        return;
      }
    }

    if (result.error) {
      console.error('[DEV] Login failed:', result.error);
      Router.go('auth-entry');
      updateDevBar();
      return;
    }

    // Bootstrap
    const boot = await Auth.bootstrap();
    console.log('[DEV] Bootstrap:', boot);

    // Auto-create/join couple for dev
    if (!boot.coupled) {
      if (DEV.autoAs === '1') {
        // Partner 1 creates the couple
        const { code } = await Auth.createCouple();
        console.log(`[DEV] Created couple. Invite code: ${code}`);
        await Auth.bootstrap();
        Router.go('home');
      } else {
        // Partner 2 needs to join — find Partner 1's couple
        // Sign in as P1 briefly to get the code, then switch back
        // Actually simpler: just go to the join screen
        Router.go('ob-join');
      }
    } else {
      Router.go('home');
    }
    updateDevBar();
    return;
  }

  // ── Demo mode via URL (?demo or ?demo=B) ──────
  if (_devParams.has('demo')) {
    DEMO.activate(_devParams.get('demo') === 'B' ? 'B' : 'A');
    return;
  }

  // ── Normal flow ───────────────────────────────
  const boot = await Auth.bootstrap();

  if (boot.mode === 'unauthenticated') {
    Router.go('auth-entry');
  } else if (!boot.coupled) {
    Router.go('ob-couple');
  } else if (!boot.hasPartner && boot.coupled) {
    Router.go('ob-invite');
  } else {
    Router.go('home');
  }
  updateDevBar();

  // Auth state change listener (handles page reload, OAuth redirect)
  Auth.sb().auth.onAuthStateChange(async (event, session) => {
    if (event === 'INITIAL_SESSION') return;
    if (event === 'SIGNED_IN' && session) {
      const b = await Auth.bootstrap();
      if (b.coupled && b.hasPartner) Router.go('home');
      else if (b.coupled) Router.go('ob-invite');
      else Router.go('ob-couple');
      updateDevBar();
    }
    if (event === 'SIGNED_OUT') {
      Router.go('auth-entry');
      updateDevBar();
    }
  });
})();

</script>
</body>
</html>
