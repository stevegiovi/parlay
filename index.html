Router.register('family-setup', () => {
  const members = FamilyStore.members();
  const kids = FamilyStore.children();
  const extended = FamilyStore.extended();
  const contacts = FamilyStore.contacts();

  const RELATIONS = {
    child: ['Son', 'Daughter', 'Stepson', 'Stepdaughter'],
    extended: ['Grandparent', 'Aunt', 'Uncle', 'Cousin', 'Sibling', 'In-law', 'Other'],
    contact: ['Babysitter', 'Nanny', 'Tutor', 'Coach', 'Other'],
  };

  const memberCard = (m) => {
    const age = FamilyStore.childAge(m);
    const ageStr = age !== null ? ` · ${age}y` : '';
    const relation = m.relation ? ` · ${m.relation}` : '';
    const roleIcon = m.role === 'child' ? '👶' : m.role === 'extended' ? '👪' : '📇';
    return `<div class="family-card" data-member-id="${m.id}">
      <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;">${roleIcon}</div>
        <div style="min-width:0;">
          <div style="font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${U.esc(m.name)}</div>
          <div style="font-size:.7rem;color:var(--muted);">${m.role}${relation}${ageStr}${m.notes ? ' · ' + U.esc(m.notes) : ''}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn-ghost edit-member-btn" data-id="${m.id}" style="font-size:.85rem;padding:4px 8px;">✏️</button>
        <button class="btn-ghost remove-member-btn" data-id="${m.id}" style="font-size:.85rem;padding:4px 8px;color:#EF4444;">✕</button>
      </div>
    </div>`;
  };

  return `
  <div style="min-height:100dvh;padding:0 20px;padding-top:max(52px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom));">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;" class="a1">
      <button class="btn btn-outline btn-sm" onclick="Router.go('setup')">‹ Back</button>
      <span style="font-family:var(--font-display);font-size:1.1rem;">Family Members</span>
    </div>

    <div class="a2" style="margin-bottom:20px;">
      <div style="font-family:var(--font-display);font-size:1.9rem;font-weight:300;margin-bottom:4px;">Your <em style="color:var(--terra)">family</em></div>
      <div style="font-size:.78rem;color:var(--muted);line-height:1.6;">Add kids, grandparents, babysitters — they appear as smart options when planning events.</div>
    </div>

    <!-- Add member form -->
    <div id="member-form" style="display:none;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;" class="a3">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div class="input-label" style="margin-bottom:0;" id="form-title">Add family member</div>
        <button class="btn-ghost" id="form-cancel" style="font-size:.85rem;">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div>
          <div class="input-label">Name</div>
          <input type="text" id="fm-name" class="input" placeholder="e.g. Emma">
        </div>
        <div>
          <div class="input-label">Type</div>
          <div class="pill-group" data-field="fm-role">
            <div class="pill" data-val="child">Child</div>
            <div class="pill" data-val="extended">Extended family</div>
            <div class="pill" data-val="contact">Contact</div>
          </div>
        </div>
        <div id="fm-relation-wrap" style="display:none;">
          <div class="input-label">Relation</div>
          <div class="pill-group" data-field="fm-relation" id="fm-relation-pills"></div>
        </div>
        <div id="fm-birth-wrap" style="display:none;">
          <div class="input-label">Birth date <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">(optional)</span></div>
          <input type="date" id="fm-birth" class="input">
        </div>
        <div>
          <div class="input-label">Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">(optional)</span></div>
          <input type="text" id="fm-notes" class="input" placeholder="e.g. Allergic to peanuts">
        </div>
        <input type="hidden" id="fm-edit-id" value="">
        <button class="btn btn-accent" id="fm-save"><span id="fm-save-text">Add member</span></button>
      </div>
    </div>

    <div class="a3">
      <button class="btn btn-outline" id="add-member-btn" style="margin-bottom:16px;">+ Add a family member</button>
    </div>

    <!-- Members list -->
    ${kids.length > 0 ? `
    <div class="a4" style="margin-bottom:16px;">
      <div class="input-label">👶 Children (${kids.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;">${kids.map(memberCard).join('')}</div>
    </div>` : ''}

    ${extended.length > 0 ? `
    <div class="a4" style="margin-bottom:16px;">
      <div class="input-label">👪 Extended Family (${extended.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;">${extended.map(memberCard).join('')}</div>
    </div>` : ''}

    ${contacts.length > 0 ? `
    <div class="a4" style="margin-bottom:16px;">
      <div class="input-label">📇 Contacts (${contacts.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px;">${contacts.map(memberCard).join('')}</div>
    </div>` : ''}

    ${members.length === 0 ? `
    <div style="text-align:center;padding:40px 20px;" class="a4">
      <div style="font-size:2.4rem;margin-bottom:12px;">👨‍👩‍👧‍👦</div>
      <div style="font-size:.88rem;color:var(--muted);line-height:1.6;max-width:260px;margin:0 auto;">No family members yet. Add kids, grandparents, or key contacts to get smarter event suggestions.</div>
    </div>` : ''}
  </div>`;
}, (el) => {
  const RELATIONS = {
    child: ['Son', 'Daughter', 'Stepson', 'Stepdaughter'],
    extended: ['Grandparent', 'Aunt', 'Uncle', 'Cousin', 'Sibling', 'In-law', 'Other'],
    contact: ['Babysitter', 'Nanny', 'Tutor', 'Coach', 'Other'],
  };

  const form = el.querySelector('#member-form');
  const addBtn = el.querySelector('#add-member-btn');
  let _selectedRole = null;
  let _selectedRelation = null;

  // Show/hide form
  addBtn?.addEventListener('click', () => {
    resetForm();
    form.style.display = 'block';
    addBtn.style.display = 'none';
    el.querySelector('#fm-name')?.focus();
  });
  el.querySelector('#form-cancel')?.addEventListener('click', () => {
    form.style.display = 'none';
    addBtn.style.display = 'block';
  });

  function resetForm() {
    el.querySelector('#fm-name').value = '';
    el.querySelector('#fm-birth').value = '';
    el.querySelector('#fm-notes').value = '';
    el.querySelector('#fm-edit-id').value = '';
    el.querySelector('#form-title').textContent = 'Add family member';
    el.querySelector('#fm-save-text').textContent = 'Add member';
    _selectedRole = null;
    _selectedRelation = null;
    el.querySelectorAll('[data-field="fm-role"] .pill').forEach(p => p.classList.remove('selected'));
    el.querySelector('#fm-relation-wrap').style.display = 'none';
    el.querySelector('#fm-birth-wrap').style.display = 'none';
  }

  // Role pill selection
  el.querySelectorAll('[data-field="fm-role"] .pill').forEach(pill => {
    pill.addEventListener('click', () => {
      el.querySelectorAll('[data-field="fm-role"] .pill').forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
      _selectedRole = pill.dataset.val;

      // Show relation pills
      const relationWrap = el.querySelector('#fm-relation-wrap');
      const relationPills = el.querySelector('#fm-relation-pills');
      const relations = RELATIONS[_selectedRole] || [];
      relationPills.innerHTML = relations.map(r => `<div class="pill" data-val="${r}">${r}</div>`).join('');
      relationWrap.style.display = relations.length > 0 ? 'block' : 'none';
      _selectedRelation = null;

      // Wire relation pills
      relationPills.querySelectorAll('.pill').forEach(rp => {
        rp.addEventListener('click', () => {
          relationPills.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
          rp.classList.add('selected');
          _selectedRelation = rp.dataset.val;
        });
      });

      // Show birth date for children
      el.querySelector('#fm-birth-wrap').style.display = _selectedRole === 'child' ? 'block' : 'none';
    });
  });

  // Save
  el.querySelector('#fm-save')?.addEventListener('click', async () => {
    const name = el.querySelector('#fm-name')?.value.trim();
    if (!name) { U.toast('Enter a name'); return; }
    if (!_selectedRole) { U.toast('Select a type'); return; }

    const btn = el.querySelector('#fm-save');
    btn.disabled = true;

    const member = {
      id: el.querySelector('#fm-edit-id').value || ('fm_' + Date.now()),
      name,
      role: _selectedRole,
      relation: _selectedRelation || null,
      belongsTo: 'both',
      birthDate: el.querySelector('#fm-birth')?.value || null,
      notes: el.querySelector('#fm-notes')?.value.trim() || null,
      sortOrder: FamilyStore.members().length,
    };

    const editId = el.querySelector('#fm-edit-id').value;
    if (editId) {
      await FamilyStore.update(editId, member);
      U.toast('Updated');
    } else {
      await FamilyStore.add(member);
      U.toast('Added');
    }

    Router.go('family-setup');
  });

  // Edit member
  el.querySelectorAll('.edit-member-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const m = FamilyStore.find(btn.dataset.id);
      if (!m) return;

      form.style.display = 'block';
      addBtn.style.display = 'none';
      el.querySelector('#form-title').textContent = 'Edit family member';
      el.querySelector('#fm-save-text').textContent = 'Save changes';
      el.querySelector('#fm-name').value = m.name;
      el.querySelector('#fm-edit-id').value = m.id;
      el.querySelector('#fm-notes').value = m.notes || '';
      el.querySelector('#fm-birth').value = m.birthDate || '';

      // Select role pill
      _selectedRole = m.role;
      el.querySelectorAll('[data-field="fm-role"] .pill').forEach(p => {
        p.classList.toggle('selected', p.dataset.val === m.role);
      });

      // Show relation pills and select
      const relations = RELATIONS[m.role] || [];
      const relationPills = el.querySelector('#fm-relation-pills');
      relationPills.innerHTML = relations.map(r => `<div class="pill${r === m.relation ? ' selected' : ''}" data-val="${r}">${r}</div>`).join('');
      el.querySelector('#fm-relation-wrap').style.display = relations.length > 0 ? 'block' : 'none';
      _selectedRelation = m.relation;

      // Wire relation pills
      relationPills.querySelectorAll('.pill').forEach(rp => {
        rp.addEventListener('click', () => {
          relationPills.querySelectorAll('.pill').forEach(p => p.classList.remove('selected'));
          rp.classList.add('selected');
          _selectedRelation = rp.dataset.val;
        });
      });

      el.querySelector('#fm-birth-wrap').style.display = m.role === 'child' ? 'block' : 'none';
      el.querySelector('#fm-name')?.focus();
    });
  });

  // Remove member
  el.querySelectorAll('.remove-member-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const m = FamilyStore.find(btn.dataset.id);
      if (!m) return;
      const action = await U.sheet(`Remove ${m.name}?`, [
        { key: 'remove', label: 'Remove', cls: 'btn-danger' },
      ]);
      if (action === 'remove') {
        await FamilyStore.remove(m.id);
        U.toast('Removed');
        Router.go('family-setup');
      }
    });
  });
});

Router.register('mediator', () => {
  const msgs = MediatorChat.messages();
  const suggs = MediatorChat.suggestions();

  return `
  <div style="display:flex;flex-direction:column;height:100dvh;">
    <div style="background:var(--espresso);padding:14px 20px;padding-top:max(48px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-shrink:0;">
      <button class="btn-ghost" style="color:var(--cream);padding:4px;" onclick="Router.go('home')">‹</button>
      <div style="flex:1;">
        <div style="font-size:.92rem;font-weight:600;color:var(--cream);">AI Mediator</div>
        <div style="font-size:.62rem;color:var(--amber);">Powered by Parlay</div>
      </div>
      <button class="btn-ghost" style="color:rgba(250,246,241,.5);font-size:.72rem;" onclick="MediatorChat.clear();Router.reload();">Clear</button>
    </div>

    <div class="chat-messages" id="chat-messages">
      ${msgs.length === 0 ? `
        <div class="chat-ai slide-up">
          <div class="ai-name">Parlay Mediator</div>
          Welcome! I'm here to help you and ${U.esc(Auth.theirName())} communicate better. You can ask me for advice, practice tough conversations, or just vent — I'm a safe space.
        </div>
      ` : msgs.map(m => {
        if (m.role === 'user') return `<div class="chat-user">${U.esc(m.text)}</div>`;
        if (m.role === 'ai') return `<div class="chat-ai"><div class="ai-name">Parlay Mediator</div>${U.esc(m.text)}</div>`;
        return `<div class="chat-system">${U.esc(m.text)}</div>`;
      }).join('')}
    </div>

    ${suggs.length > 0 && msgs.length < 4 ? `
    <div class="suggestion-bar" style="padding:8px 16px;" id="chat-suggs">
      ${suggs.map(s => `<div class="suggestion-chip" data-text="${U.esc(s.text)}"><span class="chip-icon">${s.icon}</span> ${U.esc(s.text)}</div>`).join('')}
    </div>
    ` : ''}

    <div class="chat-input-bar">
      <textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
      <button class="chat-send" id="chat-send" disabled>➤</button>
    </div>
  </div>`;
}, (el) => {
  const input = el.querySelector('#chat-input');
  const send = el.querySelector('#chat-send');
  const msgContainer = el.querySelector('#chat-messages');

  // Auto-scroll to bottom
  if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;

  // Enable/disable send button
  input?.addEventListener('input', () => {
    send.disabled = !input.value.trim();
    // Auto-resize
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });

  // Suggestion chips
  el.querySelectorAll('.suggestion-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      input.value = chip.dataset.text;
      input.dispatchEvent(new Event('input'));
      el.querySelector('#chat-suggs')?.remove();
    });
  });

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    // Add user message to UI
    const userBubble = document.createElement('div');
    userBubble.className = 'chat-user slide-up';
    userBubble.textContent = text;
    msgContainer.appendChild(userBubble);

    input.value = '';
    input.style.height = 'auto';
    send.disabled = true;

    // Remove suggestions
    el.querySelector('#chat-suggs')?.remove();

    // Show typing indicator
    const typing = document.createElement('div');
    typing.className = 'chat-ai chat-typing slide-up';
    typing.innerHTML = '<div class="ai-name">Parlay Mediator</div><div class="dots"><span></span><span></span><span></span></div>';
    msgContainer.appendChild(typing);
    msgContainer.scrollTop = msgContainer.scrollHeight;

    // Get AI response
    const response = await MediatorChat.send(text);

    // Replace typing with response
    typing.remove();
    const aiBubble = document.createElement('div');
    aiBubble.className = 'chat-ai slide-up';
    aiBubble.innerHTML = `<div class="ai-name">Parlay Mediator</div>${U.esc(response)}`;
    msgContainer.appendChild(aiBubble);
    msgContainer.scrollTop = msgContainer.scrollHeight;

    // Show follow-up suggestions after AI response
    const followUps = MediatorChat.suggestions();
    if (followUps.length > 0) {
      const suggsDiv = document.createElement('div');
      suggsDiv.id = 'chat-suggs';
      suggsDiv.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;';
      followUps.slice(0, 3).forEach(s => {
        const chip = document.createElement('div');
        chip.className = 'suggestion-chip';
        chip.dataset.text = s.text;
        chip.innerHTML = `<span class="chip-icon">${s.icon}</span> ${s.text}`;
        chip.addEventListener('click', () => {
          input.value = s.text;
          input.dispatchEvent(new Event('input'));
          suggsDiv.remove();
        });
        suggsDiv.appendChild(chip);
      });
      msgContainer.appendChild(suggsDiv);
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }
  }

  send?.addEventListener('click', sendMessage);
  input?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
});

      <div style="font-size:.82rem;color:var(--muted);line-height:1.65;margin-bottom:20px;">You've thoughtfully worked through each step. Consider sharing this with ${U.esc(Auth.theirName())} when the moment feels right.</div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <button class="btn btn-outline btn-sm" onclick="Router.go('resolution-pick')">Try another</button>
        <button class="btn btn-accent btn-sm" onclick="Router.go('home')">Done</button>
      </div>
    </div>
  </div>`;
}, (el) => {
  const steps = el.querySelectorAll('.res-step');
  const progress = el.querySelectorAll('#res-progress span');
  let currentStep = 0;

  // Attach tone coaching to first textarea
  const firstTA = el.querySelector('[data-step-input="0"]');
  const firstCoach = el.querySelector('[data-step-coach="0"]');
  if (firstTA && firstCoach) ToneCoach.attachToTextarea(firstTA, firstCoach);

  el.addEventListener('click', (e) => {
    const nextBtn = e.target.closest('[data-next]');
    if (!nextBtn) return;

    const stepIdx = parseInt(nextBtn.dataset.next);
    const stepEl = steps[stepIdx];
    const textarea = stepEl.querySelector('textarea');

    if (textarea && !textarea.value.trim()) {
      U.toast('Take a moment to write your thoughts');
      textarea.focus();
      return;
    }

    // Mark current as completed
    stepEl.classList.remove('active');
    stepEl.classList.add('completed');
    progress[stepIdx].classList.add('done');

    // Check if this was the last step
    const tmpl = RESOLUTION_TEMPLATES.find(t => t.id === el.closest('.screen')?.querySelector('[data-next]')?.closest('.res-step')?.parentElement ? true : false) || RESOLUTION_TEMPLATES[0];
    currentStep = stepIdx + 1;

    if (currentStep >= steps.length) {
      // All steps done
      progress[stepIdx].classList.add('done');
      el.querySelector('#res-complete').style.display = 'block';
      return;
    }

    // Activate next step
    const nextStep = steps[currentStep];
    nextStep.classList.add('active');
    progress[currentStep].classList.add('active');

    // Expand next step with prompt and textarea
    const stepData = nextStep.querySelector('[style]');
    const prompt = nextStep.querySelector('div[style*="color:var(--muted)"]');
    if (prompt) {
      const promptText = prompt.textContent;
      nextStep.innerHTML = `
        <div style="display:flex;align-items:center;margin-bottom:8px;">
          <span class="step-num">${currentStep + 1}</span>
          <span style="font-size:.88rem;font-weight:600;">${nextStep.querySelector('.step-num')?.nextSibling?.textContent || 'Step ' + (currentStep + 1)}</span>
        </div>
        <div class="res-prompt">${promptText}</div>
        <textarea class="input" rows="3" placeholder="Write your thoughts here..." style="margin-top:10px;font-size:.85rem;" data-step-input="${currentStep}"></textarea>
        <div class="tone-coach tone-coach-hidden" data-step-coach="${currentStep}"></div>
        <button class="btn btn-accent btn-sm" style="margin-top:10px;" data-next="${currentStep}">Continue →</button>
      `;
      // Attach tone coaching
      const ta = nextStep.querySelector(`[data-step-input="${currentStep}"]`);
      const coach = nextStep.querySelector(`[data-step-coach="${currentStep}"]`);
      if (ta && coach) ToneCoach.attachToTextarea(ta, coach);
      ta?.focus();
    }
  });
});

/* ═══════════════════════════════════════════════════════════════
   CONVERSATION ANALYTICS & RELATIONSHIP TIMELINE
   ═══════════════════════════════════════════════════════════════ */

const ConvoAnalytics = (() => {
  // Analyze conversation patterns over time
  function getTimeline() {
    const parlays = Store.parlays();
    const tasks = Store.tasks();
    const events = [];

    parlays.forEach(p => {
      events.push({
        type: 'parlay',
        subtype: 'created',
        date: p.date || p.createdAt,
        title: p.title,
        status: p.status,
        topicId: p.topicId,
        id: p.id,
        isMine: p.isMine,
      });
      if (p.status === 'resolved') {
        events.push({
          type: 'parlay',
          subtype: 'resolved',
          date: p.resolvedAt || p.date,
          title: p.title,
          id: p.id,
        });
      }
    });

    tasks.forEach(t => {
      events.push({
        type: 'task',
        subtype: 'created',
        date: t.createdAt || t.date,
        title: t.title,
        status: t.status,
        id: t.id,
      });
      if (t.status === 'done') {
        events.push({
          type: 'task',
          subtype: 'completed',
          date: t.completedAt || t.date,
          title: t.title,
          id: t.id,
        });
      }
    });

    // Sort by date descending
    events.sort((a, b) => {
      const da = new Date(a.date || 0);
      const db = new Date(b.date || 0);
      return db - da;
    });

    return events;
  }

  // Topic distribution analysis
  function topicDistribution() {
    const parlays = Store.parlays();
    const dist = {};
    parlays.forEach(p => {
      const tid = p.topicId || 'other';
      dist[tid] = (dist[tid] || 0) + 1;
    });
    return Object.entries(dist)
      .map(([id, count]) => {
        const topic = TOPICS_V2.find(t => t.id === id) || { icon: '📝', label: id };
        return { id, icon: topic.icon, label: topic.label, count };
      })
      .sort((a, b) => b.count - a.count);
  }

  // Resolution rate
  function resolutionRate() {
    const parlays = Store.parlays();
    if (parlays.length === 0) return { rate: 0, resolved: 0, total: 0 };
    const resolved = parlays.filter(p => p.status === 'resolved').length;
    return { rate: parlays.length > 0 ? Math.round((resolved / parlays.length) * 100) : 0, resolved, total: parlays.length };
  }

  // Average response time (mock estimate)
  function avgResponseTime() {
    const parlays = Store.parlays();
    const withResponse = parlays.filter(p => p.partnerRawReply || p.partnerFilteredReply);
    if (withResponse.length === 0) return 'N/A';
    // Estimate based on status transitions (simplified)
    return withResponse.length > 3 ? '< 2 hours' : withResponse.length > 1 ? '< 6 hours' : '< 1 day';
  }

  // Sentiment trajectory over recent parlays
  function sentimentTrajectory() {
    const parlays = Store.parlays().slice(-10);
    return parlays.map(p => {
      let sentiment = 'neutral';
      if (p.status === 'resolved') sentiment = 'positive';
      else if (p.status === 'declined' || p.status === 'counter_proposed') sentiment = 'mixed';
      else if (p.status === 'active' || p.status === 'in_discussion') sentiment = 'engaged';
      return { title: p.title, sentiment, date: p.date };
    });
  }

  // Daily activity heatmap data (last 28 days)
  function activityHeatmap() {
    const days = [];
    const now = new Date();
    const parlays = Store.parlays();
    const tasks = Store.tasks();

    for (let i = 27; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      const dayParlays = parlays.filter(p => (p.date || '').startsWith(dateStr)).length;
      const dayTasks = tasks.filter(t => (t.date || t.createdAt || '').startsWith(dateStr)).length;
      days.push({
        date: dateStr,
        day: d.toLocaleDateString('en-US', { weekday: 'short' }),
        count: dayParlays + dayTasks,
      });
    }
    return days;
  }

  // Win streaks — consecutive days with positive activity
  function winStreaks() {
    const parlays = Store.parlays();
    const resolved = parlays.filter(p => p.status === 'resolved').length;
    const tasks = Store.tasks();
    const done = tasks.filter(t => t.status === 'done').length;
    return {
      resolvedStreak: resolved,
      doneStreak: done,
      totalPositive: resolved + done,
    };
  }

  // Collaboration score — how balanced the relationship is
  function collaborationIndex() {
    const parlays = Store.parlays();
    const tasks = Store.tasks();
    const myInitiated = parlays.filter(p => p.isMine).length;
    const theirInitiated = parlays.filter(p => !p.isMine).length;
    const myTasks = tasks.filter(t => t.assignedTo === 'me').length;
    const theirTasks = tasks.filter(t => t.assignedTo !== 'me').length;

    const total = myInitiated + theirInitiated;
    const balance = total > 0 ? Math.min(myInitiated, theirInitiated) / Math.max(myInitiated, theirInitiated) : 0;
    const taskBalance = (myTasks + theirTasks) > 0 ? Math.min(myTasks, theirTasks) / Math.max(myTasks, theirTasks) : 0;

    const index = Math.round(((balance + taskBalance) / 2) * 100);
    let label = 'Balanced';
    if (index < 30) label = 'One-sided — try initiating more conversations';
    else if (index < 60) label = 'Room to improve — encourage more participation';
    else if (index < 80) label = 'Good balance';
    else label = 'Great teamwork!';

    return { index, label, myInitiated, theirInitiated, myTasks, theirTasks };
  }

  return {
    getTimeline, topicDistribution, resolutionRate, avgResponseTime,
    sentimentTrajectory, activityHeatmap, winStreaks, collaborationIndex,
  };
})();

   APPRECIATION JOURNAL — Gratitude & positive reinforcement
   ═══════════════════════════════════════════════════════════════ */

const AppreciationStore = (() => {
  const KEY = 'parlay_appreciations';

  function _load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
  }
  function _save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  function add(text, category = 'general') {
    const items = _load();
    items.unshift({
      id: 'ap_' + Date.now(),
      text,
      category,
      date: new Date().toISOString(),
      shared: false,
    });
    _save(items);
    NotifStore.add('appreciation', `You noted something you appreciate about ${Auth.theirName()}`, '#/appreciation');
    return items[0];
  }

  function all() { return _load(); }
  function recent(n = 5) { return _load().slice(0, n); }
  function count() { return _load().length; }

  function share(id) {
    const items = _load();
    const item = items.find(i => i.id === id);
    if (item) { item.shared = true; _save(items); }
    return item;
  }

  function todayCount() {
    const today = new Date().toISOString().split('T')[0];
    return _load().filter(a => a.date.startsWith(today)).length;
  }

  function streak() {
    const items = _load();
    if (items.length === 0) return 0;
    let streak = 0;
    const now = new Date();
    for (let i = 0; i < 30; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      if (items.some(a => a.date.startsWith(dateStr))) {
        streak++;
      } else if (i > 0) break;
    }
    return streak;
  }

  const CATEGORIES = [
    { id: 'general', icon: '💛', label: 'General' },
    { id: 'effort', icon: '💪', label: 'Effort' },
    { id: 'kindness', icon: '🤗', label: 'Kindness' },
    { id: 'patience', icon: '🧘', label: 'Patience' },
    { id: 'humor', icon: '😂', label: 'Humor' },
    { id: 'support', icon: '🤝', label: 'Support' },
    { id: 'growth', icon: '🌱', label: 'Growth' },
  ];

  const PROMPTS = [
    "What's something they did today that made you smile?",
    "When did they show you they cared recently?",
    "What quality do you most admire in them right now?",
    "What's a small thing they do that you often forget to thank them for?",
    "When was the last time they surprised you in a good way?",
    "What's something they're really good at that helps your partnership?",
    "What did they handle well recently that you didn't acknowledge?",
    "What effort of theirs do you want to recognize?",
  ];

  function randomPrompt() {
    return PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
  }

  return { add, all, recent, count, share, todayCount, streak, randomPrompt, CATEGORIES };
})();

/* ═══════════════════════════════════════════════════════════════
   SMART SCHEDULING — Calendar intelligence & date suggestions
   ═══════════════════════════════════════════════════════════════ */

const SmartSchedule = (() => {
  // Analyze existing date commitments
  function getBusyDates() {
    const parlays = Store.parlays();
    const dates = [];
    parlays.forEach(p => {
      if (p.dateOptions) {
        p.dateOptions.forEach(opt => {
          if (opt.date) dates.push(opt.date);
        });
      }
      if (p.confirmedDate) dates.push(p.confirmedDate);
    });
    const tasks = Store.tasks();
    tasks.forEach(t => {
      if (t.dueDate) dates.push(t.dueDate);
    });
    return [...new Set(dates)].sort();
  }

  // Suggest next available dates
  function suggestDates(count = 3, preferWeekend = false) {
    const busy = new Set(getBusyDates());
    const suggestions = [];
    const now = new Date();

    for (let i = 1; suggestions.length < count && i < 30; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() + i);
      const dateStr = d.toISOString().split('T')[0];
      const dayOfWeek = d.getDay();

      // Skip if busy
      if (busy.has(dateStr)) continue;

      // Weekend preference
      if (preferWeekend && dayOfWeek !== 0 && dayOfWeek !== 6) continue;

      suggestions.push({
        date: dateStr,
        dayName: d.toLocaleDateString('en-US', { weekday: 'long' }),
        formatted: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
        isWeekend: dayOfWeek === 0 || dayOfWeek === 6,
      });
    }

    // Fallback if weekend preference yielded too few
    if (suggestions.length < count && preferWeekend) {
      return suggestDates(count, false);
    }

    return suggestions;
  }

  // Check for conflicts with a proposed date
  function checkConflicts(dateStr) {
    const busy = getBusyDates();
    const conflicts = [];

    if (busy.includes(dateStr)) {
      // Find what's on that date
      Store.parlays().forEach(p => {
        if (p.dateOptions?.some(o => o.date === dateStr) || p.confirmedDate === dateStr) {
          conflicts.push({ type: 'parlay', title: p.title, id: p.id });
        }
      });
      Store.tasks().forEach(t => {
        if (t.dueDate === dateStr) {
          conflicts.push({ type: 'task', title: t.title, id: t.id });
        }
      });
    }

    return conflicts;
  }

  // Get upcoming commitments
  function upcomingCommitments(days = 7) {
    const now = new Date();
    const cutoff = new Date(now);
    cutoff.setDate(cutoff.getDate() + days);
    const commitments = [];

    Store.parlays().forEach(p => {
      if (p.confirmedDate) {
        const d = new Date(p.confirmedDate);
        if (d >= now && d <= cutoff) {
          commitments.push({
            type: 'parlay',
            title: p.title,
            date: p.confirmedDate,
            topicId: p.topicId,
          });
        }
      }
      (p.dateOptions || []).forEach(opt => {
        if (opt.date) {
          const d = new Date(opt.date);
          if (d >= now && d <= cutoff) {
            commitments.push({
              type: 'proposed',
              title: p.title,
              date: opt.date,
              timeLabel: opt.timeLabel,
              topicId: p.topicId,
            });
          }
        }
      });
    });

    Store.tasks().forEach(t => {
      if (t.dueDate) {
        const d = new Date(t.dueDate);
        if (d >= now && d <= cutoff) {
          commitments.push({
            type: 'task',
            title: t.title,
            date: t.dueDate,
            status: t.status,
          });
        }
      }
    });

    commitments.sort((a, b) => new Date(a.date) - new Date(b.date));
    return commitments;
  }

  return { getBusyDates, suggestDates, checkConflicts, upcomingCommitments };
})();

const AIContext = (() => {
  // Build rich context for AI calls
  function buildContext() {
    const parts = [];

    // Communication style
    if (CommProfile.isComplete()) {
      const summary = CommProfile.summary();
      parts.push(`COMMUNICATION STYLE: ${summary}`);
    }

    // Current mood
    const mood = MoodStore.todayMood();
    if (mood) {
      const moodData = MOODS.find(m => m.id === mood.moodId);
      parts.push(`CURRENT MOOD: ${moodData?.label || mood.moodId} (energy: ${moodData?.energy || 3}/5)`);
      if (mood.context) parts.push(`MOOD CONTEXT: ${mood.context}`);
    }

    // Relationship health
    const score = Insights.communicationScore();
    parts.push(`RELATIONSHIP HEALTH SCORE: ${score.score}/100 (${score.label})`);

    // Recent activity summary
    const parlays = Store.parlays();
    const recentResolved = parlays.filter(p => p.status === 'resolved').length;
    const recentPending = parlays.filter(p => p.status === 'pending_partner').length;
    parts.push(`ACTIVITY: ${parlays.length} total plans, ${recentResolved} resolved, ${recentPending} awaiting response`);

    // Appreciation count
    const apCount = AppreciationStore.count();
    if (apCount > 0) parts.push(`APPRECIATIONS LOGGED: ${apCount}`);

    return parts.join('\n');
  }

  // Enhanced tone filter with context
  function enhancedToneFilter(rawText, intentContext = '') {
    const ctx = buildContext();
    const systemPrompt = `You are Parlay's Communication Translator. You help couples communicate calmly and clearly.

CONTEXT ABOUT THIS PERSON:
${ctx}

RULES:
1. Rewrite to be calm, clear, and constructive
2. Use "I" statements when possible
3. Remove blame, accusations, or passive aggression
4. Keep the core message and intent intact
5. Match the person's communication style (see above)
6. If they're in a low mood, add extra gentleness
7. Keep it concise — 1-3 sentences max
8. First person only. ONLY output the rewrite, nothing else.

INTENT CONTEXT:
${intentContext}`;

    return AI.call(systemPrompt, `Rewrite this: "${rawText}"`);
  }

  // Generate personalized coaching tip
  function coachingTip() {
    const mood = MoodStore.todayMood();
    const score = Insights.communicationScore();
    const equity = Insights.equityBalance();

    if (mood?.moodId === 'stressed' || mood?.moodId === 'upset') {
      return {
        icon: '🧘',
        text: "You're feeling some pressure today. Take a breath before starting conversations — you'll communicate more clearly.",
      };
    }

    if (score.score < 40) {
      return {
        icon: '💡',
        text: "Your communication score is low. Try starting with an appreciation before bringing up a request.",
      };
    }

    if (equity.me > 70) {
      return {
        icon: '⚖️',
        text: `You're carrying ${equity.me}% of tasks. Consider asking ${Auth.theirName()} to take on more this week.`,
      };
    }

    if (equity.them > 70) {
      return {
        icon: '🤝',
        text: `${Auth.theirName()} has been handling most tasks. Maybe offer to take something off their plate.`,
      };
    }

    const tips = [
      { icon: '🌟', text: `Start your next conversation with something positive about ${Auth.theirName()}.` },
      { icon: '🎯', text: 'Be specific in your requests — "Can you do X by Friday?" works better than "Can you help?"' },
      { icon: '👂', text: 'After sending a proposal, give your partner time. Rushing creates pressure.' },
      { icon: '📅', text: 'Proposing multiple date options shows flexibility and respect for their schedule.' },
      { icon: '💬', text: 'Use guided conversations for sensitive topics — the structure keeps things productive.' },
      { icon: '🔄', text: 'Check in on unresolved plans. A gentle follow-up shows you care about resolution.' },
    ];

    return tips[Math.floor(Math.random() * tips.length)];
  }

  // Build enhanced mediator system prompt
  function mediatorSystemPrompt() {
    const ctx = buildContext();
    const pp = PartnerProfile.get();
    const conflicts = ConflictTracker.patterns();

    let partnerCtx = '';
    if (pp.loveLanguages?.length) {
      const llLabels = pp.loveLanguages.map(id => PartnerProfile.LOVE_LANGUAGES.find(l => l.id === id)?.label || id);
      partnerCtx += `\nPARTNER'S LOVE LANGUAGES: ${llLabels.join(', ')}`;
    }
    if (pp.stressSignals?.length) {
      const ssLabels = pp.stressSignals.map(id => PartnerProfile.STRESS_SIGNALS.find(s => s.id === id)?.label || id);
      partnerCtx += `\nPARTNER'S STRESS SIGNALS: ${ssLabels.join(', ')}`;
    }
    if (pp.bestTimeToTalk) {
      partnerCtx += `\nBEST TIME TO TALK: ${pp.bestTimeToTalk}`;
    }
    if (pp.needsCoolDown !== undefined) {
      partnerCtx += `\nNEEDS COOL-DOWN: ${pp.needsCoolDown ? 'Yes — give space before talking' : 'No — prefers to talk it out'}`;
    }

    if (conflicts.topTrigger) {
      partnerCtx += `\nCOMMON CONFLICT TRIGGER: ${conflicts.topTrigger}`;
      partnerCtx += `\nCONFLICT RESOLUTION RATE: ${conflicts.resolutionRate}%`;
    }

    return `You are Parlay's AI Mediator — a relationship communication coach. You help individuals think through relationship challenges privately.

ABOUT THIS PERSON:
${ctx}
${partnerCtx}

COMMUNICATION PRINCIPLES (based on Gottman Method & NVC):
1. Help identify feelings and needs behind positions
2. Suggest "I" statements over "you" statements
3. Watch for the Four Horsemen (criticism, contempt, defensiveness, stonewalling)
4. Encourage soft startups for difficult conversations
5. Validate emotions before problem-solving
6. Consider the partner's love languages and stress signals
7. Suggest timing conversations for when the partner is most receptive
8. If cool-down time is needed, suggest pausing first

Keep responses concise (2-4 sentences). Be warm but direct. Ask follow-up questions.`;
  }

  return { buildContext, enhancedToneFilter, coachingTip, mediatorSystemPrompt };
})();

const DailyRitual = (() => {
  const KEY = 'parlay_daily_ritual';

  function _load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; }
  }
  function _save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  function todayKey() { return new Date().toISOString().split('T')[0]; }

  function isCompletedToday() {
    return _load()[todayKey()]?.completed === true;
  }

  function completeToday(data) {
    const all = _load();
    all[todayKey()] = { completed: true, ...data, date: new Date().toISOString() };
    _save(all);
  }

  function streak() {
    const all = _load();
    let count = 0;
    const now = new Date();
    for (let i = 0; i < 30; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const key = d.toISOString().split('T')[0];
      if (all[key]?.completed) count++;
      else if (i > 0) break;
    }
    return count;
  }

  function history(days = 7) {
    const all = _load();
    const results = [];
    const now = new Date();
    for (let i = 0; i < days; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const key = d.toISOString().split('T')[0];
      results.push({ date: key, completed: !!all[key]?.completed, data: all[key] || null });
    }
    return results;
  }

  return { isCompletedToday, completeToday, streak, history };
})();

const ConflictTracker = (() => {
  const KEY = 'parlay_conflicts';

  function _load() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
  }
  function _save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  function log(parlayId, details) {
    const items = _load();
    items.unshift({
      id: 'conf_' + Date.now(),
      parlayId,
      date: new Date().toISOString(),
      topic: details.topic || 'general',
      trigger: details.trigger || '',
      resolution: details.resolution || 'pending',
      whatHelped: details.whatHelped || '',
      lessonsLearned: details.lessonsLearned || '',
      intensityLevel: details.intensityLevel || 3,
    });
    _save(items);
    return items[0];
  }

  function all() { return _load(); }
  function recent(n = 5) { return _load().slice(0, n); }

  function patterns() {
    const items = _load();
    if (items.length < 2) return { topTrigger: null, avgIntensity: 0, resolutionRate: 0 };

    // Top trigger
    const triggers = {};
    items.forEach(c => {
      if (c.trigger) triggers[c.trigger] = (triggers[c.trigger] || 0) + 1;
    });
    const topTrigger = Object.entries(triggers).sort((a, b) => b[1] - a[1])[0]?.[0] || null;

    // Average intensity
    const avgIntensity = items.reduce((sum, c) => sum + (c.intensityLevel || 3), 0) / items.length;

    // Resolution rate
    const resolved = items.filter(c => c.resolution === 'resolved').length;
    const resolutionRate = Math.round((resolved / items.length) * 100);

    return { topTrigger, avgIntensity: Math.round(avgIntensity * 10) / 10, resolutionRate };
  }

  function getInsights() {
    const p = patterns();
    const insights = [];
    if (p.topTrigger) {
      insights.push({ icon: '⚡', text: `Your most common trigger is "${p.topTrigger}". Being aware of it helps you prepare.` });
    }
    if (p.avgIntensity > 3.5) {
      insights.push({ icon: '🌡️', text: 'Your conflicts tend to run hot. Try the "Gentle Startup" guided conversation before bringing things up.' });
    }
    if (p.resolutionRate > 70) {
      insights.push({ icon: '🎯', text: `You resolve ${p.resolutionRate}% of conflicts — that's strong! Keep using your strategies.` });
    } else if (p.resolutionRate > 0) {
      insights.push({ icon: '💡', text: `You've resolved ${p.resolutionRate}% of tracked conflicts. The AI Mediator can help with the rest.` });
    }
    return insights;
  }

  const TRIGGERS = [
    'Money / finances',
    'Household chores',
    'Kids / parenting',
    'Time management',
    'Communication gap',
    'In-law tension',
    'Work-life balance',
    'Social plans',
    'Intimacy',
    'Personal habits',
    'Other',
  ];

  return { log, all, recent, patterns, getInsights, TRIGGERS };
})();

  const msgs = EventMessages.list(id);

  const theirN = Auth.theirName();

  return `
  <div style="min-height:100dvh;display:flex;flex-direction:column;padding:0;padding-top:max(52px,env(safe-area-inset-top));">
    <!-- Header -->
    <div style="padding:0 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">

        <div style="font-size:.62rem;color:var(--muted);">${msgs.length} messages</div>
      </div>
    </div>

    <!-- Messages -->
    <div style="flex:1;overflow-y:auto;padding:16px 20px;" id="thread-messages">
      ${msgs.length > 0 ? msgs.map(m => {
        const isMe = m.fromUid === Auth.myUid() || m.from === 'me';
        const isSystem = m.type === 'system';
        if (isSystem) {
          return `
          <div style="text-align:center;margin:12px 0;">
            <span style="font-size:.68rem;color:var(--muted);background:var(--parchment);padding:3px 12px;border-radius:12px;">${U.esc(m.filteredContent || m.rawContent)}</span>
          </div>`;
        }
        return `
        <div style="display:flex;${isMe ? 'justify-content:flex-end;' : ''}margin-bottom:12px;">
          <div style="max-width:80%;${isMe
            ? 'background:var(--terra);color:#fff;border-radius:16px 16px 4px 16px;'
            : 'background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;'
          }padding:10px 14px;">
            <div style="font-size:.62rem;font-weight:600;margin-bottom:3px;${isMe ? 'opacity:.8;' : 'color:var(--muted);'}">${isMe ? myN : theirN}</div>
            <div style="font-size:.85rem;line-height:1.55;">${U.esc(m.filteredContent || m.rawContent)}</div>
            <div style="font-size:.58rem;${isMe ? 'opacity:.6;' : 'color:var(--muted);'}margin-top:4px;text-align:right;">
              ${m.timestamp ? new Date(m.timestamp).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''}
              ${m.filteredContent && m.filteredContent !== m.rawContent ? ' · ✓ Filtered' : ''}
            </div>
          </div>
        </div>`;
      }).join('') : `
      <div style="text-align:center;padding:40px 0;">
        <div style="font-size:1.5rem;margin-bottom:8px;">💬</div>
        <div style="font-size:.82rem;color:var(--muted);">No messages yet. Start the conversation!</div>
      </div>`}
    </div>

    <!-- Reply Input -->
    <div style="padding:12px 20px;border-top:1px solid var(--border);background:var(--cream);padding-bottom:max(20px,env(safe-area-inset-bottom));">
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <textarea id="thread-input" class="input" rows="1" placeholder="Type a message..." style="flex:1;resize:none;font-size:.85rem;min-height:40px;max-height:100px;padding:10px 14px;border-radius:20px;"></textarea>
        <button class="btn btn-accent" style="border-radius:50%;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;" id="thread-send">↑</button>
      </div>
      <div class="tone-coach tone-coach-hidden" id="thread-coach" style="margin-top:4px;"></div>
    </div>
  </div>`;
}, (el, { id } = {}) => {
  const textarea = el.querySelector('#thread-input');
  const coach = el.querySelector('#thread-coach');
  if (textarea && coach) ToneCoach.attachToTextarea(textarea, coach);

  // Auto-resize textarea
  textarea?.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
  });

  // Scroll to bottom
  const msgContainer = el.querySelector('#thread-messages');
  if (msgContainer) msgContainer.scrollTop = msgContainer.scrollHeight;

  // Send message
  el.querySelector('#thread-send')?.addEventListener('click', async () => {
    const text = textarea?.value.trim();
    if (!text) return;

    const btn = el.querySelector('#thread-send');
    btn.disabled = true;
    btn.textContent = '…';

    let filtered = text;
    try {
      filtered = await AIContext.enhancedToneFilter(text);
    } catch(e) { filtered = text; }

    await EventMessages.send(id, {
      type: 'text',
      rawContent: text,
      filteredContent: filtered,
    });

    textarea.value = '';
    textarea.style.height = 'auto';
    btn.disabled = false;
    btn.textContent = '↑';

    // Re-render to show the new message
    Router.reload();
  });
});

          `).join('')}

  </div>`;
}, (el) => {
  // Wire all pill groups as single-select (except love languages which is multi up to 2)
  function wireGroup(selector, multi = false, max = 99) {
    el.querySelectorAll(selector + ' .pill').forEach(pill => {
      pill.addEventListener('click', () => {
        if (multi) {
          const selected = el.querySelectorAll(selector + ' .pill.selected').length;
          if (pill.classList.contains('selected')) {
            pill.classList.remove('selected');
          } else if (selected < max) {
            pill.classList.add('selected');
          } else {
            U.toast(`Select up to ${max}`);
          }
        } else {
          el.querySelectorAll(selector + ' .pill').forEach(p => p.classList.remove('selected'));
          pill.classList.add('selected');
        }
      });
    });
  }

  wireGroup('#pp-love-langs', true, 2);
  wireGroup('#pp-stress', true, 3);
  wireGroup('#pp-time');
  wireGroup('#pp-channel');
  wireGroup('#pp-cooldown');

  // Save

    const preferredChannel = el.querySelector('#pp-channel .pill.selected')?.dataset.channel || 'in-person';
    const needsCoolDown = el.querySelector('#pp-cooldown .pill.selected')?.dataset.cd === 'true';

    PartnerProfile.update({
      loveLanguages, stressSignals, bestTimeToTalk, preferredChannel, needsCoolDown,
    });

    U.toast('Partner profile saved ✓');
    Router.go('setup');
  });
});

    <div style="font-size:.78rem;color:var(--muted);line-height:1.65;margin-bottom:24px;" class="a2">
      Take 2 minutes to center yourself and strengthen your connection.
    </div>

    <!-- Step 1: Mood -->
    <div class="insight-card a2" style="margin-bottom:14px;">
      <div style="font-size:.82rem;font-weight:700;margin-bottom:8px;">1. How are you feeling right now?</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;" id="ritual-mood">
        ${MOODS.map(m => `
          <div class="pill" data-mood="${m.id}" style="font-size:.75rem;padding:6px 12px;">${m.emoji} ${m.label}</div>
        `).join('')}
      </div>
    </div>

    <!-- Step 2: Gratitude -->
    <div class="insight-card a3" style="margin-bottom:14px;">
      <div style="font-size:.82rem;font-weight:700;margin-bottom:4px;">2. One thing you appreciate about ${U.esc(theirN)}</div>
      <div style="font-size:.72rem;color:var(--muted);margin-bottom:8px;font-style:italic;">${apPrompt}</div>
      <textarea id="ritual-appreciate" class="input" rows="2" placeholder="What comes to mind?" style="font-size:.85rem;resize:none;"></textarea>
    </div>

    <!-- Step 3: Intention -->
    <div class="insight-card a3" style="margin-bottom:14px;">
      <div style="font-size:.82rem;font-weight:700;margin-bottom:8px;">3. Set an intention for today</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;" id="ritual-intention">
        ${[
          { id: 'listen', label: '👂 Listen more' },
          { id: 'patient', label: '🧘 Be patient' },
          { id: 'appreciate', label: '💛 Show gratitude' },
          { id: 'helpful', label: '🤝 Be helpful' },
          { id: 'present', label: '📱 Be present (less phone)' },
          { id: 'fun', label: '😂 Have fun together' },
        ].map(i => `
          <div class="pill" data-intent="${i.id}" style="font-size:.75rem;padding:6px 12px;">${i.label}</div>
        `).join('')}
      </div>
    </div>

    <button class="btn btn-accent" id="ritual-complete" style="margin-top:8px;">Complete Check-in ✨</button>
  </div>`;
}, (el) => {
  // Wire pill selections
  ['#ritual-mood', '#ritual-intention'].forEach(sel => {
    el.querySelectorAll(sel + ' .pill').forEach(pill => {
      pill.addEventListener('click', () => {
        el.querySelectorAll(sel + ' .pill').forEach(p => p.classList.remove('selected'));
        pill.classList.add('selected');
      });
    });
  });

  // Complete
  el.querySelector('#ritual-complete')?.addEventListener('click', () => {
    const mood = el.querySelector('#ritual-mood .pill.selected')?.dataset.mood;
    const appreciation = el.querySelector('#ritual-appreciate')?.value.trim();
    const intention = el.querySelector('#ritual-intention .pill.selected')?.dataset.intent;

    if (!mood) { U.toast('Select how you feel'); return; }

    // Log mood
    MoodStore.log(mood, '');

    // Save appreciation if provided
    if (appreciation) {
      AppreciationStore.add(appreciation, 'general');
    }

    // Complete ritual
    DailyRitual.completeToday({ mood, appreciation, intention });

    U.toast('Check-in complete ✨');
    Router.go('daily-ritual'); // Reload to show completion
  });
});

(async () => {
  Router.initNav();

  // ── Dev toolbar ───────────────────────────────
  if (DEV.enabled) {
    document.body.style.paddingTop = '28px';
    const bar = document.createElement('div');
    bar.id = 'dev-bar';
    bar.innerHTML = `
      <span>🔧 v${VERSION}</span>
      <span class="sep"></span>
      <span id="dev-user">...</span>
      <span class="sep"></span>
      <button onclick="navigator.clipboard?.writeText(Auth.couple()?.invite_code||'none');U.toast('Code copied')">Copy invite</button>
      <button onclick="Auth.refresh().then(()=>U.toast('Refreshed'))">Refresh</button>
      <button onclick="Auth.signOut()">Sign out</button>
      <button onclick="localStorage.clear();sessionStorage.clear();location.reload()" style="color:#f66;">Clear & reload</button>
      <span style="margin-left:auto;">
        <button onclick="location.search='?dev&as=1'">→ P1</button>
        <button onclick="location.search='?dev&as=2'">→ P2</button>
      </span>
    `;
    document.body.prepend(bar);
  }

  function updateDevBar() {
    if (!DEV.enabled) return;
    const el = document.getElementById('dev-user');
    if (el) {
      const m = Auth.me();
      el.textContent = m.name ? `${m.name} (${Auth.amSpouse1() ? 'P1' : 'P2'})` : 'Not signed in';
    }
  }

  // ── Auto-login for dev mode ───────────────────
  if (DEV.autoAs && DEV.accounts[DEV.autoAs]) {
    const acct = DEV.accounts[DEV.autoAs];
    console.log(`[DEV] Auto-login as ${acct.label}...`);

    // Try sign in first (account may already exist)
    let result = await Auth.signIn(acct.email, acct.password);
    if (result.error && result.error.includes('Invalid login')) {
      // Account doesn't exist yet — create it
      console.log('[DEV] Account not found, creating...');
      result = await Auth.signUp(acct.email, acct.password, acct.label.split(' ')[0]);
      if (result.error) {
        console.error('[DEV] Signup failed:', result.error);
        Router.go('auth-entry');
        updateDevBar();
        return;
      }
      if (result.confirmEmail) {
        console.warn('[DEV] Email confirmation required — disable in Supabase Auth settings for dev');
        U.toast('⚠️ Disable email confirmation in Supabase for dev mode');
        Router.go('auth-entry');
        updateDevBar();
        return;
      }
    }

    if (result.error) {
      console.error('[DEV] Login failed:', result.error);
      Router.go('auth-entry');
      updateDevBar();
      return;
    }

    // Bootstrap
    const boot = await Auth.bootstrap();
    console.log('[DEV] Bootstrap:', boot);

    // Auto-create/join couple for dev
    if (!boot.coupled) {
      if (DEV.autoAs === '1') {
        // Partner 1 creates the couple
        const { code } = await Auth.createCouple();
        console.log(`[DEV] Created couple. Invite code: ${code}`);
        await Auth.bootstrap();
        Router.go('home');
      } else {
        // Partner 2 needs to join — find Partner 1's couple
        // Sign in as P1 briefly to get the code, then switch back
        // Actually simpler: just go to the join screen
        Router.go('ob-join');
      }
    } else {
      Router.go('home');
    }
    updateDevBar();
    return;
  }

  // ── Demo mode via URL (?demo or ?demo=B) ──────
  if (_devParams.has('demo')) {
    DEMO.activate(_devParams.get('demo') === 'B' ? 'B' : 'A');
    return;
  }

  // ── Normal flow ───────────────────────────────
  const boot = await Auth.bootstrap();

  if (boot.mode === 'unauthenticated') {
    Router.go('auth-entry');
  } else if (!boot.coupled) {
    Router.go('ob-couple');
  } else if (!boot.hasPartner && boot.coupled) {
    Router.go('ob-invite');
  } else {
    Router.go('home');
  }
  updateDevBar();

  // Auth state change listener (handles page reload, OAuth redirect)
  Auth.sb().auth.onAuthStateChange(async (event, session) => {
    if (event === 'INITIAL_SESSION') return;
    if (event === 'SIGNED_IN' && session) {
      const b = await Auth.bootstrap();
      if (b.coupled && b.hasPartner) Router.go('home');
      else if (b.coupled) Router.go('ob-invite');
      else Router.go('ob-couple');
      updateDevBar();
    }
    if (event === 'SIGNED_OUT') {
      Router.go('auth-entry');
      updateDevBar();
    }
  });
})();
